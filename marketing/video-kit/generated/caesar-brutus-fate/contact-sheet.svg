<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="1260" height="5400" viewBox="0 0 1260 5400"><rect width="1260" height="5400" fill="#F7F3FF"/><text x="70" y="90" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="900" fill="#211A2E">CAN YOU CHANGE HISTORY? — caesar-brutus-fate</text><rect x="70" y="160" width="550" height="970" rx="34" fill="#211A2E" opacity=".94"/><text x="105" y="230" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#EAE0FF">01 · 命运终点</text><text x="345" y="660" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">CAESAR IS DEAD.</text></rect><rect x="675" y="160" width="550" height="970" rx="34" fill="#211A2E" opacity=".94"/><text x="710" y="230" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#EAE0FF">02 · 观众挑战</text><text x="950" y="637.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">CAN YOU CHANGE HIS</text>
<text x="950" y="682.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">FATE?</text></rect><rect x="70" y="1190" width="550" height="970" rx="34" fill="#211A2E" opacity=".94"/><text x="105" y="1260" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#EAE0FF">03 · 时间倒带</text><text x="345" y="1690" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">REWIND.</text></rect><rect x="675" y="1190" width="550" height="970" rx="34" fill="#211A2E" opacity=".94"/><text x="710" y="1260" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#EAE0FF">04 · 角色代入</text><text x="950" y="1667.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">YOU ARE BRUTUS.</text>
<text x="950" y="1712.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">CAESAR TRUSTS YOU.</text></rect><rect x="70" y="2220" width="550" height="970" rx="34" fill="#211A2E" opacity=".94"/><text x="105" y="2290" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#EAE0FF">05 · 剧情冲突</text><text x="345" y="2607.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">CASSIUS WANTS YOU TO</text>
<text x="345" y="2652.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">BETRAY CAESAR.</text>
<text x="345" y="2697.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">BUT CAESAR CALLS YOU</text>
<text x="345" y="2742.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">HIS FRIEND.</text>
<text x="345" y="2787.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">SAVE A FRIEND</text>
<text x="345" y="2832.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">OR SAVE THE REPUBLIC?</text></rect><rect x="675" y="2220" width="550" height="970" rx="34" fill="#211A2E" opacity=".94"/><text x="710" y="2290" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#EAE0FF">06 · 观众选择</text><text x="950" y="2652.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">WHAT WOULD YOU DO?</text>
<text x="950" y="2697.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">WARN CAESAR</text>
<text x="950" y="2742.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">JOIN CASSIUS</text>
<text x="950" y="2787.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">DECEIVE THEM BOTH</text></rect><rect x="70" y="3250" width="550" height="970" rx="34" fill="#211A2E" opacity=".94"/><text x="105" y="3320" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#EAE0FF">07 · 选择确认</text><text x="345" y="3727.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">YOU CHOOSE:</text>
<text x="345" y="3772.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">DECEIVE THEM BOTH</text></rect><rect x="675" y="3250" width="550" height="970" rx="34" fill="#211A2E" opacity=".94"/><text x="710" y="3320" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#EAE0FF">08 · 连锁后果</text><text x="950" y="3660" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">CAESAR</text>
<text x="950" y="3705" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">DELAYS THE SENATE</text>
<text x="950" y="3750" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">MEETING.</text>
<text x="950" y="3795" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">CASSIUS</text>
<text x="950" y="3840" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">SUSPECTS A TRAITOR.</text></rect><rect x="70" y="4280" width="550" height="970" rx="34" fill="#211A2E" opacity=".94"/><text x="105" y="4350" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#EAE0FF">09 · 产品机制</text><text x="345" y="4735" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">EVERY PLAYER CHOOSES.</text>
<text x="345" y="4780" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">EVERY CHOICE CHANGES</text>
<text x="345" y="4825" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">THE SAME WORLD.</text></rect><rect x="675" y="4280" width="550" height="970" rx="34" fill="#211A2E" opacity=".94"/><text x="710" y="4350" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#EAE0FF">10 · Logo 与 CTA</text><text x="950" y="4690" text-anchor="middlle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">OUR MANY WORLDR</text>
<text x="950" y="4735" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">ONE WORLD. MANY</text>
<text x="950" y="4780" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">PERSPECTIVES. NO STORY</text>
<text x="950" y="4825" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">IS WRITTEN IN ADVANCE.</text>
<text x="950" y="4870" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="850" fill="#F7F3FF">PLAY AS BRUTUS.</text></rect></svg>