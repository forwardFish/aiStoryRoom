<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="以浙江总督身份进入《桑田诏》的连续互动剧情。" />
    <title>桑田诏 | Our Many Worlds</title>
    <link rel="icon" type="image/png" href="/assets/brand/many-worlds-logo-transparent.png" />
    <link rel="stylesheet" href="/openovel-solo.css?v=20260728-1" />
  </head>
  <body>
    <main class="story-shell" data-testid="openovel-player">
      <header class="story-header">
        <a class="brand" href="/" aria-label="返回首页">
          <img src="/assets/brand/many-worlds-logo-transparent.png" alt="" />
          <span>Our Many Worlds</span>
        </a>
        <div class="story-title">
          <p>第一部分 · 急令与暗册</p>
          <h1>两封文书，一道急令</h1>
        </div>
        <button id="new-run" class="quiet-button" type="button">重新开始</button>
      </header>

      <section class="story-paper" aria-live="polite">
        <div id="story" class="story"></div>
        <p id="streaming" class="streaming" hidden></p>
      </section>

      <section class="action-panel" aria-labelledby="action-heading">
        <h2 id="action-heading">你要如何应对？</h2>
        <div id="options" class="options"></div>
        <form id="free-action" class="free-action">
          <label for="action-text">或者写下你自己的行动</label>
          <div class="action-row">
            <textarea
              id="action-text"
              maxlength="2000"
              required
              placeholder="例如：让书吏留下，把他知道的经手次序一件件说清。"
            ></textarea>
            <button id="submit-action" class="primary-button" type="submit">采取行动</button>
          </div>
        </form>
        <p id="status" class="status" role="status"></p>
      </section>
    </main>
    <script type="module" src="/openovel-solo.js?v=20260728-1"></script>
  </body>
</html>
