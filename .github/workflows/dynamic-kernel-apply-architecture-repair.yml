name: Dynamic Kernel Architecture Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/architecture-templates" \
            -f description="Architecture repair Templates gates running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify and apply architecture patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/repair/dynamic-kernel-architecture.patch.gz.b64.* \
            | tr -d '[:space:]' \
            > "${RUNNER_TEMP}/architecture.patch.gz.b64"
          test "$(sha256sum "${RUNNER_TEMP}/architecture.patch.gz.b64" | cut -d' ' -f1)" = \
            "9b54af0102fc38abe925af44e56cda7e283efe9ce85c100563bd0b828d76ceb6"
          base64 --decode "${RUNNER_TEMP}/architecture.patch.gz.b64" \
            | gzip --decompress \
            > "${RUNNER_TEMP}/architecture.patch"
          test "$(sha256sum "${RUNNER_TEMP}/architecture.patch" | cut -d' ' -f1)" = \
            "b28fc457e2e0c0774662147c728de1d50325cb160a716e2b51406bec26741900"
          git apply --check "${RUNNER_TEMP}/architecture.patch"
          git apply "${RUNNER_TEMP}/architecture.patch"
          git diff --check
          git diff --stat
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Templates typecheck
        run: pnpm --filter @ai-story/templates typecheck
      - name: Templates runtime contract
        run: pnpm --filter @ai-story/templates test:runtime-contract
      - name: Templates story package
        run: pnpm --filter @ai-story/templates test:story-package
      - name: Templates build
        run: pnpm --filter @ai-story/templates build
      - name: Commit architecture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/templates/src/story-package/part-one-runtime-engine.ts \
            packages/templates/src/story-package/dynamic-kernel-lite-runtime.ts \
            packages/templates/src/story-package/dynamic-kernel-lite-settlement.ts
          git rm -f \
            .github/repair/dynamic-kernel-architecture.patch.b64.00 \
            .github/repair/dynamic-kernel-architecture.patch.gz.b64.00 \
            .github/repair/dynamic-kernel-architecture.patch.gz.b64.01 \
            .github/repair/dynamic-kernel-architecture.patch.gz.b64.02 \
            .github/repair/dynamic-kernel-architecture.patch.gz.b64.03 \
            .github/repair/dynamic-kernel-architecture.patch.gz.b64.04 \
            .github/workflows/dynamic-kernel-source-export.yml \
            .github/workflows/dynamic-kernel-apply-architecture-repair.yml
          git diff --cached --check
          git commit -m "refactor(kernel-lite): separate settlement from next-turn planning"
          git push origin HEAD:codex/chatgpt-pro-dynamic-kernel-lite
      - name: Publish success status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="dynamic-kernel-lite/architecture-templates" \
            -f description="Architecture repair Templates gates passed" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Publish failure status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="dynamic-kernel-lite/architecture-templates" \
            -f description="Architecture repair Templates gates failed" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
