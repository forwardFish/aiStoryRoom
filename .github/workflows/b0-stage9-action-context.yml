name: B0 Stage 9 Synchronized ActionContract Context Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage9-action-context.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage9-action-context
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage9-action-context",
              description: `synchronized ActionContract context repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact branch tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "93f4328ee211b1713c4abe88964d2f559e336707"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage9-action-context.yml"

      - name: Apply the hash-bound B0 ActionContract context patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/d9e7be36db893e4a784f5f613a9246f9c698c785" --jq .content \
            | tr -d '\n' \
            | base64 -d > /tmp/b0-stage9.patch.gz.b64
          test "$(wc -c < /tmp/b0-stage9.patch.gz.b64 | tr -d ' ')" = "8480"
          test "$(sha256sum /tmp/b0-stage9.patch.gz.b64 | cut -d' ' -f1)" = "cea723c059f1c7483948b7d76658cf663dfbf91c659ac80da367a9a2effe7f96"
          base64 -d /tmp/b0-stage9.patch.gz.b64 > /tmp/b0-stage9.patch.gz
          test "$(sha256sum /tmp/b0-stage9.patch.gz | cut -d' ' -f1)" = "723949a306ee32d215d12c636cb8b725e1e25486fd2137d3e7dfa21b357e690d"
          gzip -dc /tmp/b0-stage9.patch.gz > /tmp/b0-stage9.patch
          test "$(sha256sum /tmp/b0-stage9.patch | cut -d' ' -f1)" = "af8ed1d31eb813ee1ab679e3987e40579c75e34bcbe955e7727ad479ce134091"
          git apply --check /tmp/b0-stage9.patch
          git apply /tmp/b0-stage9.patch
          git diff --check

      - name: Frozen install and focused verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/api typecheck
          pnpm --filter @apps/api test:maneuver-v1
          pnpm --filter @apps/api test:b0-window
          pnpm --filter @apps/api test:b0-player-window
          pnpm --filter @apps/api test:b0-ops
          pnpm --filter @apps/web typecheck
          pnpm --filter @apps/web test:b0-window

      - name: Commit the completed repair as an ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts \
            apps/api/src/b0-settlement/b0-window-player.service.ts \
            apps/api/src/maneuver-v1/maneuver-v1.core.spec.ts \
            apps/api/src/maneuver-v1/maneuver-v1.core.ts \
            apps/api/src/maneuver-v1/maneuver-v1.prisma-read.spec.ts \
            apps/api/src/maneuver-v1/maneuver-v1.prisma-read.ts \
            apps/api/src/maneuver-v1/maneuver-v1.service.ts \
            apps/web/public/maneuver-v1/maneuver-v1-controller.js \
            apps/web/tests/b0-window-web.test.mjs
          git rm .github/workflows/b0-stage9-action-context.yml
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          .github/workflows/b0-stage9-action-context.yml
          apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts
          apps/api/src/b0-settlement/b0-window-player.service.ts
          apps/api/src/maneuver-v1/maneuver-v1.core.spec.ts
          apps/api/src/maneuver-v1/maneuver-v1.core.ts
          apps/api/src/maneuver-v1/maneuver-v1.prisma-read.spec.ts
          apps/api/src/maneuver-v1/maneuver-v1.prisma-read.ts
          apps/api/src/maneuver-v1/maneuver-v1.service.ts
          apps/web/public/maneuver-v1/maneuver-v1-controller.js
          apps/web/tests/b0-window-web.test.mjs
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "fix(b0): derive plan context from synchronized window"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish stage outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/stage9-action-context",
              description: `synchronized ActionContract context repair ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("B0 stage 9 ActionContract context repair failed");
