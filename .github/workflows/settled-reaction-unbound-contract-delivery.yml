name: Settled Reaction and Unbound Narrative Contract Delivery

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/settled-reaction-unbound-contract-delivery.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  product-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/chatgpt-pro-dynamic-kernel-lite
      PRODUCT_BASE: c6aafdc1a68811839c56e5e8ab3cdc9c3c3ac4ad
      EVIDENCE_ROOT: /tmp/settled-reaction-unbound-contract
      TRANSPORT_B64: .github/transport/settled-reaction-unbound-contract.py.gz.b64
      TRANSPORT_SHA256: 5dd0714c56513422f62636db4246e8b02140de6d5ebf28758a44a92e0dc41205
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/settled-reaction-unbound-contract" \
            -f description="Testing structured reaction and unbound narrative contracts" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: codex/chatgpt-pro-dynamic-kernel-lite
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply product implementation and run focused deterministic gates
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs" "${EVIDENCE_ROOT}/source"
          test "$(git branch --show-current)" = "${TARGET_BRANCH}"
          git merge-base --is-ancestor "${PRODUCT_BASE}" HEAD
          git status --short | tee "${EVIDENCE_ROOT}/logs/00-status-before.log"

          pnpm install --frozen-lockfile 2>&1 \
            | tee "${EVIDENCE_ROOT}/logs/01-install.log"

          tr -d '[:space:]' < "${TRANSPORT_B64}" \
            | base64 --decode \
            | gzip --decompress \
            > "${RUNNER_TEMP}/apply-contract-upgrade.py"
          echo "${TRANSPORT_SHA256}  ${RUNNER_TEMP}/apply-contract-upgrade.py" \
            | sha256sum --check
          python "${RUNNER_TEMP}/apply-contract-upgrade.py" \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/02-apply-product.log"

          SANGTIAN_SKIP_SOURCE_WRITES=1 \
          SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring-output" \
          SANGTIAN_RUNTIME_PACKAGE_PATH="${GITHUB_WORKSPACE}/packages/templates/config/sangtian/story-package/part-one-runtime.json" \
            node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/03-compile-package.log"

          git diff --check
          git diff --name-status -- packages apps scripts \
            | tee "${EVIDENCE_ROOT}/product-files-before-commit.txt"
          test -s "${EVIDENCE_ROOT}/product-files-before-commit.txt"
          test -f packages/templates/src/story-package/settled-reaction-contract.ts
          test -f packages/templates/tests/fixtures/neutral-port-unbound-action.fixture.json
          grep -q 'schemaVersion: "settled-reaction-contract-v1"' \
            packages/templates/src/story-package/part-one-runtime-types.ts
          grep -q 'schemaVersion: "unbound-action-narrative-source-v1"' \
            packages/templates/src/story-package/part-one-runtime-types.ts
          if grep -E -i 'sangtian|zhejiang|qingliu|巡抚|县册|回文' \
            packages/templates/src/story-package/settled-reaction-contract.ts; then
            echo "STORY_SPECIFIC_TERM_IN_GENERIC_CONTRACT" >&2
            exit 1
          fi

          cp packages/templates/src/story-package/settled-reaction-contract.ts \
            "${EVIDENCE_ROOT}/source/"
          cp packages/templates/src/story-package/part-one-runtime-types.ts \
            "${EVIDENCE_ROOT}/source/"
          cp packages/templates/src/runtime-facade.ts \
            "${EVIDENCE_ROOT}/source/"
          cp apps/openovel-runtime/src/decision-adapter.ts \
            "${EVIDENCE_ROOT}/source/"
          git diff --binary -- packages apps scripts \
            > "${EVIDENCE_ROOT}/product.patch"

          results="${EVIDENCE_ROOT}/results.tsv"
          : > "${results}"
          failed=0
          run_gate() {
            local label="$1"
            shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${results}"
            if [ "${code}" -ne 0 ]; then failed=1; fi
          }

          run_gate 04-templates-typecheck \
            pnpm --filter @ai-story/templates typecheck
          run_gate 05-focused-contract-tests \
            pnpm --filter @ai-story/templates exec node --import tsx --test \
              tests/settled-reaction-contract.test.ts \
              tests/capability-runtime-facade.test.ts \
              tests/part-one-dynamic-kernel-lite.test.ts
          run_gate 06-templates-story-package \
            pnpm --filter @ai-story/templates test:story-package
          run_gate 07-templates-build \
            pnpm --filter @ai-story/templates build
          run_gate 08-openovel-typecheck \
            pnpm --filter @apps/openovel-runtime typecheck
          run_gate 09-openovel-capability-routing \
            pnpm --filter @apps/openovel-runtime exec node --import tsx --test \
              tests/intent-capability-routing.spec.ts
          run_gate 10-openovel-test \
            pnpm --filter @apps/openovel-runtime test
          run_gate 11-api-current \
            pnpm --filter @apps/api test:solo-story-engine
          run_gate 12-story-v4 \
            pnpm test:story:v4

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/settled-reaction-unbound-contract')
          rows = []
          failed = False
          for line in (root / 'results.tsv').read_text(encoding='utf-8').splitlines():
              label, code, log_path = line.split('\t', 2)
              text = Path(log_path).read_text(encoding='utf-8', errors='replace')
              def last(pattern):
                  values = re.findall(pattern, text, flags=re.MULTILINE)
                  return int(values[-1]) if values else None
              row = {
                  'label': label,
                  'exitCode': int(code),
                  'tests': last(r'^# tests\s+(\d+)\s*$'),
                  'pass': last(r'^# pass\s+(\d+)\s*$'),
                  'fail': last(r'^# fail\s+(\d+)\s*$'),
                  'skip': last(r'^# skipped\s+(\d+)\s*$'),
                  'todo': last(r'^# todo\s+(\d+)\s*$'),
                  'logPath': log_path,
              }
              rows.append(row)
              failed = failed or int(code) != 0 or (row['fail'] or 0) > 0
          (root / 'focused-results.json').write_text(
              json.dumps(rows, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (root / 'status.txt').write_text(
              'fail\n' if failed else 'pass\n',
              encoding='utf-8',
          )
          if failed:
              raise SystemExit(1)
          PY

      - name: Commit and push tested product, then remove temporary transport
        if: steps.focused.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- packages apps scripts
          git diff --cached --check
          git diff --cached --name-status -- packages apps scripts \
            | tee "${EVIDENCE_ROOT}/product-commit-files.txt"
          test -s "${EVIDENCE_ROOT}/product-commit-files.txt"
          git commit -m "feat(kernel-lite): complete settled reaction and unbound narrative contracts"
          git rev-parse HEAD > "${EVIDENCE_ROOT}/product-commit-sha.txt"
          git rev-parse HEAD^{tree} > "${EVIDENCE_ROOT}/product-commit-tree.txt"
          git push origin HEAD:"${TARGET_BRANCH}"

          git rm -f --ignore-unmatch \
            .github/transport/settled-reaction-unbound-contract.py.gz.b64 \
            .github/workflows/settled-reaction-unbound-contract-delivery.yml \
            .github/workflows/settled-reaction-real-product-v2.yml \
            .github/diagnostics/settled-reaction-*.json \
            .github/repair/settled-reaction-*.py \
            .github/repair/run-settled-reaction-*.py \
            .github/repair/run-settled-reaction-*.sh
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(kernel-lite): remove settled reaction delivery scaffolding"
          fi
          git push origin HEAD:"${TARGET_BRANCH}"
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/${TARGET_BRANCH})"

          git rev-parse HEAD > "${EVIDENCE_ROOT}/final-remote-sha.txt"
          git rev-parse HEAD^{tree} > "${EVIDENCE_ROOT}/final-remote-tree.txt"
          git diff --name-status "${PRODUCT_BASE}"..HEAD -- packages apps scripts \
            | tee "${EVIDENCE_ROOT}/final-product-files.txt"
          test -s "${EVIDENCE_ROOT}/final-product-files.txt"
          if git ls-files | grep -E '^\.github/(transport|diagnostics|repair|workflows)/.*settled-reaction'; then
            echo "SETTLED_REACTION_TRANSPORT_REMAINS" >&2
            exit 1
          fi

      - name: Build delivery summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/settled-reaction-unbound-contract')
          def read(name):
              path = root / name
              return path.read_text(encoding='utf-8').strip() if path.exists() else None
          summary = {
              'status': read('status.txt') or 'missing',
              'productBase': 'c6aafdc1a68811839c56e5e8ab3cdc9c3c3ac4ad',
              'productCommitSha': read('product-commit-sha.txt'),
              'productCommitTree': read('product-commit-tree.txt'),
              'finalRemoteSha': read('final-remote-sha.txt'),
              'finalRemoteTree': read('final-remote-tree.txt'),
              'commands': json.loads((root / 'focused-results.json').read_text(encoding='utf-8'))
                  if (root / 'focused-results.json').exists() else [],
              'supabase': 'NOT_RUN',
              'deepSeek': 'NOT_RUN',
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settled-reaction-unbound-contract-${{ github.sha }}
          path: /tmp/settled-reaction-unbound-contract/
          if-no-files-found: error
          retention-days: 14

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          description="Structured reaction contract delivery failed"
          if [ -f "${EVIDENCE_ROOT}/status.txt" ] \
            && [ "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass ] \
            && [ -f "${EVIDENCE_ROOT}/final-remote-sha.txt" ]; then
            state=success
            description="Structured reaction and unbound narrative contracts passed"
          fi
          final_sha="$(cat "${EVIDENCE_ROOT}/final-remote-sha.txt" 2>/dev/null || echo "${GITHUB_SHA}")"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${final_sha}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/settled-reaction-unbound-contract" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "${state}" = success
