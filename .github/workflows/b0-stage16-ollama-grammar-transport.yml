name: B0 Stage 16 Ollama Grammar Transport Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage16-ollama-grammar-transport.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage16-ollama-grammar-transport
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage16-ollama-grammar-transport",
              description: `Ollama grammar transport repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact remote starting point
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "7a6a556c98d5c3269b3bb947873f42e2466174e9"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage16-ollama-grammar-transport.yml"
          test "$(sha256sum apps/openovel-runtime/src/provider.ts | cut -d' ' -f1)" = "39caef38c3645343aaefe407d11a9ef08bc1062e108f61ea6bd1f932dca6f465"
          test "$(sha256sum apps/openovel-runtime/tests/openovel-first.spec.ts | cut -d' ' -f1)" = "57fd0bac30ef0be595e676f08e83b3726c6f6632db245e425cae761ac23524c8"

      - name: Apply the hash-bound transport patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/98b84304e1bcae3b9571498ca5590ef1b6007ee3" --jq .content \
            | tr -d '\n' \
            | base64 -d > /tmp/b0-stage16.patch.gz.b64
          test "$(wc -c < /tmp/b0-stage16.patch.gz.b64 | tr -d ' ')" = "2396"
          test "$(sha256sum /tmp/b0-stage16.patch.gz.b64 | cut -d' ' -f1)" = "64b745dae1562f82cd3518abb512895b8e54210c35ca2404c2e8def9d34839ad"
          base64 -d /tmp/b0-stage16.patch.gz.b64 > /tmp/b0-stage16.patch.gz
          test "$(sha256sum /tmp/b0-stage16.patch.gz | cut -d' ' -f1)" = "905f2c81b0cbf7f9a2b156775c574dca7e4af14965e6585a1d0d461075e8313a"
          gzip -dc /tmp/b0-stage16.patch.gz > /tmp/b0-stage16.patch
          test "$(sha256sum /tmp/b0-stage16.patch | cut -d' ' -f1)" = "db190a69d7ed145736ee299e16b9df85ab3beb3b7c038bd1c9ed1ed169a1c682"
          git apply --check /tmp/b0-stage16.patch
          git apply /tmp/b0-stage16.patch
          git diff --check
          test "$(sha256sum apps/openovel-runtime/src/provider.ts | cut -d' ' -f1)" = "9fc967e853c2eaa8963205087f47d895d10b3dc825339abcb5731a1f1bd88261"
          test "$(sha256sum apps/openovel-runtime/tests/openovel-first.spec.ts | cut -d' ' -f1)" = "ae3411d5a77b8e89ce36a435571c036510bf356e5b0aedc71a9d9426c09124d4"

      - name: Frozen install and focused verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/openovel-runtime typecheck
          pnpm --filter @apps/openovel-runtime test
          pnpm --filter @apps/openovel-runtime build
          pnpm test:story:v4

      - name: Commit and push the completed stage as an ordinary fast-forward
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          remote_before="$(git rev-parse origin/$GITHUB_REF_NAME)"
          test "$remote_before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/openovel-runtime/src/provider.ts \
            apps/openovel-runtime/tests/openovel-first.spec.ts
          git rm .github/workflows/b0-stage16-ollama-grammar-transport.yml
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          .github/workflows/b0-stage16-ollama-grammar-transport.yml
          apps/openovel-runtime/src/provider.ts
          apps/openovel-runtime/tests/openovel-first.spec.ts
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "fix(openovel): avoid oversized Ollama grammar repetitions"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          remote_after="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          {
            echo "local_head=$local_head"
            echo "remote_before=$remote_before"
            echo "remote_after=$remote_after"
          } >> "$GITHUB_OUTPUT"

      - name: Publish completed-stage outcome
        if: success()
        uses: actions/github-script@v7
        env:
          FINAL_SHA: ${{ steps.commit.outputs.local_head }}
          REMOTE_BEFORE: ${{ steps.commit.outputs.remote_before }}
          REMOTE_AFTER: ${{ steps.commit.outputs.remote_after }}
        with:
          script: |
            if (!process.env.FINAL_SHA || process.env.FINAL_SHA !== process.env.REMOTE_AFTER) {
              core.setFailed("stage push SHA readback mismatch");
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.FINAL_SHA,
              state: "success",
              context: "b0/stage16-ollama-grammar-transport",
              description: `ordinary fast-forward from ${process.env.REMOTE_BEFORE.slice(0, 8)} verified in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Publish failed-stage outcome
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "failure",
              context: "b0/stage16-ollama-grammar-transport",
              description: `Ollama grammar transport repair failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.setFailed("B0 stage 16 Ollama grammar transport repair failed");
