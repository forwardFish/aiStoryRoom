name: Dynamic Kernel Round 1 Diagnostics

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-round1-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVIDENCE_ROOT: /tmp/dynamic-kernel-round1
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/round1-diagnostics" \
            -f description="Round-one diagnostics running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          python .github/repair/dynamic-kernel-round1-diagnostics.py
          git diff --check
          git diff --stat | tee "${EVIDENCE_ROOT}/logs/00-diff.log"
          git diff --binary > "${EVIDENCE_ROOT}/diagnostic.patch"
      - name: Install frozen workspace
        shell: bash
        run: pnpm install --frozen-lockfile 2>&1 | tee "${EVIDENCE_ROOT}/logs/01-install.log"
      - name: Run exact Story v4 gate
        shell: bash
        continue-on-error: true
        run: |
          set +e
          pnpm test:story:v4 2>&1 | tee "${EVIDENCE_ROOT}/logs/02-story-v4.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "${code}" > "${EVIDENCE_ROOT}/exit-code.txt"
          exit 0
      - name: Summarize TAP result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_ROOT"])
          log = (root / "logs/02-story-v4.log").read_text(errors="replace")
          def last(pattern, default=0):
              values = re.findall(pattern, log, re.MULTILINE)
              return int(values[-1]) if values else default
          summary = {
              "candidateSha": os.environ["GITHUB_SHA"],
              "command": "pnpm test:story:v4",
              "tests": last(r"^# tests (\d+)$"),
              "pass": last(r"^# pass (\d+)$"),
              "fail": last(r"^# fail (\d+)$"),
              "skip": last(r"^# skipped (\d+)$"),
              "todo": last(r"^# todo (\d+)$"),
              "exitCode": int((root / "exit-code.txt").read_text().strip()),
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-round1-${{ github.sha }}
          path: /tmp/dynamic-kernel-round1/
          if-no-files-found: error
          retention-days: 7
      - name: Publish final diagnostic status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          description="Round-one diagnostics captured"
          if [ ! -f "${EVIDENCE_ROOT}/summary.json" ]; then
            state=failure
            description="Round-one diagnostics failed before evidence"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/round1-diagnostics" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
