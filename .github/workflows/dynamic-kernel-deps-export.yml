name: Dynamic Kernel Dependency Export

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-deps-export.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  export-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/dependency-export" \
            -f description="Frozen dependency export running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Create dependency archive
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/dynamic-kernel-dependencies-${GITHUB_SHA}.tar.gz"
          paths=(node_modules)
          for path in \
            packages/templates/node_modules \
            packages/shared/node_modules \
            packages/openovel-runtime/node_modules \
            apps/openovel-runtime/node_modules \
            apps/api/node_modules; do
            if [ -e "${path}" ]; then paths+=("${path}"); fi
          done
          tar -czf "${archive}" "${paths[@]}"
          echo "DEPENDENCY_ARCHIVE=${archive}" >> "${GITHUB_ENV}"
      - name: Upload dependency archive
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-dependencies-${{ github.sha }}
          path: ${{ env.DEPENDENCY_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/dependency-export" \
            -f description="Frozen dependency export ${state}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
