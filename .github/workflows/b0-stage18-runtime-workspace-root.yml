name: B0 Stage 18 Runtime Workspace Evidence Binding

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage18-runtime-workspace-root.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage18-runtime-workspace-root
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage18-runtime-workspace-root",
              description: `runtime workspace evidence binding running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact remote starting point
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "4efe79c3a8df9a0e771e7df4feb55673a7947ed9"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage18-runtime-workspace-root.yml"
          test "$(sha256sum scripts/acceptance/b0-candidate-real-flow.ts | cut -d' ' -f1)" = "20d1fd8fdaa038c366192238b2bb0af9bf9b30ea0cc543755b0a365e261d45b4"
          test "$(sha256sum scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs | cut -d' ' -f1)" = "0ebb9e19a130696b0025338d6eca984cb29ab2f55704f4acf26934fffcd4893e"

      - name: Apply the hash-bound workspace binding patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/a8cbee6b628f982599a8f8e61e8b2d6f761d9d7c" --jq .content \
            | tr -d '\n' \
            | base64 -d > /tmp/b0-stage18.patch.gz.b64
          test "$(wc -c < /tmp/b0-stage18.patch.gz.b64 | tr -d ' ')" = "796"
          test "$(sha256sum /tmp/b0-stage18.patch.gz.b64 | cut -d' ' -f1)" = "8a47c3c2f024702e74d73bc29413e25b6ef7b31bc01e75ed7907fbfc2d624645"
          base64 -d /tmp/b0-stage18.patch.gz.b64 > /tmp/b0-stage18.patch.gz
          test "$(wc -c < /tmp/b0-stage18.patch.gz | tr -d ' ')" = "595"
          test "$(sha256sum /tmp/b0-stage18.patch.gz | cut -d' ' -f1)" = "441a5e99032f1e0de8999e57c17b8a6ceee1421a3a9b5dd2830c34d6f5f1ee47"
          gzip -dc /tmp/b0-stage18.patch.gz > /tmp/b0-stage18.patch
          test "$(wc -c < /tmp/b0-stage18.patch | tr -d ' ')" = "1394"
          test "$(sha256sum /tmp/b0-stage18.patch | cut -d' ' -f1)" = "b592293b505d40650c0879fd107de468ff0acf41d52e6a39a7829dfb1ae42752"
          git apply --check /tmp/b0-stage18.patch
          git apply /tmp/b0-stage18.patch
          git diff --check
          test "$(sha256sum scripts/acceptance/b0-candidate-real-flow.ts | cut -d' ' -f1)" = "2b21006e323bfc804350640f982d60831f69351bf701df09d6bdf6f8cee6bce7"
          test "$(sha256sum scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs | cut -d' ' -f1)" = "467e2afcb41b0e65469c6afc18674b588e0d4bcae1000cebef0790308b8e68e3"

      - name: Frozen install and affected verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance
          node --test scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs
          bash -n scripts/acceptance/b0-selfhosted-real-acceptance.sh
          bash -n scripts/acceptance/b0-formal-supabase-acceptance.sh
          pnpm --filter @apps/openovel-runtime typecheck
          pnpm --filter @apps/openovel-runtime test
          pnpm --filter @apps/openovel-runtime build

      - name: Commit and push the completed stage as an ordinary fast-forward
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          remote_before="$(git rev-parse origin/$GITHUB_REF_NAME)"
          test "$remote_before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/acceptance/b0-candidate-real-flow.ts \
            scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs
          git rm .github/workflows/b0-stage18-runtime-workspace-root.yml
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          .github/workflows/b0-stage18-runtime-workspace-root.yml
          scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs
          scripts/acceptance/b0-candidate-real-flow.ts
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "fix(b0): bind runtime evidence to isolated workspace"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          remote_after="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          {
            echo "local_head=$local_head"
            echo "remote_before=$remote_before"
            echo "remote_after=$remote_after"
          } >> "$GITHUB_OUTPUT"

      - name: Publish completed-stage outcome
        if: success()
        uses: actions/github-script@v7
        env:
          FINAL_SHA: ${{ steps.commit.outputs.local_head }}
          REMOTE_BEFORE: ${{ steps.commit.outputs.remote_before }}
          REMOTE_AFTER: ${{ steps.commit.outputs.remote_after }}
        with:
          script: |
            if (!process.env.FINAL_SHA || process.env.FINAL_SHA !== process.env.REMOTE_AFTER) {
              core.setFailed("stage push SHA readback mismatch");
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.FINAL_SHA,
              state: "success",
              context: "b0/stage18-runtime-workspace-root",
              description: `ordinary fast-forward from ${process.env.REMOTE_BEFORE.slice(0, 8)} verified in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Publish failed-stage outcome
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "failure",
              context: "b0/stage18-runtime-workspace-root",
              description: `runtime workspace evidence binding failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.setFailed("B0 stage 18 runtime workspace evidence binding failed");
