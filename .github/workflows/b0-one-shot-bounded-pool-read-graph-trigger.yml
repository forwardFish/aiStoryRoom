name: B0 One-Shot Bounded Pool Read Graph Trigger

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-bounded-pool-read-graph-trigger.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-one-shot-bounded-pool-read-graph-trigger
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_BASELINE: 63aec28b0b775eff924585f68827abe87b148a9e
  B0_PATCH_ROOT: docs/auto-execute/evidence/b0/_tmp/bounded-pool-read-graph

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publish locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: "pending", context: "b0/bounded-pool-read-graph-v2",
              description: `bounded pool read repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50

      - name: Verify, reconstruct and apply immutable patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$B0_BASELINE" HEAD
          test -z "$(git status --short)"
          test "$(find "$B0_PATCH_ROOT" -maxdepth 1 -type f -name 'chunk-*.b64' | wc -l | tr -d ' ')" = 12
          find "$B0_PATCH_ROOT" -maxdepth 1 -type f -name 'chunk-*.b64' -print0 \
            | LC_ALL=C sort -z | xargs -0 cat | tr -d '[:space:]' | base64 -d > /tmp/b0.patch
          test "$(wc -c < /tmp/b0.patch | tr -d ' ')" = 43949
          test "$(sha256sum /tmp/b0.patch | awk '{print $1}')" = d0c68a29e64d7de6ab9c11b01519f23ab6e62593a4cbba565eed1ccbdf1818fa
          git apply --check /tmp/b0.patch
          git apply /tmp/b0.patch
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run focused product gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/api test:b0-window
          pnpm --filter @apps/api test:b0-player-window
          pnpm --filter @apps/api test:b0-ops
          pnpm --filter @apps/api test:maneuver-v1
          pnpm --filter @apps/api typecheck
          pnpm typecheck:b0:real-acceptance
          pnpm --filter @apps/api build
          pnpm --filter @apps/web test:b0-window
          pnpm --filter @apps/web typecheck
          pnpm --filter @apps/web build

      - name: Scan changed product files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          paths = [pathlib.Path(path) for path in """
          apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
          apps/api/src/b0-settlement/b0-window-initialization-concurrency.spec.ts
          apps/api/src/b0-settlement/b0-window-player.controller.ts
          apps/api/src/b0-settlement/b0-window-player.service.ts
          apps/api/src/maneuver-v1/maneuver-v1.controller.ts
          apps/api/src/maneuver-v1/maneuver-v1.prisma-read.spec.ts
          apps/api/src/maneuver-v1/maneuver-v1.prisma-read.ts
          apps/api/src/maneuver-v1/maneuver-v1.service.ts
          apps/web/public/maneuver-v1/maneuver-v1-controller.js
          apps/web/tests/b0-window-web.test.mjs
          """.split()]
          patterns = [
              re.compile(r"postgres(?:ql)?://[^\s\"']+", re.I),
              re.compile(r"sk-[A-Za-z0-9_-]{16,}"),
              re.compile(r"Bearer\s+[A-Za-z0-9._~+/-]{16,}", re.I),
              re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"),
          ]
          hits=[]
          for path in paths:
              text=path.read_text(encoding="utf-8")
              for pattern in patterns:
                  if pattern.search(text): hits.append((str(path), pattern.pattern))
          if hits: raise SystemExit(f"secret scan failed: {hits}")
          print("changed-file secret scan: PASS")
          PY

      - name: Commit and push product files only
        id: push
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
            apps/api/src/b0-settlement/b0-window-initialization-concurrency.spec.ts
            apps/api/src/b0-settlement/b0-window-player.controller.ts
            apps/api/src/b0-settlement/b0-window-player.service.ts
            apps/api/src/maneuver-v1/maneuver-v1.controller.ts
            apps/api/src/maneuver-v1/maneuver-v1.prisma-read.spec.ts
            apps/api/src/maneuver-v1/maneuver-v1.prisma-read.ts
            apps/api/src/maneuver-v1/maneuver-v1.service.ts
            apps/web/public/maneuver-v1/maneuver-v1-controller.js
            apps/web/tests/b0-window-web.test.mjs
          )
          git fetch origin "$B0_BRANCH"
          remote_before="$(git rev-parse origin/$B0_BRANCH)"
          test "$remote_before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git diff --cached --check
          printf '%s\n' "${files[@]}" | LC_ALL=C sort > /tmp/expected
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git commit -m "fix(b0): bound repeated projection reads to the pool"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$B0_BRANCH"
          remote_after="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          echo "local_head=$local_head" >> "$GITHUB_OUTPUT"
          echo "remote_before=$remote_before" >> "$GITHUB_OUTPUT"
          echo "remote_after=$remote_after" >> "$GITHUB_OUTPUT"
          echo "REMOTE_PRODUCT_FIX_PUSHED=$local_head"

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          LOCAL_HEAD: ${{ steps.push.outputs.local_head }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: success ? "success" : "failure", context: "b0/bounded-pool-read-graph-v2",
              description: success ? `product fix pushed ${process.env.LOCAL_HEAD?.slice(0, 12)}` : `repair failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("bounded pool product repair failed");
