name: Apply AI story capability binding

on:
  push:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    paths:
      - .github/workflows/ai-story-capability-apply.yml
      - docs/auto-execute/.chatgpt-pro-capability-binding.patch

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the only authorized candidate branch
        uses: actions/checkout@v4
        with:
          ref: codex/chatgpt-pro-ai-story-convergence
          fetch-depth: 0

      - name: Prove repository and branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "codex/chatgpt-pro-ai-story-convergence"
          test "$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)" = "1b750e56858dabefb0ddb8b922c6bdcbe0574e4c"
          test -z "$(git status --short)"

      - name: Apply the reviewed generic capability patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH=docs/auto-execute/.chatgpt-pro-capability-binding.patch
          git apply --check "$PATCH"
          git apply "$PATCH"
          git rm "$PATCH"
          git rm .github/workflows/ai-story-capability-apply.yml
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic engineering gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-story/templates typecheck
          pnpm --filter @apps/openovel-runtime typecheck
          pnpm test:story:v4
          pnpm --filter @apps/openovel-runtime smoke:http

      - name: Commit only the verified capability implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/openovel-runtime/src/decision-adapter.ts \
            apps/openovel-runtime/src/intent-resolver.ts \
            apps/openovel-runtime/src/sangtian-decisions.ts \
            apps/openovel-runtime/tests/intent-resolver-adapter.spec.ts \
            apps/openovel-runtime/tests/intent-resolver.spec.ts \
            packages/templates/src/story-package/part-one-runtime-engine.ts
          git add -u \
            docs/auto-execute/.chatgpt-pro-capability-binding.patch \
            .github/workflows/ai-story-capability-apply.yml
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "8"
          git commit -m "feat(openovel): settle capability-level free actions"
          git push origin HEAD:codex/chatgpt-pro-ai-story-convergence
