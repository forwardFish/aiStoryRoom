name: B0 Stage AI Draft Recovery Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage-ai-draft-recovery-repair.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage-ai-draft-recovery-repair
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_EXPECTED_PARENT: ae91996b5a485dc9b710b4cdf107544e7756deef

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish repair locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/ai-draft-recovery-repair",
              description: `AI draft recovery repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact ordinary fast-forward start
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$B0_EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage-ai-draft-recovery-repair.yml"
          test -z "$(git status --short)"

      - name: Repair replay-safe AI plan recovery and add crash-boundary regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path("apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts")
          service = service_path.read_text(encoding="utf-8")
          old = '''        if (!current?.lastConfirmed) {
                    const now = new Date().toISOString();
                    const candidate = aiIntent(window, control.roleId, now);
                    await this.windows.saveDraft({
                      windowId: window.id,
                      actorId: control.roleId,
                      controlEpoch: control.epoch,
                      expectedRevision: current?.latestRevision ?? 0,
                      candidate,
                      now,
                    });
                    const confirmedRevision = current?.latestDraft?.clientRequestId === candidate.clientRequestId
                      ? current.latestRevision
                      : (current?.latestRevision ?? 0) + 1;
                    await this.windows.confirmDraft({
          '''.replace("                  ", "")
          new = '''        if (!current?.lastConfirmed) {
                    const now = new Date().toISOString();
                    const candidate = aiIntent(window, control.roleId, now);
                    const replayingPersistedDraft = current?.latestDraft?.clientRequestId === candidate.clientRequestId;
                    const expectedDraftRevision = replayingPersistedDraft
                      ? Math.max(0, current.latestRevision - 1)
                      : (current?.latestRevision ?? 0);
                    await this.windows.saveDraft({
                      windowId: window.id,
                      actorId: control.roleId,
                      controlEpoch: control.epoch,
                      expectedRevision: expectedDraftRevision,
                      candidate,
                      now,
                    });
                    const confirmedRevision = replayingPersistedDraft
                      ? current.latestRevision
                      : expectedDraftRevision + 1;
                    await this.windows.confirmDraft({
          '''.replace("                  ", "")
          if service.count(old) != 1:
              raise SystemExit(f"service recovery anchor count={service.count(old)}")
          service_path.write_text(service.replace(old, new, 1), encoding="utf-8")

          spec_path = Path("apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts")
          spec = spec_path.read_text(encoding="utf-8")
          anchor = '''test("C8 AI recovery preserves an already confirmed plan and only restores READY", async () => {
          '''
          test_case = '''test("C8 AI recovery replays a persisted unconfirmed draft with its original expected revision", async () => {
            const calls: Array<{ method: string; input: any }> = [];
            const draft = {
              ...aiAction(),
              status: "DRAFT" as const,
              confirmedAt: null,
            };
            const prisma = {
              actionWindow: { findUnique: async () => ({ nodeId: "node.1", status: "OPEN" }) },
              roleControl: { findMany: async () => [{ roleId: "role.ai", epoch: 3 }] },
              actionWindowParticipant: { findUnique: async () => ({ mainStatus: "B0_PENDING", version: 4 }) },
              playerAction: { findUnique: async () => ({
                normalizedJson: {
                  schemaVersion: "b0-intent-revision-envelope-v1",
                  windowId: "window.ai",
                  roomId: "run.1",
                  runId: "run.1",
                  actorId: "role.ai",
                  latestRevision: 1,
                  latestDraft: draft,
                  lastConfirmed: null,
                  lockedIntent: null,
                  latestRequestHash: "a".repeat(64),
                },
              }) },
            };
            const windows = {
              saveDraft: async (input: any) => { calls.push({ method: "saveDraft", input }); },
              confirmDraft: async (input: any) => { calls.push({ method: "confirmDraft", input }); },
              ready: async (input: any) => { calls.push({ method: "ready", input }); },
            };
            const service = new B0SettlementPipelineService(prisma as any, {} as any, windows as any, {} as any);
            await (service as any).prepareAiPlans(aiWindow());
            assert.deepEqual(calls.map((entry) => entry.method), ["saveDraft", "confirmDraft", "ready"]);
            assert.equal(calls[0].input.expectedRevision, 0, "replay must reuse the revision that originally created the draft");
            assert.equal(calls[0].input.candidate.clientRequestId, "ai-plan:window.ai:role.ai");
            assert.equal(calls[1].input.expectedRevision, 1, "recovery confirms the already persisted revision");
            assert.equal(calls[2].input.controlEpoch, 3);
          });

          '''
          if spec.count(anchor) != 1:
              raise SystemExit(f"spec insertion anchor count={spec.count(anchor)}")
          spec_path.write_text(spec.replace(anchor, test_case + anchor, 1), encoding="utf-8")
          PY
          git diff --check
          grep -F 'const replayingPersistedDraft' apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
          grep -F 'replays a persisted unconfirmed draft with its original expected revision' apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts "

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run focused product gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/api test:b0-ops
          pnpm --filter @apps/api typecheck
          pnpm --filter @apps/api build

      - name: Commit and push the tested product repair
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          before="$(git rev-parse origin/$B0_BRANCH)"
          test "$before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts "
          git diff --cached --check
          git commit -m "fix(b0): resume persisted AI drafts across worker crashes"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$B0_BRANCH"
          after="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
          test "$after" = "$local_head"
          echo "local_head=$local_head" >> "$GITHUB_OUTPUT"
          echo "remote_before=$before" >> "$GITHUB_OUTPUT"
          echo "remote_after=$after" >> "$GITHUB_OUTPUT"

      - name: Publish repair outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          LOCAL_HEAD: ${{ steps.push.outputs.local_head }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/ai-draft-recovery-repair",
              description: success ? `AI recovery repair pushed ${process.env.LOCAL_HEAD?.slice(0, 12)}` : `AI recovery repair failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("B0 AI draft recovery repair failed");
