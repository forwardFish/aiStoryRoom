name: Patch Settled Reaction Contract V2 Runner

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/settled-reaction-v2-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chatgpt-pro-dynamic-kernel-lite
          fetch-depth: 0
      - name: Patch runner and trigger final focused attempt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/settled-reaction-unbound-contract-delivery-v2.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          echo "${SOURCE_SHA256}  ${RUNNER_TEMP}/apply-contract-upgrade.py" \\
            | sha256sum --check
          python "${RUNNER_TEMP}/apply-contract-upgrade.py" \\
            2>&1 | tee "${EVIDENCE_ROOT}/logs/03-apply-product.log"'''
          new = '''          echo "${SOURCE_SHA256}  ${RUNNER_TEMP}/apply-contract-upgrade.py" \\
            | sha256sum --check
          python "${TRANSPORT_DIR}/hotfix-apply-source.py" \\
            "${RUNNER_TEMP}/apply-contract-upgrade.py"
          python "${RUNNER_TEMP}/apply-contract-upgrade.py" \\
            2>&1 | tee "${EVIDENCE_ROOT}/logs/03-apply-product.log"'''
          if text.count(old) != 1:
              raise SystemExit(f'runner execution marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          old_cleanup = '''            .github/workflows/settled-reaction-unbound-contract-delivery-v2.yml \\
            .github/workflows/settled-reaction-real-product-v2.yml \\'''
          new_cleanup = '''            .github/workflows/settled-reaction-unbound-contract-delivery-v2.yml \\
            .github/workflows/settled-reaction-v2-hotfix.yml \\
            .github/workflows/settled-reaction-real-product-v2.yml \\'''
          if text.count(old_cleanup) != 1:
              raise SystemExit(f'runner cleanup marker count={text.count(old_cleanup)}')
          path.write_text(text.replace(old_cleanup, new_cleanup, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/settled-reaction-unbound-contract-delivery-v2.yml
          git commit -m "ci(kernel-lite): scope final reaction contract transform"
          git push origin HEAD:codex/chatgpt-pro-dynamic-kernel-lite
