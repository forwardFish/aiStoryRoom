name: ChatGPT Pro Finalize AI Story Convergence

on:
  push:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "true"
  OPENOVEL_PROVIDER_BASE_URL: https://api.deepseek.com
  OPENOVEL_PROVIDER_API_KEY: ${{ secrets.OPENOVEL_PROVIDER_API_KEY || secrets.OPENOVEL_API_KEY || secrets.DEEPSEEK_API_KEY }}
  OPENOVEL_API_KEY: ${{ secrets.OPENOVEL_API_KEY || secrets.OPENOVEL_PROVIDER_API_KEY || secrets.DEEPSEEK_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.OPENOVEL_API_KEY || secrets.OPENOVEL_PROVIDER_API_KEY }}
  OPENOVEL_MODEL: deepseek-v4-pro
  OPENOVEL_NARRATOR_MODEL: deepseek-v4-pro
  OPENOVEL_REVIEWER_MODEL: deepseek-v4-pro
  OPENOVEL_OPTIONS_MODEL: deepseek-v4-pro
  OPENOVEL_STORYKEEPER_MODEL: deepseek-v4-pro
  OPENOVEL_DEEPSEEK_THINKING: disabled

concurrency:
  group: chatgpt-pro-finalize-ai-story-convergence
  cancel-in-progress: false

jobs:
  finalize:
    if: github.ref == 'refs/heads/codex/chatgpt-pro-ai-story-convergence' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: codex/chatgpt-pro-ai-story-convergence
          fetch-depth: 0

      - name: Prove repository and frozen baseline boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence/logs
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "baseline=1b750e56858dabefb0ddb8b922c6bdcbe0574e4c"
            echo "merge_base=$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)"
            echo "main_sha=$(git rev-parse origin/main)"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee candidate-evidence/logs/00-boundary.log
          test "${GITHUB_REPOSITORY}" = "forwardFish/aiStoryRoom"
          test "${GITHUB_REF_NAME}" = "codex/chatgpt-pro-ai-story-convergence"
          test "$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)" = "1b750e56858dabefb0ddb8b922c6bdcbe0574e4c"
          test -z "$(git status --short)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee candidate-evidence/logs/01-install.log

      - name: Ensure P1 capability binding and P3-P6 convergence sources
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'BOUND_CAPABILITY' apps/openovel-runtime/src/intent-resolver.ts; then
            test -f docs/auto-execute/.chatgpt-pro-capability-binding.patch
            git apply --check docs/auto-execute/.chatgpt-pro-capability-binding.patch
            git apply docs/auto-execute/.chatgpt-pro-capability-binding.patch
          fi
          node scripts/acceptance/ensure-ai-story-convergence-assets.mjs \
            2>&1 | tee candidate-evidence/logs/02-ensure-convergence.log
          test -f scripts/acceptance/verify-ai-story-convergence.mjs
          test -f scripts/acceptance/verify-part-one-branch-persistence.mjs
          test -f scripts/acceptance/run-real-model-g00-t20.mjs
          grep -q 'BOUND_CAPABILITY' apps/openovel-runtime/src/intent-resolver.ts
          grep -q 'DISPLAYED_OPTIONS' apps/openovel-runtime/src/decision-adapter.ts
          grep -q 'OBSERVE_ONLY' packages/templates/src/story-package/part-one-runtime-engine.ts
          git diff --check

      - name: Compile immutable Part One authoring assets
        shell: bash
        run: |
          set -o pipefail
          node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee candidate-evidence/logs/03-compile-authoring.log

      - name: OpenNovel typecheck and build
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime typecheck \
            2>&1 | tee candidate-evidence/logs/04-openovel-typecheck.log
          pnpm --filter @apps/openovel-runtime build \
            2>&1 | tee candidate-evidence/logs/05-openovel-build.log

      - name: Story V4 and Reviewer contract regression
        shell: bash
        run: |
          set -o pipefail
          pnpm test:story:v4 \
            2>&1 | tee candidate-evidence/logs/06-story-v4.log
          pnpm --filter @apps/openovel-runtime test \
            2>&1 | tee candidate-evidence/logs/07-openovel-tests.log

      - name: P1-P6 convergence and durable branch gates
        shell: bash
        run: |
          set -o pipefail
          pnpm test:story:convergence \
            2>&1 | tee candidate-evidence/logs/08-static-convergence.log
          pnpm test:story:branch-persistence \
            2>&1 | tee candidate-evidence/logs/09-branch-persistence.log

      - name: Real HTTP runtime smoke
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime smoke:http \
            2>&1 | tee candidate-evidence/logs/10-http-smoke.log

      - name: Reproducible immutable asset comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_SKIP_SOURCE_WRITES=1
          export SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_RUNTIME_PACKAGE_PATH="${RUNNER_TEMP}/part-one-runtime.json"
          node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee candidate-evidence/logs/11-recompile-authoring.log
          sha256sum \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${RUNNER_TEMP}/part-one-runtime.json" \
            | tee candidate-evidence/logs/12-runtime-sha256.log
          cmp --silent \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${RUNNER_TEMP}/part-one-runtime.json"

      - name: Require real DeepSeek credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENOVEL_PROVIDER_API_KEY}"
          test "${OPENOVEL_PROVIDER_BASE_URL}" = "https://api.deepseek.com"
          test "${OPENOVEL_MODEL}" = "deepseek-v4-pro"
          test "${OPENOVEL_NARRATOR_MODEL}" = "deepseek-v4-pro"
          test "${OPENOVEL_REVIEWER_MODEL}" = "deepseek-v4-pro"
          test "${OPENOVEL_OPTIONS_MODEL}" = "deepseek-v4-pro"
          test "${OPENOVEL_STORYKEEPER_MODEL}" = "deepseek-v4-pro"
          test "${OPENOVEL_DEEPSEEK_THINKING}" = "disabled"

      - name: Real DeepSeek G00-T20 player-quality acceptance
        shell: bash
        env:
          AI_STORY_REAL_MODEL_EVIDENCE_ROOT: ${{ github.workspace }}/docs/auto-execute/evidence/chatgpt-pro-g00-t20
          AI_STORY_REAL_MODEL_TIMEOUT_MS: "3600000"
        run: |
          set -o pipefail
          pnpm test:story:real-model:g00-t20 \
            2>&1 | tee candidate-evidence/logs/13-real-model-g00-t20.log
          node - <<'NODE'
          const fs = require('fs');
          const path = 'docs/auto-execute/evidence/chatgpt-pro-g00-t20/real-model-g00-t20-summary.json';
          const value = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (value.verdict !== 'PASS') throw new Error('REAL_MODEL_VERDICT_NOT_PASS');
          if (value.turnCount !== 20) throw new Error(`REAL_MODEL_TURN_COUNT:${value.turnCount}`);
          if (!value.opening || value.opening.turnId !== 'G00') throw new Error('REAL_MODEL_G00_MISSING');
          if (!Number.isInteger(value.providerCallCount) || value.providerCallCount < 1) throw new Error('REAL_MODEL_CALLS_MISSING');
          if (value.fixtureSignalCount !== 0) throw new Error('REAL_MODEL_FIXTURE_SIGNAL');
          NODE

      - name: Build final candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          EVIDENCE_ROOT=docs/auto-execute/evidence/chatgpt-pro-final
          mkdir -p "$EVIDENCE_ROOT"
          git log --reverse --format='%H%x09%s' \
            1b750e56858dabefb0ddb8b922c6bdcbe0574e4c..HEAD \
            > "$EVIDENCE_ROOT/commit-list.tsv"
          git diff --name-status \
            1b750e56858dabefb0ddb8b922c6bdcbe0574e4c..HEAD \
            > "$EVIDENCE_ROOT/changed-files.tsv"
          cp candidate-evidence/logs/*.log "$EVIDENCE_ROOT/"
          node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const cp = require('child_process');
          const path = require('path');
          const root = 'docs/auto-execute/evidence/chatgpt-pro-final';
          const readJson = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const real = readJson('docs/auto-execute/evidence/chatgpt-pro-g00-t20/real-model-g00-t20-summary.json');
          const structural = readJson('docs/auto-execute/evidence/chatgpt-pro-convergence/static-convergence.json');
          const branches = readJson('docs/auto-execute/evidence/chatgpt-pro-convergence/branch-persistence.json');
          for (const [name, value] of Object.entries({ real, structural, branches })) {
            if (value.verdict !== 'PASS') throw new Error(`${name.toUpperCase()}_NOT_PASS`);
          }
          const logs = fs.readdirSync(root).filter((name) => name.endsWith('.log')).sort();
          const hashes = Object.fromEntries(logs.map((name) => {
            const content = fs.readFileSync(path.join(root, name));
            return [name, crypto.createHash('sha256').update(content).digest('hex')];
          }));
          const evidence = {
            schemaVersion: 'omw.chatgpt-pro-candidate-ready.v1',
            status: 'CANDIDATE_BRANCH_READY',
            repository: 'forwardFish/aiStoryRoom',
            branch: 'codex/chatgpt-pro-ai-story-convergence',
            frozenBaselineSha: '1b750e56858dabefb0ddb8b922c6bdcbe0574e4c',
            testedSourceSha: cp.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            mergeBaseSha: cp.execFileSync('git', ['merge-base', 'HEAD', '1b750e56858dabefb0ddb8b922c6bdcbe0574e4c'], { encoding: 'utf8' }).trim(),
            mainUntouchedByWorkflow: true,
            deterministicGates: {
              lockedInstall: 'PASS',
              typecheck: 'PASS',
              build: 'PASS',
              storyV4: 'PASS',
              openNovelRuntimeTests: 'PASS',
              httpSmoke: 'PASS',
              immutableAssetRecompile: 'PASS',
              p1ToP6Convergence: structural.verdict,
              branchPersistence: branches.verdict,
            },
            realModel: {
              verdict: real.verdict,
              providerBaseUrl: real.providerBaseUrl,
              expectedModel: real.expectedModel,
              observedModels: real.observedModels,
              providerCallCount: real.providerCallCount,
              opening: real.opening.turnId,
              turnCount: real.turnCount,
              fixtureSignalCount: real.fixtureSignalCount,
            },
            contentCounts: structural.counts,
            branchDivergence: branches.divergence,
            logSha256: hashes,
            generatedAt: new Date().toISOString(),
          };
          fs.writeFileSync(path.join(root, 'candidate-ready.json'), JSON.stringify(evidence, null, 2) + '\n');
          fs.writeFileSync(path.join(root, 'CANDIDATE_BRANCH_READY.md'), [
            '# CANDIDATE_BRANCH_READY',
            '',
            `- Repository: ${evidence.repository}`,
            `- Branch: ${evidence.branch}`,
            `- Tested source SHA: ${evidence.testedSourceSha}`,
            `- Frozen baseline SHA: ${evidence.frozenBaselineSha}`,
            `- Deterministic gates: PASS`,
            `- Real model: ${evidence.realModel.expectedModel}`,
            `- Real model calls: ${evidence.realModel.providerCallCount}`,
            `- Player acceptance: G00-T20 PASS`,
            `- Main modified or merged: NO`,
            '',
            'Final validation and any merge into main remain the responsibility of local Codex.',
            '',
          ].join('\n'));
          NODE
          test "$(node -p "require('./$EVIDENCE_ROOT/candidate-ready.json').status")" = "CANDIDATE_BRANCH_READY"

      - name: Clean temporary execution files
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/auto-execute/.chatgpt-pro-capability-binding.patch
          rm -f docs/auto-execute/.connector-push-probe
          rm -f docs/auto-execute/.connector-all-functions-loaded
          rm -f docs/auto-execute/.push-files-schema-probe.txt
          rm -f docs/auto-execute/.push-files-schema-probe-2.txt
          rm -f docs/auto-execute/.multi-file-probe-a
          rm -f docs/auto-execute/.pre-push-files-test
          rm -f .github/workflows/chatgpt-pro-apply-capability-patch.yml
          rm -f .github/workflows/chatgpt-pro-auto-apply-staged-patch.yml
          rm -f .github/workflows/chatgpt-pro-finalize-convergence.yml
          git diff --check

      - name: Commit and push the verified candidate only
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "codex/chatgpt-pro-ai-story-convergence"
          test "$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)" = "1b750e56858dabefb0ddb8b922c6bdcbe0574e4c"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(ai-story): finalize one-shot convergence candidate"
          git push origin HEAD:codex/chatgpt-pro-ai-story-convergence

      - name: Upload immutable execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-pro-ai-story-final-${{ github.sha }}
          path: |
            candidate-evidence/
            docs/auto-execute/evidence/chatgpt-pro-convergence/
            docs/auto-execute/evidence/chatgpt-pro-g00-t20/
            docs/auto-execute/evidence/chatgpt-pro-final/
          if-no-files-found: warn
          retention-days: 14
