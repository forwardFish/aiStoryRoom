name: Requirement Dependency Dependency Export

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/requirement-dependency-source-export.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish export status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/dependency-export" \
            -f description="Dependency export running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen workspace and pack dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          root="${RUNNER_TEMP}/requirement-dependency-deps"
          mkdir -p "${root}"
          tar --zstd -cf "${root}/workspace-deps.tar.zst" \
            node_modules \
            packages/openovel-runtime \
            packages/templates/node_modules \
            apps/openovel-runtime/node_modules \
            apps/api/node_modules
          git rev-parse HEAD > "${root}/source-sha.txt"
          du -sh "${root}/workspace-deps.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: requirement-dependency-deps-${{ github.sha }}
          path: ${{ runner.temp }}/requirement-dependency-deps/
          if-no-files-found: error
          retention-days: 2

      - name: Publish export completion
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="dynamic-kernel-lite/dependency-export" \
            -f description="Dependency export uploaded" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
