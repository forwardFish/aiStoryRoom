name: Requirement Dependency Acceptance Source Export

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/requirement-dependency-source-export.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish export status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/acceptance-source-export" \
            -f description="Acceptance source export running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export remaining deterministic acceptance source
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/requirement-dependency-acceptance-source"
          mkdir -p "${root}/packages" "${root}/scripts" "${root}/prisma"
          rsync -a --exclude='node_modules/' --exclude='dist/' \
            packages/shared/ "${root}/packages/shared/"
          rsync -a --exclude='node_modules/' --exclude='dist/' \
            scripts/acceptance/ "${root}/scripts/acceptance/"
          cp scripts/run-current-solo-story-engine-tests.mjs "${root}/scripts/"
          if [ -d prisma ]; then rsync -a prisma/ "${root}/prisma/"; fi
          for file in tsconfig.base.json .env.test; do
            if [ -f "${file}" ]; then cp "${file}" "${root}/"; fi
          done
          git rev-parse HEAD > "${root}/source-sha.txt"
          du -sh "${root}"

      - uses: actions/upload-artifact@v4
        with:
          name: requirement-dependency-acceptance-source-${{ github.sha }}
          path: ${{ runner.temp }}/requirement-dependency-acceptance-source/
          if-no-files-found: error
          retention-days: 2

      - name: Publish export completion
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="dynamic-kernel-lite/acceptance-source-export" \
            -f description="Acceptance source export uploaded" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
