name: Requirement Dependency Product Delivery

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/requirement-dependency-product.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EVIDENCE_ROOT: /tmp/requirement-dependency-product
      BASE_SHA: 321a9aa03ce33201a59da63350e385b885023d77
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/requirement-dependency-product" \
            -f description="Tracked Requirement dependency product gates running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          pnpm install --frozen-lockfile 2>&1 \
            | tee "${EVIDENCE_ROOT}/logs/00-install.log"

      - name: Build exact tracked product commit
        shell: bash
        run: |
          set -euo pipefail
          python .github/repair/requirement-dependency-product.py \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/01-apply-product.log"
          SANGTIAN_SKIP_SOURCE_WRITES=1 \
          SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring-output" \
          SANGTIAN_RUNTIME_PACKAGE_PATH="${GITHUB_WORKSPACE}/packages/templates/config/sangtian/story-package/part-one-runtime.json" \
            node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/02-compile-package.log"
          git diff --check
          git diff --stat | tee "${EVIDENCE_ROOT}/logs/03-precommit-diff-stat.log"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages apps scripts
          git rm -f \
            .github/repair/requirement-dependency-product.py \
            .github/workflows/requirement-dependency-product.yml
          git diff --cached --check
          git commit -m "feat(kernel-lite): add validated requirement dependency routing [skip ci]"
          git rev-parse HEAD > "${EVIDENCE_ROOT}/tested-sha.txt"
          git rev-parse HEAD^{tree} > "${EVIDENCE_ROOT}/tested-tree.txt"
          git rev-parse "${BASE_SHA}^{tree}" > "${EVIDENCE_ROOT}/base-tree.txt"
          git diff --name-status "${BASE_SHA}..HEAD" \
            | tee "${EVIDENCE_ROOT}/changed-files.txt"
          git show --stat --oneline HEAD > "${EVIDENCE_ROOT}/tested-commit.txt"
          git status --short > "${EVIDENCE_ROOT}/pretest-status.txt"
          test ! -s "${EVIDENCE_ROOT}/pretest-status.txt"
          test "$(cat "${EVIDENCE_ROOT}/tested-tree.txt")" != "$(cat "${EVIDENCE_ROOT}/base-tree.txt")"
          grep -q '^A[[:space:]]\+packages/templates/src/story-package/requirement-dependency.ts$' "${EVIDENCE_ROOT}/changed-files.txt"
          grep -q 'packages/templates/authoring/sangtian/requirements/part-01.requirements.json' "${EVIDENCE_ROOT}/changed-files.txt"
          grep -q 'packages/templates/tests/requirement-dependency.test.ts' "${EVIDENCE_ROOT}/changed-files.txt"
          grep -q 'apps/openovel-runtime/tests/requirement-dependency-production.spec.ts' "${EVIDENCE_ROOT}/changed-files.txt"
          test ! -e .github/repair/requirement-dependency-product.py
          test ! -e .github/workflows/requirement-dependency-product.yml

      - name: Run complete deterministic matrix on exact commit
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/tested-sha.txt")"
          results="${EVIDENCE_ROOT}/results.tsv"
          : > "${results}"
          failed=0
          run_gate() {
            local label="$1"
            shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${results}"
            if [ "${code}" -ne 0 ]; then failed=1; fi
          }

          run_gate 04-story-v4 pnpm test:story:v4
          run_gate 05-templates-typecheck pnpm --filter @ai-story/templates typecheck
          run_gate 06-templates-runtime-contract pnpm --filter @ai-story/templates test:runtime-contract
          run_gate 07-templates-story-package pnpm --filter @ai-story/templates test:story-package
          run_gate 08-templates-build pnpm --filter @ai-story/templates build
          run_gate 09-openovel-typecheck pnpm --filter @apps/openovel-runtime typecheck
          run_gate 10-openovel-test pnpm --filter @apps/openovel-runtime test
          run_gate 11-openovel-build pnpm --filter @apps/openovel-runtime build
          run_gate 12-prisma-generate pnpm db:generate
          run_gate 13-api-solo pnpm --filter @apps/api test:solo-story-engine
          run_gate 14-api-legacy-sangtian pnpm --filter @apps/api test:solo-story-engine:legacy-sangtian
          run_gate 15-branch-persistence pnpm test:story:branch-persistence
          run_gate 16-story-options pnpm test:story:options
          run_gate 17-story-convergence pnpm test:story:convergence

          if [ "${failed}" -eq 0 ]; then
            printf 'pass\n' > "${EVIDENCE_ROOT}/status.txt"
          else
            printf 'fail\n' > "${EVIDENCE_ROOT}/status.txt"
          fi

      - name: Summarize evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_ROOT"])
          patterns = {
              "tests": re.compile(r"^# tests (\d+)$", re.MULTILINE),
              "pass": re.compile(r"^# pass (\d+)$", re.MULTILINE),
              "fail": re.compile(r"^# fail (\d+)$", re.MULTILINE),
              "skip": re.compile(r"^# skipped (\d+)$", re.MULTILINE),
              "todo": re.compile(r"^# todo (\d+)$", re.MULTILINE),
          }
          commands = []
          results = root / "results.tsv"
          if results.exists():
              for line in results.read_text().splitlines():
                  label, code, log_path = line.split("\t", 2)
                  text = Path(log_path).read_text(errors="replace") if Path(log_path).exists() else ""
                  row = {"label": label, "exitCode": int(code), "logPath": log_path}
                  for key, pattern in patterns.items():
                      values = pattern.findall(text)
                      row[key] = int(values[-1]) if values else None
                  commands.append(row)
          summary = {
              "inputSha": os.environ.get("GITHUB_SHA"),
              "baseSha": os.environ.get("BASE_SHA"),
              "testedSha": (root / "tested-sha.txt").read_text().strip() if (root / "tested-sha.txt").exists() else None,
              "baseTree": (root / "base-tree.txt").read_text().strip() if (root / "base-tree.txt").exists() else None,
              "testedTree": (root / "tested-tree.txt").read_text().strip() if (root / "tested-tree.txt").exists() else None,
              "status": (root / "status.txt").read_text().strip() if (root / "status.txt").exists() else "missing",
              "commands": commands,
              "supabaseFormal": "NOT_RUN",
              "deepSeek": "NOT_RUN",
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY

      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirement-dependency-product-${{ github.sha }}
          path: /tmp/requirement-dependency-product/
          if-no-files-found: error
          retention-days: 7

      - name: Push exact tested candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${EVIDENCE_ROOT}/status.txt"
          test "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass
          test "$(git rev-parse HEAD)" = "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/tested-sha.txt")"
          git push origin HEAD:codex/chatgpt-pro-dynamic-kernel-lite
          git rev-parse HEAD > "${EVIDENCE_ROOT}/final-sha.txt"

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          description="Tracked Requirement dependency product gates failed"
          if [ -f "${EVIDENCE_ROOT}/final-sha.txt" ]; then
            state=success
            description="Tracked Requirement dependency product passed and was pushed"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/requirement-dependency-product" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
