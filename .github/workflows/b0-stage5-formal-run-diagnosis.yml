name: B0 Stage 5 Formal Run Diagnosis

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage5-formal-run-diagnosis.yml

permissions:
  contents: write
  statuses: write
  actions: read

concurrency:
  group: b0-stage5-formal-run-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publish diagnosis locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo,
              sha: context.sha, state: "pending", context: "b0/stage5-formal-diagnosis",
              description: `formal run diagnosis running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact candidate tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage5-formal-run-diagnosis.yml"
      - name: Read latest formal workflow metadata
        id: metadata
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const readinessPath = 'docs/auto-execute/evidence/b0/c8/credential-readiness.json';
            const readiness = fs.existsSync(readinessPath)
              ? JSON.parse(fs.readFileSync(readinessPath, 'utf8'))
              : { status: 'MISSING' };
            const checkpointExists = fs.existsSync('docs/auto-execute/evidence/b0/c8/checkpoint.json');
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'b0-candidate-real-acceptance.yml',
              branch: 'codex/chatgpt-pro-maneuver-evidence-v1',
              per_page: 20,
            });
            const run = runs.data.workflow_runs[0] || null;
            let jobs = [];
            if (run) {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                filter: 'all',
                per_page: 100,
              });
              jobs = response.data.jobs.map(job => ({
                id: job.id,
                name: job.name,
                status: job.status,
                conclusion: job.conclusion,
                startedAt: job.started_at,
                completedAt: job.completed_at,
                steps: (job.steps || []).map(step => ({
                  number: step.number,
                  name: step.name,
                  status: step.status,
                  conclusion: step.conclusion,
                })),
              }));
            }
            const failedJob = jobs.find(job => job.conclusion === 'failure') || null;
            const payload = {
              schemaVersion: 1,
              diagnosedAt: new Date().toISOString(),
              diagnosisCommitSha: context.sha,
              readinessStatus: readiness.status || null,
              selectedEnvironment: readiness.selectedEnvironment || null,
              selectedDatabaseSecretName: readiness.selectedDatabaseSecretName || null,
              selectedProviderSecretName: readiness.selectedProviderSecretName || null,
              formalCheckpointExists: checkpointExists,
              latestFormalRun: run ? {
                id: run.id,
                attempt: run.run_attempt,
                status: run.status,
                conclusion: run.conclusion,
                event: run.event,
                headSha: run.head_sha,
                createdAt: run.created_at,
                updatedAt: run.updated_at,
                jobs,
              } : null,
              secretValuesRead: false,
              productionDatabaseAccessed: false,
            };
            fs.mkdirSync('docs/auto-execute/evidence/b0/c9/readiness', { recursive: true });
            fs.writeFileSync('docs/auto-execute/evidence/b0/c9/readiness/formal-run-diagnosis.json', JSON.stringify(payload, null, 2) + '\n');
            core.setOutput('run_id', run ? String(run.id) : '');
            core.setOutput('failed_job_id', failedJob ? String(failedJob.id) : '');
            core.setOutput('readiness_status', String(readiness.status || 'MISSING'));
            core.setOutput('checkpoint_exists', checkpointExists ? 'true' : 'false');
            core.setOutput('run_conclusion', run ? String(run.conclusion || run.status) : 'missing');
      - name: Download and sanitize failed job log
        if: steps.metadata.outputs.failed_job_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: ${{ steps.metadata.outputs.failed_job_id }}
        run: |
          set -euo pipefail
          mkdir -p docs/auto-execute/evidence/b0/c9/readiness
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$FAILED_JOB_ID/logs" > /tmp/b0-formal-job.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          source=Path('/tmp/b0-formal-job.log').read_text(encoding='utf-8',errors='replace').splitlines()
          sanitized=[]
          for line in source:
              line=re.sub(r'postgres(?:ql)?://[^\s\"\']+', '[REDACTED_DATABASE_URL]', line, flags=re.I)
              line=re.sub(r'Bearer\s+[A-Za-z0-9._~+/=-]+', 'Bearer [REDACTED]', line, flags=re.I)
              line=re.sub(r'(?:api[_-]?key|password|cookie|token)\s*[:=]\s*[^\s]+', r'\1=[REDACTED]', line, flags=re.I)
              sanitized.append(line)
          selected=set()
          signal=re.compile(r'(?:##\[error\]|error:|failed|failure|required|refusing|Process completed|exit code|TIMEOUT|HTTP_5\d\d)',re.I)
          for index,line in enumerate(sanitized):
              if signal.search(line):
                  selected.update(range(max(0,index-4),min(len(sanitized),index+5)))
          output=[sanitized[index] for index in sorted(selected)]
          if len(output)>500: output=output[-500:]
          Path('docs/auto-execute/evidence/b0/c9/readiness/formal-failure-excerpt.log').write_text('\n'.join(output)+'\n',encoding='utf-8')
          PY
          if grep -Eiq 'postgres(?:ql)?://|Bearer[[:space:]]+[A-Za-z0-9]|(api[_-]?key|password|cookie|token)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9._~+/=-]{12,}' docs/auto-execute/evidence/b0/c9/readiness/formal-failure-excerpt.log; then
            echo 'sanitized failure excerpt still contains a credential pattern' >&2
            exit 1
          fi
      - name: Write fail-closed formal status
        if: always()
        shell: bash
        env:
          READINESS: ${{ steps.metadata.outputs.readiness_status }}
          CHECKPOINT: ${{ steps.metadata.outputs.checkpoint_exists }}
          CONCLUSION: ${{ steps.metadata.outputs.run_conclusion }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          checkpoint=os.environ.get('CHECKPOINT')=='true'
          readiness=os.environ.get('READINESS','MISSING')
          conclusion=os.environ.get('CONCLUSION','missing')
          if checkpoint:
              status='FORMAL_RUNTIME_EVIDENCE_PRESENT'
          elif readiness.startswith('BLOCKED'):
              status='BLOCKED_MISSING_NONPRODUCTION_CREDENTIAL_PAIR'
          elif conclusion in {'failure','cancelled','timed_out','action_required','stale'}:
              status='FORMAL_RUN_FAILED'
          elif conclusion in {'queued','in_progress','waiting','pending'}:
              status='FORMAL_RUN_NOT_SETTLED'
          else:
              status='FORMAL_RUN_NOT_OBSERVED'
          payload={'schemaVersion':1,'status':status,'generatedAt':datetime.now(timezone.utc).isoformat(),
                   'diagnosisCommitSha':os.environ['GITHUB_SHA'],'readinessStatus':readiness,
                   'formalCheckpointExists':checkpoint,'latestRunConclusion':conclusion,
                   'formalC8Passed':checkpoint,'completionMarkersAllowed':False if not checkpoint else None}
          path=Path('docs/auto-execute/evidence/b0/c8/formal-status.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(payload,indent=2)+'\n')
          PY
      - name: Commit diagnosis as ordinary fast-forward
        shell: bash
        env:
          READINESS: ${{ steps.metadata.outputs.readiness_status }}
          CHECKPOINT: ${{ steps.metadata.outputs.checkpoint_exists }}
          CONCLUSION: ${{ steps.metadata.outputs.run_conclusion }}
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/auto-execute/evidence/b0/c8/formal-status.json docs/auto-execute/evidence/b0/c9/readiness
          git rm .github/workflows/b0-stage5-formal-run-diagnosis.yml
          git diff --cached --check
          if [ "$CHECKPOINT" = true ]; then
            git commit -m "test(b0): verify formal C8 runtime evidence"
          elif [[ "$READINESS" == BLOCKED* ]]; then
            git commit -m "test(b0): record formal C8 credential blocker"
          else
            git commit -m "test(b0): record formal C8 run failure"
          fi
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Publish diagnosis outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo,
              sha: context.sha, state: ok ? "success" : "failure", context: "b0/stage5-formal-diagnosis",
              description: `formal run diagnosis ${ok ? "recorded" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            if (!ok) core.setFailed('Formal run diagnosis failed');
