name: B0 Stage 17 Structured Result Carry Forward

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage17-result-carry-forward.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage17-result-carry-forward
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage17-result-carry-forward",
              description: `structured result carry-forward repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact remote starting point
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "a3ce95b235050f0a8665cea94e0e99604ba29dbf"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage17-result-carry-forward.yml"
          test "$(sha256sum apps/api/src/b0-settlement/b0-window-player.service.ts | cut -d' ' -f1)" = "a45524d484bddbc281e122e33a0823b8ff4c959b5334354ab334953199766b99"
          test "$(sha256sum apps/api/src/b0-settlement/b0-window-player.core.spec.ts | cut -d' ' -f1)" = "292628bb1d31389d79e6bc32c63313d4cfd4cad27d476d25e405857ea964bec6"

      - name: Apply the hash-bound result projection patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/ba93796f94c157e43f700d966a182150d96acad1" --jq .content \
            | tr -d '\n' \
            | base64 -d > /tmp/b0-stage17.patch.gz.b64
          test "$(wc -c < /tmp/b0-stage17.patch.gz.b64 | tr -d ' ')" = "1880"
          test "$(sha256sum /tmp/b0-stage17.patch.gz.b64 | cut -d' ' -f1)" = "182f73bb6a25713a1de3342dfa32bb3df0e6f550aa003940570e45b08f1c3220"
          base64 -d /tmp/b0-stage17.patch.gz.b64 > /tmp/b0-stage17.patch.gz
          test "$(sha256sum /tmp/b0-stage17.patch.gz | cut -d' ' -f1)" = "e02e01a22f1b4333fa91b89a92d70ceca4bf7541c0d9e59b1d5e9cafe177cbe9"
          gzip -dc /tmp/b0-stage17.patch.gz > /tmp/b0-stage17.patch
          test "$(sha256sum /tmp/b0-stage17.patch | cut -d' ' -f1)" = "f5a50c8f44c5f7a4d3c3296900b5e47266aebdfebafea8459f3b7692a850e0c9"
          git apply --check /tmp/b0-stage17.patch
          git apply /tmp/b0-stage17.patch
          git diff --check
          test "$(sha256sum apps/api/src/b0-settlement/b0-window-player.service.ts | cut -d' ' -f1)" = "73c2524953529120120c90fcb1dc5272b519c51db028cb890e7e05ddeeb818fa"
          test "$(sha256sum apps/api/src/b0-settlement/b0-window-player.core.spec.ts | cut -d' ' -f1)" = "701f65d811cd083a1f7018df14a884e21ddea272a2b8ddc7e2d369291308a3db"

      - name: Frozen install and affected verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/api typecheck
          pnpm --filter @apps/api test:b0-player-window
          pnpm --filter @apps/api test:b0-pipeline
          pnpm --filter @apps/api test:b0-ops
          pnpm --filter @apps/api test
          pnpm --filter @apps/api build
          pnpm --filter @apps/web typecheck
          pnpm --filter @apps/web test:b0-window

      - name: Commit and push the completed stage as an ordinary fast-forward
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          remote_before="$(git rev-parse origin/$GITHUB_REF_NAME)"
          test "$remote_before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/b0-settlement/b0-window-player.service.ts \
            apps/api/src/b0-settlement/b0-window-player.core.spec.ts
          git rm .github/workflows/b0-stage17-result-carry-forward.yml
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          .github/workflows/b0-stage17-result-carry-forward.yml
          apps/api/src/b0-settlement/b0-window-player.core.spec.ts
          apps/api/src/b0-settlement/b0-window-player.service.ts
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "fix(b0): carry completed results into the next window"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          remote_after="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          {
            echo "local_head=$local_head"
            echo "remote_before=$remote_before"
            echo "remote_after=$remote_after"
          } >> "$GITHUB_OUTPUT"

      - name: Publish completed-stage outcome
        if: success()
        uses: actions/github-script@v7
        env:
          FINAL_SHA: ${{ steps.commit.outputs.local_head }}
          REMOTE_BEFORE: ${{ steps.commit.outputs.remote_before }}
          REMOTE_AFTER: ${{ steps.commit.outputs.remote_after }}
        with:
          script: |
            if (!process.env.FINAL_SHA || process.env.FINAL_SHA !== process.env.REMOTE_AFTER) {
              core.setFailed("stage push SHA readback mismatch");
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.FINAL_SHA,
              state: "success",
              context: "b0/stage17-result-carry-forward",
              description: `ordinary fast-forward from ${process.env.REMOTE_BEFORE.slice(0, 8)} verified in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Publish failed-stage outcome
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "failure",
              context: "b0/stage17-result-carry-forward",
              description: `structured result carry-forward repair failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.setFailed("B0 stage 17 structured result carry-forward repair failed");
