name: B0 Stage 19 Narrative Quiescence Before Replay

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage19-narrative-quiescence.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage19-narrative-quiescence
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage19-narrative-quiescence",
              description: `narrative quiescence repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact remote starting point
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "14589ef2d488d78f223e2992fe40f3ba025fa710"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage19-narrative-quiescence.yml"
          test "$(sha256sum scripts/acceptance/b0-candidate-real-flow.ts | cut -d' ' -f1)" = "2b21006e323bfc804350640f982d60831f69351bf701df09d6bdf6f8cee6bce7"
          test "$(sha256sum scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs | cut -d' ' -f1)" = "467e2afcb41b0e65469c6afc18674b588e0d4bcae1000cebef0790308b8e68e3"

      - name: Apply the hash-bound narrative quiescence patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/6dcdfb6caa181a2cac4768b11fd1de0306586b08" --jq .content \
            | tr -d '\n' \
            | base64 -d > /tmp/b0-stage19.patch.gz.b64
          test "$(wc -c < /tmp/b0-stage19.patch.gz.b64 | tr -d ' ')" = "2360"
          test "$(sha256sum /tmp/b0-stage19.patch.gz.b64 | cut -d' ' -f1)" = "f5fa51bf00267971eed8989246c873067d81d9cc31c99b9fa1c393c7fe379db0"
          base64 -d /tmp/b0-stage19.patch.gz.b64 > /tmp/b0-stage19.patch.gz
          test "$(wc -c < /tmp/b0-stage19.patch.gz | tr -d ' ')" = "1768"
          test "$(sha256sum /tmp/b0-stage19.patch.gz | cut -d' ' -f1)" = "774d6b8e9716d1cf17cf19303f3bf9356d1bc6c7c41a6e9627307182f2e6f35c"
          gzip -dc /tmp/b0-stage19.patch.gz > /tmp/b0-stage19.patch
          test "$(wc -c < /tmp/b0-stage19.patch | tr -d ' ')" = "5088"
          test "$(sha256sum /tmp/b0-stage19.patch | cut -d' ' -f1)" = "a9fc1ff82a584ef2d826e4001abcbfac5690734f0e12f02649036c0ab1f79474"
          git apply --check /tmp/b0-stage19.patch
          git apply /tmp/b0-stage19.patch
          git diff --check
          test "$(sha256sum scripts/acceptance/b0-candidate-real-flow.ts | cut -d' ' -f1)" = "44cb408e4be02640fd17159a47667fb255a7a622c6d3887a87d7e5819875114a"
          test "$(sha256sum scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs | cut -d' ' -f1)" = "7c37b3db263e46b6bb87135e7e5130f73867b891f102641fa97efa1df0cc0436"

      - name: Frozen install and affected verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance
          node --test scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs
          bash -n scripts/acceptance/b0-selfhosted-real-acceptance.sh
          bash -n scripts/acceptance/b0-formal-supabase-acceptance.sh

      - name: Commit and push the completed stage as an ordinary fast-forward
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          remote_before="$(git rev-parse origin/$GITHUB_REF_NAME)"
          test "$remote_before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/acceptance/b0-candidate-real-flow.ts \
            scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs
          git rm .github/workflows/b0-stage19-narrative-quiescence.yml
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          .github/workflows/b0-stage19-narrative-quiescence.yml
          scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs
          scripts/acceptance/b0-candidate-real-flow.ts
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "test(b0): wait for narrative quiescence before replay"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          remote_after="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          {
            echo "local_head=$local_head"
            echo "remote_before=$remote_before"
            echo "remote_after=$remote_after"
          } >> "$GITHUB_OUTPUT"

      - name: Publish completed-stage outcome
        if: success()
        uses: actions/github-script@v7
        env:
          FINAL_SHA: ${{ steps.commit.outputs.local_head }}
          REMOTE_BEFORE: ${{ steps.commit.outputs.remote_before }}
          REMOTE_AFTER: ${{ steps.commit.outputs.remote_after }}
        with:
          script: |
            if (!process.env.FINAL_SHA || process.env.FINAL_SHA !== process.env.REMOTE_AFTER) {
              core.setFailed("stage push SHA readback mismatch");
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.FINAL_SHA,
              state: "success",
              context: "b0/stage19-narrative-quiescence",
              description: `ordinary fast-forward from ${process.env.REMOTE_BEFORE.slice(0, 8)} verified in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Publish failed-stage outcome
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "failure",
              context: "b0/stage19-narrative-quiescence",
              description: `narrative quiescence repair failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.setFailed("B0 stage 19 narrative quiescence repair failed");
