name: B0 One-Shot Narrative Task Atomicity

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-narrative-task-atomicity.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-one-shot-narrative-task-atomicity
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_BASELINE: 689bf663e256a9d9ca71892ddbc076c356cdc1d6

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/narrative-task-atomicity",
              description: `narrative task atomicity repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 100

      - name: Apply the minimal product and contract repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$B0_BASELINE" HEAD
          test -z "$(git status --short)"

          python3 - <<'PY'
          from pathlib import Path

          contract_path = Path("apps/api/src/story-task-outbox.contract.ts")
          if contract_path.exists():
              raise SystemExit("story-task source-finalization contract already exists")
          contract_path.write_text('''export const STORY_TASK_SOURCE_FINALIZATION_SCHEMA_V1 = "story-task-source-finalization-v1" as const;

export type StoryTaskLeaseFenceV1 = Readonly<{
  taskId: string;
  leaseOwner: string;
  leaseVersion: number;
}>;

export type StoryTaskSourceFinalizationV1 = Readonly<{
  outcome: string;
  sourceFinalization: Readonly<{
    schemaVersion: typeof STORY_TASK_SOURCE_FINALIZATION_SCHEMA_V1;
    taskId: string;
    leaseOwner: string;
    leaseVersion: number;
  }>;
}>;

export function isStoryTaskSourceFinalizationV1(
  value: unknown,
  fence: StoryTaskLeaseFenceV1,
): value is StoryTaskSourceFinalizationV1 {
  if (!value || typeof value !== "object") return false;
  const marker = (value as { sourceFinalization?: unknown }).sourceFinalization;
  if (!marker || typeof marker !== "object") return false;
  const record = marker as Record<string, unknown>;
  return record.schemaVersion === STORY_TASK_SOURCE_FINALIZATION_SCHEMA_V1
    && record.taskId === fence.taskId
    && record.leaseOwner === fence.leaseOwner
    && record.leaseVersion === fence.leaseVersion;
}
''', encoding="utf-8")

          outbox_path = Path("apps/api/src/story-task-outbox.service.ts")
          outbox = outbox_path.read_text(encoding="utf-8")
          import_anchor = 'import { SoloStoryEngineService } from "./solo-story-engine/solo-story-engine.service";\n'
          import_value = import_anchor + 'import { isStoryTaskSourceFinalizationV1 } from "./story-task-outbox.contract";\n'
          if outbox.count(import_anchor) != 1 or "isStoryTaskSourceFinalizationV1" in outbox:
              raise SystemExit("unexpected StoryTaskOutbox import state")
          outbox = outbox.replace(import_anchor, import_value, 1)
          completion_anchor = '      const completed = await this.prisma.storyTaskOutbox.updateMany({\n'
          completion_value = '      if (isStoryTaskSourceFinalizationV1(resolution, fence)) return;\n' + completion_anchor
          if outbox.count(completion_anchor) != 1:
              raise SystemExit("unexpected generic outbox completion state")
          outbox = outbox.replace(completion_anchor, completion_value, 1)
          outbox_path.write_text(outbox, encoding="utf-8")

