name: ChatGPT Pro AI Story Candidate

on:
  pull_request:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  deterministic-engineering-gates:
    name: Deterministic engineering gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      OPENOVEL_PROVIDER_BASE_URL: https://api.deepseek.com
      OPENOVEL_MODEL: deepseek-v4-pro
      OPENOVEL_NARRATOR_MODEL: deepseek-v4-pro
      OPENOVEL_REVIEWER_MODEL: deepseek-v4-pro
      OPENOVEL_OPTIONS_MODEL: deepseek-v4-pro
      OPENOVEL_STORYKEEPER_MODEL: deepseek-v4-pro
      OPENOVEL_DEEPSEEK_THINKING: disabled
    steps:
      - name: Check out exact candidate base SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Prove repository, branch boundary, base and clean tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence/logs
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "base_ref=${{ github.event.pull_request.base.ref }}"
            echo "base_sha=${{ github.event.pull_request.base.sha }}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "remote=$(git remote get-url origin)"
            echo "merge_base=$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee candidate-evidence/logs/00-git-gate.log
          test "${GITHUB_REPOSITORY}" = "forwardFish/aiStoryRoom"
          test "${{ github.event.pull_request.base.ref }}" = "codex/chatgpt-pro-ai-story-convergence"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)" = "1b750e56858dabefb0ddb8b922c6bdcbe0574e4c"
          test -z "$(git status --short)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - id: install
        name: Install locked dependencies
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee candidate-evidence/logs/01-pnpm-install.log

      - id: typecheck
        name: OpenNovel runtime typecheck
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime typecheck 2>&1 | tee candidate-evidence/logs/02-openovel-typecheck.log

      - id: build
        name: OpenNovel runtime build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime build 2>&1 | tee candidate-evidence/logs/03-openovel-build.log

      - id: story_v4
        name: Story V4 contracts and runtime tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:story:v4 2>&1 | tee candidate-evidence/logs/04-story-v4.log

      - id: http_smoke
        name: OpenNovel real HTTP smoke with deterministic provider fixture
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime smoke:http 2>&1 | tee candidate-evidence/logs/05-openovel-http-smoke.log

      - id: assets
        name: Recompile Part One without source writes and compare immutable bytes
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_SKIP_SOURCE_WRITES=1
          export SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_RUNTIME_PACKAGE_PATH="${RUNNER_TEMP}/part-one-runtime.json"
          node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee candidate-evidence/logs/06-asset-recompile.log
          sha256sum \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${RUNNER_TEMP}/part-one-runtime.json" \
            | tee candidate-evidence/logs/07-asset-sha256.log
          cmp --silent \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${RUNNER_TEMP}/part-one-runtime.json"

      - name: Record exact gate outcomes and targeted source archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "tested_commit=$(git rev-parse HEAD)"
            echo "merge_base=$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)"
            echo "install=${{ steps.install.outcome }}"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "story_v4=${{ steps.story_v4.outcome }}"
            echo "http_smoke=${{ steps.http_smoke.outcome }}"
            echo "assets=${{ steps.assets.outcome }}"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee candidate-evidence/logs/99-final-git-gate.log
          git archive --format=tar.gz \
            --output=candidate-evidence/candidate-targeted-source.tar.gz \
            HEAD -- \
            AGENTS.md \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.base.json \
            apps/openovel-runtime \
            packages/templates/package.json \
            packages/templates/tsconfig.json \
            packages/templates/src \
            packages/templates/tests \
            packages/templates/authoring/sangtian/manifest.json \
            packages/templates/authoring/sangtian/narrative \
            packages/templates/authoring/sangtian/sections \
            packages/templates/authoring/sangtian/source-evidence \
            packages/templates/authoring/sangtian/evidence \
            packages/templates/authoring/sangtian/continuity \
            packages/templates/config/sangtian/story-package \
            scripts/story-decomposition \
            docs/Our_Many_Worlds_AI剧情推演一次性收敛现状审计与ChatGPT_Pro开发交接方案_v1.0.md
          cp packages/templates/config/sangtian/story-package/part-one-runtime.json \
            candidate-evidence/committed-part-one-runtime.json

      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-engineering-evidence-${{ github.event.pull_request.base.sha }}
          path: candidate-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce all deterministic gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.story_v4.outcome }}" = "success"
          test "${{ steps.http_smoke.outcome }}" = "success"
          test "${{ steps.assets.outcome }}" = "success"

  apply-capability-patch:
    name: Validate and apply generic capability binding
    if: github.event.pull_request.title == 'patch: apply generic capability binding'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate base SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Prove branch boundary and apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.ref }}" = "codex/chatgpt-pro-ai-story-convergence"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)" = "1b750e56858dabefb0ddb8b922c6bdcbe0574e4c"
          git apply --check docs/auto-execute/.chatgpt-pro-capability-binding.patch
          git apply docs/auto-execute/.chatgpt-pro-capability-binding.patch
          git rm docs/auto-execute/.chatgpt-pro-capability-binding.patch
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify patched runtime
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @apps/openovel-runtime typecheck
          pnpm test:story:v4
          pnpm --filter @apps/openovel-runtime smoke:http

      - name: Commit tested patch to candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/openovel-runtime/src/decision-adapter.ts
          git add apps/openovel-runtime/src/intent-resolver.ts
          git add apps/openovel-runtime/src/sangtian-decisions.ts
          git add apps/openovel-runtime/tests/intent-resolver-adapter.spec.ts
          git add apps/openovel-runtime/tests/intent-resolver.spec.ts
          git add packages/templates/src/story-package/part-one-runtime-engine.ts
          git add -u docs/auto-execute/.chatgpt-pro-capability-binding.patch
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "7"
          git commit -m "feat(openovel): settle capability-level free actions"
          git push origin HEAD:codex/chatgpt-pro-ai-story-convergence
