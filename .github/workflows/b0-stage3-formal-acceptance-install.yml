name: B0 Stage 3 Formal Acceptance Workflow Install

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage3-formal-acceptance-install.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage3-formal-acceptance-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage3-formal-acceptance-install",
              description: `stage 3 formal acceptance install running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact candidate and single-file trigger
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage3-formal-acceptance-install.yml"

      - name: Reconstruct immutable stage payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_blob_text() {
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$1" --jq .content \
              | tr -d '\n' \
              | base64 -d
          }
          : > /tmp/b0-stage3-payload.b64
          while read -r blob size digest; do
            chunk="/tmp/${blob}.chunk"
            fetch_blob_text "$blob" > "$chunk"
            test "$(wc -c < "$chunk" | tr -d ' ')" = "$size"
            test "$(sha256sum "$chunk" | cut -d' ' -f1)" = "$digest"
            cat "$chunk" >> /tmp/b0-stage3-payload.b64
          done <<'B0_STAGE3_BLOBS'
          e2e5ecf73fc81a9fc9e27fafcb2dff2afa424e54 5000 8065dd7a141f5412ce58d99a864b76b83ce64cc78f4c8ce340f2504131fcfc0b
          f0210d6224c042c3a47885632f89aaba9e50e353 5000 e4dedcb142e74bf7c9c0e844236885255b539902a711aec68a158fb26118dccf
          a0a287c2783cbab993426b142e80de27ce49ef15 5000 d53a359c6b4e592a5ccca30d43efea8df3f82d660ab3e6690f054157594a4de0
          ff726429b76226160e25cb3fe1806b193338480f 5000 8bf0891062e1654adbd9186956c200fbb4b5234baf8307b980773008b79123e1
          8c216a47f9fea31b054903c0f6bde3be616e51a1 3268 2e2b76434100f90046bf96994beebb8130a4433c10ced47ea77c3a54d89d51b0
          B0_STAGE3_BLOBS
          test "$(wc -c < /tmp/b0-stage3-payload.b64 | tr -d ' ')" = "23268"
          test "$(sha256sum /tmp/b0-stage3-payload.b64 | cut -d' ' -f1)" = "03897de01eda0a842cffd4edf97f9548556b5e4a9dd84d79926deb28ab82cbad"
          base64 -d /tmp/b0-stage3-payload.b64 > /tmp/b0-stage3-payload.tar.gz
          test "$(wc -c < /tmp/b0-stage3-payload.tar.gz | tr -d ' ')" = "17450"
          test "$(sha256sum /tmp/b0-stage3-payload.tar.gz | cut -d' ' -f1)" = "de4d6607832b3f3519a5b4393f1b16fc59324d3e9be0244e1340d09da600e12d"
          tar -xzf /tmp/b0-stage3-payload.tar.gz
          test "$(sha256sum .github/workflows/b0-candidate-real-acceptance.yml | cut -d' ' -f1)" = "db7e8080ad7673b86f8ca7d7b5f1960d91de4ba7acb71ffd4373a56dd472a54e"
          test "$(sha256sum scripts/acceptance/b0-selfhosted-real-acceptance.sh | cut -d' ' -f1)" = "8dec96b0e3f211796d6213797f88b4da6ef42b2c247e3e3825e723a52ff27c31"
          test "$(sha256sum scripts/acceptance/b0-formal-supabase-acceptance.sh | cut -d' ' -f1)" = "3cbf24f59bbc5208da0a8909263b29dc575bc5968ae1253dd0cb87bfba211286"
          test "$(sha256sum scripts/acceptance/b0-formal-db-admin.mjs | cut -d' ' -f1)" = "4ba11a1053721138d5f1fe803db0440216482069408ce36a21e8b142557c3564"
          test "$(sha256sum scripts/acceptance/b0-formal-provider-probe.mjs | cut -d' ' -f1)" = "ab084ca2c362c243085766dad004b81139119ca23c24ad5ea87f1f345b2b9e39"
          test "$(sha256sum scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs | cut -d' ' -f1)" = "5bc899137e218efc8b5eed828848b4d6318ac2d6f417053fdf345ac8e58c752f"
          chmod +x scripts/acceptance/b0-selfhosted-real-acceptance.sh scripts/acceptance/b0-formal-supabase-acceptance.sh
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen install and acceptance verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance
          bash -n scripts/acceptance/b0-selfhosted-real-acceptance.sh
          bash -n scripts/acceptance/b0-formal-supabase-acceptance.sh
          node --check scripts/acceptance/b0-formal-db-admin.mjs
          node --check scripts/acceptance/b0-formal-provider-probe.mjs
          B0_DATABASE_IMAGE='supabase/postgres:15.14.1.157-mmlb_amd64' B0_PROVIDER_IMAGE='ollama/ollama:0.32.5' scripts/acceptance/b0-selfhosted-real-acceptance.sh self-check
          scripts/acceptance/b0-formal-supabase-acceptance.sh self-check
          node --test scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs
          zeros="sha256:$(printf '0%.0s' $(seq 1 64))"
          GITHUB_SHA="$GITHUB_SHA" DATABASE_URL='postgresql://postgres:secret@127.0.0.1:55432/postgres?schema=cs_accept_b0_install123&connection_limit=3&sslmode=disable' OPENOVEL_PROVIDER_BASE_URL='http://127.0.0.1:11434/v1' OPENOVEL_API_KEY='engineering-self-check' OPENOVEL_MODEL='qwen2.5:1.5b' B0_ACCEPTANCE_TIER='engineering-selfhosted' B0_ACCEPTANCE_ENVIRONMENT='github-hosted-isolated-engineering' B0_DATABASE_PROVENANCE='official-supabase-postgres-container' B0_DATABASE_IMAGE='supabase/postgres:15.14.1.157-mmlb_amd64' B0_DATABASE_IMAGE_DIGEST="$zeros" B0_PROVIDER_PROVENANCE='ollama-openai-compatible-local' B0_PROVIDER_IMAGE='ollama/ollama:0.32.5' B0_PROVIDER_IMAGE_DIGEST="$zeros" B0_PROVIDER_MODEL_DIGEST="$zeros" B0_ACCEPTANCE_SELF_CHECK=1 pnpm test:b0:real-acceptance
          GITHUB_SHA="$GITHUB_SHA" DATABASE_URL='postgresql://postgres:secret@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?schema=cs_accept_b0_install123&connection_limit=3&sslmode=require' OPENOVEL_PROVIDER_BASE_URL='https://api.deepseek.com' OPENOVEL_API_KEY='formal-self-check' OPENOVEL_MODEL='deepseek-chat' B0_ACCEPTANCE_TIER='formal-c8' B0_ACCEPTANCE_ENVIRONMENT='ourmanyworlds.com / test' B0_DATABASE_SECRET_NAME='SUPABASE_DATABASE_URL' B0_PROVIDER_SECRET_NAME='DEEPSEEK_API_KEY' B0_DATABASE_PROVENANCE='supabase-cloud-nonproduction-random-schema' B0_PROVIDER_PROVENANCE='deepseek-api-real' B0_PROVIDER_MODEL_DIGEST="$zeros" B0_ACCEPTANCE_SELF_CHECK=1 pnpm test:b0:real-acceptance

      - name: Commit verified stage 3 as ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/b0-candidate-real-acceptance.yml scripts/acceptance/b0-selfhosted-real-acceptance.sh scripts/acceptance/b0-formal-supabase-acceptance.sh scripts/acceptance/b0-formal-db-admin.mjs scripts/acceptance/b0-formal-provider-probe.mjs scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs
          git rm .github/workflows/b0-stage3-formal-acceptance-install.yml
          git diff --cached --check
          cat > /tmp/expected <<'PATHS'
          .github/workflows/b0-candidate-real-acceptance.yml
          .github/workflows/b0-stage3-formal-acceptance-install.yml
          scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs
          scripts/acceptance/b0-formal-db-admin.mjs
          scripts/acceptance/b0-formal-provider-probe.mjs
          scripts/acceptance/b0-formal-supabase-acceptance.sh
          scripts/acceptance/b0-selfhosted-real-acceptance.sh
          PATHS
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "test(b0): split engineering and formal C8 acceptance"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish stage outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/stage3-formal-acceptance-install",
              description: `stage 3 formal acceptance install ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("Stage 3 formal acceptance installation failed");
