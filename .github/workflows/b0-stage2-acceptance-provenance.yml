name: B0 Stage 2 Acceptance Provenance Boundary

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage2-acceptance-provenance.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage2-acceptance-provenance
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage2-provenance-boundary",
              description: `stage 2 provenance boundary running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact branch tip and immutable input
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage2-acceptance-provenance.yml"
          test "$(sha256sum scripts/acceptance/b0-candidate-real-flow.ts | cut -d' ' -f1)" = "0dd15674e3d7dc52667b217ae48c988a64c01354a0ca232898152d24716ded95"

      - name: Install hash-bound dual-tier acceptance driver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_blob_text() {
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$1" --jq .content \
              | tr -d '\n' \
              | base64 -d
          }
          : > /tmp/b0-stage2-driver.gz.b64
          while read -r blob size digest; do
            chunk="/tmp/${blob}.chunk"
            fetch_blob_text "$blob" > "$chunk"
            actual_size="$(wc -c < "$chunk" | tr -d ' ')"
            actual_digest="$(sha256sum "$chunk" | cut -d' ' -f1)"
            echo "stage2_blob=${blob:0:12} size=$actual_size sha256=$actual_digest"
            test "$actual_size" = "$size"
            test "$actual_digest" = "$digest"
            cat "$chunk" >> /tmp/b0-stage2-driver.gz.b64
          done <<'B0_STAGE2_BLOBS'
          3a65c91f4a2d5194ddb5b41d8a288573a11b23c4 5500 e2601d3aa3b7f8cd9391150f7c86ff313ea16849a6648a140618b5d54c978bca
          1bdffd0a79cbb14d9f3ce9ad7b7f5712069f463a 5500 fc8e98275e23b7663a791079e25e4853f1d439204a9308750016f8081a9c4b7f
          0f29c4b14bbaa5b9146295e9ce5689588010636a 5500 51fe22705696bd7c528ae7d74b5edd529b08531a0ef89b798aa764da02edd6ba
          96f8a677ef6ce1cea6dc4fcc5fa2aed3d68bab5e 5500 6879123f6790d2b6fc86fec51017a2ff65c4ab9edbc67ca6eeaee8ffe1d69383
          ba0cf3d72a1d901033695b5d12b3ce1b536f794b 1168 246023cfd39862f316c97043ba663f96f51084e05e79658604bbecc2cd97dca8
          B0_STAGE2_BLOBS
          payload_size="$(wc -c < /tmp/b0-stage2-driver.gz.b64 | tr -d ' ')"
          payload_digest="$(sha256sum /tmp/b0-stage2-driver.gz.b64 | cut -d' ' -f1)"
          echo "stage2_payload_size=$payload_size stage2_payload_sha256=$payload_digest"
          test "$payload_size" = "23168"
          test "$payload_digest" = "7aedf1ce65faf92cc36d0baf729e79c642260febbb9d7aa045bb3001ad2c4928"
          base64 -d /tmp/b0-stage2-driver.gz.b64 > /tmp/b0-stage2-driver.gz
          test "$(sha256sum /tmp/b0-stage2-driver.gz | cut -d' ' -f1)" = "426b0ea1a570d8c72bf7d958a674efe60f289a215787bce92be48ebda9e3466a"
          gzip -dc /tmp/b0-stage2-driver.gz > scripts/acceptance/b0-candidate-real-flow.ts
          test "$(sha256sum scripts/acceptance/b0-candidate-real-flow.ts | cut -d' ' -f1)" = "20d1fd8fdaa038c366192238b2bb0af9bf9b30ea0cc543755b0a365e261d45b4"
          git diff --check

      - name: Frozen install and compile acceptance driver
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance

      - name: Prove engineering and formal C8 provenance modes
        shell: bash
        run: |
          set -euo pipefail
          zeros="sha256:$(printf '0%.0s' $(seq 1 64))"

          GITHUB_SHA="$GITHUB_SHA" \
          DATABASE_URL='postgresql://postgres:secret@127.0.0.1:55432/postgres?schema=cs_accept_b0_selfcheck123&connection_limit=3&sslmode=disable' \
          OPENOVEL_PROVIDER_BASE_URL='http://127.0.0.1:11434/v1' \
          OPENOVEL_API_KEY='engineering-self-check' \
          OPENOVEL_MODEL='qwen2.5:1.5b' \
          B0_ACCEPTANCE_TIER='engineering-selfhosted' \
          B0_ACCEPTANCE_ENVIRONMENT='github-hosted-isolated-engineering' \
          B0_DATABASE_PROVENANCE='official-supabase-postgres-container' \
          B0_DATABASE_IMAGE='supabase/postgres:15.14.1.157-mmlb_amd64' \
          B0_DATABASE_IMAGE_DIGEST="$zeros" \
          B0_PROVIDER_PROVENANCE='ollama-openai-compatible-local' \
          B0_PROVIDER_IMAGE='ollama/ollama:0.32.5' \
          B0_PROVIDER_IMAGE_DIGEST="$zeros" \
          B0_PROVIDER_MODEL_DIGEST="$zeros" \
          B0_ACCEPTANCE_SELF_CHECK=1 \
            pnpm test:b0:real-acceptance

          GITHUB_SHA="$GITHUB_SHA" \
          DATABASE_URL='postgresql://postgres:secret@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?schema=cs_accept_b0_selfcheck123&connection_limit=3&sslmode=require' \
          OPENOVEL_PROVIDER_BASE_URL='https://api.deepseek.com' \
          OPENOVEL_API_KEY='formal-self-check' \
          OPENOVEL_MODEL='deepseek-chat' \
          B0_ACCEPTANCE_TIER='formal-c8' \
          B0_ACCEPTANCE_ENVIRONMENT='ourmanyworlds.com / test' \
          B0_DATABASE_SECRET_NAME='SUPABASE_DATABASE_URL' \
          B0_PROVIDER_SECRET_NAME='DEEPSEEK_API_KEY' \
          B0_DATABASE_PROVENANCE='supabase-cloud-nonproduction-random-schema' \
          B0_PROVIDER_PROVENANCE='deepseek-api-real' \
          B0_PROVIDER_MODEL_DIGEST="$zeros" \
          B0_ACCEPTANCE_SELF_CHECK=1 \
            pnpm test:b0:real-acceptance

          if GITHUB_SHA="$GITHUB_SHA" \
            DATABASE_URL='postgresql://postgres:secret@127.0.0.1:55432/postgres?schema=cs_accept_b0_selfcheck123' \
            OPENOVEL_PROVIDER_BASE_URL='https://api.deepseek.com' \
            OPENOVEL_API_KEY='formal-self-check' \
            OPENOVEL_MODEL='deepseek-chat' \
            B0_ACCEPTANCE_TIER='formal-c8' \
            B0_ACCEPTANCE_ENVIRONMENT='ourmanyworlds.com / test' \
            B0_DATABASE_SECRET_NAME='SUPABASE_DATABASE_URL' \
            B0_PROVIDER_SECRET_NAME='DEEPSEEK_API_KEY' \
            B0_DATABASE_PROVENANCE='supabase-cloud-nonproduction-random-schema' \
            B0_PROVIDER_PROVENANCE='deepseek-api-real' \
            B0_PROVIDER_MODEL_DIGEST="$zeros" \
            B0_ACCEPTANCE_SELF_CHECK=1 \
              pnpm test:b0:real-acceptance; then
            echo 'Formal C8 incorrectly accepted a local database.' >&2
            exit 1
          fi

      - name: Commit stage 2 as ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/acceptance/b0-candidate-real-flow.ts
          git rm .github/workflows/b0-stage2-acceptance-provenance.yml
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          .github/workflows/b0-stage2-acceptance-provenance.yml
          scripts/acceptance/b0-candidate-real-flow.ts
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "test(b0): separate formal C8 from engineering provenance"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish stage outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/stage2-provenance-boundary",
              description: `stage 2 provenance boundary ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("Stage 2 provenance boundary failed");
