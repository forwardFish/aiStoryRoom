name: Dynamic Kernel Lockfile Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - packages/templates/package.json
      - packages/templates/tsconfig.json
      - .github/workflows/dynamic-kernel-lockfile-repair.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Generate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify expected importer
        shell: bash
        run: |
          set -euo pipefail
          grep -A8 '^  packages/templates:$' pnpm-lock.yaml | grep -F "'@types/node':"
          git diff -- pnpm-lock.yaml
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "fix(templates): update Node types lockfile"
            git push origin HEAD:codex/chatgpt-pro-dynamic-kernel-lite
          fi
      - name: Publish status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/lockfile" \
            -f description="Lockfile commit ${state}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
