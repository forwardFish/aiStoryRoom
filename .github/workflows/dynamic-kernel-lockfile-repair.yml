name: Dynamic Kernel Templates Repair Gate

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - "packages/templates/**"
      - "apps/openovel-runtime/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/dynamic-kernel-lockfile-repair.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  templates-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EVIDENCE_ROOT: ${{ runner.temp }}/dynamic-kernel-templates-repair
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="pending" \
            -f context="dynamic-kernel-lite/templates-repair" \
            -f description="Templates repair gate is running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Run repair gates and preserve exact output
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs" "${EVIDENCE_ROOT}/source"
          : > "${EVIDENCE_ROOT}/results.tsv"
          run_gate() {
            local label="$1"
            shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${EVIDENCE_ROOT}/results.tsv"
          }
          run_gate 00-install pnpm install --frozen-lockfile
          run_gate 01-templates-typecheck pnpm --filter @ai-story/templates typecheck
          run_gate 02-templates-runtime-contract pnpm --filter @ai-story/templates test:runtime-contract
          run_gate 03-templates-story-package pnpm --filter @ai-story/templates test:story-package
          run_gate 04-templates-build pnpm --filter @ai-story/templates build
          cp packages/templates/src/story-package/dynamic-kernel-lite-runtime.ts "${EVIDENCE_ROOT}/source/"
          cp packages/templates/src/story-package/dynamic-kernel-lite-settlement.ts "${EVIDENCE_ROOT}/source/"
          cp packages/templates/src/story-package/dynamic-kernel-lite-projection.ts "${EVIDENCE_ROOT}/source/"
          cp packages/templates/tests/part-one-dynamic-kernel-lite.test.ts "${EVIDENCE_ROOT}/source/"
          cp packages/templates/tests/part-one-dynamic-kernel-continuation.test.ts "${EVIDENCE_ROOT}/source/" || true
          cp packages/templates/tests/part-one-dynamic-kernel-fallback-recovery.test.ts "${EVIDENCE_ROOT}/source/" || true
          cp packages/templates/package.json packages/templates/tsconfig.json pnpm-lock.yaml "${EVIDENCE_ROOT}/source/"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_ROOT'])
          tap = re.compile(r'# tests (\d+).*?# pass (\d+).*?# fail (\d+).*?# skipped (\d+).*?# todo (\d+)', re.S)
          rows=[]
          for line in (root/'results.tsv').read_text().splitlines():
              label, code, log_path = line.split('\t', 2)
              text=Path(log_path).read_text(errors='replace') if Path(log_path).exists() else ''
              matches=list(tap.finditer(text))
              rows.append({
                'label':label,
                'exitCode':int(code),
                'tests':sum(int(m.group(1)) for m in matches),
                'pass':sum(int(m.group(2)) for m in matches),
                'fail':sum(int(m.group(3)) for m in matches),
                'skip':sum(int(m.group(4)) for m in matches),
                'todo':sum(int(m.group(5)) for m in matches),
                'logPath':log_path,
              })
          verdict='PASS' if all(row['exitCode']==0 for row in rows) else 'FAIL'
          (root/'summary.json').write_text(json.dumps({
            'candidateSha':os.environ['GITHUB_SHA'],
            'commands':rows,
            'verdict':verdict,
          }, indent=2)+'\n')
          (root/'status.txt').write_text(verdict.lower()+'\n')
          PY
      - name: Upload exact repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-templates-repair-${{ github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 7
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=failure
          if [ -f "${EVIDENCE_ROOT}/status.txt" ] && [ "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass ]; then
            state=success
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/templates-repair" \
            -f description="Templates repair gate ${state}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Enforce templates repair gate
        if: always()
        shell: bash
        run: test -f "${EVIDENCE_ROOT}/status.txt" && test "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass
