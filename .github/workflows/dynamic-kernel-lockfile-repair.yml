name: Dynamic Kernel Lockfile Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - packages/templates/package.json
      - packages/templates/tsconfig.json
      - .github/workflows/dynamic-kernel-lockfile-repair.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Generate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify expected importer
        shell: bash
        run: |
          set -euo pipefail
          grep -A8 '^  packages/templates:$' pnpm-lock.yaml | grep -F "'@types/node':"
          git diff -- pnpm-lock.yaml
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-lockfile-${{ github.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 3
      - name: Publish artifact status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/lockfile" \
            -f description="Lockfile artifact ${state}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
