name: Dynamic Kernel Architecture Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-architecture-repair.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  repair-and-verify-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVIDENCE_ROOT: ${{ runner.temp }}/dynamic-kernel-architecture-repair
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/architecture-repair" \
            -f description="Architecture repair and Templates gates running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Apply architecture-level runtime contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path("packages/templates/src/story-package/dynamic-kernel-lite-runtime.ts")
          settlement = Path("packages/templates/src/story-package/dynamic-kernel-lite-settlement.ts")

          runtime_text = runtime.read_text()
          if "function collectOwnedObligationPaths(" not in runtime_text:
              start = runtime_text.index("const coveredPaths")
              stack = []
              quote = None
              escaped = False
              end = None
              pairs = {"(": ")", "[": "]", "{": "}"}
              for index in range(start, len(runtime_text)):
                  char = runtime_text[index]
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in "'\"`":
                      quote = char
                      continue
                  if char in pairs:
                      stack.append(pairs[char])
                  elif stack and char == stack[-1]:
                      stack.pop()
                  elif char == ";" and not stack:
                      end = index + 1
                      break
              if end is None:
                  raise RuntimeError("coveredPaths statement end not found")
              runtime_text = (
                  runtime_text[:start]
                  + "const coveredPaths = collectOwnedObligationPaths(pkg, kernel);"
                  + runtime_text[end:]
              )
              helper = r'''

/**
 * Resolve obligation ownership only from explicit Requirement/Decision
 * Contract edges. Affordance patches and Settlement previews prove
 * executability and outcome diversity; they never expand ownership or score.
 */
function collectOwnedObligationPaths(
  pkg: PartOneRuntimePackage,
  kernel: PartOneRuntimeAsset,
) {
  const dependencyPaths = new Set(kernel.stateDependencies || []);
  const owned = new Set<string>();
  const payload = kernel.payload as Record<string, unknown>;
  for (const key of ["ownedObligationPaths", "obligationStatePaths"] as const) {
    const explicit = payload[key];
    if (!Array.isArray(explicit)) continue;
    for (const path of explicit) {
      if (typeof path === "string" && path.length > 0) owned.add(path);
    }
  }

  for (const rawRequirement of pkg.requirements) {
    const requirement = rawRequirement as Record<string, unknown>;
    const requirementId = typeof requirement.requirementId === "string"
      ? requirement.requirementId
      : "";
    const decisionKernelIds = Array.isArray(requirement.decisionKernelIds)
      ? requirement.decisionKernelIds.filter(
        (value): value is string => typeof value === "string",
      )
      : [];
    const linked = kernel.requirementIds.includes(requirementId)
      || decisionKernelIds.includes(kernel.assetId);
    if (!linked) continue;
    const effects = Array.isArray(requirement.stateEffects)
      ? requirement.stateEffects
      : [];
    for (const effect of effects) {
      if (typeof effect === "string" && dependencyPaths.has(effect)) {
        owned.add(effect);
      }
    }
  }
  return owned;
}
'''
              marker = "\nfunction linkedPending("
              if marker not in runtime_text:
                  marker = "\nfunction selectAffordances("
              position = runtime_text.index(marker)
              runtime_text = runtime_text[:position] + helper + runtime_text[position:]
              runtime.write_text(runtime_text)

          settlement_text = settlement.read_text()
          if "export function settleDynamicPartOneActionPhased(" not in settlement_text:
              anchor = "export type DynamicPartOneSettlementExecutionOptions = {"
              type_start = settlement_text.index(anchor)
              type_end = settlement_text.index("\n};", type_start) + 3
              architecture_types = r'''

/** Immutable authority for the action currently exposed to the player. */
export type PartOneCommittedDecisionSurface = {
  schemaVersion: "part-one-committed-decision-surface-v1";
  revision: number;
  stateFingerprint: string;
  bindingHash: string;
  workingSet: DynamicPartOneRuntimeWorkingSet;
};

export type PartOneNextTurnPlanningResult =
  | {
    status: "PLANNED";
    revision: number;
    stateFingerprint: string;
    surface: PartOneCommittedDecisionSurface;
  }
  | {
    status: "UNPLANNED";
    revision: number;
    stateFingerprint: string;
    failureCode: string;
    recoverable: true;
  };

export type DynamicPartOneSettlementWithPlanning = {
  settlement: DynamicPartOneActionSettlement;
  currentDecisionSurface: PartOneCommittedDecisionSurface | null;
  nextTurnPlanning: PartOneNextTurnPlanningResult;
};
'''
              settlement_text = (
                  settlement_text[:type_end]
                  + architecture_types
                  + settlement_text[type_end:]
              )
              function_start = settlement_text.index(
                  "export function settleDynamicPartOneAction("
              )
              next_export = settlement_text.index(
                  "\nexport function packageForDynamicCapabilityAction(",
                  function_start,
              )
              replacement = r'''export function settleDynamicPartOneActionPhased(
  pkg: PartOneRuntimePackage,
  state: PartOneState,
  action: PartOneIncomingAction,
  turnNumber: number,
  options: DynamicPartOneSettlementExecutionOptions = {},
): DynamicPartOneSettlementWithPlanning {
  const opening = Boolean(action.decisionId?.startsWith("opening_"));
  const currentWorkingSet = opening
    ? null
    : options.currentWorkingSetOverride
      ? validateCurrentWorkingSetOverride(
        pkg, state, turnNumber, options.currentWorkingSetOverride,
      )
      : buildDynamicPartOneRuntimeWorkingSet(
        pkg,
        state,
        Math.max(0, turnNumber - 1),
        options.currentPin
          ? { mode: "DYNAMIC_LITE", pin: options.currentPin }
          : {},
      );
  const currentDecisionSurface = currentWorkingSet
    ? commitDecisionSurface(state, currentWorkingSet)
    : null;

  if (currentDecisionSurface) {
    assertActionBoundToCommittedSurface(currentDecisionSurface, action);
  }

  const currentSettlement = settleCommittedCurrentAction(
    pkg, state, action, turnNumber, currentDecisionSurface,
  );
  const selectionState = projectFinalizedPartOneSelectionState(
    currentSettlement,
  );
  const nextTurnPlanning = planNextTurn(
    pkg, selectionState, turnNumber,
  );
  const finalized = finalizeCurrentSettlement(
    currentSettlement, nextTurnPlanning,
  );
  return {
    settlement: finalized,
    currentDecisionSurface: currentDecisionSurface
      ? clone(currentDecisionSurface)
      : null,
    nextTurnPlanning: clone(nextTurnPlanning),
  };
}

export function settleDynamicPartOneAction(
  pkg: PartOneRuntimePackage,
  state: PartOneState,
  action: PartOneIncomingAction,
  turnNumber: number,
  options: DynamicPartOneSettlementExecutionOptions = {},
): DynamicPartOneActionSettlement {
  return settleDynamicPartOneActionPhased(
    pkg, state, action, turnNumber, options,
  ).settlement;
}

export function commitDecisionSurface(
  state: PartOneState,
  workingSet: DynamicPartOneRuntimeWorkingSet,
): PartOneCommittedDecisionSurface {
  const revision = Number(state.turnNumber ?? workingSet.turnNumber);
  const stateFingerprint = stableSha256(state);
  const bindingHash = stableSha256({
    packageHash: workingSet.packageHash,
    sectionId: workingSet.section.sectionId,
    revision,
    stateFingerprint,
    decisionKernelId: workingSet.decisionPoint.decisionKernelId,
    decisionPointId: workingSet.decisionPoint.decisionPointId,
    affordanceIds: workingSet.decisionAffordances.map(
      (affordance) => affordance.affordanceTemplateId,
    ),
    outcomeHashes: workingSet.kernelSelection.selectedOutcomeHashes,
  });
  return {
    schemaVersion: "part-one-committed-decision-surface-v1",
    revision,
    stateFingerprint,
    bindingHash,
    workingSet: clone(workingSet),
  };
}

function assertActionBoundToCommittedSurface(
  surface: PartOneCommittedDecisionSurface,
  action: PartOneIncomingAction,
) {
  if (!action.affordanceTemplateId) return;
  const bound = surface.workingSet.decisionAffordances.some((candidate) => (
    candidate.affordanceTemplateId === action.affordanceTemplateId
    && candidate.decisionKernelId === action.decisionKernelId
    && candidate.actionText === action.actionText
    && candidate.target.id === action.targetRef
  ));
  if (!bound) {
    throw new Error("PART_ONE_DYNAMIC_STALE_OR_TAMPERED_AFFORDANCE");
  }
}

function settleCommittedCurrentAction(
  pkg: PartOneRuntimePackage,
  state: PartOneState,
  action: PartOneIncomingAction,
  turnNumber: number,
  surface: PartOneCommittedDecisionSurface | null,
): PartOneActionSettlement {
  if (surface) {
    const expected = commitDecisionSurface(state, surface.workingSet);
    if (
      surface.revision !== Number(
        state.turnNumber ?? Math.max(0, turnNumber - 1),
      )
      || surface.stateFingerprint !== stableSha256(state)
      || surface.bindingHash !== expected.bindingHash
    ) {
      throw new Error("PART_ONE_COMMITTED_DECISION_SURFACE_MISMATCH");
    }
  }
  const settlementPackage = surface
    ? forcePackageForProvisionalSettlement(
      pkg, state, surface.workingSet,
    )
    : pkg;
  return settleLegacyAction(
    settlementPackage, state, action, turnNumber,
  );
}

export function planNextTurn(
  pkg: PartOneRuntimePackage,
  authoritativeState: PartOneState,
  revision: number,
): PartOneNextTurnPlanningResult {
  const stateFingerprint = stableSha256(authoritativeState);
  try {
    const workingSet = buildDynamicPartOneRuntimeWorkingSet(
      pkg, authoritativeState, revision,
    );
    return {
      status: "PLANNED",
      revision,
      stateFingerprint,
      surface: commitDecisionSurface(authoritativeState, workingSet),
    };
  } catch (error) {
    return {
      status: "UNPLANNED",
      revision,
      stateFingerprint,
      failureCode: normalizePlanningFailure(error),
      recoverable: true,
    };
  }
}

function finalizeCurrentSettlement(
  currentSettlement: PartOneActionSettlement,
  nextTurnPlanning: PartOneNextTurnPlanningResult,
): DynamicPartOneActionSettlement {
  const finalized = clone(currentSettlement) as DynamicPartOneActionSettlement;
  const event = finalized.event as DynamicPartOneCommittedEvent;
  if (nextTurnPlanning.status === "PLANNED") {
    const planned = nextTurnPlanning.surface;
    event.nextDecisionPoint = clone(planned.workingSet.decisionPoint);
    event.nextKernelSelection = clone(
      planned.workingSet.kernelSelection,
    );
  } else {
    event.nextKernelSelection = undefined;
  }
  return finalized;
}

function normalizePlanningFailure(error: unknown) {
  const message = error instanceof Error ? error.message : String(error || "");
  return (message.split(":", 1)[0] || "PART_ONE_NEXT_TURN_PLANNING_FAILED")
    .trim()
    .replace(/[^A-Za-z0-9_]+/gu, "_")
    .toUpperCase()
    .slice(0, 96) || "PART_ONE_NEXT_TURN_PLANNING_FAILED";
}
'''
              settlement_text = (
                  settlement_text[:function_start]
                  + replacement
                  + settlement_text[next_export:]
              )
              obsolete_start = settlement_text.find(
                  "function assertProvisionalCausalStateStable("
              )
              if obsolete_start >= 0:
                  obsolete_end = settlement_text.index(
                      "\nfunction forceFallbackPackage(", obsolete_start
                  )
                  settlement_text = (
                      settlement_text[:obsolete_start]
                      + settlement_text[obsolete_end:]
                  )
              settlement_text = settlement_text.replace(
                  "  stableCanonicalJson,\n", "", 1
              )
              settlement.write_text(settlement_text)
          PY
      - name: Run Templates deterministic gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          : > "${EVIDENCE_ROOT}/results.tsv"
          run_gate() {
            local label="$1"
            shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${EVIDENCE_ROOT}/results.tsv"
            return "${code}"
          }
          run_gate templates-typecheck pnpm --filter @ai-story/templates typecheck
          run_gate templates-runtime-contract pnpm --filter @ai-story/templates test:runtime-contract
          run_gate templates-story-package pnpm --filter @ai-story/templates test:story-package
          run_gate templates-build pnpm --filter @ai-story/templates build
      - name: Build Templates evidence summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_ROOT"])
          rows = []
          tap = re.compile(
              r"# tests (\d+).*?# pass (\d+).*?# fail (\d+).*?"
              r"# skipped (\d+).*?# todo (\d+)",
              re.S,
          )
          results = root / "results.tsv"
          if results.exists():
              for raw in results.read_text().splitlines():
                  label, code, log_path = raw.split("\t", 2)
                  path = Path(log_path)
                  text = path.read_text(errors="replace") if path.exists() else ""
                  matches = list(tap.finditer(text))
                  rows.append({
                      "label": label,
                      "exitCode": int(code),
                      "tests": sum(int(m.group(1)) for m in matches),
                      "pass": sum(int(m.group(2)) for m in matches),
                      "fail": sum(int(m.group(3)) for m in matches),
                      "skip": sum(int(m.group(4)) for m in matches),
                      "todo": sum(int(m.group(5)) for m in matches),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest().upper()
                          if path.exists() else None,
                  })
          verdict = "PASS" if rows and all(r["exitCode"] == 0 for r in rows) else "FAIL"
          summary = {
              "schemaVersion": "omw.dynamic-kernel-architecture-repair.v1",
              "sourceSha": os.environ["GITHUB_SHA"],
              "databaseUsed": False,
              "supabaseUsed": False,
              "deepSeekUsed": False,
              "commands": rows,
              "verdict": verdict,
          }
          root.mkdir(parents=True, exist_ok=True)
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          (root / "status.txt").write_text(verdict.lower() + "\n")
          PY
      - name: Upload Templates evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-architecture-repair-${{ github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 7
      - name: Commit repaired source and Templates evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass
          evidence_dir="docs/auto-execute/evidence/dynamic-kernel-architecture-repair"
          mkdir -p "${evidence_dir}"
          cp "${EVIDENCE_ROOT}/summary.json" "${evidence_dir}/templates-summary.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/templates/src/story-package/dynamic-kernel-lite-runtime.ts \
            packages/templates/src/story-package/dynamic-kernel-lite-settlement.ts \
            "${evidence_dir}/templates-summary.json"
          if git diff --cached --quiet; then
            echo "Architecture repair already present"
          else
            git commit -m "refactor(kernel-lite): separate settlement from next-turn planning"
            git push origin HEAD:codex/chatgpt-pro-dynamic-kernel-lite
          fi
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          if [ -f "${EVIDENCE_ROOT}/status.txt" ] && [ "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass ]; then
            state=success
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/architecture-repair" \
            -f description="Architecture repair Templates gates ${state}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Enforce Templates gates
        if: always()
        run: test -f "${EVIDENCE_ROOT}/status.txt" && test "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass
