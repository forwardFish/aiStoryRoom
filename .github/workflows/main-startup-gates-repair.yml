name: Repair main startup gates

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: main-startup-gates-repair
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.event.head_commit.message == 'chore(ci): stage main startup gate repair'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: b1315004ef836fb3a625c8201d362a395284b0dc
      WORKFLOW_PATH: .github/workflows/main-startup-gates-repair.yml
      TARGET_TEST: apps/api/src/pressure-chapter/seat-control-persistence/seat-control-persistence.spec.ts
      EXPECTED_TARGET_SHA256: eb8c8a8496d5b2a12df815831cf3b3a2f0cb02c9fe7ea8853283708eb12bb5da
      OLD_TARGET_SHA256: cbf471ed910510731987b8046919d44e281da2a3648de7761076014fe303db7a
      OLD_SOURCE_MANIFEST_SHA256: d3764c96d04ca2938b34d1413c04a04b19e2afb9ce2241a002d06da1a89980c1
      SOURCE_MANIFEST: packages/templates/config/sangtian/pressure-chapter-v1/release/source-regression-manifest.json
      RELEASE_MANIFEST: packages/templates/config/sangtian/pressure-chapter-v1/release/release-manifest.json
    steps:
      - name: Checkout exact main staging commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exclusive starting point
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git show -s --format='HEAD=%H%nTREE=%T%nPARENT=%P%nSUBJECT=%s' HEAD

      - name: Set up repository pnpm major
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate minimal lockfile and re-sign source-regression chain
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, writeFileSync } = require('node:fs');

          const targetPath = process.env.TARGET_TEST;
          const expectedTarget = process.env.EXPECTED_TARGET_SHA256;
          const oldTarget = process.env.OLD_TARGET_SHA256;
          const oldSourceManifest = process.env.OLD_SOURCE_MANIFEST_SHA256;
          const sourcePath = process.env.SOURCE_MANIFEST;
          const releasePath = process.env.RELEASE_MANIFEST;

          const rawSha256 = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          const canonical = (value) => {
            if (value === null) return 'null';
            if (typeof value === 'string' || typeof value === 'boolean') return JSON.stringify(value);
            if (typeof value === 'number') {
              if (!Number.isFinite(value)) throw new Error('NON_FINITE_NUMBER');
              return Object.is(value, -0) ? '0' : JSON.stringify(value);
            }
            if (Array.isArray(value)) return `[${value.map(canonical).join(',')}]`;
            if (!value || typeof value !== 'object') throw new Error(`UNSUPPORTED:${typeof value}`);
            return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonical(value[key])}`).join(',')}}`;
          };
          const canonicalSha256 = (value) => createHash('sha256').update(canonical(value), 'utf8').digest('hex');

          const targetActual = rawSha256(targetPath);
          if (targetActual !== expectedTarget) {
            throw new Error(`TARGET_SHA_DRIFT:${targetActual}`);
          }

          const source = JSON.parse(readFileSync(sourcePath, 'utf8'));
          const sourceEntries = source.entries.flatMap((entry) => entry.targetTests ?? []);
          const targetRefs = sourceEntries.filter((entry) => entry.path === targetPath);
          if (targetRefs.length !== 1) throw new Error(`TARGET_REFERENCE_COUNT:${targetRefs.length}`);
          if (targetRefs[0].sha256RawBytes !== oldTarget) {
            throw new Error(`UNEXPECTED_OLD_TARGET_SHA:${targetRefs[0].sha256RawBytes}`);
          }
          targetRefs[0].sha256RawBytes = targetActual;
          writeFileSync(sourcePath, `${JSON.stringify(source, null, 2)}\n`);

          const sourceActual = canonicalSha256(source);
          const release = JSON.parse(readFileSync(releasePath, 'utf8'));
          const sourceArtifacts = release.artifacts.filter(
            (artifact) => artifact.artifactId === 'source_regression_manifest',
          );
          if (sourceArtifacts.length !== 1) {
            throw new Error(`SOURCE_ARTIFACT_COUNT:${sourceArtifacts.length}`);
          }
          if (sourceArtifacts[0].sha256 !== oldSourceManifest) {
            throw new Error(`UNEXPECTED_OLD_SOURCE_SHA:${sourceArtifacts[0].sha256}`);
          }
          sourceArtifacts[0].sha256 = sourceActual;
          writeFileSync(releasePath, `${JSON.stringify(release, null, 2)}\n`);

          console.log(`TARGET_SHA256=${targetActual}`);
          console.log(`SOURCE_REGRESSION_MANIFEST_SHA256=${sourceActual}`);
          NODE
          git diff --check
          git diff --stat

      - name: Prove frozen install
        run: |
          set -o pipefail
          mkdir -p .startup-gate-evidence
          CI=true pnpm install --frozen-lockfile 2>&1 | tee .startup-gate-evidence/frozen-install.log

      - name: Generate Prisma client without migration
        run: pnpm db:generate

      - name: Run release-artifacts gate
        run: |
          set -o pipefail
          pnpm exec node --import tsx --test \
            packages/templates/tests/pressure-chapter-release-artifacts.test.ts \
            2>&1 | tee .startup-gate-evidence/release-artifacts.log

      - name: Run API full TypeScript gate
        run: |
          set -o pipefail
          pnpm --filter @apps/api exec tsc --noEmit --pretty false \
            2>&1 | tee .startup-gate-evidence/api-tsc.log

      - name: Run all five convergence test files
        run: |
          set -o pipefail
          node --import tsx --test \
            apps/api/src/pressure-chapter/decision-automation/decision-convergence.api.spec.ts \
            apps/api/src/pressure-chapter/decision-automation/decision-convergence-capability.api.spec.ts \
            apps/api/src/pressure-chapter/decision-automation/prisma-snapshot.api.spec.ts \
            apps/api/src/pressure-chapter/persistence/prepared-automation-action.prisma-adapter.api.spec.ts \
            apps/api/src/pressure-chapter/orchestrator/decision-convergence-reconciliation.api.spec.ts \
            2>&1 | tee .startup-gate-evidence/convergence-tests.log

      - name: Verify exact scope and commit to main
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git rm "$WORKFLOW_PATH"
          changed="$(git diff --name-only "$BASE_SHA" | sort)"
          printf '%s\n' "$changed" | tee .startup-gate-evidence/changed-paths.txt
          expected=$'packages/templates/config/sangtian/pressure-chapter-v1/release/release-manifest.json\npackages/templates/config/sangtian/pressure-chapter-v1/release/source-regression-manifest.json\npnpm-lock.yaml'
          test "$changed" = "$expected"
          if printf '%s\n' "$changed" | grep -E '^(apps/web/|prisma/schema\.prisma$|prisma/migrations/|apps/openovel-runtime/|release/)' ; then
            echo 'Forbidden path changed' >&2
            exit 1
          fi
          git diff --check
          git config user.name "ChatGPT Pro"
          git config user.email "chatgpt-pro@users.noreply.github.com"
          git add pnpm-lock.yaml "$SOURCE_MANIFEST" "$RELEASE_MANIFEST"
          git commit -m "fix(startup): sync lockfile and release hashes"
          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          final_parent="$(git rev-parse HEAD^)"
          {
            echo "FINAL_COMMIT_SHA=$final_sha"
            echo "FINAL_TREE_SHA=$final_tree"
            echo "FINAL_PARENT_SHA=$final_parent"
            echo "BASE_SHA=$BASE_SHA"
          } | tee .startup-gate-evidence/final-sha.txt
          git push origin HEAD:main

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-startup-gates-evidence
          path: .startup-gate-evidence
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
