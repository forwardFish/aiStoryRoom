name: B0 Stage 6 ActionWindow Initialization Race Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage6-window-init-race.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage6-window-init-race
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage6-window-init-race",
              description: `window initialization race repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact branch tip and immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "d5905ed2661bd72635d2e2c4ce6559bc94ada6cd"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage6-window-init-race.yml"
          test "$(sha256sum apps/api/src/b0-settlement/b0-window-coordinator.prisma.ts | cut -d' ' -f1)" = "9a5a0017a9a4b8efff07530c246445d57ceaa3da7cd268fa6bd5a121faa7e113"
          test "$(sha256sum apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts | cut -d' ' -f1)" = "7a6798b6e78aab1855cc83e6efcbd643815934dae7515bb737c1124440a5cdc3"

      - name: Repair the exact ActionWindow nodeId winner race
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          coordinator = Path("apps/api/src/b0-settlement/b0-window-coordinator.prisma.ts")
          source = coordinator.read_text(encoding="utf-8")
          old = '''function retryable(error: unknown): boolean {
            const code = String((error as any)?.code || "");
            return code === "P2034" || code === "40001" || code === "40P01";
          }
          '''.replace("          ", "")
          new = '''function retryable(error: unknown): boolean {
            const candidate = error as any;
            const code = String(candidate?.code || "");
            if (code === "P2034" || code === "40001" || code === "40P01") return true;
            if (code !== "P2002" || String(candidate?.meta?.modelName || "") !== "ActionWindow") return false;
            const target = candidate?.meta?.target;
            const fields = Array.isArray(target)
              ? target.map((entry: unknown) => String(entry))
              : typeof target === "string"
                ? [target]
                : [];
            return fields.length === 1 && (fields[0] === "nodeId" || fields[0].endsWith("_nodeId_key"));
          }
          '''.replace("          ", "")
          if source.count(old) != 1:
              raise SystemExit(f"coordinator anchor count={source.count(old)}")
          coordinator.write_text(source.replace(old, new), encoding="utf-8")

          spec = Path("apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts")
          source = spec.read_text(encoding="utf-8")
          anchor = '''test("generated HOLD rows use a precise durable actor provenance", () => {
            assert.match(COORDINATOR, /actorKind: existing\\?\\.actorKind \\|\\| "TIMEOUT_FALLBACK"/);
            assert.doesNotMatch(COORDINATOR, /SYSTEM_OR_ACTOR/);
          });
          '''.replace("          ", "")
          addition = '''
          test("ActionWindow lazy initialization retries only the nodeId winner race", () => {
            assert.match(COORDINATOR, /code !== "P2002"[\\s\\S]*?modelName[\\s\\S]*?ActionWindow/);
            assert.match(COORDINATOR, /fields\\.length === 1[\\s\\S]*?fields\\[0\\] === "nodeId"/);
            assert.doesNotMatch(COORDINATOR, /return code === "P2002"/);
          });
          '''.replace("          ", "")
          if source.count(anchor) != 1:
              raise SystemExit(f"spec anchor count={source.count(anchor)}")
          spec.write_text(source.replace(anchor, anchor + addition), encoding="utf-8")
          PY
          test "$(sha256sum apps/api/src/b0-settlement/b0-window-coordinator.prisma.ts | cut -d' ' -f1)" = "c9d15ce01a19d4d74364b6d0ada76540df773831cbdd6c16c4fc869772167175"
          test "$(sha256sum apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts | cut -d' ' -f1)" = "92a203fbd64fbdc609dfe61f7a76c79a98fbca3e14e67810e475c654bef8fe0d"
          git diff --check

      - name: Frozen install and focused verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/api typecheck
          pnpm --filter @apps/api test:b0-batch
          pnpm --filter @apps/api test:b0-window

      - name: Commit the completed repair as an ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/b0-settlement/b0-window-coordinator.prisma.ts \
            apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts
          git rm .github/workflows/b0-stage6-window-init-race.yml
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          .github/workflows/b0-stage6-window-init-race.yml
          apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts
          apps/api/src/b0-settlement/b0-window-coordinator.prisma.ts
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "fix(b0): retry concurrent ActionWindow node race"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish stage outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/stage6-window-init-race",
              description: `window initialization race repair ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("B0 stage 6 window initialization repair failed");
