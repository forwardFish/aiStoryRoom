name: B0 Stage 5 Concurrent Initialization Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage5-concurrent-initialization-repair.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage5-concurrent-initialization-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage5-concurrent-initialization-repair",
              description: `stage 5 concurrent initialization repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact candidate parent and source baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "30b11c3aeed43ff5014ed06dd9ba1e17bd8665ee"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage5-concurrent-initialization-repair.yml"
          test "$(sha256sum apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts | cut -d' ' -f1)" = "652a16cea4481f68cbdc3046671ce0526588579720c332b243e8f67c668aa3b2"
          test "$(sha256sum apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts | cut -d' ' -f1)" = "ed5fca203ccbd795eb25fbe834adcee04660417ee4cc4cfcb6cf35673e392e33"

      - name: Decode and apply hash-bound conflict-safe initialization patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/b0-stage5-concurrent-init.patch.gz.b64 <<'B0_STAGE5_PATCH'
          
          B0_STAGE5_PATCH
          tr -d '[:space:]' < /tmp/b0-stage5-concurrent-init.patch.gz.b64 > /tmp/b0-stage5-concurrent-init.patch.gz.b64.clean
          test "$(wc -c < /tmp/b0-stage5-concurrent-init.patch.gz.b64.clean | tr -d ' ')" = "2096"
          test "$(sha256sum /tmp/b0-stage5-concurrent-init.patch.gz.b64.clean | cut -d' ' -f1)" = "1078be211dc5182dde126440ab1fef95ab2f1c9ea42287f23dfc212fdd50edeb"
          base64 -d /tmp/b0-stage5-concurrent-init.patch.gz.b64.clean > /tmp/b0-stage5-concurrent-init.patch.gz
          test "$(wc -c < /tmp/b0-stage5-concurrent-init.patch.gz | tr -d ' ')" = "1570"
          test "$(sha256sum /tmp/b0-stage5-concurrent-init.patch.gz | cut -d' ' -f1)" = "4d05e01061f028b7510ff2ba868f9fb65ee2031aed28df5c43dd957e9296d46c"
          gzip -dc /tmp/b0-stage5-concurrent-init.patch.gz > /tmp/b0-stage5-concurrent-init.patch
          test "$(wc -c < /tmp/b0-stage5-concurrent-init.patch | tr -d ' ')" = "4452"
          test "$(sha256sum /tmp/b0-stage5-concurrent-init.patch | cut -d' ' -f1)" = "22a69aff38f13e5ffcfe15c26a22a05cacda80cf87904dd87a296de09df33dc3"
          git apply --check /tmp/b0-stage5-concurrent-init.patch
          git apply /tmp/b0-stage5-concurrent-init.patch
          test "$(sha256sum apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts | cut -d' ' -f1)" = "9124a5e8783daafa32b8d3ece8ab7ec337e81040f73fdaeb71f5d956185d4b64"
          test "$(sha256sum apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts | cut -d' ' -f1)" = "7a6798b6e78aab1855cc83e6efcbd643815934dae7515bb737c1124440a5cdc3"
          git diff --check

      - name: Frozen install, Prisma generation and affected gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/api typecheck
          pnpm --filter @apps/api test:b0-batch
          pnpm --filter @apps/api test:b0-window
          pnpm --filter @apps/api test:b0-player-window
          pnpm --filter @apps/api test:b0-pipeline
          pnpm --filter @apps/api test:b0-ops

      - name: Commit verified stage 5 as ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts \
            apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts
          git rm .github/workflows/b0-stage5-concurrent-initialization-repair.yml
          git diff --cached --check
          cat > /tmp/expected <<'PATHS'
          .github/workflows/b0-stage5-concurrent-initialization-repair.yml
          apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts
          apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
          PATHS
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "fix(b0): make lazy initialization conflict-safe"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish stage outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/stage5-concurrent-initialization-repair",
              description: `stage 5 concurrent initialization repair ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("Stage 5 concurrent initialization repair failed");
