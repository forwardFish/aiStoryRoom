name: B0 One-Shot Self-Hosted Real Acceptance Script Install

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-generic-provider-driver-v3.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-one-shot-selfhosted-acceptance-script
  cancel-in-progress: false

jobs:
  install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish exact run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/selfhosted-acceptance-script-install",
              description: `self-hosted acceptance script install running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git diff --name-only HEAD^..HEAD | LC_ALL=C sort)" = ".github/workflows/b0-one-shot-generic-provider-driver-v3.yml"
          test ! -e scripts/acceptance/b0-selfhosted-real-acceptance.sh

      - name: Reconstruct the immutable acceptance infrastructure script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_blob_text() {
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$1" --jq .content \
              | tr -d '\n' \
              | base64 -d
          }
          : > /tmp/b0-selfhosted-real-acceptance.sh.gz.b64
          for blob in \
            159b4a6ce2e9b0c80edd48b84694d6f80002d480 \
            59238e2be46518168e383ad6a9ddbbee48ce9e8b \
            f09abf1e729cb5319a1b4f551a96095d8ac0ff8d \
            26068b9e6af2f03ca3804b4b09eddccd9b317f86
          do
            fetch_blob_text "$blob" >> /tmp/b0-selfhosted-real-acceptance.sh.gz.b64
          done
          test "$(wc -c < /tmp/b0-selfhosted-real-acceptance.sh.gz.b64 | tr -d ' ')" = "7800"
          base64 -d /tmp/b0-selfhosted-real-acceptance.sh.gz.b64 > /tmp/b0-selfhosted-real-acceptance.sh.gz
          test "$(sha256sum /tmp/b0-selfhosted-real-acceptance.sh.gz | cut -d' ' -f1)" = "1cc16cfdcaeeb96701a6637c336400df4d3269e4f0a50679182a98047f807d93"
          gzip -dc /tmp/b0-selfhosted-real-acceptance.sh.gz > scripts/acceptance/b0-selfhosted-real-acceptance.sh
          test "$(sha256sum scripts/acceptance/b0-selfhosted-real-acceptance.sh | cut -d' ' -f1)" = "9b146e454697b9ef68e122a2fc33b601e0e32434268bcc08d92d2cecf96a3930"
          chmod +x scripts/acceptance/b0-selfhosted-real-acceptance.sh
          bash -n scripts/acceptance/b0-selfhosted-real-acceptance.sh
          B0_DATABASE_IMAGE='supabase/postgres:15.14.1.157-mmlb_amd64' \
          B0_PROVIDER_IMAGE='ollama/ollama:0.32.5' \
            scripts/acceptance/b0-selfhosted-real-acceptance.sh self-check
          git diff --check

      - name: Frozen install and Prisma generation
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance

      - name: Commit only the verified infrastructure script as an ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/acceptance/b0-selfhosted-real-acceptance.sh
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "scripts/acceptance/b0-selfhosted-real-acceptance.sh"
          git commit -m "test(b0): add self-hosted real acceptance infrastructure"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish install outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/selfhosted-acceptance-script-install",
              description: `self-hosted acceptance script install ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
