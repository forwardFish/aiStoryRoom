name: Dynamic Kernel Source Export

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-source-export.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/source-export" \
            -f description="Source export running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create focused source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/dynamic-kernel-source-${GITHUB_SHA}.tar.gz"
          paths=(
            packages/templates
            packages/shared
            apps/openovel-runtime
            apps/api
            scripts
            prisma
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
          )
          for optional in \
            packages/openovel-runtime \
            tsconfig.json \
            tsconfig.base.json \
            .npmrc \
            AGENTS.md \
            CLAUDE.md \
            README.md; do
            if [ -e "${optional}" ]; then paths+=("${optional}"); fi
          done
          git archive --format=tar.gz --output="${archive}" HEAD -- "${paths[@]}"
          echo "SOURCE_ARCHIVE=${archive}" >> "${GITHUB_ENV}"
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-source-${{ github.sha }}
          path: ${{ env.SOURCE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 2
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/source-export" \
            -f description="Source export ${state}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
