name: Dynamic Kernel Core Repair Gates

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      EVIDENCE_ROOT: ${{ runner.temp }}/dynamic-kernel-core-repair
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - id: gates
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          results="${EVIDENCE_ROOT}/results.tsv"
          : > "${results}"
          run_gate() {
            local label="$1"
            shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${results}"
          }
          run_gate 00-install pnpm install --frozen-lockfile
          run_gate 01-templates-typecheck pnpm --filter @ai-story/templates typecheck
          run_gate 02-templates-runtime-contract pnpm --filter @ai-story/templates test:runtime-contract
          run_gate 03-templates-story-package pnpm --filter @ai-story/templates test:story-package
          run_gate 04-templates-build pnpm --filter @ai-story/templates build
          run_gate 05-openovel-typecheck pnpm --filter @apps/openovel-runtime typecheck
          run_gate 06-openovel-test pnpm --filter @apps/openovel-runtime test
          run_gate 07-openovel-build pnpm --filter @apps/openovel-runtime build
          run_gate 08-api-solo pnpm --filter @apps/api test:solo-story-engine
          run_gate 09-api-legacy-sangtian pnpm --filter @apps/api test:solo-story-engine:legacy-sangtian
          run_gate 10-branch-persistence pnpm test:story:branch-persistence
          run_gate 11-story-options pnpm test:story:options
          run_gate 12-story-convergence pnpm test:story:convergence
          run_gate 13-story-v4 pnpm test:story:v4
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_ROOT'])
          tap = re.compile(r'# tests (\d+).*?# pass (\d+).*?# fail (\d+).*?# skipped (\d+).*?# todo (\d+)', re.S)
          rows=[]
          for line in (root/'results.tsv').read_text().splitlines():
              label, code, log_path = line.split('\t', 2)
              text=Path(log_path).read_text(errors='replace') if Path(log_path).exists() else ''
              matches=list(tap.finditer(text))
              rows.append({
                'label':label,
                'exitCode':int(code),
                'tests':sum(int(m.group(1)) for m in matches),
                'pass':sum(int(m.group(2)) for m in matches),
                'fail':sum(int(m.group(3)) for m in matches),
                'skip':sum(int(m.group(4)) for m in matches),
                'todo':sum(int(m.group(5)) for m in matches),
                'logPath':log_path,
              })
          verdict='PASS' if all(row['exitCode']==0 for row in rows) else 'FAIL'
          (root/'summary.json').write_text(json.dumps({
            'schemaVersion':'omw.dynamic-kernel-core-repair.v1',
            'candidateSha':os.environ['GITHUB_SHA'],
            'databaseUsed':False,
            'supabaseUsed':False,
            'formalPersistenceVerdict':'NOT_RUN',
            'commands':rows,
            'verdict':verdict,
          }, indent=2)+'\n')
          (root/'status.txt').write_text(verdict.lower()+'\n')
          PY
      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-core-repair-${{ github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 7
      - name: Publish deterministic status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=failure
          if [ -f "${EVIDENCE_ROOT}/status.txt" ] && [ "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass ]; then
            state=success
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/core-repair" \
            -f description="Deterministic core gates ${state}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Enforce deterministic gates
        if: always()
        shell: bash
        run: test -f "${EVIDENCE_ROOT}/status.txt" && test "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass
