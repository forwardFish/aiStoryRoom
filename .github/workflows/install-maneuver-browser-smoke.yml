name: Install maneuver browser smoke

on:
  pull_request:
    branches:
      - tmp/maneuver-browser-smoke-trigger-20260805

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/maneuver-rules-v1-full-implementation-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct exact verified browser smoke
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: 2f4da3dd1074dfb7cb695fdbd07f1f7b0e3405b48ece9c41e5d7c7f5c8cb34c3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def blob(sha):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return base64.b64decode(json.load(response)['content'])

          groups = [
              ['84ab5a37c675cce61ae02539ab742d0ffb0f488e'],
              ['9d255cf92478ec2f474a243bca2ee8b3c04814b8','28303d17ca88db18d350d543ea7da83e58f777f9','18654d3c209bdc90ad3d79ce96381a4f568021d9','2d1e60e4eba01fef4707cfd959602c101fa75998','aa04b01e95efd579c1a35727bbbd34e06335c326'],
              ['54bb15124fbbd5a5f53d2891ff1f4c36f9d10a2d','923303268534f297dce1ff197e3530719fca3be5','705be59fc30d8dc13dbbebfc2709dd77f3a91224','9240548d150d2672fc134271bbdb41f8bafe9549','872f49d414adf13a831005629ad7eead3221b523'],
              ['8d800feaba279dd87a5334b6a29aa51e3c9184fc','45afea8cd1ad5533cbd5d763d89a4e8030fe0a13','5a169d8c7e1a256adc84411fce08ec633e6980e2','041fd3166376edf582e260b18f7ca564ca18e62c','e73452990fd117289acc4f523f4d01ab45cdb7e4'],
              ['78505eaff7d7a4407dbaf53b1bf4be22c84b10c5'],
              ['3b1746b0af800cea4eb0bc0ae34fb5eadab0a0ba','1318ded99c2bafff75149defea52eb64ac7dd1f8','1469ce067b4694f515782ae3c252dc9fae579168','aab6d939dccf7730f6eb528e5c71c96e9d8c2e77','8963ed3d1982368f5941614dd5e61df344dad8e5'],
              ['fe81a6644b08f42b645495655633a5c218638b44'],
              ['b5d3778ddc6f32c7bbf2fc83abf2fc9ea2cd4141'],
          ]
          encoded = b''.join(b''.join(blob(sha) for sha in group) for group in groups)
          script = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(script).hexdigest()
          if actual != os.environ['EXPECTED_SHA256']:
              raise SystemExit(f'script sha256 mismatch: {actual}')
          path = Path('scripts/acceptance/maneuver-v1-browser-smoke.mjs')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(script)
          print(f'verified {path}: {len(script)} bytes sha256={actual}')
          PY

      - name: Commit exact browser smoke to helper branch
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/acceptance/maneuver-v1-browser-smoke.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'browser smoke already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(maneuver-v1): add real game-page browser smoke'
          git push origin HEAD:feat/maneuver-rules-v1-full-implementation-20260805
