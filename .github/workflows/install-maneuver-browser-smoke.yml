name: Install maneuver browser smoke

on:
  push:
    branches:
      - feat/maneuver-rules-v1-full-implementation-20260805
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-maneuver-browser-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and diagnose browser test
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: 2f4da3dd1074dfb7cb695fdbd07f1f7b0e3405b48ece9c41e5d7c7f5c8cb34c3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected_script = os.environ["EXPECTED_SHA256"]
          chunks = [
              ("84ab5a37c675cce61ae02539ab742d0ffb0f488e", "e476b42a74e92b82e12c2afd0e1856aa114279f04f8edb6e83a9d14fdb50bd95"),
              ("4e4eb25cdc0f9a301cad2ec07886aaa4fef6db64", "86a345464ff947456de983d940b90148bd6620a5bd16d0a617227f0659155082"),
              ("72b42b77cd4311f6b8f6fee428915c2fc6697827", "a5a7e1391ff776906d47fb687fd1c1050580b869eba5dba755652e48bf3a0bc1"),
              ("981b9dba7345373bbf4a795c3960fddbaae956a7", "44ef6a5215831a64297d8c3597ea51d23691bdc67c81ff44000e268e66c58487"),
              ("78505eaff7d7a4407dbaf53b1bf4be22c84b10c5", "4c932309ee7db31b6094b58a26bf618f101aab679227a6b05aa9500dd7c8114f"),
              ("bc63cbcefe149240f8928de6942965c863beb9a1", "7e1273fb54b1bf2748b1cb369f27f0f7ce042f620533babfba5662436d752946"),
              ("fe81a6644b08f42b645495655633a5c218638b44", "fe06f946020b97986bb90144e7a72be6662c431ff8be7f3edcac741ee5b13c56"),
              ("b5d3778ddc6f32c7bbf2fc83abf2fc9ea2cd4141", "81f057d426a91a4b7f4e7c7c61fa4dfc782335da265aa50ec3b1749537438b4e"),
          ]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          report = {"chunks": [], "expectedScriptSha256": expected_script}
          encoded = []
          all_chunks_ok = True
          for index, (sha, expected_chunk) in enumerate(chunks):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{sha}", headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  chunk = base64.b64decode(json.load(response)["content"])
              actual_chunk = hashlib.sha256(chunk).hexdigest()
              ok = actual_chunk == expected_chunk
              all_chunks_ok = all_chunks_ok and ok
              report["chunks"].append({
                  "index": index,
                  "blobSha": sha,
                  "bytes": len(chunk),
                  "expected": expected_chunk,
                  "actual": actual_chunk,
                  "ok": ok,
              })
              encoded.append(chunk)

          script_ok = False
          if all_chunks_ok:
              try:
                  script = base64.b64decode(b"".join(encoded), validate=True)
                  actual_script = hashlib.sha256(script).hexdigest()
                  report["actualScriptSha256"] = actual_script
                  report["scriptBytes"] = len(script)
                  script_ok = actual_script == expected_script
                  report["scriptOk"] = script_ok
                  if script_ok:
                      path = Path("scripts/acceptance/maneuver-v1-browser-smoke.mjs")
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(script)
              except Exception as error:
                  report["decodeError"] = repr(error)
          else:
              report["scriptOk"] = False

          diagnostic = Path("tmp-maneuver-browser-chunk-diagnostics.json")
          diagnostic.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          Path(".browser-install-status").write_text("PASS\n" if script_ok else "FAIL\n")
          print(json.dumps(report, indent=2))
          PY

      - name: Commit script or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git add tmp-maneuver-browser-chunk-diagnostics.json
          if [[ -f scripts/acceptance/maneuver-v1-browser-smoke.mjs ]]; then
            git add scripts/acceptance/maneuver-v1-browser-smoke.mjs
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(maneuver-v1): reconstruct browser smoke verification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          [[ "$(cat .browser-install-status)" == "PASS" ]]
