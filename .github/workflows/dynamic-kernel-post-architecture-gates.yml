name: Dynamic Kernel Post-Architecture Gates

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - packages/templates/src/story-package/dynamic-kernel-lite-runtime.ts
      - packages/templates/src/story-package/dynamic-kernel-lite-settlement.ts
      - .github/workflows/dynamic-kernel-post-architecture-gates.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EVIDENCE_ROOT: ${{ runner.temp }}/dynamic-kernel-post-architecture
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require architecture contract
        run: |
          grep -F 'settleDynamicPartOneActionPhased' packages/templates/src/story-package/dynamic-kernel-lite-settlement.ts
          grep -F 'collectOwnedObligationPaths' packages/templates/src/story-package/dynamic-kernel-lite-runtime.ts
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Execute deterministic gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          : > "${EVIDENCE_ROOT}/results.tsv"
          run_gate() {
            local label="$1"
            shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${EVIDENCE_ROOT}/results.tsv"
          }
          run_gate templates-typecheck pnpm --filter @ai-story/templates typecheck
          run_gate templates-runtime-contract pnpm --filter @ai-story/templates test:runtime-contract
          run_gate templates-story-package pnpm --filter @ai-story/templates test:story-package
          run_gate templates-build pnpm --filter @ai-story/templates build
          run_gate openovel-typecheck pnpm --filter @apps/openovel-runtime typecheck
          run_gate openovel-test pnpm --filter @apps/openovel-runtime test
          run_gate openovel-build pnpm --filter @apps/openovel-runtime build
          run_gate api-solo-current pnpm --filter @apps/api test:solo-story-engine
          run_gate api-solo-legacy pnpm --filter @apps/api test:solo-story-engine:legacy-sangtian
          run_gate branch-persistence pnpm test:story:branch-persistence
          run_gate story-options pnpm test:story:options
          run_gate story-convergence pnpm test:story:convergence
          run_gate story-v4 pnpm test:story:v4
      - name: Build deterministic report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_ROOT"])
          rows = []
          tap = re.compile(
              r"# tests (\d+).*?# pass (\d+).*?# fail (\d+).*?"
              r"# skipped (\d+).*?# todo (\d+)",
              re.S,
          )
          results = root / "results.tsv"
          if results.exists():
              for raw in results.read_text().splitlines():
                  label, code, log_path = raw.split("\t", 2)
                  path = Path(log_path)
                  text = path.read_text(errors="replace") if path.exists() else ""
                  matches = list(tap.finditer(text))
                  rows.append({
                      "label": label,
                      "exitCode": int(code),
                      "tests": sum(int(m.group(1)) for m in matches),
                      "pass": sum(int(m.group(2)) for m in matches),
                      "fail": sum(int(m.group(3)) for m in matches),
                      "skip": sum(int(m.group(4)) for m in matches),
                      "todo": sum(int(m.group(5)) for m in matches),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest().upper()
                          if path.exists() else None,
                  })
          verdict = "PASS" if len(rows) == 13 and all(
              row["exitCode"] == 0 for row in rows
          ) else "FAIL"
          report = {
              "schemaVersion": "omw.dynamic-kernel-post-architecture.v1",
              "testedSha": os.environ["GITHUB_SHA"],
              "databaseUsed": False,
              "supabaseUsed": False,
              "deepSeekUsed": False,
              "formalSupabaseVerdict": "NOT_STARTED",
              "commands": rows,
              "verdict": verdict,
          }
          root.mkdir(parents=True, exist_ok=True)
          (root / "summary.json").write_text(json.dumps(report, indent=2) + "\n")
          (root / "status.txt").write_text(verdict.lower() + "\n")
          PY
      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-post-architecture-${{ github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 7
      - name: Commit deterministic summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="docs/auto-execute/evidence/dynamic-kernel-architecture-repair"
          mkdir -p "${evidence_dir}"
          cp "${EVIDENCE_ROOT}/summary.json" "${evidence_dir}/deterministic-summary.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${evidence_dir}/deterministic-summary.json"
          if git diff --cached --quiet; then
            echo "Deterministic summary already current"
          else
            git commit -m "test(kernel-lite): record post-architecture gates"
            git push origin HEAD:codex/chatgpt-pro-dynamic-kernel-lite
          fi
      - name: Publish deterministic status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          if [ -f "${EVIDENCE_ROOT}/status.txt" ] && [ "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass ]; then
            state=success
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/post-architecture" \
            -f description="Post-architecture deterministic gates ${state}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Enforce deterministic gates
        if: always()
        run: test -f "${EVIDENCE_ROOT}/status.txt" && test "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass
