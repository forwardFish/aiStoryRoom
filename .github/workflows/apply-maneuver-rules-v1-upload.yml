name: Apply and verify MANEUVER_RULES_V1 implementation

on:
  push:
    branches:
      - feat/maneuver-rules-v1-full-implementation-20260805
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-maneuver-rules-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reconstruct, verify, and apply implementation patches
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_EXPECTED_SHA256: 5277938bdaca1b2465a66c9b490f8cdeba640a8d2517d3681fb4376c92a7e8e1
          FIX_EXPECTED_SHA256: abc5d5498c10ad76396c3a64245726169fa2d59736237973663c82cd5fa5af84
        shell: bash
        run: |
          set -euo pipefail
          export BASE_PATCH_PATH="$RUNNER_TEMP/maneuver-rules-v1-base.patch"
          export FIX_PATCH_PATH="$RUNNER_TEMP/maneuver-rules-v1-fix-round1.patch"
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          def reconstruct(blob_shas: list[str], output_path: str, expected: str) -> None:
              encoded_parts: list[bytes] = []
              for sha in blob_shas:
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  encoded_parts.append(base64.b64decode(payload["content"]))

              compressed = base64.b64decode(b"".join(encoded_parts), validate=True)
              patch = lzma.decompress(compressed)
              actual = hashlib.sha256(patch).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f"patch checksum mismatch for {output_path}: expected {expected}, got {actual}"
                  )
              Path(output_path).write_bytes(patch)
              print(f"verified {output_path}: {len(patch)} bytes, sha256={actual}")

          reconstruct(
              [
                  "f2b77097fdd17a2cac1cb50cd224e39a2acdd323",
                  "beca723609e29a3bbc32632f59fe856dee167be9",
                  "37ae0a1c05eca7c5448583eec6907cc0729b1ca5",
                  "711982a1da09f08e2808f432b6982908ba8a68a0",
                  "40e1bddd8eff5b0d851bf502cb3a31233a34be0c",
                  "7fac807c48aa2e64a11246d0c2a1269ad4213494",
                  "8ff1f71e8849b57243d4ee80ae315fd40bd8b212",
                  "e4c0cbe6f4d8657803d410c3776113bf8ac78d1f",
              ],
              os.environ["BASE_PATCH_PATH"],
              os.environ["BASE_EXPECTED_SHA256"],
          )
          reconstruct(
              ["4ac2dfde944563b0b1c3df0f01c6624c5216f76d"],
              os.environ["FIX_PATCH_PATH"],
              os.environ["FIX_EXPECTED_SHA256"],
          )
          PY

          git apply --check "$BASE_PATCH_PATH"
          git apply --index "$BASE_PATCH_PATH"
          git apply --check "$FIX_PATCH_PATH"
          git apply --index "$FIX_PATCH_PATH"
          git diff --cached --check
          echo "Applied implementation and round-1 fixes to $(git rev-parse --short HEAD)."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck maneuver dependencies
        run: |
          pnpm --filter @ai-story/templates typecheck
          pnpm --filter @ai-story/shared typecheck
          pnpm --filter @apps/api typecheck
          pnpm --filter @apps/web typecheck

      - name: Run maneuver tests
        run: pnpm test:maneuver:v1

      - name: Run Web regression suite
        run: pnpm --filter @apps/web test

      - name: Commit and push complete implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-maneuver-rules-v1-upload.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(game): implement bounded maneuver rules v1"
          git push origin "HEAD:${TARGET_BRANCH}"
