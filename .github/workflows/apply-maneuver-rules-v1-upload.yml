name: Apply MANEUVER_RULES_V1 implementation

on:
  push:
    branches:
      - feat/maneuver-rules-v1-full-implementation-20260805
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-maneuver-rules-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify implementation patch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: 5277938bdaca1b2465a66c9b490f8cdeba640a8d2517d3681fb4376c92a7e8e1
        shell: bash
        run: |
          set -euo pipefail
          PATCH_PATH="$RUNNER_TEMP/maneuver-rules-v1.patch"
          export PATCH_PATH
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected = os.environ["EXPECTED_SHA256"]
          patch_path = Path(os.environ["PATCH_PATH"])
          blob_shas = [
              "f2b77097fdd17a2cac1cb50cd224e39a2acdd323",
              "beca723609e29a3bbc32632f59fe856dee167be9",
              "37ae0a1c05eca7c5448583eec6907cc0729b1ca5",
              "711982a1da09f08e2808f432b6982908ba8a68a0",
              "40e1bddd8eff5b0d851bf502cb3a31233a34be0c",
              "7fac807c48aa2e64a11246d0c2a1269ad4213494",
              "8ff1f71e8849b57243d4ee80ae315fd40bd8b212",
              "e4c0cbe6f4d8657803d410c3776113bf8ac78d1f",
          ]

          encoded_parts: list[bytes] = []
          for sha in blob_shas:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              encoded_parts.append(base64.b64decode(payload["content"]))

          compressed = base64.b64decode(b"".join(encoded_parts), validate=True)
          patch = lzma.decompress(compressed)
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f"patch checksum mismatch: expected {expected}, got {actual}")
          patch_path.write_bytes(patch)
          print(f"verified patch: {len(patch)} bytes, sha256={actual}")
          PY

          git apply --check "$PATCH_PATH"
          git apply --index "$PATCH_PATH"
          git diff --cached --check
          echo "Applied implementation patch to $(git rev-parse --short HEAD)."

      - name: Commit and push complete implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-maneuver-rules-v1-upload.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(game): implement bounded maneuver rules v1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
