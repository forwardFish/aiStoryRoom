# Product-level database, persistence, idempotency, atomic commit and real-page
# acceptance. Every mutation is restricted to an existing isolated Supabase
# acceptance schema. This workflow never migrates, pushes, resets or seeds DB.
name: Dynamic Kernel Lite Supabase Formal Acceptance

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  supabase-formal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      BASE_SHA: dc4a7cd10978fc3662edcb6f2cf3445c1393ddb0
      FORMAL_ACCEPTANCE: "true"
      NODE_ENV: test
      DATABASE_TARGET: external
      MVP_STORY_STORAGE: prisma
      # Deliberately no fallback to generic DATABASE_URL / SUPABASE_DATABASE_URL
      # secrets: those may belong to production or another environment. Formal
      # acceptance must use a separately approved synthetic-only Supabase target.
      DATABASE_URL: ${{ secrets.SUPABASE_ACCEPTANCE_DATABASE_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_ACCEPTANCE_DATABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_ACCEPTANCE_PROJECT_REF }}
      ACCEPTANCE_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_ACCEPTANCE_PROJECT_REF }}
      SUPABASE_ACCEPTANCE_SCHEMA: ${{ secrets.SUPABASE_ACCEPTANCE_SCHEMA }}
      ACCEPTANCE_SUPABASE_SCHEMA_CONFIRMED_SYNTHETIC_ONLY: ${{ secrets.SUPABASE_ACCEPTANCE_SCHEMA_CONFIRMED_SYNTHETIC_ONLY }}
      ACCEPTANCE_ALLOW_SYNTHETIC_WRITES: "true"
      ACCEPTANCE_ALLOW_MIGRATIONS: "false"
      ACCEPTANCE_DATA_NAMESPACE: omw-dkl-${{ github.run_id }}-${{ github.run_attempt }}
      SUPABASE_ACCEPTANCE_EVIDENCE_ROOT: ${{ runner.temp }}/dynamic-kernel-lite-supabase
      SUPABASE_ACCEPTANCE_EVIDENCE_PATH: ${{ runner.temp }}/dynamic-kernel-lite-supabase/supabase-preflight.json
      CHROME_PATH: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Supabase formal pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="pending" \
            -f context="dynamic-kernel-lite/supabase-formal" \
            -f description="Supabase-backed formal acceptance is running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify branch, scope and forbidden database operations
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "forwardFish/aiStoryRoom"
          test "${GITHUB_REF_NAME}" = "codex/chatgpt-pro-dynamic-kernel-lite"
          test "$(git merge-base HEAD "${BASE_SHA}")" = "${BASE_SHA}"
          test "$(git rev-parse origin/main)" = "${BASE_SHA}"
          test -z "$(git status --short)"
          git diff --check
          changed="$(git diff --name-only "${BASE_SHA}...HEAD")"
          if printf '%s\n' "${changed}" | grep -E '(^|/)(migrations?|prisma/migrations)/|^prisma/schema\.prisma$|^apps/web/' ; then
            echo "SUPABASE_FORMAL_FORBIDDEN_SCOPE_CHANGE"
            exit 1
          fi
          if grep -E 'prisma (migrate|db push|db seed)|pnpm db:(migrate|push|reset|seed)' \
            scripts/acceptance/run-dynamic-kernel-lite-supabase.mjs \
            scripts/acceptance/verify-supabase-formal-acceptance.mjs ; then
            echo "SUPABASE_FORMAL_MIGRATION_COMMAND_FORBIDDEN"
            exit 1
          fi
          # A blank dedicated secret blocks formal acceptance; it must never
          # downgrade to local PostgreSQL, Docker, an in-memory store or a
          # generic Supabase secret whose environment is unknown.
          test -n "${DATABASE_URL}" || {
            echo "SUPABASE_ACCEPTANCE_DATABASE_URL_MISSING"
            exit 78
          }
          test -n "${ACCEPTANCE_SUPABASE_PROJECT_REF}" || {
            echo "SUPABASE_ACCEPTANCE_PROJECT_REF_MISSING"
            exit 78
          }
          test -n "${SUPABASE_ACCEPTANCE_SCHEMA}" || {
            echo "SUPABASE_ACCEPTANCE_SCHEMA_MISSING"
            exit 78
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formal acceptance contract as a pure unit gate
        run: node --test scripts/acceptance/__tests__/supabase-formal-acceptance.spec.mjs scripts/acceptance/__tests__/dynamic-kernel-supabase-gate-contract.spec.mjs

      - id: formal
        name: Run Supabase-backed Run, turn, idempotency, persistence and real-page acceptance
        continue-on-error: true
        run: node scripts/acceptance/run-dynamic-kernel-lite-supabase.mjs

      - name: Upload Supabase formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-lite-supabase-${{ github.sha }}
          path: ${{ env.SUPABASE_ACCEPTANCE_EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 14

      - name: Publish Supabase formal commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="failure"
          description="Supabase formal acceptance failed or is blocked"
          summary="${SUPABASE_ACCEPTANCE_EVIDENCE_ROOT}/summary.json"
          if [ -f "${summary}" ]; then
            status="$(node -e 'const s=require(process.argv[1]); process.stdout.write(String(s.status||""))' "${summary}")"
            if [ "${status}" = "PASS" ]; then
              state="success"
              description="Supabase formal acceptance passed"
            elif [ "${status}" = "BLOCKED" ]; then
              description="Supabase formal acceptance blocked by missing or unsafe environment"
            fi
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/supabase-formal" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce Supabase formal acceptance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="${SUPABASE_ACCEPTANCE_EVIDENCE_ROOT}/summary.json"
          test -f "${summary}"
          node - "${summary}" <<'NODE'
          const summary = require(process.argv[2]);
          const checks = [
            summary.status === "PASS",
            summary.evidenceClass === "FORMAL_SUPABASE",
            summary.formalAcceptanceEligible === true,
            summary.databaseProvider === "SUPABASE",
            summary.databaseBacked === true,
            summary.runRoomTurnPersistenceCovered === true,
            summary.idempotencyCovered === true,
            summary.atomicCommitCovered === true,
            summary.realPageFlowCovered === true,
            summary.migrationsExecuted === false,
            summary.onlineConfigurationModified === false,
            summary.realUserDataAccessed === false,
            Array.isArray(summary.commands),
            summary.commands.some((item) => item.label === "04-supabase-run-turn-idempotency" && item.passed),
            summary.commands.some((item) => item.label === "05-supabase-real-page-flow" && item.passed),
            summary.v4DatabaseEvidence?.evidenceClass === "FORMAL_SUPABASE",
            summary.browserEvidence?.evidenceClass === "FORMAL_SUPABASE",
            summary.cleanupEvidence?.status === "PASS",
          ];
          if (!checks.every(Boolean)) process.exit(1);
          NODE