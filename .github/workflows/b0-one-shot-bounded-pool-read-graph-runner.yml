name: B0 One-Shot Bounded Pool Staging Cleanup

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-bounded-pool-read-graph-runner.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-one-shot-bounded-pool-staging-cleanup
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_PRODUCT_SHA: 2b83e7f1e476dfad905e2a3451f05468caa68bf6

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/bounded-pool-staging-cleanup",
              description: `bounded-pool staging cleanup ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50

      - name: Remove only one-shot workflows and temporary chunks
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$B0_PRODUCT_SHA" HEAD
          mapfile -t files < <(git ls-files | grep -E '^\.github/workflows/b0-one-shot-bounded-pool-read-graph.*\.yml$|^docs/auto-execute/evidence/b0/_tmp/bounded-pool-read-graph/' || true)
          test "${#files[@]}" -gt 0
          printf '%s\n' "${files[@]}" > /tmp/cleanup-files.txt
          git rm -f -- "${files[@]}"
          git diff --cached --check
          if git diff --cached --name-only | grep -Ev '^\.github/workflows/b0-one-shot-bounded-pool-read-graph.*\.yml$|^docs/auto-execute/evidence/b0/_tmp/bounded-pool-read-graph/' ; then
            echo "cleanup attempted to modify a non-staging path" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(b0): remove bounded-pool repair staging"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$B0_BRANCH"
          remote_after="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          echo "local_head=$local_head" >> "$GITHUB_OUTPUT"
          echo "remote_after=$remote_after" >> "$GITHUB_OUTPUT"

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          CLEANUP_SHA: ${{ steps.cleanup.outputs.local_head }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/bounded-pool-staging-cleanup",
              description: success
                ? `staging removed ${process.env.CLEANUP_SHA?.slice(0, 12)}`
                : `staging cleanup failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("bounded-pool staging cleanup failed");
