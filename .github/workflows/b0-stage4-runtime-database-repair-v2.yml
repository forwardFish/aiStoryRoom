name: B0 Stage 4 Runtime Database Repair V2

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage4-runtime-database-repair-v2.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage4-runtime-database-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage4-runtime-database-repair-v2",
              description: `stage 4 runtime database repair v2 running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact candidate ancestry and source baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^^)" = "81ee28fd3259be9a73ffc56d2ae1b4fc0eae1113"
          cat > /tmp/expected-staging <<'PATHS'
          .github/workflows/b0-stage4-runtime-database-repair-v2.yml
          .github/workflows/b0-stage4-runtime-database-repair.yml
          PATHS
          git diff --name-only 81ee28fd3259be9a73ffc56d2ae1b4fc0eae1113..HEAD | LC_ALL=C sort > /tmp/actual-staging
          LC_ALL=C sort -o /tmp/expected-staging /tmp/expected-staging
          diff -u /tmp/expected-staging /tmp/actual-staging
          test "$(sha256sum apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts | cut -d' ' -f1)" = "c916506e451a18bbe762272b405d05c77d59b4173728e489377354739b851d59"
          test "$(sha256sum apps/api/src/b0-settlement/b0-window-coordinator.prisma.ts | cut -d' ' -f1)" = "784f7973e7e6a6b9edeb1f882670e8f93f43b2a4ebd95fdfd2b07eb4df47cc8b"
          test "$(sha256sum apps/api/package.json | cut -d' ' -f1)" = "989adf7a40fe476b32d0f900e5e7ec471d53e2f397609828e687918e3b697efe"

      - name: Recover and apply the hash-bound runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path('.github/workflows/b0-stage4-runtime-database-repair.yml').read_text(encoding='utf-8')
          match = re.search(r"<<'B0_STAGE4_PATCH'\n(?P<body>.*?)\n\s*B0_STAGE4_PATCH", source, re.S)
          if not match:
              raise SystemExit('embedded stage 4 patch payload is missing')
          payload = ''.join(match.group('body').split())
          Path('/tmp/b0-stage4-runtime-db.patch.gz.b64').write_text(payload, encoding='ascii')
          PY
          test "$(wc -c < /tmp/b0-stage4-runtime-db.patch.gz.b64 | tr -d ' ')" = "5432"
          test "$(sha256sum /tmp/b0-stage4-runtime-db.patch.gz.b64 | cut -d' ' -f1)" = "fe3b7cf9922a075ecbe9bde5dd8054a727c2a32b20c43dc2c055c64d1f408cb6"
          base64 -d /tmp/b0-stage4-runtime-db.patch.gz.b64 > /tmp/b0-stage4-runtime-db.patch.gz
          test "$(sha256sum /tmp/b0-stage4-runtime-db.patch.gz | cut -d' ' -f1)" = "c23d178ebb15e183b6dc0ca7b50ab8765a785ec5b2a05a82e5baf2c27b4d351f"
          gzip -dc /tmp/b0-stage4-runtime-db.patch.gz > /tmp/b0-stage4-runtime-db.patch
          test "$(wc -c < /tmp/b0-stage4-runtime-db.patch | tr -d ' ')" = "14913"
          test "$(sha256sum /tmp/b0-stage4-runtime-db.patch | cut -d' ' -f1)" = "ad7c6c082cd5a153f55134be4de2af94fc24adbe3b4937702372433e5665938a"
          git apply --check /tmp/b0-stage4-runtime-db.patch
          git apply /tmp/b0-stage4-runtime-db.patch
          test "$(sha256sum apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts | cut -d' ' -f1)" = "652a16cea4481f68cbdc3046671ce0526588579720c332b243e8f67c668aa3b2"
          test "$(sha256sum apps/api/src/b0-settlement/b0-window-coordinator.prisma.ts | cut -d' ' -f1)" = "9a5a0017a9a4b8efff07530c246445d57ceaa3da7cd268fa6bd5a121faa7e113"
          test "$(sha256sum apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts | cut -d' ' -f1)" = "ed5fca203ccbd795eb25fbe834adcee04660417ee4cc4cfcb6cf35673e392e33"
          test "$(sha256sum prisma/migrations/20260809030000_b0_runtime_database_vocabulary/migration.sql | cut -d' ' -f1)" = "ac6139f41b004cc1028097367cd4dbba73563744a367ba0edef9278264c9249d"
          test "$(sha256sum apps/api/package.json | cut -d' ' -f1)" = "db66b35b39c0c1c0453b1ab0fd8bbd9d990db0a03c52fba5f8e5f93f8c182a1f"
          git diff --check

      - name: Frozen install, Prisma generation and affected gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/api typecheck
          pnpm --filter @apps/api test:b0-batch
          pnpm --filter @apps/api test:b0-window
          pnpm --filter @apps/api test:b0-player-window
          pnpm --filter @apps/api test:b0-pipeline
          pnpm --filter @apps/api test:b0-ops

      - name: Commit verified stage 4 as ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/package.json \
            apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts \
            apps/api/src/b0-settlement/b0-window-coordinator.prisma.ts \
            apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts \
            prisma/migrations/20260809030000_b0_runtime_database_vocabulary/migration.sql
          git rm \
            .github/workflows/b0-stage4-runtime-database-repair.yml \
            .github/workflows/b0-stage4-runtime-database-repair-v2.yml
          git diff --cached --check
          cat > /tmp/expected <<'PATHS'
          .github/workflows/b0-stage4-runtime-database-repair-v2.yml
          .github/workflows/b0-stage4-runtime-database-repair.yml
          apps/api/package.json
          apps/api/src/b0-settlement/b0-runtime-database-vocabulary.spec.ts
          apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
          apps/api/src/b0-settlement/b0-window-coordinator.prisma.ts
          prisma/migrations/20260809030000_b0_runtime_database_vocabulary/migration.sql
          PATHS
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "fix(b0): align runtime persistence vocabulary"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish stage outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/stage4-runtime-database-repair-v2",
              description: `stage 4 runtime database repair v2 ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("Stage 4 runtime database repair v2 failed");
