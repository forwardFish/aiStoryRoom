name: Dynamic Kernel Three-Turn Trace

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-three-turn-trace.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_ROOT: /tmp/dynamic-kernel-three-turn-trace
    steps:
      - name: Publish trace status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/three-turn-trace" \
            -f description="Three-turn structural trace running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply repair layers and trace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}"
          tr -d '[:space:]' < .github/repair/dynamic-kernel-followup.patch.gz.b64 \
            | base64 --decode | gzip --decompress > "${RUNNER_TEMP}/followup.patch"
          git apply --check "${RUNNER_TEMP}/followup.patch"
          git apply "${RUNNER_TEMP}/followup.patch"
          python .github/repair/apply-dynamic-kernel-final-repair.py
          python .github/repair/apply-dynamic-kernel-continuity-repair.py
          python .github/repair/apply-dynamic-kernel-sequence-compat-repair.py
          pnpm install --frozen-lockfile
          pnpm exec tsx .github/repair/trace-dynamic-kernel-three-turns.ts \
            | tee "${EVIDENCE_ROOT}/three-turn-trace.json"
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-three-turn-trace-${{ github.sha }}
          path: /tmp/dynamic-kernel-three-turn-trace/
          if-no-files-found: error
          retention-days: 3
      - name: Publish completion
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="dynamic-kernel-lite/three-turn-trace" \
            -f description="Three-turn structural trace uploaded" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
