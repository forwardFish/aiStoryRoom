name: B0 One-Shot Deadline Recovery Race

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-deadline-recovery-race.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-one-shot-deadline-recovery-race
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_BASELINE: d42ab2876b33672375b1c38a473c012e759d16fa

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/deadline-recovery-race",
              description: `deadline recovery race repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 100

      - name: Apply the minimal product and contract repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$B0_BASELINE" HEAD
          test -z "$(git status --short)"

          python3 - <<'PY'
          from pathlib import Path

          coordinator_path = Path("apps/api/src/b0-settlement/b0-window-coordinator.prisma.ts")
          coordinator = coordinator_path.read_text(encoding="utf-8")
          constant_anchor = 'const B0_PROJECTION_STABILITY_ATTEMPTS = 4;\n'
          constants = '''const B0_PROJECTION_STABILITY_ATTEMPTS = 4;
const B0_DEADLINE_RECOVERY_ACKNOWLEDGEMENT_MS = 60_000;
const B0_DEADLINE_IN_FLIGHT_STATUSES = [
  "LOCKED",
  "SETTLING",
  "COMMITTED",
  "PUBLISHING",
  "FAILED_RETRYABLE",
  "FAILED_HARD",
] as const;
'''
          if coordinator.count(constant_anchor) != 1:
              raise SystemExit("unexpected deadline constant anchor")
          if "B0_DEADLINE_RECOVERY_ACKNOWLEDGEMENT_MS" in coordinator:
              raise SystemExit("deadline recovery repair already exists")
          coordinator = coordinator.replace(constant_anchor, constants, 1)

          old_method = '''  async recoverExpired(now = new Date()): Promise<Array<{ windowId: string; status: string }>> {
    const windows = await this.prisma.actionWindow.findMany({
      where: { status: "OPEN", mainClosesAt: { lte: now } },
      select: { id: true },
      orderBy: { createdAt: "asc" },
    });
    const results: Array<{ windowId: string; status: string }> = [];
    for (const window of windows) {
      const result = await this.freezeDeadline(window.id, now);
      results.push({ windowId: window.id, status: result.status });
    }
    return results;
  }
'''
          new_method = '''  async recoverExpired(now = new Date()): Promise<Array<{ windowId: string; status: string }>> {
    const acknowledgedAfter = new Date(now.getTime() - B0_DEADLINE_RECOVERY_ACKNOWLEDGEMENT_MS);
    const windows = await this.prisma.actionWindow.findMany({
      where: {
        mainClosesAt: { lte: now },
        OR: [
          { status: "OPEN" },
          {
            closingReason: "DEADLINE",
            status: { in: [...B0_DEADLINE_IN_FLIGHT_STATUSES] },
          },
          {
            closingReason: "DEADLINE",
            status: "COMPLETED",
            updatedAt: { gte: acknowledgedAfter },
          },
        ],
      },
      select: {
        id: true,
        status: true,
        closingReason: true,
        mainClosesAt: true,
        configJson: true,
      },
      orderBy: { createdAt: "asc" },
    });
    const results: Array<{ windowId: string; status: string }> = [];
    for (const window of windows) {
      if (jsonRecord(window.configJson)?.schemaVersion !== "b0-window-config-v1") continue;
      if (window.status !== "OPEN") {
        if (window.closingReason === "DEADLINE") {
          results.push({ windowId: window.id, status: "ALREADY_FROZEN" });
        }
        continue;
      }
      try {
        const result = await this.freezeDeadline(window.id, now);
        results.push({ windowId: window.id, status: result.status });
      } catch (error) {
        // The embedded or independent recovery worker may win after the OPEN
        // scan but before this caller enters the serializable freeze. Re-read
        // the durable row and acknowledge only a proven deadline winner; all
        // unrelated failures remain fail-closed.
        const current = await this.prisma.actionWindow.findUnique({
          where: { id: window.id },
          select: {
            status: true,
            closingReason: true,
            mainClosesAt: true,
            configJson: true,
          },
        });
        const deadlineRecovered = Boolean(
          current
          && current.status !== "OPEN"
          && current.closingReason === "DEADLINE"
          && current.mainClosesAt
          && current.mainClosesAt.getTime() <= now.getTime()
          && jsonRecord(current.configJson)?.schemaVersion === "b0-window-config-v1",
        );
        if (!deadlineRecovered) throw error;
        results.push({ windowId: window.id, status: "ALREADY_FROZEN" });
      }
    }
    return results;
  }
'''
          if coordinator.count(old_method) != 1:
              raise SystemExit("unexpected recoverExpired source state")
          coordinator_path.write_text(coordinator.replace(old_method, new_method, 1), encoding="utf-8")

          spec_path = Path("apps/api/src/b0-settlement/b0-window-coordinator.prisma.spec.ts")
          spec = spec_path.read_text(encoding="utf-8")
          marker = "deadline recovery reports the exact window when a background sweep already completed it"
          if marker in spec:
              raise SystemExit("deadline recovery regression already exists")
          spec += r'''


test("deadline recovery reports the exact window when a background sweep already completed it", async () => {
  const now = new Date("2026-08-11T12:00:00.000Z");
  const row = windowRow();
  let freezeCalls = 0;
  let observedQuery: any;
  const service = new B0WindowCoordinatorService({
    actionWindow: {
      findMany: async (args: any) => {
        observedQuery = args;
        return [
          {
            id: row.id,
            status: "COMPLETED",
            closingReason: "DEADLINE",
            mainClosesAt: new Date(now.getTime() - 1_000),
            configJson: row.configJson,
          },
          {
            id: "window.legacy",
            status: "COMPLETED",
            closingReason: "DEADLINE",
            mainClosesAt: new Date(now.getTime() - 1_000),
            configJson: { schemaVersion: "legacy-window-v1" },
          },
        ];
      },
    },
  } as never);
  (service as any).freezeDeadline = async () => {
    freezeCalls += 1;
    throw new Error("completed deadline rows must not be frozen twice");
  };

  const recovered = await service.recoverExpired(now);

  assert.deepEqual(recovered, [{ windowId: row.id, status: "ALREADY_FROZEN" }]);
  assert.equal(freezeCalls, 0);
  assert.equal(observedQuery.where.mainClosesAt.lte, now);
  assert.equal(observedQuery.where.OR.length, 3);
});

test("deadline recovery reconciles an OPEN scan lost to a concurrent recovery owner", async () => {
  const now = new Date("2026-08-11T12:00:00.000Z");
  const row = windowRow();
  const service = new B0WindowCoordinatorService({
    actionWindow: {
      findMany: async () => [{
        id: row.id,
        status: "OPEN",
        closingReason: null,
        mainClosesAt: new Date(now.getTime() - 1_000),
        configJson: row.configJson,
      }],
      findUnique: async () => ({
        status: "SETTLING",
        closingReason: "DEADLINE",
        mainClosesAt: new Date(now.getTime() - 1_000),
        configJson: row.configJson,
      }),
    },
  } as never);
  (service as any).freezeDeadline = async () => {
    throw new Error("WINDOW_ALREADY_LOCKED");
  };

  const recovered = await service.recoverExpired(now);

  assert.deepEqual(recovered, [{ windowId: row.id, status: "ALREADY_FROZEN" }]);
});

test("deadline recovery still freezes an expired OPEN B0 window exactly once", async () => {
  const now = new Date("2026-08-11T12:00:00.000Z");
  const row = windowRow();
  const calls: Array<{ windowId: string; now: Date }> = [];
  const service = new B0WindowCoordinatorService({
    actionWindow: {
      findMany: async () => [{
        id: row.id,
        status: "OPEN",
        closingReason: null,
        mainClosesAt: new Date(now.getTime() - 1_000),
        configJson: row.configJson,
      }],
    },
  } as never);
  (service as any).freezeDeadline = async (windowId: string, observedNow: Date) => {
    calls.push({ windowId, now: observedNow });
    return { status: "FROZEN", envelope: null };
  };

  const recovered = await service.recoverExpired(now);

  assert.deepEqual(recovered, [{ windowId: row.id, status: "FROZEN" }]);
  assert.deepEqual(calls, [{ windowId: row.id, now }]);
});
'''
          spec_path.write_text(spec, encoding="utf-8")
          PY

          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run focused product gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/api test:b0-window
          pnpm --filter @apps/api test:b0-ops
          pnpm --filter @apps/api test:b0-pipeline
          pnpm --filter @apps/api typecheck
          pnpm typecheck:b0:real-acceptance
          pnpm --filter @apps/api build
          pnpm --filter @apps/openovel-runtime build

      - name: Scan changed product files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          paths = [
              pathlib.Path("apps/api/src/b0-settlement/b0-window-coordinator.prisma.ts"),
              pathlib.Path("apps/api/src/b0-settlement/b0-window-coordinator.prisma.spec.ts"),
          ]
          patterns = [
              re.compile(r"postgres(?:ql)?://[^\s\"']+", re.I),
              re.compile(r"(?<![A-Za-z0-9_-])sk-[A-Za-z0-9_-]{16,}"),
              re.compile(r"Bearer\s+[A-Za-z0-9._~+/-]{16,}", re.I),
              re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"),
          ]
          findings = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for pattern in patterns:
                  if pattern.search(text):
                      findings.append({"path": str(path), "pattern": pattern.pattern})
          if findings:
              raise SystemExit(f"secret scan failed: {findings}")
          print("changed-file secret scan: PASS")
          PY

      - name: Commit and push product files only
        id: push
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/api/src/b0-settlement/b0-window-coordinator.prisma.ts
            apps/api/src/b0-settlement/b0-window-coordinator.prisma.spec.ts
          )
          git fetch origin "$B0_BRANCH"
          remote_before="$(git rev-parse origin/$B0_BRANCH)"
          test "$remote_before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git diff --cached --check
          printf '%s\n' "${files[@]}" | LC_ALL=C sort > /tmp/expected
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git commit -m "fix(b0): acknowledge concurrent deadline recovery"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$B0_BRANCH"
          remote_after="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          echo "local_head=$local_head" >> "$GITHUB_OUTPUT"
          echo "remote_before=$remote_before" >> "$GITHUB_OUTPUT"
          echo "remote_after=$remote_after" >> "$GITHUB_OUTPUT"
          echo "REMOTE_PRODUCT_FIX_PUSHED=$local_head"

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          LOCAL_HEAD: ${{ steps.push.outputs.local_head }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/deadline-recovery-race",
              description: success
                ? `product fix pushed ${process.env.LOCAL_HEAD?.slice(0, 12)}`
                : `deadline recovery race repair failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("deadline recovery race repair failed");
