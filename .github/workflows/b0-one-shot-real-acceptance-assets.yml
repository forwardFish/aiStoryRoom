name: B0 One-Shot Real Acceptance Assets

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-real-acceptance-assets.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-one-shot-real-acceptance-assets
  cancel-in-progress: false

jobs:
  install-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish exact run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/acceptance-assets-install",
              description: `acceptance assets install running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git diff --name-only HEAD^..HEAD | LC_ALL=C sort)" = ".github/workflows/b0-one-shot-real-acceptance-assets.yml"

      - name: Reconstruct hash-bound acceptance assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fetch_blob_text() {
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$1" --jq .content \
              | tr -d '\n' \
              | base64 -d
          }

          mkdir -p scripts/acceptance .github/workflows

          {
            fetch_blob_text 7c9cf462ae93196af4918ca6652eafd220e7b33e
            fetch_blob_text 093acaed3e4cc4405476eb31c6b295237e8b6462
            fetch_blob_text 4fd80ed7e8ba11c4bd7514e9b72bbdb24d5f7c4f
            fetch_blob_text bbcf82f9a0b1b224766ddea3d2fffe0c0bb43684
            fetch_blob_text 67a346ac15b0540cdc31e18a655efad612b1bc55
          } > /tmp/b0-driver.gz.b64
          base64 -d /tmp/b0-driver.gz.b64 > /tmp/b0-driver.gz
          test "$(sha256sum /tmp/b0-driver.gz | cut -d' ' -f1)" = "d4031c3b7c22bbc239ca538ec7ab4f20ddf6aaeb73e614d21b6cf3c93ca1b875"
          gzip -dc /tmp/b0-driver.gz > scripts/acceptance/b0-candidate-real-flow.ts

          fetch_blob_text 4e21af2f2c4bc85b24f81f13617cfa3831dd095b > /tmp/b0-package.gz.b64
          base64 -d /tmp/b0-package.gz.b64 > /tmp/b0-package.gz
          test "$(sha256sum /tmp/b0-package.gz | cut -d' ' -f1)" = "d5487528a8a91ecccef88617a2ade0d7fe80bc26138c7abff899166a156f6511"
          gzip -dc /tmp/b0-package.gz > package.json

          fetch_blob_text f86f264d33bd16b550461a290b111a67e93f8277 > /tmp/b0-tsconfig.gz.b64
          base64 -d /tmp/b0-tsconfig.gz.b64 > /tmp/b0-tsconfig.gz
          test "$(sha256sum /tmp/b0-tsconfig.gz | cut -d' ' -f1)" = "19f49d37d303d80fd9a187562a5e1cb823b70413f92c27bfeb14466ad7c8ec52"
          gzip -dc /tmp/b0-tsconfig.gz > scripts/acceptance/tsconfig.b0-candidate-real.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("scripts/acceptance/tsconfig.b0-candidate-real.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data.setdefault("compilerOptions", {})["typeRoots"] = ["../../apps/api/node_modules/@types"]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          {
            fetch_blob_text cfd83e0e815879e317f280e0e738f9d864e2ba31
            fetch_blob_text 5a63e7cf315017aa39ee4ece3784a00652150be3
          } > /tmp/b0-workflow.gz.b64
          base64 -d /tmp/b0-workflow.gz.b64 > /tmp/b0-workflow.gz
          test "$(sha256sum /tmp/b0-workflow.gz | cut -d' ' -f1)" = "d82316227c7a2fdf3d84d095a186d0d03be45de7999abe6516483b0cc4d6523d"
          gzip -dc /tmp/b0-workflow.gz > .github/workflows/b0-candidate-real-acceptance.yml

          test "$(sha256sum scripts/acceptance/b0-candidate-real-flow.ts | cut -d' ' -f1)" = "adf3c939facb72a572281ec4f93982c48f46fcc58555391fcc3b6d822349421d"
          test "$(sha256sum package.json | cut -d' ' -f1)" = "ac706b1a05463ad56431e317c673e9b69a10902b3ff20fa394c79e81e4313b65"
          test "$(sha256sum scripts/acceptance/tsconfig.b0-candidate-real.json | cut -d' ' -f1)" = "2d3b0a47fae5332dbbd48994bd4ae258abb0c2b758a7a11021da14d561c73885"
          test "$(sha256sum .github/workflows/b0-candidate-real-acceptance.yml | cut -d' ' -f1)" = "bc5f6a4b2d24bb7c54c20fe3ee99a3c01c47fa2661d028ba57b6843a9a520393"
          git diff --check

      - name: Frozen install and acceptance-driver self-check
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance
          GITHUB_SHA="$GITHUB_SHA" \
          DATABASE_URL='postgresql://user:pass@127.0.0.1:5432/db?schema=cs_accept_b0_selfcheck123&connection_limit=3' \
          DEEPSEEK_API_KEY='self-check-only' \
          B0_ACCEPTANCE_SELF_CHECK=1 \
            pnpm test:b0:real-acceptance

      - name: Upload verified final workflow for connector installation
        uses: actions/upload-artifact@v4
        with:
          name: b0-final-real-acceptance-workflow-${{ github.sha }}
          path: .github/workflows/b0-candidate-real-acceptance.yml
          if-no-files-found: error
          retention-days: 7

      - name: Commit only non-workflow assets as an ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/acceptance/b0-candidate-real-flow.ts scripts/acceptance/tsconfig.b0-candidate-real.json
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          package.json
          scripts/acceptance/b0-candidate-real-flow.ts
          scripts/acceptance/tsconfig.b0-candidate-real.json
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "test(b0): add real acceptance harness assets"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish install outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/acceptance-assets-install",
              description: `${success ? "acceptance assets installed" : "acceptance assets install failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
