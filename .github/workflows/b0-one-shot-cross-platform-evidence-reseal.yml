name: B0 One-Shot Cross-Platform Evidence Reseal

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-cross-platform-evidence-reseal.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-one-shot-cross-platform-evidence-reseal
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_HISTORICAL_EVIDENCE_SHA: 6032972d4518f8feb57f958ff0b2e52636431be1
  B0_TESTABLE_CANDIDATE_SHA: e7635c279e72ae8efaff614159447d88c7ba22d0

jobs:
  patch-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/cross-platform-reseal-prep",
              description: `cross-platform reseal preparation running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Anchor exact remote state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH" main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$B0_TESTABLE_CANDIDATE_SHA" HEAD
          git cat-file -e "$B0_HISTORICAL_EVIDENCE_SHA^{commit}"
          test -z "$(git status --short)"

      - name: Restore history and patch cross-platform contracts
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$B0_HISTORICAL_EVIDENCE_SHA" -- \
            docs/auto-execute/evidence/b0/c0/baseline-test-matrix.json \
            docs/auto-execute/evidence/b0/c1/contract-gate-notes.md \
            docs/auto-execute/evidence/b0/c2/checkpoint.json \
            docs/auto-execute/evidence/b0/c3/checkpoint.json \
            docs/auto-execute/evidence/b0/c4/checkpoint.json \
            docs/auto-execute/evidence/b0/c5/checkpoint.json \
            docs/auto-execute/evidence/b0/c6/checkpoint.json

          python3 - <<'PY'
          from __future__ import annotations

          import pathlib

          def replace_once(path: pathlib.Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          attributes = pathlib.Path(".gitattributes")
          text = attributes.read_text(encoding="utf-8")
          marker = "# B0 evidence hashes are verified from ordinary Windows and Unix worktrees."
          if marker not in text:
              text = text.rstrip() + "\n\n" + """# B0 evidence hashes are verified from ordinary Windows and Unix worktrees.
          docs/auto-execute/USER_TEST_READY_HANDOFF.md text eol=lf
          docs/auto-execute/evidence/b0/**/*.json text eol=lf
          docs/auto-execute/evidence/b0/**/*.md text eol=lf
          docs/auto-execute/evidence/b0/**/*.txt text eol=lf
          docs/auto-execute/evidence/b0/**/*.log text eol=lf -diff
          docs/auto-execute/evidence/b0/**/*.sha256 text eol=lf
          docs/auto-execute/evidence/b0/**/*.ndjson text eol=lf
          docs/auto-execute/evidence/b0/**/*.csv text eol=lf
          docs/auto-execute/evidence/b0/**/*.html text eol=lf
          docs/auto-execute/evidence/b0/**/*.yaml text eol=lf
          docs/auto-execute/evidence/b0/**/*.yml text eol=lf
          docs/auto-execute/evidence/b0/**/*.png binary
          docs/auto-execute/evidence/b0/**/*.jpg binary
          docs/auto-execute/evidence/b0/**/*.jpeg binary
          docs/auto-execute/evidence/b0/**/*.webp binary
          docs/auto-execute/evidence/b0/**/*.zip binary
          """
              attributes.write_text(text, encoding="utf-8")

          windows = pathlib.Path(".github/workflows/b0-user-test-seed-windows.yml")
          replace_once(
              windows,
              """    paths:
                - prisma/seed.ts
                - package.json
                - pnpm-lock.yaml
                - .github/workflows/b0-user-test-seed-windows.yml
          """,
              """    paths-ignore:
                - \"docs/auto-execute/evidence/b0/**\"
          """,
          )

          finalizer = pathlib.Path(".github/workflows/b0-fail-closed-finalizer-v7.yml")
          replace_once(
              finalizer,
              """  B0_V2_SHA: bb48f72d4b65a17e311ec32dffa6c5c4a2959430
            B0_ROOT: docs/auto-execute/evidence/b0
          """,
              """  B0_V2_SHA: bb48f72d4b65a17e311ec32dffa6c5c4a2959430
            B0_HISTORICAL_EVIDENCE_SHA: 6032972d4518f8feb57f958ff0b2e52636431be1
            B0_ROOT: docs/auto-execute/evidence/b0
          """,
          )
          replace_once(
              finalizer,
              """  finalize:
              runs-on: ubuntu-latest
              timeout-minutes: 240
              steps:
          """,
              """  finalize:
              runs-on: ubuntu-latest
              timeout-minutes: 240
              outputs:
                tested_sha: ${{ steps.generate.outputs.tested_sha }}
                evidence_sha: ${{ steps.push.outputs.evidence_sha }}
                final_sha: ${{ steps.push.outputs.final_sha }}
              steps:
          """,
          )
          replace_once(
              finalizer,
              """          wanted = {
                        \"exact\": \"b0/exact-push\",
                        \"contract\": \"b0/acceptance-contract\",
                        \"engineering\": \"b0/engineering-real-acceptance\",
                    }
          """,
              """          wanted = {
                        \"exact\": \"b0/exact-push\",
                        \"contract\": \"b0/acceptance-contract\",
                        \"engineering\": \"b0/engineering-real-acceptance\",
                        \"windows\": \"b0/windows-seed\",
                    }
          """,
          )
          replace_once(
              finalizer,
              """          EXACT_RUN_ID: ${{ steps.observe.outputs.exact_run_id }}
                    ACCEPTANCE_RUN_ID: ${{ steps.observe.outputs.engineering_run_id }}
          """,
              """          EXACT_RUN_ID: ${{ steps.observe.outputs.exact_run_id }}
                    ACCEPTANCE_RUN_ID: ${{ steps.observe.outputs.engineering_run_id }}
                    WINDOWS_RUN_ID: ${{ steps.observe.outputs.windows_run_id }}
          """,
          )
          replace_once(
              finalizer,
              """          for run_id in \"$EXACT_RUN_ID\" \"$ACCEPTANCE_RUN_ID\"; do
          """,
              """          for run_id in \"$EXACT_RUN_ID\" \"$ACCEPTANCE_RUN_ID\" \"$WINDOWS_RUN_ID\"; do
          """,
          )
          replace_once(
              finalizer,
              """          prefixes = (\"b0-engineering-real-acceptance-\", \"b0-formal-c8-credential-blocker-\", \"b0-formal-c8-real-acceptance-\")
          """,
              """          prefixes = (\"b0-engineering-real-acceptance-\", \"b0-formal-c8-credential-blocker-\", \"b0-formal-c8-real-acceptance-\", \"b0-user-test-seed-\")
          """,
          )
          replace_once(
              finalizer,
              """          ENGINEERING_STATE: ${{ steps.observe.outputs.engineering_state }}
                    EXACT_RUN_ID: ${{ steps.observe.outputs.exact_run_id }}
                    ACCEPTANCE_RUN_ID: ${{ steps.observe.outputs.engineering_run_id }}
                run: |
                  set -euo pipefail
                  python3 - <<'PY'
          """,
              """          ENGINEERING_STATE: ${{ steps.observe.outputs.engineering_state }}
                    WINDOWS_STATE: ${{ steps.observe.outputs.windows_state }}
                    EXACT_RUN_ID: ${{ steps.observe.outputs.exact_run_id }}
                    ACCEPTANCE_RUN_ID: ${{ steps.observe.outputs.engineering_run_id }}
                    WINDOWS_RUN_ID: ${{ steps.observe.outputs.windows_run_id }}
                run: |
                  set -euo pipefail
                  git checkout \"$B0_HISTORICAL_EVIDENCE_SHA\" -- \\
                    \"$B0_ROOT/c0/baseline-test-matrix.json\" \\
                    \"$B0_ROOT/c1/contract-gate-notes.md\" \\
                    \"$B0_ROOT/c2/checkpoint.json\" \\
                    \"$B0_ROOT/c3/checkpoint.json\" \\
                    \"$B0_ROOT/c4/checkpoint.json\" \\
                    \"$B0_ROOT/c5/checkpoint.json\" \\
                    \"$B0_ROOT/c6/checkpoint.json\"
                  python3 - <<'PY'
          """,
          )
          replace_once(
              finalizer,
              """          if root.exists(): shutil.rmtree(root)
                    for path in (c8, c9 / \"gates\", c9 / \"runtime/engineering\", c9 / \"runtime/formal\", c9 / \"recovery/finalizer-v2\", c9 / \"readback\"): path.mkdir(parents=True, exist_ok=True)
          """,
              """          for generated_dir in (c8, c9):
                        if generated_dir.exists(): shutil.rmtree(generated_dir)
                    for path in (c8, c9 / \"gates\", c9 / \"runtime/engineering\", c9 / \"runtime/formal\", c9 / \"runtime/seed\", c9 / \"recovery/finalizer-v2\", c9 / \"readback\"): path.mkdir(parents=True, exist_ok=True)
          """,
          )
          replace_once(
              finalizer,
              """          formal_sources = sorted(p for p in (stage / \"extracted\").glob(\"b0-formal-c8-real-acceptance-*\") if p.is_dir())
                    for source in engineering_sources: copy_tree(source, c9 / \"runtime/engineering\" / source.name)
                    for source in blocker_sources + formal_sources: copy_tree(source, c9 / \"runtime/formal\" / source.name)
          """,
              """          formal_sources = sorted(p for p in (stage / \"extracted\").glob(\"b0-formal-c8-real-acceptance-*\") if p.is_dir())
                    seed_sources = sorted(p for p in (stage / \"extracted\").glob(\"b0-user-test-seed-*\") if p.is_dir())
                    for source in engineering_sources: copy_tree(source, c9 / \"runtime/engineering\" / source.name)
                    for source in blocker_sources + formal_sources: copy_tree(source, c9 / \"runtime/formal\" / source.name)
                    for source in seed_sources: copy_tree(source, c9 / \"runtime/seed\" / source.name)
          """,
          )
          replace_once(
              finalizer,
              """          engineering_pass = bool(os.environ.get(\"ENGINEERING_STATE\") == \"success\" and acceptance_result and acceptance_result.get(\"status\") == \"PASS\")
                    acceptance_jobs = read_json(stage / f\"gates/run-{os.environ.get('ACCEPTANCE_RUN_ID')}-jobs.json\") or {}
          """,
              """          engineering_pass = bool(os.environ.get(\"ENGINEERING_STATE\") == \"success\" and acceptance_result and acceptance_result.get(\"status\") == \"PASS\")
                    windows_pass = os.environ.get(\"WINDOWS_STATE\") == \"success\"
                    acceptance_jobs = read_json(stage / f\"gates/run-{os.environ.get('ACCEPTANCE_RUN_ID')}-jobs.json\") or {}
          """,
          )
          replace_once(
              finalizer,
              """          if exact_pass and contract_pass and engineering_pass and formal_pass: status, classification, ready = \"PASS\", \"FULL_PASS\", True
                    elif exact_pass and contract_pass and engineering_pass and external_blocked: status, classification, ready = \"EXTERNAL_BLOCKED\", \"ENGINEERING_PASS_FORMAL_C8_EXTERNAL_BLOCKED\", False
                    else: status, classification, ready = \"INCOMPLETE\", \"ENGINEERING_OR_FORMAL_VERIFICATION_INCOMPLETE\", False
                    tested = os.environ[\"GITHUB_SHA\"] if exact_pass and contract_pass and engineering_pass else None
          """,
              """          if exact_pass and contract_pass and engineering_pass and windows_pass and formal_pass: status, classification, ready = \"PASS\", \"FULL_PASS\", True
                    elif exact_pass and contract_pass and engineering_pass and windows_pass and external_blocked: status, classification, ready = \"EXTERNAL_BLOCKED\", \"ENGINEERING_PASS_FORMAL_C8_EXTERNAL_BLOCKED\", False
                    else: status, classification, ready = \"INCOMPLETE\", \"ENGINEERING_OR_FORMAL_VERIFICATION_INCOMPLETE\", False
                    tested = os.environ[\"GITHUB_SHA\"] if exact_pass and contract_pass and engineering_pass and windows_pass else None
          """,
          )
          replace_once(
              finalizer,
              """\"desktopAnd390px\":engineering_pass,\"formalManagedNonProductionSupabase\":formal_pass""",
              """\"desktopAnd390px\":engineering_pass,\"linuxCleanCloneSeed\":exact_pass,\"windowsCleanCloneSeed\":windows_pass,\"formalManagedNonProductionSupabase\":formal_pass""",
          )
          replace_once(
              finalizer,
              """\"formalC8\":formal,\"engineeringAcceptance\":engineering,\"boundaries\"""",
              """\"formalC8\":formal,\"engineeringAcceptance\":engineering,\"crossPlatformSeed\":{\"linux\":{\"status\":\"PASS\" if exact_pass else \"FAIL\",\"workflowRunId\":int(os.environ[\"EXACT_RUN_ID\"]) if os.environ.get(\"EXACT_RUN_ID\") else None},\"windows\":{\"status\":\"PASS\" if windows_pass else \"FAIL\",\"workflowRunId\":int(os.environ[\"WINDOWS_RUN_ID\"]) if os.environ.get(\"WINDOWS_RUN_ID\") else None}},\"boundaries\"""",
          )
          replace_once(
              finalizer,
              """- acceptance run: `{os.environ.get('ACCEPTANCE_RUN_ID') or 'unknown'}`\\n- status:""",
              """- acceptance run: `{os.environ.get('ACCEPTANCE_RUN_ID') or 'unknown'}`\\n- Windows seed run: `{os.environ.get('WINDOWS_RUN_ID') or 'unknown'}`\\n- status:""",
          )
          replace_once(
              finalizer,
              """- engineering acceptance: `{engineering['status']}`\\n- formal C8:""",
              """- engineering acceptance: `{engineering['status']}`\\n- Windows clean-clone seed: `{'PASS' if windows_pass else 'FAIL'}`\\n- formal C8:""",
          )
          replace_once(
              finalizer,
              """          exclusions={\"manifest.json\",\"manifest.sha256\",\"final-pointer.json\",\"B0_FINAL_DELIVERY_RESULT.json\"};rows=[];total=0
                    for p in sorted(c9.rglob(\"*\")):
                        if not p.is_file() or p.name in exclusions:continue
                        raw=p.read_bytes();total+=len(raw);rows.append({\"path\":str(p.relative_to(c9)).replace(\"\\\\\",\"/\"),\"bytes\":len(raw),\"sha256\":hashlib.sha256(raw).hexdigest()})
                    manifest={\"schemaVersion\":1,\"generatedAtUtc\":generated,\"testedCodeSha\":tested,\"artifactCount\":len(rows),\"totalBytes\":total,\"selfReferentialExclusions\":sorted(exclusions),\"artifacts\":rows};mp=c9/\"manifest.json\";mp.write_text(json.dumps(manifest,indent=2)+\"\\n\");(c9/\"manifest.sha256\").write_text(f\"{hashlib.sha256(mp.read_bytes()).hexdigest()}  manifest.json\\n\")
          """,
              """          exclusions={\"c9/manifest.json\",\"c9/manifest.sha256\",\"c9/final-pointer.json\",\"c9/B0_FINAL_DELIVERY_RESULT.json\"};rows=[];total=0
                    for p in sorted(root.rglob(\"*\")):
                        rel=str(p.relative_to(root)).replace(\"\\\\\",\"/\")
                        if not p.is_file() or rel in exclusions:continue
                        raw=p.read_bytes();total+=len(raw);rows.append({\"path\":rel,\"bytes\":len(raw),\"sha256\":hashlib.sha256(raw).hexdigest()})
                    manifest={\"schemaVersion\":1,\"generatedAtUtc\":generated,\"testedCodeSha\":tested,\"pathBase\":\"docs/auto-execute/evidence/b0\",\"artifactCount\":len(rows),\"totalBytes\":total,\"selfReferentialExclusions\":sorted(exclusions),\"artifacts\":rows};mp=c9/\"manifest.json\";mp.write_text(json.dumps(manifest,indent=2)+\"\\n\");(c9/\"manifest.sha256\").write_text(f\"{hashlib.sha256(mp.read_bytes()).hexdigest()}  manifest.json\\n\")
          """,
          )
          replace_once(
              finalizer,
              """          print(json.dumps({\"status\":status,\"classification\":classification,\"testedCodeSha\":tested,\"engineeringPass\":engineering_pass,\"formalPass\":formal_pass,\"externalBlocked\":external_blocked},indent=2))
          """,
              """          print(json.dumps({\"status\":status,\"classification\":classification,\"testedCodeSha\":tested,\"engineeringPass\":engineering_pass,\"windowsSeedPass\":windows_pass,\"formalPass\":formal_pass,\"externalBlocked\":external_blocked},indent=2))
          """,
          )
          replace_once(
              finalizer,
              """          required=[root/\"c8/checkpoint.json\",c9/\"manifest.json\",c9/\"manifest.sha256\",c9/\"checkpoint.json\",c9/\"final-pointer.json\",c9/\"HANDOFF.md\",c9/\"test-matrix.json\",c9/\"B0_FINAL_DELIVERY_RESULT.json\",c9/\"B0_FINAL_DELIVERY_REPORT.md\",c9/\"recovery-audit.json\",c9/\"redaction-scan.json\"]
          """,
              """          required=[root/\"c0/baseline-test-matrix.json\",root/\"c1/contract-gate-notes.md\",root/\"c2/checkpoint.json\",root/\"c3/checkpoint.json\",root/\"c4/checkpoint.json\",root/\"c5/checkpoint.json\",root/\"c6/checkpoint.json\",root/\"c8/checkpoint.json\",c9/\"manifest.json\",c9/\"manifest.sha256\",c9/\"checkpoint.json\",c9/\"final-pointer.json\",c9/\"HANDOFF.md\",c9/\"test-matrix.json\",c9/\"B0_FINAL_DELIVERY_RESULT.json\",c9/\"B0_FINAL_DELIVERY_REPORT.md\",c9/\"recovery-audit.json\",c9/\"redaction-scan.json\"]
          """,
          )
          replace_once(
              finalizer,
              """              p=c9/row[\"path\"]
          """,
              """              p=root/row[\"path\"]
          """,
          )

          replace_once(
              finalizer,
              """            if (!success) core.setFailed(\"B0 guaranteed fail-closed finalizer v7 failed\");
          """,
              """            if (!success) core.setFailed(\"B0 guaranteed fail-closed finalizer v7 failed\");

            windows-evidence-readback:
              name: Windows ordinary-worktree evidence hash readback
              needs: finalize
              runs-on: windows-2025
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ needs.finalize.outputs.final_sha }}
                    fetch-depth: 1
                - name: Verify exact final remote checkout and manifest hashes
                  shell: pwsh
                  env:
                    FINAL_SHA: ${{ needs.finalize.outputs.final_sha }}
                  run: |
                    $ErrorActionPreference = \"Stop\"
                    if ((git rev-parse HEAD).Trim() -ne $env:FINAL_SHA) { throw \"wrong final SHA\" }
                    New-Item -ItemType Directory -Force -Path .artifacts/windows-evidence-readback | Out-Null
                    @'
                    import hashlib, json, pathlib, os
                    root = pathlib.Path(\"docs/auto-execute/evidence/b0\")
                    c9 = root / \"c9\"
                    manifest_path = c9 / \"manifest.json\"
                    manifest = json.loads(manifest_path.read_text(encoding=\"utf-8\"))
                    errors = []
                    total = 0
                    for row in manifest.get(\"artifacts\", []):
                        path = root / row[\"path\"]
                        if not path.is_file():
                            errors.append(\"missing:\" + row[\"path\"])
                            continue
                        raw = path.read_bytes()
                        total += len(raw)
                        if len(raw) != row[\"bytes\"]: errors.append(\"bytes:\" + row[\"path\"])
                        if hashlib.sha256(raw).hexdigest() != row[\"sha256\"]: errors.append(\"sha256:\" + row[\"path\"])
                    if total != manifest.get(\"totalBytes\"): errors.append(\"totalBytes\")
                    expected = (c9 / \"manifest.sha256\").read_text(encoding=\"utf-8\").split()[0]
                    if hashlib.sha256(manifest_path.read_bytes()).hexdigest() != expected: errors.append(\"manifest-self-hash\")
                    for required in (\"c0/baseline-test-matrix.json\", \"c1/contract-gate-notes.md\", \"c2/checkpoint.json\", \"c3/checkpoint.json\", \"c4/checkpoint.json\", \"c5/checkpoint.json\", \"c6/checkpoint.json\"):
                        if not (root / required).is_file(): errors.append(\"historical-missing:\" + required)
                    result = {\"schemaVersion\": 1, \"os\": \"windows-2025\", \"finalRemoteSha\": os.environ[\"FINAL_SHA\"], \"artifactCount\": manifest.get(\"artifactCount\"), \"totalBytes\": total, \"errors\": errors, \"status\": \"PASS\" if not errors else \"FAIL\"}
                    pathlib.Path(\".artifacts/windows-evidence-readback/result.json\").write_text(json.dumps(result, indent=2) + \"\\n\", encoding=\"utf-8\")
                    print(json.dumps(result, indent=2))
                    if errors: raise SystemExit(str(errors))
                    '@ | python -
                - name: Upload Windows evidence readback
                  uses: actions/upload-artifact@v4
                  with:
                    name: b0-windows-evidence-readback-${{ needs.finalize.outputs.final_sha }}
                    path: .artifacts/windows-evidence-readback
                    if-no-files-found: error
                    retention-days: 30
                - name: Publish Windows readback status
                  if: always()
                  uses: actions/github-script@v7
                  env:
                    FINAL_SHA: ${{ needs.finalize.outputs.final_sha }}
                    JOB_STATUS: ${{ job.status }}
                  with:
                    script: |
                      const success = process.env.JOB_STATUS === \"success\";
                      await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:process.env.FINAL_SHA,state:success?\"success\":\"failure\",context:\"b0/windows-evidence-readback\",description:success?`Windows worktree evidence hashes passed in ${context.runId}`:`Windows worktree evidence hashes failed in ${context.runId}`,target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
                      if (!success) core.setFailed(\"Windows evidence hash readback failed\");
          """,
          )

          handoff = pathlib.Path("docs/auto-execute/USER_TEST_READY_HANDOFF.md")
          handoff_text = handoff.read_text(encoding="utf-8")
          replacements = {
              "483911272191964a22d14966163aee5f99968b1d": "e7635c279e72ae8efaff614159447d88c7ba22d0",
              "fix(seed): build the shared runtime on a clean checkout": "test(seed): add Windows clean-clone migration and seed gate",
              "31406011925": "31409860173",
              "31406011926": "31409860193",
              "93512417453": "93525285893",
              "b0-user-test-seed-483911272191964a22d14966163aee5f99968b1d": "b0-user-test-seed-e7635c279e72ae8efaff614159447d88c7ba22d0",
              "artifact id: 9069657258": "artifact id: 9071185078",
              "artifact SHA-256: 8f57793675e22549af0ddf7a6523c6287a6905df625a643e1251deccfb6215df": "artifact SHA-256: 7223d0d51f93cd13c236b86b97d306f8573e8310f023900c0551d13ca24fd5c4",
          }
          for old, new in replacements.items():
              if old not in handoff_text:
                  raise SystemExit(f"handoff token missing: {old}")
              handoff_text = handoff_text.replace(old, new)
          marker = "`pnpm db:seed` now loads the repository-root `.env` when it exists."
          if marker not in handoff_text:
              raise SystemExit("handoff seed explanation marker missing")
          handoff_text = handoff_text.replace(
              marker,
              marker + " The Shared build subprocess is launched through the active pnpm CLI via Node (`npm_execpath`), avoiding Windows `spawnSync('pnpm.cmd') EINVAL`."
          )
          proof_marker = "artifact SHA-256: 7223d0d51f93cd13c236b86b97d306f8573e8310f023900c0551d13ca24fd5c4\n```"
          windows_proof = """artifact SHA-256: 7223d0d51f93cd13c236b86b97d306f8573e8310f023900c0551d13ca24fd5c4
          ```

          Windows clean-clone proof:

          ```text
          workflow run: 31409860255
          job: 93525029790
          command: pnpm db:seed
          exit code: 0
          database readback: templateCount=5, userCount=1, runCount=1
          artifact: b0-user-test-seed-windows-e7635c279e72ae8efaff614159447d88c7ba22d0
          artifact id: 9071148170
          artifact SHA-256: 11a44edffa20632553af3ae10c490d889155bfc197fcf7d836ae6d9c927e3dd6
          ```"""
          if proof_marker not in handoff_text:
              raise SystemExit("handoff proof marker missing")
          handoff.write_text(handoff_text.replace(proof_marker, windows_proof), encoding="utf-8")
          PY

      - name: Validate the minimal patch
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            docs/auto-execute/evidence/b0/c0/baseline-test-matrix.json \
            docs/auto-execute/evidence/b0/c1/contract-gate-notes.md \
            docs/auto-execute/evidence/b0/c2/checkpoint.json \
            docs/auto-execute/evidence/b0/c3/checkpoint.json \
            docs/auto-execute/evidence/b0/c4/checkpoint.json \
            docs/auto-execute/evidence/b0/c5/checkpoint.json \
            docs/auto-execute/evidence/b0/c6/checkpoint.json; do test -f "$path"; done
          grep -F 'process.env.npm_execpath' prisma/seed.ts
          grep -F 'b0/windows-seed' .github/workflows/b0-fail-closed-finalizer-v7.yml
          grep -F 'Windows ordinary-worktree evidence hash readback' .github/workflows/b0-fail-closed-finalizer-v7.yml
          grep -F 'docs/auto-execute/evidence/b0/**/*.json text eol=lf' .gitattributes
          grep -F 'testableCandidateSha' docs/auto-execute/USER_TEST_READY_HANDOFF.md
          git diff --check
          python3 - <<'PY'
          import pathlib, re
          paths = [
              pathlib.Path("prisma/seed.ts"),
              pathlib.Path(".gitattributes"),
              pathlib.Path(".github/workflows/b0-user-test-seed-windows.yml"),
              pathlib.Path(".github/workflows/b0-fail-closed-finalizer-v7.yml"),
              pathlib.Path("docs/auto-execute/USER_TEST_READY_HANDOFF.md"),
          ]
          patterns = {
              "api-key": re.compile(r"sk-[A-Za-z0-9_-]{16,}"),
              "bearer": re.compile(r"Bearer\s+[A-Za-z0-9._~+/-]{16,}", re.I),
              "jwt": re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"),
          }
          findings = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for kind, pattern in patterns.items():
                  if pattern.search(text): findings.append({"path": str(path), "kind": kind})
          if findings: raise SystemExit(str(findings))
          print("changed-file secret scan: PASS")
          PY

      - name: Commit and push the frozen reseal preparation
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          before="$(git rev-parse origin/$B0_BRANCH)"
          test "$before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/b0-one-shot-cross-platform-evidence-reseal.yml
          git add .gitattributes \
            .github/workflows/b0-user-test-seed-windows.yml \
            .github/workflows/b0-fail-closed-finalizer-v7.yml \
            docs/auto-execute/USER_TEST_READY_HANDOFF.md
          git add -f \
            docs/auto-execute/evidence/b0/c0/baseline-test-matrix.json \
            docs/auto-execute/evidence/b0/c1/contract-gate-notes.md \
            docs/auto-execute/evidence/b0/c2/checkpoint.json \
            docs/auto-execute/evidence/b0/c3/checkpoint.json \
            docs/auto-execute/evidence/b0/c4/checkpoint.json \
            docs/auto-execute/evidence/b0/c5/checkpoint.json \
            docs/auto-execute/evidence/b0/c6/checkpoint.json
          git diff --cached --check
          git commit -m "ci(b0): preserve cross-platform evidence history"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$B0_BRANCH"
          after="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
          test "$after" = "$local_head"
          echo "local_head=$local_head" >> "$GITHUB_OUTPUT"
          echo "remote_before=$before" >> "$GITHUB_OUTPUT"
          echo "remote_after=$after" >> "$GITHUB_OUTPUT"

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          LOCAL_HEAD: ${{ steps.push.outputs.local_head }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/cross-platform-reseal-prep",
              description: success
                ? `reseal preparation pushed ${process.env.LOCAL_HEAD?.slice(0, 12)}`
                : `reseal preparation failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("Cross-platform reseal preparation failed");
