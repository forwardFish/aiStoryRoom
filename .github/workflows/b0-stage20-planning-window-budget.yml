name: B0 Stage 20 Planning Window Budget

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage20-planning-window-budget.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage20-planning-window-budget
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage20-planning-window-budget",
              description: `planning window budget repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact remote starting point
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "8e6ede5253013ce05fe60424a321b8d1cf4e2f34"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage20-planning-window-budget.yml"
          printf '%s  %s\n' \
            "44cb408e4be02640fd17159a47667fb255a7a622c6d3887a87d7e5819875114a" scripts/acceptance/b0-candidate-real-flow.ts \
            "7c37b3db263e46b6bb87135e7e5130f73867b891f102641fa97efa1df0cc0436" scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs \
            | sha256sum -c -

      - name: Apply the hash-bound planning-window patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/30e6a6059242f4d9ac9e02427d15afbc71e417d1" --jq .content \
            | tr -d '\n' \
            | base64 -d > /tmp/b0-stage20.patch.gz.b64
          test "$(wc -c < /tmp/b0-stage20.patch.gz.b64 | tr -d ' ')" = "1184"
          printf '%s  %s\n' "24b1bbc4dfb9b78ea29f07b1dbdf1511bdbf307c15a386383645873233de5fea" /tmp/b0-stage20.patch.gz.b64 | sha256sum -c -
          base64 -d /tmp/b0-stage20.patch.gz.b64 > /tmp/b0-stage20.patch.gz
          test "$(wc -c < /tmp/b0-stage20.patch.gz | tr -d ' ')" = "888"
          printf '%s  %s\n' "5c0d2667b79fb8e44c304b9b2544ae9bcd99e560ed76653b2ab3997db5c05c73" /tmp/b0-stage20.patch.gz | sha256sum -c -
          gzip -dc /tmp/b0-stage20.patch.gz > /tmp/b0-stage20.patch
          test "$(wc -c < /tmp/b0-stage20.patch | tr -d ' ')" = "2006"
          printf '%s  %s\n' "9d38d7a7247329b68f6435f17ad06499a1227d282824ef8f6a138ec5de561773" /tmp/b0-stage20.patch | sha256sum -c -
          git apply --check /tmp/b0-stage20.patch
          git apply /tmp/b0-stage20.patch
          git diff --check
          printf '%s  %s\n' \
            "ef1818d44bee2954cfaed43f0095fbe28f1c4de856627fc47a6b6ac7a478e6f0" scripts/acceptance/b0-candidate-real-flow.ts \
            "12579804042fb2a56aa4e5a3c73cb328716b1b15dc7f6128a0afd4949b9d60da" scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs \
            | sha256sum -c -

      - name: Frozen install and affected verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance
          node --test scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs
          bash -n scripts/acceptance/b0-selfhosted-real-acceptance.sh
          bash -n scripts/acceptance/b0-formal-supabase-acceptance.sh

      - name: Commit and push the completed stage as an ordinary fast-forward
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          remote_before="$(git rev-parse origin/$GITHUB_REF_NAME)"
          test "$remote_before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/acceptance/b0-candidate-real-flow.ts \
            scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs
          git rm .github/workflows/b0-stage20-planning-window-budget.yml
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          .github/workflows/b0-stage20-planning-window-budget.yml
          scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs
          scripts/acceptance/b0-candidate-real-flow.ts
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "test(b0): keep planned windows open during real narrative work"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          remote_after="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          {
            echo "local_head=$local_head"
            echo "remote_before=$remote_before"
            echo "remote_after=$remote_after"
          } >> "$GITHUB_OUTPUT"

      - name: Publish completed-stage outcome
        if: success()
        uses: actions/github-script@v7
        env:
          FINAL_SHA: ${{ steps.commit.outputs.local_head }}
          REMOTE_BEFORE: ${{ steps.commit.outputs.remote_before }}
          REMOTE_AFTER: ${{ steps.commit.outputs.remote_after }}
        with:
          script: |
            if (!process.env.FINAL_SHA || process.env.FINAL_SHA !== process.env.REMOTE_AFTER) {
              core.setFailed("stage push SHA readback mismatch");
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.FINAL_SHA,
              state: "success",
              context: "b0/stage20-planning-window-budget",
              description: `ordinary fast-forward from ${process.env.REMOTE_BEFORE.slice(0, 8)} verified in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Publish failed-stage outcome
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "failure",
              context: "b0/stage20-planning-window-budget",
              description: `planning window budget repair failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.setFailed("B0 stage 20 planning window budget repair failed");
