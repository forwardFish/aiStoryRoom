name: B0 Stage 11 Real Browser Six-Window Repair

on:
  push:
    branches: [codex/chatgpt-pro-maneuver-evidence-v1]
    paths: [.github/workflows/b0-stage11-browser-window-driver.yml]

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage11-real-browser-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      B0_DATABASE_IMAGE: supabase/postgres:15.14.1.157-mmlb_amd64
      B0_PROVIDER_IMAGE: ollama/ollama:0.32.5
      B0_PROVIDER_MODEL: qwen2.5:1.5b
      B0_ACCEPTANCE_TIER: engineering-selfhosted
      B0_ACCEPTANCE_ENVIRONMENT: github-hosted-isolated-engineering
      B0_EVIDENCE_ROOT: .artifacts/b0-stage11-v2/${{ github.sha }}
      B0_PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - name: Publish locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:"pending",context:"b0/stage11-real-browser-v2",description:`real browser six-window repair running in ${context.runId}`,target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 2}
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}

      - name: Verify exact input
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = d2f30adb30e89c90fcab1904e72e5973da361f22
          test "$(git diff --name-only HEAD^..HEAD)" = .github/workflows/b0-stage11-browser-window-driver.yml
          test "$(git hash-object scripts/acceptance/b0-candidate-real-flow.ts)" = f434c6bf4c2d6d26d1231fd9343e87672ad58bef

      - name: Patch deterministic browser driver and worker boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("scripts/acceptance/b0-candidate-real-flow.ts")
          s=p.read_text()
          special='      await submitCyclicPlans(mainRun.id, users.slice(0, 3), opened.humanRoleIds, { duplicateConfirm: true });'
          assert s.count(special)==1
          s=s.replace(special,'      await submitCyclicPlansThroughBrowser(browsers, mainRun.id, users.slice(0, 3), opened.humanRoleIds, { duplicateConfirm: true });',1)
          generic='      await submitCyclicPlans(mainRun.id, users.slice(0, 3), opened.humanRoleIds);'
          assert s.count(generic)==4
          s=s.replace(generic,'      await submitCyclicPlansThroughBrowser(browsers, mainRun.id, users.slice(0, 3), opened.humanRoleIds);')
          partial='      await submitCyclicPlans(mainRun.id, users.slice(0, 2), opened.humanRoleIds.slice(0, 2));'
          assert s.count(partial)==1
          s=s.replace(partial,'      await submitCyclicPlansThroughBrowser(browsers.slice(0, 2), mainRun.id, users.slice(0, 2), opened.humanRoleIds.slice(0, 2));',1)

          begin=s.index('      await sleep(1_500);\n      const participantsBeforeWorker')
          end=s.index('\n      await startWorker(commonEnv, "worker"',begin)
          boundary='''      await sleep(1_500);
          const snap = await prisma.$transaction(async (tx) => ({
            participants: await tx.actionWindowParticipant.findMany({ where: { windowId: opened.windowId }, select: { roleId: true, mainStatus: true }, orderBy: { roleId: "asc" } }),
            settlement: await tx.storyTaskOutbox.findFirst({ where: { windowId: opened.windowId, taskType: "B0_SETTLEMENT_REQUESTED" }, select: { id: true, status: true, attempt: true, leaseVersion: true, leaseOwner: true } }),
            window: await tx.actionWindow.findUniqueOrThrow({ where: { id: opened.windowId }, select: { status: true } }),
            run: await tx.storyRun.findUniqueOrThrow({ where: { id: mainRun.id }, select: { worldSequence: true } }),
          }), { isolationLevel: Prisma.TransactionIsolationLevel.RepeatableRead });
          const humanRoleIds = new Set(opened.humanRoleIds);
          const humanParticipants = snap.participants.filter((entry) => humanRoleIds.has(entry.roleId));
          const aiParticipants = snap.participants.filter((entry) => !humanRoleIds.has(entry.roleId));
          const preparedStatuses = new Set(["B0_READY", "B0_LOCKED"]);
          assert.equal(humanParticipants.length, opened.humanRoleIds.length, "all human roles must have synchronized window participants");
          assert(humanParticipants.every((entry) => preparedStatuses.has(entry.mainStatus)), "all humans must have browser-confirmed ActionContracts before standalone worker startup");
          assert(aiParticipants.length >= 1, "the multiplayer run must retain AI-filled vacant roles");
          assert(aiParticipants.every((entry) => ["B0_PENDING", "B0_READY", "B0_LOCKED"].includes(entry.mainStatus)), "AI roles must remain inside the bounded ActionContract lifecycle");
          assert.equal(snap.run.worldSequence, before.worldSequence, "without a standalone worker the world cannot advance");
          const aiPending = aiParticipants.filter((entry) => entry.mainStatus === "B0_PENDING").length;
          const aiLocked = aiParticipants.filter((entry) => entry.mainStatus === "B0_LOCKED").length;
          let preWorkerBoundary: "AI_ACTIONS_UNPREPARED" | "AI_ACTIONS_PARTIALLY_PREPARED" | "SETTLEMENT_ENQUEUED";
          if (snap.settlement === null) {
            assert.equal(snap.window.status, "OPEN", "without settlement the synchronized window remains OPEN");
            assert(humanParticipants.every((entry) => entry.mainStatus === "B0_READY"), "humans remain READY before freeze");
            assert.equal(aiLocked, 0, "an OPEN window cannot expose a partially locked AI roster");
            preWorkerBoundary = aiPending === aiParticipants.length ? "AI_ACTIONS_UNPREPARED" : "AI_ACTIONS_PARTIALLY_PREPARED";
          } else {
            assert(humanParticipants.every((entry) => entry.mainStatus === "B0_LOCKED"), "humans lock with the frozen roster");
            assert.equal(aiLocked, aiParticipants.length, "all AI roles lock atomically after freeze");
            assert.equal(snap.window.status, "LOCKED");
            assert.equal(snap.settlement.status, "pending");
            assert.equal(snap.settlement.leaseOwner, null);
            assert.equal(snap.settlement.leaseVersion, 0);
            preWorkerBoundary = "SETTLEMENT_ENQUEUED";
          }
          const settlementBeforeWorker = snap.settlement;
          '''.replace('          ','')
          s=s[:begin]+boundary+s[end:]

          helper='''async function submitCyclicPlansThroughBrowser(
            browsers: BrowserSession[], runId: string,
            users: Array<{ id: string; token: string }>, roleIds: string[],
            options: { duplicateConfirm?: boolean } = {},
          ) {
            assert.equal(browsers.length, users.length);
            assert.equal(users.length, roleIds.length);
            for (let index=0; index<users.length; index+=1) {
              const browser=browsers[index];
              const target=roleIds[(index+1)%roleIds.length] || roleIds[0];
              await browser.reload();
              await browser.waitForSelector("[data-b0-window-status]",60000);
              await browser.waitFor(()=>browser.evaluate(`Boolean(document.querySelector('[data-mv1-kind="CONTACT"]:not([disabled]))')`),60000,`${browser.name} CONTACT enabled`);
              await browser.evaluate(`document.querySelector('[data-mv1-kind="CONTACT"]')?.click()`);
              await browser.waitForSelector('[data-mv1-for="CONTACT"][data-mv1-field="targetId"]',30000);
              const selected=await browser.evaluate(`(()=>{const e=document.querySelector('[data-mv1-for="CONTACT"][data-mv1-field="targetId"]');if(!e||e.disabled)return "";const values=Array.from(e.options).filter(o=>!o.disabled&&o.value).map(o=>o.value);const wanted=${JSON.stringify(target)};e.value=values.includes(wanted)?wanted:(values[0]||"");e.dispatchEvent(new Event("change",{bubbles:true}));return e.value})()`);
              assert.equal(selected,target,`${browser.name} must select its cyclic target through CONTACT`);
              await browser.waitForSelector('[data-mv1-for="CONTACT"][data-mv1-field="rawText"]',30000);
              const text=`Coordinate a bounded synchronized action with the selected counterpart.`;
              await browser.evaluate(`(()=>{const e=document.querySelector('[data-mv1-for="CONTACT"][data-mv1-field="rawText"]');if(!e||e.disabled)return false;const set=Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,"value")?.set;set?set.call(e,${JSON.stringify(text)}):e.value=${JSON.stringify(text)};e.dispatchEvent(new Event("input",{bubbles:true}));return true})()`);
              await browser.waitFor(()=>browser.evaluate(`Boolean(document.querySelector('[data-mv1-preview]:not([disabled]))')`),30000,`${browser.name} preview enabled`);
              await browser.evaluate(`document.querySelector('[data-mv1-preview]:not([disabled])')?.click()`);
              await browser.waitFor(()=>browser.evaluate(`Boolean(document.querySelector('[data-mv1-confirm]:not([disabled]))')||Boolean(document.querySelector('[role="alert"]'))`),90000,`${browser.name} preview response`);
              const preview=await browser.evaluate(`(()=>({ok:Boolean(document.querySelector('[data-mv1-confirm]:not([disabled])')),error:document.querySelector('[role="alert"]')?.textContent||""}))()`);
              assert.equal(preview.ok,true,`${browser.name} preview must be confirmable: ${preview.error}`);
              await browser.evaluate(`document.querySelector('[data-mv1-confirm]:not([disabled])')?.click()`);
              await waitFor(async()=>{const x=await apiJson(users[index].token,`/v4/rooms/${encodeURIComponent(runId)}/b0/window`,{method:"GET"});return ["CONFIRMED","LOCKED"].includes(x.plan?.status)||x.window?.status!=="OPEN"},90000,`${browser.name} confirmation persisted`);
              if(options.duplicateConfirm&&index===0){const x=await apiJson(users[index].token,`/v4/rooms/${encodeURIComponent(runId)}/b0/window`,{method:"GET"});const revision=Number(x.plan?.revision);assert(Number.isInteger(revision)&&revision>0);const replay=await apiJson(users[index].token,`/v4/rooms/${encodeURIComponent(runId)}/b0/window/confirm`,{method:"POST",body:{expectedRevision:revision}});assert.equal(replay.plan?.status,"CONFIRMED")}
              await browser.waitFor(()=>browser.evaluate(`Boolean(document.querySelector('[data-b0-ready]:not([disabled]))')`),60000,`${browser.name} ready enabled`);
              await browser.evaluate(`document.querySelector('[data-b0-ready]:not([disabled])')?.click()`);
              await waitFor(async()=>{const x=await apiJson(users[index].token,`/v4/rooms/${encodeURIComponent(runId)}/b0/window`,{method:"GET"});return x.actor?.ready===true||x.window?.status!=="OPEN"},90000,`${browser.name} ready persisted`);
            }
          }

          '''.replace('          ','')
          anchor='async function submitCyclicPlans(\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,helper+anchor,1)
          net='        assert(report.network.some((entry: any) => entry.url.includes("/b0/window") && entry.status >= 200 && entry.status < 300), `${report.name} must observe successful real B0 network traffic`);\n'
          assert s.count(net)==1
          s=s.replace(net,net+'        for (const suffix of ["/b0/window/preview", "/b0/window/confirm", "/b0/window/ready"]) assert(report.network.some((entry: any) => entry.method === "POST" && entry.url.endsWith(suffix) && entry.status >= 200 && entry.status < 300), `${report.name} must drive ${suffix} through the real browser`);\n',1)
          p.write_text(s)
          PY
          git diff --check
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance
          pnpm --filter @apps/web typecheck
          pnpm --filter @apps/web test:b0-window
          pnpm --filter @apps/web test
          pnpm --filter @apps/api typecheck
          pnpm --filter @apps/api test:b0-window
          pnpm --filter @apps/api test:b0-player-window
          pnpm --filter @apps/api test:b0-pipeline
          pnpm --filter @apps/api test:b0-ops

      - name: Build exact runtime binaries
        run: |
          pnpm --filter @ai-story/shared build
          pnpm --filter @ai-story/templates build
          pnpm --filter @apps/api build
          pnpm --filter @apps/openovel-runtime build
          pnpm --filter @apps/web build

      - name: Start isolated Supabase PostgreSQL
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh prepare-database
      - name: Start real local Ollama
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh prepare-provider
      - name: Execute real three-browser six-window acceptance
        env: {CHROME_PATH: /usr/bin/google-chrome}
        run: pnpm test:b0:real-acceptance
      - name: Prove provider traffic
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh provider-proof
      - name: Clean isolated infrastructure
        if: always()
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh cleanup || true
      - name: Redact evidence
        if: always()
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh redact || true
      - name: Finalize evidence
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh finalize
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "b0-stage11-real-browser-v2-${{ github.sha }}", path: "${{ env.B0_EVIDENCE_ROOT }}", if-no-files-found: warn, retention-days: 14}

      - name: Commit verified repair as ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/acceptance/b0-candidate-real-flow.ts
          git rm .github/workflows/b0-stage11-browser-window-driver.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | LC_ALL=C sort | tr '\n' ' ')" = ".github/workflows/b0-stage11-browser-window-driver.yml scripts/acceptance/b0-candidate-real-flow.ts "
          git commit -m "test(b0): drive all synchronized windows through real browsers"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env: {JOB_STATUS: "${{ job.status }}"}
        with:
          script: |
            const ok=process.env.JOB_STATUS==="success"; await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:ok?"success":"failure",context:"b0/stage11-real-browser-v2",description:`real browser six-window repair ${ok?"passed":"failed"} in ${context.runId}`,target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`}); if(!ok) core.setFailed("real browser six-window repair failed");
