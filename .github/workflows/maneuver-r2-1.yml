name: Maneuver R2-1 shell executor

on:
  push:
    branches:
      - feat/mvp-four-maneuver-actions
    paths:
      - ".github/workflows/maneuver-r2-1.yml"
      - "scripts/automation/r2-1-chunks/**"

permissions:
  contents: write

concurrency:
  group: maneuver-r2-1-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement-r2-1:
    if: startsWith(github.event.head_commit.message, 'ci(maneuver): run shell-only R2-1')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/mvp-four-maneuver-actions
    steps:
      - name: Bootstrap repository without external Actions
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .git ]; then git init .; fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH_HEADER}"
          git fetch --no-tags --prune --depth=100 origin "$TARGET_SHA"
          git checkout --force --detach FETCH_HEAD
          git config user.name "ChatGPT Pro R2-1"
          git config user.email "actions@users.noreply.github.com"
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          node --version
          pnpm --version
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Implement, test, and publish R2-1
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          expected = '55952a74b32d0ef59fdcc1f4a70af2f856f5e7f6'
          chunk_root = Path('scripts/automation/r2-1-chunks')
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in sorted(chunk_root.glob('*.txt')))
          source = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          source = source.replace(
              "subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=ROOT, text=True).strip()",
              "subprocess.check_output(['git', 'merge-base', 'HEAD', expected], cwd=ROOT, text=True).strip()",
              1,
          )
          source = source.replace(
              "    # Remove temporary execution scaffolding from the final stage commit.\n",
              "    # Remove temporary execution scaffolding from the final stage commit.\n    import shutil\n    subprocess.run(['git', 'checkout', expected, '--', '.github/workflows/causal-mvp.yml'], cwd=ROOT, check=True)\n    shutil.rmtree(ROOT / 'scripts/automation/r2-1-chunks', ignore_errors=True)\n",
              1,
          )
          Path('/tmp/apply-maneuver-r2-1.py').write_text(source, encoding='utf-8')
          PY

          set +e
          python3 /tmp/apply-maneuver-r2-1.py 2>&1 | tee /tmp/r2-1-shell.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard "$TARGET_SHA"
            git checkout 55952a74b32d0ef59fdcc1f4a70af2f856f5e7f6 -- .github/workflows/causal-mvp.yml
            rm -f .github/workflows/maneuver-r2-1.yml
            rm -rf scripts/automation/r2-1-chunks
            mkdir -p docs/auto-execute/logs/maneuver-r2-1
            cp /tmp/r2-1-shell.log docs/auto-execute/logs/maneuver-r2-1/shell-attempt.log
            printf '{"status":"FAIL","executor":"shell-only","exitCode":%s,"baseSha":"55952a74b32d0ef59fdcc1f4a70af2f856f5e7f6"}\n' "$status" > docs/auto-execute/evidence/maneuver-r2-1-shell-failure.json
            git add -A
            git commit -m "test(maneuver): record R2-1 shell failure"
            git push origin "HEAD:${TARGET_BRANCH}"
            exit "$status"
          fi
