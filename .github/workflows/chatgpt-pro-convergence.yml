name: ChatGPT Pro Convergence

on:
  pull_request:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: chatgpt-pro-engineering-${{ github.event.pull_request.base.sha }}
  cancel-in-progress: false

jobs:
  engineering-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      CANDIDATE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_REF: codex/chatgpt-pro-ai-story-convergence
      FROZEN_BASE_SHA: 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c
      OPENOVEL_PROVIDER_BASE_URL: https://api.deepseek.com
      OPENOVEL_MODEL: deepseek-v4-pro
      OPENOVEL_NARRATOR_MODEL: deepseek-v4-pro
      OPENOVEL_REVIEWER_MODEL: deepseek-v4-pro
      OPENOVEL_OPTIONS_MODEL: deepseek-v4-pro
      OPENOVEL_STORYKEEPER_MODEL: deepseek-v4-pro
      OPENOVEL_DEEPSEEK_THINKING: disabled
    steps:
      - name: Check out exact candidate base SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove repository, branch, frozen base and clean tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engineering-evidence/logs engineering-evidence/assets
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "base_ref=${{ github.event.pull_request.base.ref }}"
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "checked_out=$(git rev-parse HEAD)"
            echo "merge_base=$(git merge-base HEAD ${FROZEN_BASE_SHA})"
            echo "main_remote=$(git rev-parse origin/main)"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee engineering-evidence/logs/00-boundary.log
          test "${GITHUB_REPOSITORY}" = "forwardFish/aiStoryRoom"
          test "${{ github.event.pull_request.base.ref }}" = "${CANDIDATE_REF}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git merge-base HEAD ${FROZEN_BASE_SHA})" = "${FROZEN_BASE_SHA}"
          test "$(git rev-parse origin/main)" = "${FROZEN_BASE_SHA}"
          test -z "$(git status --short)"
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - id: install
        name: Install locked dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee engineering-evidence/logs/01-install.log

      - id: typecheck
        name: OpenNovel runtime typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime typecheck 2>&1 | tee engineering-evidence/logs/02-openovel-typecheck.log

      - id: build
        name: OpenNovel runtime build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime build 2>&1 | tee engineering-evidence/logs/03-openovel-build.log

      - id: story_v4
        name: Complete Story V4 regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test:story:v4 2>&1 | tee engineering-evidence/logs/04-story-v4.log

      - id: http_smoke
        name: OpenNovel HTTP smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime smoke:http 2>&1 | tee engineering-evidence/logs/05-http-smoke.log

      - id: frozen_assets
        name: Recompile frozen Part One assets and compare bytes
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_SKIP_SOURCE_WRITES=1
          export SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_RUNTIME_PACKAGE_PATH="${RUNNER_TEMP}/part-one-runtime.json"
          node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee engineering-evidence/logs/06-frozen-assets.log
          sha256sum \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${RUNNER_TEMP}/part-one-runtime.json" \
            | tee engineering-evidence/logs/07-frozen-assets-sha256.log
          cmp --silent \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${RUNNER_TEMP}/part-one-runtime.json"
          cp "${RUNNER_TEMP}/part-one-runtime.json" engineering-evidence/assets/recompiled-part-one-runtime.json

      - id: supplement
        name: Compile P3 narrative supplement
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export SANGTIAN_NARRATIVE_SUPPLEMENT_PATH="${RUNNER_TEMP}/part-one-narrative-supplement.json"
          node scripts/story-decomposition/compile-sangtian-part-one-narrative-supplement.mjs \
            2>&1 | tee engineering-evidence/logs/08-narrative-supplement.log
          test -s "${SANGTIAN_NARRATIVE_SUPPLEMENT_PATH}"
          cp "${SANGTIAN_NARRATIVE_SUPPLEMENT_PATH}" engineering-evidence/assets/part-one-narrative-supplement.json
          sha256sum "${SANGTIAN_NARRATIVE_SUPPLEMENT_PATH}" \
            | tee engineering-evidence/logs/09-narrative-supplement-sha256.log

      - name: Record exact outcomes, commands and test counts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path('engineering-evidence')
          story = (root / 'logs/04-story-v4.log').read_text(encoding='utf-8', errors='replace') if (root / 'logs/04-story-v4.log').exists() else ''
          smoke = (root / 'logs/05-http-smoke.log').read_text(encoding='utf-8', errors='replace') if (root / 'logs/05-http-smoke.log').exists() else ''
          test_blocks = []
          for match in re.finditer(r'# tests (\d+)\s+# suites (\d+)\s+# pass (\d+)\s+# fail (\d+)\s+# cancelled (\d+)\s+# skipped (\d+)\s+# todo (\d+)', story):
              test_blocks.append({
                  'tests': int(match.group(1)),
                  'suites': int(match.group(2)),
                  'pass': int(match.group(3)),
                  'fail': int(match.group(4)),
                  'cancelled': int(match.group(5)),
                  'skipped': int(match.group(6)),
                  'todo': int(match.group(7)),
              })
          summary = {
              'schemaVersion': 'omw.chatgpt-pro-engineering-gates.v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'branch': os.environ['CANDIDATE_REF'],
              'candidateSha': os.environ['CANDIDATE_SHA'],
              'frozenBaseSha': os.environ['FROZEN_BASE_SHA'],
              'node': '22',
              'pnpm': '10.12.1',
              'modelConfiguration': {
                  'providerBaseUrl': os.environ['OPENOVEL_PROVIDER_BASE_URL'],
                  'model': os.environ['OPENOVEL_MODEL'],
                  'narratorModel': os.environ['OPENOVEL_NARRATOR_MODEL'],
                  'reviewerModel': os.environ['OPENOVEL_REVIEWER_MODEL'],
                  'optionsModel': os.environ['OPENOVEL_OPTIONS_MODEL'],
                  'storykeeperModel': os.environ['OPENOVEL_STORYKEEPER_MODEL'],
                  'thinking': os.environ['OPENOVEL_DEEPSEEK_THINKING'],
              },
              'commands': [
                  'pnpm install --frozen-lockfile',
                  'pnpm --filter @apps/openovel-runtime typecheck',
                  'pnpm --filter @apps/openovel-runtime build',
                  'pnpm test:story:v4',
                  'pnpm --filter @apps/openovel-runtime smoke:http',
                  'node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs',
                  'node scripts/story-decomposition/compile-sangtian-part-one-narrative-supplement.mjs',
              ],
              'outcomes': {
                  'install': '${{ steps.install.outcome }}',
                  'openovelTypecheck': '${{ steps.typecheck.outcome }}',
                  'openovelBuild': '${{ steps.build.outcome }}',
                  'storyV4': '${{ steps.story_v4.outcome }}',
                  'httpSmoke': '${{ steps.http_smoke.outcome }}',
                  'frozenAssetRecompile': '${{ steps.frozen_assets.outcome }}',
                  'narrativeSupplementCompile': '${{ steps.supplement.outcome }}',
              },
              'storyV4TapBlocks': test_blocks,
              'httpSmoke': {
                  'mode': 'deterministic fixture provider over real HTTP runtime path',
                  'mockOnly': True,
                  'reportDetected': 'openovel_http_g00_t03_smoke_v1' in smoke,
              },
              'realModel': False,
          }
          outcomes = summary['outcomes']
          summary['verdict'] = 'PASS' if all(value == 'success' for value in outcomes.values()) else 'FAIL'
          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          {
            echo "tested_sha=$(git rev-parse HEAD)"
            echo "main_remote=$(git rev-parse origin/main)"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee engineering-evidence/logs/99-final-boundary.log
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse origin/main)" = "${FROZEN_BASE_SHA}"
          test -z "$(git status --short)"
          sha256sum engineering-evidence/summary.json engineering-evidence/logs/*.log \
            > engineering-evidence/SHA256SUMS

      - name: Upload complete engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-gates-${{ env.CANDIDATE_SHA }}
          path: engineering-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce every engineering gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.story_v4.outcome }}" = "success"
          test "${{ steps.http_smoke.outcome }}" = "success"
          test "${{ steps.frozen_assets.outcome }}" = "success"
          test "${{ steps.supplement.outcome }}" = "success"
