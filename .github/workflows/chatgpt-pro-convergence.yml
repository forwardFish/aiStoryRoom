          replace_once(path, '''export const sangtianFactSettlementModule: FactSettlementModule = {''', '''const protectedPlayerResultEffectTypes = new Set([
            "ENTITY.INTRODUCED",
            "ENTITY.LOCATED_AT",
            "ENTITY.HELD_BY",
            "ENTITY.STATE",
            "DOCUMENT.CREATED",
