name: ChatGPT Pro Convergence

on:
  push:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
  pull_request:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  engineering-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      CANDIDATE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      CANDIDATE_REF: codex/chatgpt-pro-ai-story-convergence
      OPENOVEL_PROVIDER_BASE_URL: https://api.deepseek.com
      OPENOVEL_MODEL: deepseek-v4-pro
      OPENOVEL_NARRATOR_MODEL: deepseek-v4-pro
      OPENOVEL_REVIEWER_MODEL: deepseek-v4-pro
      OPENOVEL_OPTIONS_MODEL: deepseek-v4-pro
      OPENOVEL_STORYKEEPER_MODEL: deepseek-v4-pro
      OPENOVEL_DEEPSEEK_THINKING: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove exact candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence/logs
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "candidate_ref=${CANDIDATE_REF}"
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "checked_out=$(git rev-parse HEAD)"
            echo "merge_base=$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)"
            echo "main_remote=$(git rev-parse origin/main)"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee candidate-evidence/logs/00-boundary.log
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)" = "1b750e56858dabefb0ddb8b922c6bdcbe0574e4c"
          test "$(git rev-parse origin/main)" = "1b750e56858dabefb0ddb8b922c6bdcbe0574e4c"
          test -z "$(git status --short)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee candidate-evidence/logs/01-install.log

      - id: typecheck
        name: OpenNovel typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime typecheck 2>&1 | tee candidate-evidence/logs/02-typecheck.log

      - id: build
        name: OpenNovel build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime build 2>&1 | tee candidate-evidence/logs/03-build.log

      - id: story_v4
        name: Story V4 tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test:story:v4 2>&1 | tee candidate-evidence/logs/04-story-v4.log

      - id: smoke
        name: OpenNovel HTTP smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime smoke:http 2>&1 | tee candidate-evidence/logs/05-http-smoke.log

      - id: assets
        name: Recompile Part One without source writes
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_SKIP_SOURCE_WRITES=1
          export SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_RUNTIME_PACKAGE_PATH="${RUNNER_TEMP}/part-one-runtime.json"
          node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee candidate-evidence/logs/06-assets.log
          sha256sum \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${RUNNER_TEMP}/part-one-runtime.json" \
            | tee candidate-evidence/logs/07-assets-sha256.log
          cmp --silent \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${RUNNER_TEMP}/part-one-runtime.json"

      - name: Record outcomes and package targeted source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "tested_sha=$(git rev-parse HEAD)"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "story_v4=${{ steps.story_v4.outcome }}"
            echo "http_smoke=${{ steps.smoke.outcome }}"
            echo "assets=${{ steps.assets.outcome }}"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee candidate-evidence/logs/99-outcomes.log
          git archive --format=tar.gz \
            --output=candidate-evidence/candidate-targeted-source.tar.gz \
            HEAD -- \
            AGENTS.md \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.base.json \
            apps/openovel-runtime \
            packages/templates/package.json \
            packages/templates/tsconfig.json \
            packages/templates/tsconfig.build.json \
            packages/templates/src \
            packages/templates/tests \
            packages/templates/authoring/sangtian \
            packages/templates/config/sangtian/story-package \
            scripts/story-decomposition \
            docs/Our_Many_Worlds_AI剧情推演一次性收敛现状审计与ChatGPT_Pro开发交接方案_v1.0.md

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-${{ env.CANDIDATE_SHA }}
          path: candidate-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce deterministic gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.story_v4.outcome }}" = "success"
          test "${{ steps.smoke.outcome }}" = "success"
          test "${{ steps.assets.outcome }}" = "success"
