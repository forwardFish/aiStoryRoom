            ]
              .map((value) => String(value || "").trim())
              .find((value) => value && value !== playerOutcome && value !== decisionStop)
              || playerVisibleFallback.WORLD_PRESSURE;
            const dramaticBeatPlan = compileDramaticBeatPlan({
              sceneRef: input.sceneAfter.sceneId,
              // The objective belongs to the scene after Settlement. Reusing the
              // decision prompt that led into this turn can reintroduce actors or key
              // object states from the scene that just ended.
              sceneObjective: input.nextDecisionPoint.prompt,
              presentActorRefs: input.sceneAfter.presentActorRefs,
              actorLabelsByRef,
              pressureActorRefs: input.nextDecisionPoint.actorRefs,
              actorPolicies,
              surfaceContract: {
                settledPlayerResult: playerOutcome,
                visiblePressure: playerVisibleFallback.WORLD_PRESSURE,
                visibleConsequence,
                dramaticQuestion: playerVisibleFallback.DECISION_STOP,
                stopCondition: playerVisibleFallback.DECISION_STOP,
                sourceBindings: unique([
                  ...sourceEventIds,
                  ...sourceEvidenceItems.flatMap((item) => item.sourceClaimIds)
                ]),
                adaptationBindings: unique(
                  adaptationEvidenceItems.flatMap((item) => item.adaptationDecisionIds)
                ),
                allowedCriticalChanges: unique(input.authoritativeObservableFacts),
                forbiddenCriticalChanges: unique(input.unresolvedFacts)
              }
            });''')

          # P4.3 — capability-level turns use the identical surface contract.
          path = "packages/templates/src/runtime-facade.ts"
          replace_once(path, '''  const dramaticBeatPlan = compileDramaticBeatPlan({
              sceneRef: scene.sceneId,
              sceneObjective: input.workingSet.section.dramaticPurpose,
              presentActorRefs: scene.presentActorRefs,
              actorLabelsByRef,
              pressureActorRefs: worldMove.actorRefs.length
                ? worldMove.actorRefs
                : input.workingSet.decisionPoint.actorRefs,
              actorPolicies,
              pressureMeaning: worldPressure,
              decisionStopMeaning: decisionStop,
            });''', '''  const dramaticBeatPlan = compileDramaticBeatPlan({
              sceneRef: scene.sceneId,
              sceneObjective: input.workingSet.section.dramaticPurpose,
              presentActorRefs: scene.presentActorRefs,
              actorLabelsByRef,
              pressureActorRefs: worldMove.actorRefs.length
                ? worldMove.actorRefs
                : input.workingSet.decisionPoint.actorRefs,
              actorPolicies,
              surfaceContract: {
                settledPlayerResult: playerOutcome,
                visiblePressure: worldPressure,
                visibleConsequence: capabilityFact,
                dramaticQuestion: decisionStop,
                stopCondition: decisionStop,
                sourceBindings: unique([eventId, worldMove.beatId]),
                adaptationBindings: [],
                allowedCriticalChanges: [],
                forbiddenCriticalChanges: [
                  "当前 Decision Kernel 必须保持开放。",
                  "不得新增或改变命令、证据、文书、秘密、承诺、资源或其他持久事实。",
                ],
              },
            });''')

          # P4.4 — fail closed when plan, tickets and assembly diverge.
          path = "apps/openovel-runtime/src/scene-expression.ts"
          replace_once(path, '''    noCrossSlotDuplicate: true;
              fallbackSurfaceValidated: true;
            };''', '''    noCrossSlotDuplicate: true;
              fallbackSurfaceValidated: true;
              dramaticPlanSurfaceAligned: true;
            };''')
          old_validate = '''function validateDramaticBeatPlan(
            plan: DramaticBeatPlan | undefined,
            afterScene: SceneSnapshot,
          ) {
            if (!plan) return;
            if (plan.schemaVersion !== "dramatic-beat-plan-v1"
              || !nonEmpty(plan.sceneRef)
              || plan.sceneRef !== afterScene.sceneId
              || !nonEmpty(plan.sceneObjective)
              || !Array.isArray(plan.steps)
              || plan.steps.length < 2) {
              throw new Error("DRAMATIC_BEAT_PLAN_INVALID");
            }
            const presentActorIds = new Set(afterScene.presentActorIds);
            for (const step of plan.steps) {
              if (!nonEmpty(step.stepId)
                || !nonEmpty(step.requiredMeaning)
                || step.durableMutationAllowed !== false
                || step.actorRefs.some((actorRef) => !presentActorIds.has(actorRef))) {
                throw new Error(`DRAMATIC_BEAT_STEP_INVALID:${step.stepId || "unknown"}`);
              }
            }
            if (plan.steps.at(-1)?.kind !== "DECISION_PRESSURE") {
              throw new Error("DRAMATIC_BEAT_STOP_MISSING");
            }
          }'''
          new_validate = '''function validateDramaticBeatPlan(
            plan: DramaticBeatPlan | undefined,
            afterScene: SceneSnapshot,
          ) {
            if (!plan) return;
            const surface = plan.surfaceContract;
            if (plan.schemaVersion !== "dramatic-beat-plan-v1"
              || !nonEmpty(plan.sceneRef)
              || plan.sceneRef !== afterScene.sceneId
              || !nonEmpty(plan.sceneObjective)
              || !surface
              || !nonEmpty(surface.settledPlayerResult)
              || !nonEmpty(surface.visiblePressure)
              || !nonEmpty(surface.visibleConsequence)
              || !nonEmpty(surface.dramaticQuestion)
              || !nonEmpty(surface.stopCondition)
              || normalize(surface.dramaticQuestion) !== normalize(surface.stopCondition)
              || !Array.isArray(surface.sourceBindings)
              || !surface.sourceBindings.length
              || surface.sourceBindings.some((value) => !nonEmpty(value))
              || !Array.isArray(surface.adaptationBindings)
              || surface.adaptationBindings.some((value) => !nonEmpty(value))
              || !Array.isArray(surface.allowedCriticalChanges)
              || surface.allowedCriticalChanges.some((value) => !nonEmpty(value))
              || !Array.isArray(surface.forbiddenCriticalChanges)
