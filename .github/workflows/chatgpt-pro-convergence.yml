            }
            if (stop.length !== 1
              || plan.steps.at(-1) !== stop[0]
              || normalize(stop[0]!.requiredMeaning) !== normalize(surface.stopCondition)) {
              throw new Error("DRAMATIC_BEAT_STOP_MISSING");
            }
          }

          function validateDramaticBeatTicketAlignment(manifest: BeatManifest) {
            const surface = manifest.dramaticBeatPlan?.surfaceContract;
            if (!surface) return;
            const expectedBySlot = {
              PLAYER_RESULT: surface.settledPlayerResult,
              WORLD_PRESSURE: surface.visiblePressure,
              DECISION_STOP: surface.stopCondition,
            } as const;
            for (const [slot, expectedMeaning] of Object.entries(expectedBySlot)) {
              const tickets = manifest.tickets.filter((ticket) => (
                ticket.slot === slot && ticket.required
              ));
              if (tickets.length !== 1
                || normalize(tickets[0]!.requiredMeaning) !== normalize(expectedMeaning)) {
                throw new Error(`DRAMATIC_BEAT_SURFACE_TICKET_MISMATCH:${slot}`);
              }
            }
          }'''
          replace_once(path, old_validate, new_validate)
          replace_once(path, '''  if (manifest.transition.transitionRequired
              && !manifest.tickets.some((ticket) => ticket.slot === "SCENE_TRANSITION" && ticket.required)) {
              throw new Error("BEAT_MANIFEST_TRANSITION_TICKET_MISSING");
            }
            return manifest;''', '''  if (manifest.transition.transitionRequired
              && !manifest.tickets.some((ticket) => ticket.slot === "SCENE_TRANSITION" && ticket.required)) {
              throw new Error("BEAT_MANIFEST_TRANSITION_TICKET_MISSING");
            }
            if (manifest.dramaticBeatPlan
              && !manifest.tickets.some((ticket) => ticket.slot === "WORLD_PRESSURE" && ticket.required)) {
              throw new Error("BEAT_MANIFEST_WORLD_PRESSURE_TICKET_MISSING");
            }
            validateDramaticBeatTicketAlignment(manifest);
            return manifest;''')
          replace_once(path, '''        noCrossSlotDuplicate: true,
                  fallbackSurfaceValidated: true,
                },''', '''        noCrossSlotDuplicate: true,
                  fallbackSurfaceValidated: true,
                  dramaticPlanSurfaceAligned: true,
                },''')

          # P4.5 — expose only the slot-owned part of the unified surface to Narrator.
          path = "apps/openovel-runtime/src/foreground.ts"
          replace_once(path, '''        "Follow dramaticBeatPlan in order. It is the server-owned shape of this scene: dramatize its required meanings, use only its listed on-stage actors for causal moves, and stop at its final unresolved pressure.",''', '''        "Follow dramaticBeatPlan in order. It is the server-owned shape of this scene: dramatize its required meanings, use only its listed on-stage actors for causal moves, and stop at its final unresolved pressure.",
        "surfaceContract is the complete semantic boundary: render each Narrator-owned surface exactly once, show its visible consequence before the final question, and never restate a PROTECTED surface.",''')
          replace_once(path, '''  const protectedSet = new Set(protectedSlots);
            return {
              sceneObjective: plan.sceneObjective,
              activeActors: plan.activeActors.map((actor) => ({''', '''  const protectedSet = new Set(protectedSlots);
            const surface = plan.surfaceContract;
            const playerResultProtected = protectedSet.has("PLAYER_RESULT");
            const worldPressureProtected = protectedSet.has("WORLD_PRESSURE");
            const decisionStopProtected = protectedSet.has("DECISION_STOP");
            const sameMeaning = (left: string, right: string) => (
