name: ChatGPT Pro Convergence

on:
  pull_request:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: chatgpt-pro-p4-finalize
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: "${{ github.event.pull_request.title == 'ci(P4): finalize dramatic beat plan' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      TARGET_BRANCH: codex/chatgpt-pro-ai-story-convergence
      CANDIDATE_SHA: ${{ github.event.pull_request.base.sha }}
      FROZEN_BASE_SHA: 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c
      WORKFLOW_PATH: .github/workflows/chatgpt-pro-convergence.yml
      STAGED_P4_WORKFLOW_PATH: .github/workflows/chatgpt-pro-p4-finalize.yml
      STAGED_P4_PATCH_PATH: docs/auto-execute/.chatgpt-pro-p4-final.patch
      EVIDENCE_ROOT: ${{ runner.temp }}/p4-evidence
      OPENOVEL_PROVIDER_BASE_URL: https://api.deepseek.com
      OPENOVEL_MODEL: deepseek-v4-pro
      OPENOVEL_NARRATOR_MODEL: deepseek-v4-pro
      OPENOVEL_REVIEWER_MODEL: deepseek-v4-pro
      OPENOVEL_OPTIONS_MODEL: deepseek-v4-pro
      OPENOVEL_STORYKEEPER_MODEL: deepseek-v4-pro
      OPENOVEL_DEEPSEEK_THINKING: disabled

    steps:
      - name: Check out exact candidate base SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove repository, branch and frozen main boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "base_ref=${{ github.event.pull_request.base.ref }}"
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "checked_out=$(git rev-parse HEAD)"
            echo "merge_base=$(git merge-base HEAD ${FROZEN_BASE_SHA})"
            echo "main_remote=$(git rev-parse origin/main)"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee "${EVIDENCE_ROOT}/logs/00-boundary.log"
          test "${GITHUB_REPOSITORY}" = "forwardFish/aiStoryRoom"
          test "${{ github.event.pull_request.base.ref }}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git merge-base HEAD ${FROZEN_BASE_SHA})" = "${FROZEN_BASE_SHA}"
          test "$(git rev-parse origin/main)" = "${FROZEN_BASE_SHA}"
          test -z "$(git status --short)"

      - name: Apply exact P4 source and regression changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"P4_REPLACEMENT_PRECONDITION_FAILED:{path}:{count}:{old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # P4.1 — one world-agnostic semantic surface contract.
          path = "packages/templates/src/story-package/dramatic-beat-plan.ts"
          replace_once(path, '''    | "COUNTERMOVE"
              | "REACTION_WINDOW"
              | "DECISION_PRESSURE";''', '''    | "COUNTERMOVE"
              | "REACTION_WINDOW"
              | "VISIBLE_CONSEQUENCE"
              | "DECISION_PRESSURE";''')
          replace_once(path, '''/**
           * A world-agnostic bridge between fact settlement and literary expression.
           * It decides the dramatic order without using keywords from any story world.
           */
          export type DramaticBeatPlan = {''', '''export type DramaticBeatSurfaceContract = {
            /** The already-settled meaning that must be visible exactly once. */
            settledPlayerResult: string;
            /** The NPC/world move that puts pressure on stage. */
            visiblePressure: string;
            /** The concrete change the reader can perceive before choosing again. */
            visibleConsequence: string;
            /** The unresolved dramatic question at the end of the scene. */
            dramaticQuestion: string;
            /** The exact semantic boundary where prose must stop. */
            stopCondition: string;
            /** Stable server-owned bindings; these remain backstage. */
            sourceBindings: string[];
            adaptationBindings: string[];
            /** Closed critical-change boundary for both Narrator and fallback. */
            allowedCriticalChanges: string[];
            forbiddenCriticalChanges: string[];
          };

          /**
           * A world-agnostic bridge between fact settlement and literary expression.
           * It decides the dramatic order without using keywords from any story world.
           */
          export type DramaticBeatPlan = {''')
          replace_once(path, '''  sceneRef: string;
            sceneObjective: string;
            activeActors: DramaticBeatActor[];''', '''  sceneRef: string;
            sceneObjective: string;
            surfaceContract: DramaticBeatSurfaceContract;
            activeActors: DramaticBeatActor[];''')
          replace_once(path, '''  pressureActorRefs: string[];
            actorPolicies: DramaticBeatPolicyInput[];
            pressureMeaning: string;
            decisionStopMeaning: string;
          };''', '''  pressureActorRefs: string[];
            actorPolicies: DramaticBeatPolicyInput[];
            surfaceContract: DramaticBeatSurfaceContract;
          };''')
          replace_once(path, '''  const sceneRef = required(input.sceneRef, "DRAMATIC_BEAT_SCENE_MISSING");
            const sceneObjective = required(input.sceneObjective, "DRAMATIC_BEAT_OBJECTIVE_MISSING");
            const pressureMeaning = required(input.pressureMeaning, "DRAMATIC_BEAT_PRESSURE_MISSING");
            const decisionStopMeaning = required(input.decisionStopMeaning, "DRAMATIC_BEAT_STOP_MISSING");
            const presentActorRefs = unique(input.presentActorRefs.map(clean).filter(Boolean));''', '''  const sceneRef = required(input.sceneRef, "DRAMATIC_BEAT_SCENE_MISSING");
            const sceneObjective = required(input.sceneObjective, "DRAMATIC_BEAT_OBJECTIVE_MISSING");
            const surfaceContract: DramaticBeatSurfaceContract = {
              settledPlayerResult: required(
                input.surfaceContract?.settledPlayerResult,
                "DRAMATIC_BEAT_PLAYER_RESULT_MISSING",
              ),
              visiblePressure: required(
                input.surfaceContract?.visiblePressure,
                "DRAMATIC_BEAT_PRESSURE_MISSING",
              ),
              visibleConsequence: required(
                input.surfaceContract?.visibleConsequence,
                "DRAMATIC_BEAT_VISIBLE_CONSEQUENCE_MISSING",
              ),
              dramaticQuestion: required(
                input.surfaceContract?.dramaticQuestion,
                "DRAMATIC_BEAT_QUESTION_MISSING",
              ),
              stopCondition: required(
                input.surfaceContract?.stopCondition,
                "DRAMATIC_BEAT_STOP_MISSING",
              ),
              sourceBindings: unique(
                (input.surfaceContract?.sourceBindings || []).map(clean).filter(Boolean),
              ),
              adaptationBindings: unique(
                (input.surfaceContract?.adaptationBindings || []).map(clean).filter(Boolean),
              ),
              allowedCriticalChanges: unique(
                (input.surfaceContract?.allowedCriticalChanges || []).map(clean).filter(Boolean),
              ),
              forbiddenCriticalChanges: unique(
                (input.surfaceContract?.forbiddenCriticalChanges || []).map(clean).filter(Boolean),
