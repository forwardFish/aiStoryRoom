            }
            if (!surfaceContract.sourceBindings.length) {
              throw new Error("DRAMATIC_BEAT_SOURCE_BINDINGS_MISSING");
            }
            if (!surfaceContract.forbiddenCriticalChanges.length) {
              throw new Error("DRAMATIC_BEAT_CRITICAL_BOUNDARY_MISSING");
            }
            const pressureMeaning = surfaceContract.visiblePressure;
