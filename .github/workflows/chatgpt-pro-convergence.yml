name: ChatGPT Pro Convergence

on:
  pull_request:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: chatgpt-pro-p3-finalizer-${{ github.event.pull_request.base.sha }}
  cancel-in-progress: false

jobs:
  p3-finalizer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      CANDIDATE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_REF: codex/chatgpt-pro-ai-story-convergence
      FROZEN_BASE_SHA: 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c
      PAYLOAD_PREFIX: docs/auto-execute/.chatgpt-pro-p3-final-stage.tar.gz.b64.part-
      PAYLOAD_B64_SHA256: c2043133ca4d06da76c43ab7f3c88213865ee7d70f8e2d61c831d66edd751755
      PAYLOAD_SHA256: 6c26a75c277baf21ba73dfb7ee0d405eb9393cdcd8181f283d6eb85fb2225fec
      OPENOVEL_PROVIDER_BASE_URL: https://api.deepseek.com
      OPENOVEL_MODEL: deepseek-v4-pro
      OPENOVEL_NARRATOR_MODEL: deepseek-v4-pro
      OPENOVEL_REVIEWER_MODEL: deepseek-v4-pro
      OPENOVEL_OPTIONS_MODEL: deepseek-v4-pro
      OPENOVEL_STORYKEEPER_MODEL: deepseek-v4-pro
      OPENOVEL_DEEPSEEK_THINKING: disabled
    steps:
      - name: Check out exact candidate stage SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove repository, branch, frozen base and stage commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p3-evidence/logs p3-evidence/assets
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "base_ref=${{ github.event.pull_request.base.ref }}"
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "checked_out=$(git rev-parse HEAD)"
            echo "subject=$(git log -1 --format=%s)"
            echo "merge_base=$(git merge-base HEAD ${FROZEN_BASE_SHA})"
            echo "main_remote=$(git rev-parse origin/main)"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee p3-evidence/logs/00-boundary.log
          test "${GITHUB_REPOSITORY}" = "forwardFish/aiStoryRoom"
          test "${{ github.event.pull_request.base.ref }}" = "${CANDIDATE_REF}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git log -1 --format=%s)" = "ci(P3): execute verified stage finalizer"
          test "$(git merge-base HEAD ${FROZEN_BASE_SHA})" = "${FROZEN_BASE_SHA}"
          test "$(git rev-parse origin/main)" = "${FROZEN_BASE_SHA}"
          test -z "$(git status --short)"

      - name: Reconstruct, verify and normalize the seven-file P3 payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(printf '%s\n' ${PAYLOAD_PREFIX}* | sort)
          test "${#parts[@]}" -eq 8
          payload_b64="${RUNNER_TEMP}/p3.tar.gz.b64"
          payload="${RUNNER_TEMP}/p3.tar.gz"
          cat "${parts[@]}" > "${payload_b64}"
          echo "${PAYLOAD_B64_SHA256}  ${payload_b64}" | sha256sum --check --strict
          base64 --decode "${payload_b64}" > "${payload}"
          echo "${PAYLOAD_SHA256}  ${payload}" | sha256sum --check --strict
          mapfile -t actual_paths < <(tar -tzf "${payload}" | sed '/^$/d' | sed '/\/$/d' | sort)
          expected_paths=(
            packages/templates/authoring/sangtian/narrative/scene-patterns.section-02.approved.json
            packages/templates/authoring/sangtian/narrative/scene-patterns.section-03.approved.json
            packages/templates/authoring/sangtian/narrative/scene-patterns.section-04.approved.json
            packages/templates/authoring/sangtian/narrative/source-scenes.supplemental.approved.json
            packages/templates/src/story-package/playable-part-one-runtime.ts
            packages/templates/tests/part-one-narrative-supplement.test.ts
            scripts/story-decomposition/compile-sangtian-part-one-narrative-supplement.mjs
          )
          mapfile -t expected_paths < <(printf '%s\n' "${expected_paths[@]}" | sort)
          test "$(printf '%s\n' "${actual_paths[@]}")" = "$(printf '%s\n' "${expected_paths[@]}")"
          tar -xzf "${payload}" -C .

          python - <<'PY'
          import json
          from pathlib import Path

          section_path = Path('packages/templates/authoring/sangtian/narrative/scene-patterns.section-03.approved.json')
          section = json.loads(section_path.read_text(encoding='utf-8'))
          for pattern in section['patterns']:
              if pattern['patternId'] == 'NSP-P1-MERCHANT-LEDGER-PRIVATE-BARGAIN':
                  pattern['requirementIds'] = [
                      item for item in pattern['requirementIds']
                      if item != 'REQ-P1-KNOWLEDGE-CHAIN'
                  ]
          section_path.write_text(json.dumps(section, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          source_path = Path('packages/templates/authoring/sangtian/narrative/source-scenes.supplemental.approved.json')
          source_set = json.loads(source_path.read_text(encoding='utf-8'))
          for scene in source_set['scenes']:
              if scene['sourceSceneId'] == 'DM1566-C07-MERCHANT-LEDGER-PRIVATE-BARGAIN':
                  scene['requirementIds'] = [
                      item for item in scene['requirementIds']
                      if item != 'REQ-P1-KNOWLEDGE-CHAIN'
                  ]
          source_path.write_text(json.dumps(source_set, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = Path('packages/templates/tests/part-one-narrative-supplement.test.ts')
          text = test_path.read_text(encoding='utf-8')
          old = '    assert.ok(scene.adaptationDecisionIds.length >= 1);'
          new = '''    assert.ok(scene.adaptationDecisionIds.every((adaptationId) => (
              pkg.approvedAdaptations.some((entry) => (
                entry.adaptationDecisionId === adaptationId
                && entry.reviewStatus === "APPROVED"
              ))
            )));'''
          if old in text:
              text = text.replace(old, new)
          if 'entry.reviewStatus === "APPROVED"' not in text:
              raise SystemExit('P3_ADAPTATION_ASSERTION_NORMALIZATION_FAILED')
          test_path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Audit all P3 SourceScene, Claim, SourceRef and Kernel bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee p3-evidence/source-bindings.json
          import json
          from pathlib import Path

          root = Path('.')
          runtime = json.loads((root / 'packages/templates/config/sangtian/story-package/part-one-runtime.json').read_text(encoding='utf-8'))
          sections = {row['sectionId']: row for row in runtime['sections']}
          scenes = {}
          for asset in runtime['assets']:
              if asset['assetType'] != 'SOURCE_SCENE_EVIDENCE':
                  continue
              payload = asset['payload']
              scenes[payload['sourceSceneId']] = {
                  'claims': set(asset['sourceClaimIds']),
                  'sourceId': payload['sourceId'],
                  'sourceSha256': payload['sourceSha256'],
                  'sourceRange': payload['sourceRange'],
                  'origin': 'FROZEN_RUNTIME',
              }
          supplemental = json.loads((root / 'packages/templates/authoring/sangtian/narrative/source-scenes.supplemental.approved.json').read_text(encoding='utf-8'))
          assert supplemental['schemaVersion'] == 'narrative-source-scene-supplement-v1'
          assert supplemental['worldId'] == 'sangtian'
          assert supplemental['partId'] == 'PART-01'
          assert supplemental['reviewStatus'] == 'APPROVED'
          assert len(supplemental['scenes']) == 6
          for scene in supplemental['scenes']:
              scene_id = scene['sourceSceneId']
              assert scene_id not in scenes, scene_id
              assert scene['verbatimPolicy'] == 'MECHANISM_ONLY_NO_VERBATIM_REUSE'
              assert scene['sourceClaimIds']
              assert len(scene['sourceRefs']) == 1
              ref = scene['sourceRefs'][0]
              scenes[scene_id] = {
                  'claims': set(scene['sourceClaimIds']),
                  'sourceId': ref['sourceId'],
                  'sourceSha256': ref['sourceSha256'],
                  'sourceRange': ref,
                  'origin': 'APPROVED_SUPPLEMENT',
              }
          required = {
              kernel_id
              for section_id in ('SEC-P1-02', 'SEC-P1-03', 'SEC-P1-04')
              for kernel_id in sections[section_id]['activeDecisionKernelIds']
          }
          covered = set()
          audited = []
          for number in (2, 3, 4):
              value = json.loads((root / f'packages/templates/authoring/sangtian/narrative/scene-patterns.section-{number:02d}.approved.json').read_text(encoding='utf-8'))
              for pattern in value['patterns']:
                  scene_id = pattern['sourceSceneId']
                  assert scene_id in scenes, (pattern['patternId'], scene_id)
                  scene = scenes[scene_id]
                  missing_claims = set(pattern['sourceClaimIds']) - scene['claims']
                  assert not missing_claims, (pattern['patternId'], sorted(missing_claims))
                  source_range = scene['sourceRange']
                  assert any(
                      ref['sourceId'] == scene['sourceId']
                      and ref['sourceSha256'] == scene['sourceSha256']
                      and ref['chapterId'] == source_range['chapterId']
                      and ref['paragraphStartId'] == source_range['paragraphStartId']
                      and ref['paragraphEndId'] == source_range['paragraphEndId']
                      and ref['textSpanSha256'] == source_range['textSpanSha256']
                      for ref in pattern['sourceRefs']
                  ), pattern['patternId']
                  covered.update(pattern['decisionKernelIds'])
                  audited.append({
                      'patternId': pattern['patternId'],
                      'sourceSceneId': scene_id,
                      'sourceOrigin': scene['origin'],
                      'sourceClaimCount': len(pattern['sourceClaimIds']),
                      'decisionKernelIds': pattern['decisionKernelIds'],
                  })
          assert len(audited) == 11, len(audited)
          assert covered == required, sorted(required - covered)
          print(json.dumps({
              'schemaVersion': 'omw.p3-source-binding-evidence.v1',
              'verdict': 'PASS',
              'candidateSha': '${{ env.CANDIDATE_SHA }}',
              'patternCount': len(audited),
              'sourceSceneCount': len(scenes),
              'supplementalSourceSceneCount': len(supplemental['scenes']),
              'coveredKernelCount': len(covered),
              'requiredKernelCount': len(required),
              'coveredDecisionKernelIds': sorted(covered),
              'patterns': audited,
          }, ensure_ascii=False, indent=2))
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee p3-evidence/logs/01-install.log

      - name: Run P3 and complete engineering gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-story/templates typecheck 2>&1 | tee p3-evidence/logs/02-templates-typecheck.log
          pnpm --filter @ai-story/templates test:story-package 2>&1 | tee p3-evidence/logs/03-story-package.log
          pnpm --filter @ai-story/templates build 2>&1 | tee p3-evidence/logs/04-templates-build.log
          pnpm --filter @apps/openovel-runtime typecheck 2>&1 | tee p3-evidence/logs/05-openovel-typecheck.log
          pnpm --filter @apps/openovel-runtime build 2>&1 | tee p3-evidence/logs/06-openovel-build.log
          pnpm test:story:v4 2>&1 | tee p3-evidence/logs/07-story-v4.log
          pnpm --filter @apps/openovel-runtime smoke:http 2>&1 | tee p3-evidence/logs/08-http-smoke.log

          mkdir -p "${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_SKIP_SOURCE_WRITES=1
          export SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_RUNTIME_PACKAGE_PATH="${RUNNER_TEMP}/part-one-runtime.json"
          node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs 2>&1 | tee p3-evidence/logs/09-frozen-assets.log
          cmp --silent packages/templates/config/sangtian/story-package/part-one-runtime.json "${RUNNER_TEMP}/part-one-runtime.json"
          sha256sum packages/templates/config/sangtian/story-package/part-one-runtime.json "${RUNNER_TEMP}/part-one-runtime.json" | tee p3-evidence/logs/10-frozen-assets-sha256.log

          export SANGTIAN_NARRATIVE_SUPPLEMENT_PATH="${RUNNER_TEMP}/part-one-narrative-supplement.json"
          node scripts/story-decomposition/compile-sangtian-part-one-narrative-supplement.mjs 2>&1 | tee p3-evidence/logs/11-narrative-supplement.log
          test -s "${SANGTIAN_NARRATIVE_SUPPLEMENT_PATH}"
          cp "${SANGTIAN_NARRATIVE_SUPPLEMENT_PATH}" p3-evidence/assets/part-one-narrative-supplement.json

      - name: Materialize durable P3 evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="docs/auto-execute/evidence/chatgpt-pro-ai-story-convergence/p3/${CANDIDATE_SHA}"
          mkdir -p "${evidence_dir}"
          cp p3-evidence/source-bindings.json "${evidence_dir}/source-bindings.json"
          cat > "${evidence_dir}/summary.json" <<EOF
          {
            "schemaVersion": "omw.chatgpt-pro-p3-stage.v1",
            "verdict": "PASS",
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${CANDIDATE_REF}",
            "stagingSha": "${CANDIDATE_SHA}",
            "frozenBaseSha": "${FROZEN_BASE_SHA}",
            "payloadTarGzSha256": "${PAYLOAD_SHA256}",
            "patternCount": 11,
            "supplementalSourceSceneCount": 6,
            "coveredDecisionKernelCount": 12,
            "tests": {
              "templatesTypecheck": "PASS",
              "storyPackage": "PASS",
              "templatesBuild": "PASS",
              "openovelTypecheck": "PASS",
              "openovelBuild": "PASS",
              "storyV4": "PASS",
              "httpSmoke": "PASS",
              "frozenAssetRecompile": "PASS",
              "narrativeSupplementCompile": "PASS"
            },
            "realModel": false
          }
          EOF
          sha256sum "${evidence_dir}/source-bindings.json" "${evidence_dir}/summary.json" > "${evidence_dir}/SHA256SUMS"

      - name: Upload complete P3 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-narrative-assets-${{ env.CANDIDATE_SHA }}
          path: p3-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Commit exactly one completed P3 stage and restore engineering workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f ${PAYLOAD_PREFIX}* docs/auto-execute/.chatgpt-pro-p3-final-stage.ready
          rm -f .github/workflows/chatgpt-pro-p3-finalize.yml .github/workflows/chatgpt-pro-p3-pr-finalize.yml
          git show "${CANDIDATE_SHA}^:.github/workflows/chatgpt-pro-convergence.yml" > .github/workflows/chatgpt-pro-convergence.yml
          git diff --check

          python - <<'PY'
          import subprocess
          allowed_exact = {
              '.github/workflows/chatgpt-pro-convergence.yml',
              '.github/workflows/chatgpt-pro-p3-finalize.yml',
              '.github/workflows/chatgpt-pro-p3-pr-finalize.yml',
              'docs/auto-execute/.chatgpt-pro-p3-final-stage.ready',
              *{f'docs/auto-execute/.chatgpt-pro-p3-final-stage.tar.gz.b64.part-{index:02d}' for index in range(8)},
              'packages/templates/authoring/sangtian/narrative/scene-patterns.section-02.approved.json',
              'packages/templates/authoring/sangtian/narrative/scene-patterns.section-03.approved.json',
              'packages/templates/authoring/sangtian/narrative/scene-patterns.section-04.approved.json',
              'packages/templates/authoring/sangtian/narrative/source-scenes.supplemental.approved.json',
              'packages/templates/src/story-package/playable-part-one-runtime.ts',
              'packages/templates/tests/part-one-narrative-supplement.test.ts',
              'scripts/story-decomposition/compile-sangtian-part-one-narrative-supplement.mjs',
          }
          allowed_prefix = 'docs/auto-execute/evidence/chatgpt-pro-ai-story-convergence/p3/'
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          unexpected = [row for row in rows if row[3:] not in allowed_exact and not row[3:].startswith(allowed_prefix)]
          if unexpected:
              raise SystemExit('UNEXPECTED_P3_WORKTREE_CHANGES\n' + '\n'.join(unexpected))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/chatgpt-pro-convergence.yml \
            .github/workflows/chatgpt-pro-p3-finalize.yml \
            .github/workflows/chatgpt-pro-p3-pr-finalize.yml \
            docs/auto-execute/.chatgpt-pro-p3-final-stage.ready \
            ${PAYLOAD_PREFIX}* \
            packages/templates/authoring/sangtian/narrative/scene-patterns.section-02.approved.json \
            packages/templates/authoring/sangtian/narrative/scene-patterns.section-03.approved.json \
            packages/templates/authoring/sangtian/narrative/scene-patterns.section-04.approved.json \
            packages/templates/authoring/sangtian/narrative/source-scenes.supplemental.approved.json \
            packages/templates/src/story-package/playable-part-one-runtime.ts \
            packages/templates/tests/part-one-narrative-supplement.test.ts \
            scripts/story-decomposition/compile-sangtian-part-one-narrative-supplement.mjs \
            docs/auto-execute/evidence/chatgpt-pro-ai-story-convergence/p3/${CANDIDATE_SHA}
          git commit -m "fix(P3): complete source-grounded narrative assets"
          git fetch origin "${CANDIDATE_REF}"
          test "$(git rev-parse FETCH_HEAD)" = "${CANDIDATE_SHA}"
          git push origin HEAD:"${CANDIDATE_REF}"
