    });
    const fallbackSlots = beatContract?.playerVisibleFallback;''')
          replace_once(path, '''          protectedText, playerSourceRefs, true, "PROTECTED", protectedText,''', '''          protectedText,
          playerSourceRefs,
          true,
          playerResultExpressionOwner,
