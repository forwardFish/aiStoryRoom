          replace_once(path, '''    const fallbackSlots = beatContract?.playerVisibleFallback;''', '''    const playerResultExpressionOwner = expressionOwnerForPlayerResult({
      durableEffectTypes: event.durableEffects.map((effect) => effect.type),
