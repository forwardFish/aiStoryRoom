name: ChatGPT Pro Convergence

on:
  push:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    paths-ignore:
      - docs/auto-execute/evidence/convergence/**

permissions:
  contents: write

jobs:
  engineering-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      CANDIDATE_SHA: ${{ github.sha }}
      CANDIDATE_REF: codex/chatgpt-pro-ai-story-convergence
      OPENOVEL_PROVIDER_BASE_URL: https://api.deepseek.com
      OPENOVEL_MODEL: deepseek-v4-pro
      OPENOVEL_NARRATOR_MODEL: deepseek-v4-pro
      OPENOVEL_REVIEWER_MODEL: deepseek-v4-pro
      OPENOVEL_OPTIONS_MODEL: deepseek-v4-pro
      OPENOVEL_STORYKEEPER_MODEL: deepseek-v4-pro
      OPENOVEL_DEEPSEEK_THINKING: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove exact candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence/logs
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "candidate_ref=${CANDIDATE_REF}"
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "checked_out=$(git rev-parse HEAD)"
            echo "merge_base=$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)"
            echo "main_remote=$(git rev-parse origin/main)"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee candidate-evidence/logs/00-boundary.log
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)" = "1b750e56858dabefb0ddb8b922c6bdcbe0574e4c"
          test "$(git rev-parse origin/main)" = "1b750e56858dabefb0ddb8b922c6bdcbe0574e4c"
          test -z "$(git status --short)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - id: install
        name: Install locked dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee candidate-evidence/logs/01-install.log

      - id: typecheck
        name: OpenNovel typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime typecheck 2>&1 | tee candidate-evidence/logs/02-typecheck.log

      - id: build
        name: OpenNovel build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime build 2>&1 | tee candidate-evidence/logs/03-build.log

      - id: story_v4
        name: Story V4 tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test:story:v4 2>&1 | tee candidate-evidence/logs/04-story-v4.log

      - id: smoke
        name: OpenNovel HTTP smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime smoke:http 2>&1 | tee candidate-evidence/logs/05-http-smoke.log

      - id: assets
        name: Recompile Part One without source writes
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_SKIP_SOURCE_WRITES=1
          export SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_RUNTIME_PACKAGE_PATH="${RUNNER_TEMP}/part-one-runtime.json"
          node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee candidate-evidence/logs/06-assets.log
          sha256sum \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${RUNNER_TEMP}/part-one-runtime.json" \
            | tee candidate-evidence/logs/07-assets-sha256.log
          cmp --silent \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${RUNNER_TEMP}/part-one-runtime.json"

      - name: Commit auditable gate evidence to the candidate branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="docs/auto-execute/evidence/convergence/${CANDIDATE_SHA}"
          mkdir -p "${evidence_dir}"
          cat > "${evidence_dir}/summary.json" <<EOF
          {
            "schemaVersion": "omw.ai-story-convergence-evidence.v1",
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${CANDIDATE_REF}",
            "testedSha": "${CANDIDATE_SHA}",
            "frozenBaseSha": "1b750e56858dabefb0ddb8b922c6bdcbe0574e4c",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowAttempt": "${GITHUB_RUN_ATTEMPT}",
            "provider": "https://api.deepseek.com",
            "model": "deepseek-v4-pro",
            "thinking": "disabled",
            "mockOnly": true,
            "outcomes": {
              "install": "${{ steps.install.outcome }}",
              "typecheck": "${{ steps.typecheck.outcome }}",
              "build": "${{ steps.build.outcome }}",
              "storyV4": "${{ steps.story_v4.outcome }}",
              "httpSmoke": "${{ steps.smoke.outcome }}",
              "assetRecompile": "${{ steps.assets.outcome }}"
            }
          }
          EOF
          for log in candidate-evidence/logs/*.log; do
            base=$(basename "$log")
            tail -n 300 "$log" > "${evidence_dir}/${base%.log}.tail.log"
          done
          {
            echo "tested_sha=${CANDIDATE_SHA}"
            echo "merge_base=$(git merge-base HEAD 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c)"
            grep -E '^# (tests|pass|fail|skipped|todo) ' candidate-evidence/logs/04-story-v4.log | tail -n 10 || true
            echo "asset_hashes"
            cat candidate-evidence/logs/07-assets-sha256.log || true
          } > "${evidence_dir}/gate-summary.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${evidence_dir}"
          git commit -m "test(ai-story): record convergence gates for ${CANDIDATE_SHA:0:12}"
          git fetch origin "${CANDIDATE_REF}"
          test "$(git rev-parse FETCH_HEAD)" = "${CANDIDATE_SHA}"
          git push origin HEAD:"${CANDIDATE_REF}"

      - name: Enforce deterministic gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.story_v4.outcome }}" = "success"
          test "${{ steps.smoke.outcome }}" = "success"
          test "${{ steps.assets.outcome }}" = "success"
