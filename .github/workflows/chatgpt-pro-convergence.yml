              ? "PROTECTED"
              : "NARRATOR";
          }

          export const sangtianFactSettlementModule: FactSettlementModule = {''')
          replace_once(path, '''  const event = prepared.settlement.event;
            const scene = phase === "ACTION_PHASE" ? event.sceneBefore : event.sceneAfter;''', '''  const event = prepared.settlement.event;
            const playerResultExpressionOwner = expressionOwnerForPlayerResult({
              durableEffectTypes: event.durableEffects.map((effect) => effect.type),
