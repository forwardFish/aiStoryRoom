            }
            const presentActorIds = new Set(afterScene.presentActorIds);
            const stepIds = new Set<string>();
            for (const actor of plan.activeActors) {
              if (!nonEmpty(actor.actorRef)
                || !nonEmpty(actor.displayName)
                || !presentActorIds.has(actor.actorRef)) {
                throw new Error(`DRAMATIC_BEAT_ACTOR_INVALID:${actor.actorRef || "unknown"}`);
              }
            }
            for (const step of plan.steps) {
              if (!nonEmpty(step.stepId)
                || stepIds.has(step.stepId)
                || !nonEmpty(step.requiredMeaning)
                || step.durableMutationAllowed !== false
                || step.actorRefs.some((actorRef) => !presentActorIds.has(actorRef))) {
                throw new Error(`DRAMATIC_BEAT_STEP_INVALID:${step.stepId || "unknown"}`);
              }
              stepIds.add(step.stepId);
            }
            const counter = plan.steps.filter((step) => step.kind === "COUNTERMOVE");
            const consequence = plan.steps.filter((step) => step.kind === "VISIBLE_CONSEQUENCE");
            const stop = plan.steps.filter((step) => step.kind === "DECISION_PRESSURE");
            if (counter.length !== 1
              || normalize(counter[0]!.requiredMeaning) !== normalize(surface.visiblePressure)) {
