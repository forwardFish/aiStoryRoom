            return {
              sceneObjective: plan.sceneObjective,
              surfaceContract: {
                playerResultExpressionOwner: playerResultProtected ? "PROTECTED" : "NARRATOR",
                settledPlayerResult: playerResultProtected ? null : surface.settledPlayerResult,
                worldPressureExpressionOwner: worldPressureProtected ? "PROTECTED" : "NARRATOR",
                visiblePressure: worldPressureProtected ? null : surface.visiblePressure,
