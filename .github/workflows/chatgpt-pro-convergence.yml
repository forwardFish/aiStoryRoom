      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked workspace
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "${EVIDENCE_ROOT}/logs/02-install.log"

      - name: Run P4 contract and complete engineering gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-story/templates typecheck \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/03-templates-typecheck.log"
          pnpm --filter @ai-story/templates test:story-package \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/04-story-package.log"
          pnpm --filter @ai-story/templates build \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/05-templates-build.log"
          pnpm --filter @apps/openovel-runtime typecheck \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/06-openovel-typecheck.log"
          pnpm --filter @apps/openovel-runtime test \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/07-openovel-tests.log"
          pnpm --filter @apps/openovel-runtime build \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/08-openovel-build.log"
          pnpm test:story:v4 \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/09-story-v4.log"
          pnpm --filter @apps/openovel-runtime smoke:http \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/10-http-smoke.log"

          tmp_root="${RUNNER_TEMP}/sangtian-authoring"
          mkdir -p "${tmp_root}"
          export SANGTIAN_SKIP_SOURCE_WRITES=1
          export SANGTIAN_AUTHORING_OUTPUT_ROOT="${tmp_root}/authoring"
          export SANGTIAN_RUNTIME_PACKAGE_PATH="${tmp_root}/part-one-runtime.json"
          node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/11-authoring-recompile.log"
          cmp --silent \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${tmp_root}/part-one-runtime.json"
          sha256sum \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${tmp_root}/part-one-runtime.json" \
            | tee "${EVIDENCE_ROOT}/logs/12-authoring-sha256.log"

          export SANGTIAN_NARRATIVE_SUPPLEMENT_PATH="${tmp_root}/part-one-narrative-supplement.json"
          node scripts/story-decomposition/compile-sangtian-part-one-narrative-supplement.mjs \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/13-supplement.log"
          test -s "${SANGTIAN_NARRATIVE_SUPPLEMENT_PATH}"

      - name: Materialize P4 stage evidence
        shell: bash
        run: |
          set -euo pipefail
          target="docs/auto-execute/evidence/chatgpt-pro-ai-story-convergence/p4/${CANDIDATE_SHA}"
          mkdir -p "${target}"
          export TARGET="${target}"
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          logs = Path(os.environ["EVIDENCE_ROOT"]) / "logs"
          def tap(name):
              text = (logs / name).read_text(encoding="utf-8", errors="replace")
              matches = list(re.finditer(
                  r"# tests (\d+)\s+# suites (\d+)\s+# pass (\d+)\s+# fail (\d+)\s+"
                  r"# cancelled (\d+)\s+# skipped (\d+)\s+# todo (\d+)",
                  text,
              ))
              return [
                  dict(zip(
                      ["tests", "suites", "pass", "fail", "cancelled", "skipped", "todo"],
                      map(int, match.groups()),
                  ))
                  for match in matches
              ]

          summary = {
              "schemaVersion": "omw.chatgpt-pro-p4-stage.v1",
              "verdict": "PASS",
              "repository": "forwardFish/aiStoryRoom",
              "branch": "codex/chatgpt-pro-ai-story-convergence",
              "stagingSha": os.environ["CANDIDATE_SHA"],
              "frozenBaseSha": os.environ["FROZEN_BASE_SHA"],
              "stage": "P4",
              "contracts": {
                  "unifiedDramaticBeatSurface": "PASS",
                  "settlementFactsOnly": "PASS",
                  "typedSingleExpressionOwner": "PASS",
                  "narratorOwnsRegularPlayerResult": "PASS",
                  "criticalProtectedSlotsRemainMinimal": "PASS",
                  "fallbackConsumesSameSurfaceContract": "PASS",
                  "visibleConsequenceBeforeDecisionStop": "PASS",
                  "ticketPlanAlignmentFailsClosed": "PASS",
                  "secondWorldFixture": "PASS",
              },
              "tests": {
                  "templatesTypecheck": "PASS",
                  "storyPackageTap": tap("04-story-package.log"),
                  "templatesBuild": "PASS",
                  "openNovelTypecheck": "PASS",
                  "openNovelTap": tap("07-openovel-tests.log"),
                  "openNovelBuild": "PASS",
                  "storyV4Tap": tap("09-story-v4.log"),
                  "httpSmoke": "PASS",
                  "immutableAuthoringRecompile": "PASS",
                  "narrativeSupplementCompile": "PASS",
              },
              "realModel": False,
              "nextStage": "P5",
          }
          target = Path(os.environ["TARGET"])
          target.joinpath("summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum "${target}/summary.json" > "${target}/SHA256SUMS"

      - name: Upload complete P4 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-dramatic-beat-plan-${{ env.CANDIDATE_SHA }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 7

      - name: Commit one completed P4 stage and push only candidate branch
        shell: bash
        run: |
          set -euo pipefail
          evidence_prefix="docs/auto-execute/evidence/chatgpt-pro-ai-story-convergence/p4/${CANDIDATE_SHA}"
          git checkout "${CANDIDATE_SHA}^" -- "${WORKFLOW_PATH}"
          rm -f "${STAGED_P4_WORKFLOW_PATH}" "${STAGED_P4_PATCH_PATH}"
          git diff --check
          python - <<'PY'
          import subprocess

          allowed_exact = {
              ".github/workflows/chatgpt-pro-convergence.yml",
              ".github/workflows/chatgpt-pro-p4-finalize.yml",
              "docs/auto-execute/.chatgpt-pro-p4-final.patch",
              "packages/templates/src/story-package/dramatic-beat-plan.ts",
              "packages/templates/src/story-package/part-one-runtime-engine.ts",
              "packages/templates/src/runtime-facade.ts",
              "packages/templates/tests/dramatic-beat-plan-pattern.test.ts",
              "packages/templates/tests/narrative-scene-pattern-multiworld.test.ts",
              "apps/openovel-runtime/src/scene-expression.ts",
              "apps/openovel-runtime/src/foreground.ts",
              "apps/openovel-runtime/src/sangtian-decisions.ts",
              "apps/openovel-runtime/tests/p04-scene-pattern-plan.spec.ts",
              "apps/openovel-runtime/tests/p04-runtime-integration.spec.ts",
          }
          allowed_prefix = "docs/auto-execute/evidence/chatgpt-pro-ai-story-convergence/p4/"
          rows = subprocess.check_output(["git", "status", "--short"], text=True).splitlines()
          unexpected = []
          for row in rows:
              path = row[3:]
              if path not in allowed_exact and not path.startswith(allowed_prefix):
                  unexpected.append(row)
          if unexpected:
              raise SystemExit("P4_UNEXPECTED_WORKTREE_FILES:\n" + "\n".join(unexpected))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "${WORKFLOW_PATH}" \
            packages/templates/src/story-package/dramatic-beat-plan.ts \
            packages/templates/src/story-package/part-one-runtime-engine.ts \
            packages/templates/src/runtime-facade.ts \
            packages/templates/tests/dramatic-beat-plan-pattern.test.ts \
            packages/templates/tests/narrative-scene-pattern-multiworld.test.ts \
            apps/openovel-runtime/src/scene-expression.ts \
            apps/openovel-runtime/src/foreground.ts \
            apps/openovel-runtime/src/sangtian-decisions.ts \
            apps/openovel-runtime/tests/p04-scene-pattern-plan.spec.ts \
            apps/openovel-runtime/tests/p04-runtime-integration.spec.ts \
            "${evidence_prefix}/summary.json" \
            "${evidence_prefix}/SHA256SUMS"
          git add -u \
            "${STAGED_P4_WORKFLOW_PATH}" \
            "${STAGED_P4_PATCH_PATH}"
          git commit -m "feat(P4): unify dramatic beat plan and expression ownership"

          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "${CANDIDATE_SHA}"
          git push origin HEAD:"${TARGET_BRANCH}"
