            const decisionStopMeaning = surfaceContract.stopCondition;
            const presentActorRefs = unique(input.presentActorRefs.map(clean).filter(Boolean));''')
          replace_once(path, '''    sceneRef,
              sceneObjective,
              activeActors,''', '''    sceneRef,
              sceneObjective,
              surfaceContract,
              activeActors,''')
          replace_once(path, '''      {
                stepId: "DECISION_PRESSURE",''', '''      {
                stepId: "VISIBLE_CONSEQUENCE",
                kind: "VISIBLE_CONSEQUENCE",
                actorRefs: presentActorRefs,
                actorLabels: labelsFor(presentActorRefs),
                requiredMeaning: visibleConsequence,
                actorGoals: goalsFor(presentActorRefs),
                expressionPolicy: "DRAMATIZE_REQUIRED_MEANING",
                durableMutationAllowed: false,
              },
              {
                stepId: "DECISION_PRESSURE",''')

          # P4.2 — compile the same surface from authoritative Part One settlement.
          path = "packages/templates/src/story-package/part-one-runtime-engine.ts"
          replace_once(path, '''  const playerVisibleFallback = {
              ...(input.playerVisibleFallback || {
                PLAYER_RESULT: playerOutcome,
                ...(transitionMove?.action
                  ? { SCENE_TRANSITION: transitionMove.action }
                  : {}),
                WORLD_PRESSURE: worldPressure
              }),
              DECISION_STOP: decisionStop
            };''', '''  const playerVisibleFallback = {
              ...(input.playerVisibleFallback || {
                PLAYER_RESULT: playerOutcome,
                ...(transitionMove?.action
                  ? { SCENE_TRANSITION: transitionMove.action }
                  : {}),
                WORLD_PRESSURE: worldPressure
              }),
              // Fallback and model prose consume one semantic plan. An authored
              // fallback may change literary wording in later slots, but it may
              // not carry a second version of the already-settled player result.
              PLAYER_RESULT: playerOutcome,
              DECISION_STOP: decisionStop
            };''')
          replace_once(path, '''  const dramaticBeatPlan = compileDramaticBeatPlan({
              sceneRef: input.sceneAfter.sceneId,
              // The objective belongs to the scene after Settlement. Reusing the
              // decision prompt that led into this turn can reintroduce actors or key
              // object states from the scene that just ended.
              sceneObjective: input.nextDecisionPoint.prompt,
              presentActorRefs: input.sceneAfter.presentActorRefs,
              actorLabelsByRef,
              pressureActorRefs: input.nextDecisionPoint.actorRefs,
              actorPolicies,
              pressureMeaning: playerVisibleFallback.WORLD_PRESSURE,
              decisionStopMeaning: playerVisibleFallback.DECISION_STOP
