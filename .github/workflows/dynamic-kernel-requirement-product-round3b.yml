name: Dynamic Kernel Requirement Dependency Product Round 3B

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-requirement-product-round3b.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EVIDENCE_ROOT: /tmp/dynamic-kernel-requirement-product-round3b
      SOURCE_COMMIT: 40908fd7583ea4006f328903d4b65c660670ad38
      BASE_PRODUCT_SHA: 321a9aa03ce33201a59da63350e385b885023d77
      BRANCH_NAME: codex/chatgpt-pro-dynamic-kernel-lite
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/requirement-dependency-product-r3b" \
            -f description="Testing tracked Requirement dependency product round 3B" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify clean product parent and install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          test "$(git branch --show-current)" = "${BRANCH_NAME}"
          git diff --quiet "${BASE_PRODUCT_SHA}..${GITHUB_SHA}^^"
          git status --short | tee "${EVIDENCE_ROOT}/logs/00-initial-status.log"
          test ! -s "${EVIDENCE_ROOT}/logs/00-initial-status.log"
          pnpm install --frozen-lockfile 2>&1 \
            | tee "${EVIDENCE_ROOT}/logs/01-install.log"

      - name: Materialize tracked product implementation
        shell: bash
        run: |
          set -euo pipefail

          git show "${SOURCE_COMMIT}:.github/repair/dynamic-kernel-requirement-dependency.py.gz.b64" \
            | tr -d '[:space:]' \
            | base64 --decode \
            | gzip --decompress \
            > "${RUNNER_TEMP}/dynamic-kernel-requirement-dependency.py"
          test "$(sha256sum "${RUNNER_TEMP}/dynamic-kernel-requirement-dependency.py" | cut -d' ' -f1)" = \
            "a1bc1185636751d4aa4056a1a3dc45d0ffd46085b56cd4f82e5a98378c8eb884"

          for script in \
            dynamic-kernel-requirement-dependency-round1-format.py \
            dynamic-kernel-dependency-runtime-semantics.py \
            dynamic-kernel-dependency-predecessor-kernels.py \
            dynamic-kernel-authored-transition-surface.py
          do
            git show "${SOURCE_COMMIT}:.github/repair/${script}" \
              > "${RUNNER_TEMP}/${script}"
          done

          tr -d '[:space:]' \
            < .github/repair/dynamic-kernel-requirement-product-r3.py.gz.b64 \
            | base64 --decode \
            | gzip --decompress \
            > "${RUNNER_TEMP}/dynamic-kernel-requirement-product-r3.py"
          test "$(sha256sum "${RUNNER_TEMP}/dynamic-kernel-requirement-product-r3.py" | cut -d' ' -f1)" = \
            "537babb200549fd25aaf4aa527bdd8ec50348f9ca9aa5563b30c04cdb1865b55"

          python "${RUNNER_TEMP}/dynamic-kernel-requirement-dependency.py" \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/02-apply-base.log"
          python "${RUNNER_TEMP}/dynamic-kernel-requirement-dependency-round1-format.py"
          python "${RUNNER_TEMP}/dynamic-kernel-dependency-runtime-semantics.py"
          python "${RUNNER_TEMP}/dynamic-kernel-dependency-predecessor-kernels.py"
          python "${RUNNER_TEMP}/dynamic-kernel-authored-transition-surface.py"
          python "${RUNNER_TEMP}/dynamic-kernel-requirement-product-r3.py" \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/03-apply-round3.log"

          SANGTIAN_SKIP_SOURCE_WRITES=1 \
          SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring-output" \
          SANGTIAN_RUNTIME_PACKAGE_PATH="${GITHUB_WORKSPACE}/packages/templates/config/sangtian/story-package/part-one-runtime.json" \
            node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/04-compile-package.log"

          git diff --check
          git diff --stat | tee "${EVIDENCE_ROOT}/logs/05-product-diff-stat.log"
          git diff --name-status | tee "${EVIDENCE_ROOT}/logs/06-product-name-status.log"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/solo-story-engine/context-compiler.ts \
            packages/templates/src/runtime-contract/kernel-selector-lite.ts \
            packages/templates/src/story-package/requirement-dependency.ts \
            packages/templates/src/story-package/part-one-runtime-types.ts \
            packages/templates/src/story-package/index.ts \
            packages/templates/src/story-package/part-one-runtime-loader.ts \
            packages/templates/src/story-package/dynamic-kernel-lite-runtime.ts \
            packages/templates/src/story-package/dynamic-kernel-lite-settlement.ts \
            packages/templates/src/story-package/part-one-runtime-engine.ts \
            packages/templates/tests/requirement-dependency.test.ts \
            packages/templates/tests/part-one-dynamic-kernel-lite.test.ts \
            packages/templates/package.json \
            packages/templates/authoring/sangtian/requirements/part-01.requirements.json \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            scripts/story-decomposition/lib/requirement-dependency.mjs \
            scripts/story-decomposition/build-sangtian-part-one-authoring.mjs \
            scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs
          git rm -f \
            .github/repair/dynamic-kernel-requirement-product-r3.py.gz.b64 \
            .github/workflows/dynamic-kernel-requirement-product-round3b.yml
          git diff --cached --check
          git commit -m "feat(kernel-lite): persist requirement dependency architecture"

          git rev-parse HEAD > "${EVIDENCE_ROOT}/tested-sha.txt"
          git rev-parse HEAD^{tree} > "${EVIDENCE_ROOT}/tested-tree.txt"
          git rev-parse "${BASE_PRODUCT_SHA}^{tree}" > "${EVIDENCE_ROOT}/base-tree.txt"
          test "$(cat "${EVIDENCE_ROOT}/tested-tree.txt")" != "$(cat "${EVIDENCE_ROOT}/base-tree.txt")"
          git diff --name-status "${BASE_PRODUCT_SHA}..HEAD" \
            | tee "${EVIDENCE_ROOT}/changed-files.txt"
          grep -Eq '^(A|M)[[:space:]]+(packages/|apps/|scripts/story-decomposition/)' \
            "${EVIDENCE_ROOT}/changed-files.txt"
          if git ls-tree -r --name-only HEAD \
            | grep -Eq '^\.github/(repair/.*dynamic-kernel|workflows/dynamic-kernel-requirement-product)'; then
            echo "temporary dynamic-kernel scaffolding remained in candidate" >&2
            exit 1
          fi
          git status --short | tee "${EVIDENCE_ROOT}/logs/07-pre-test-status.log"
          test ! -s "${EVIDENCE_ROOT}/logs/07-pre-test-status.log"

      - name: Run exact-SHA deterministic gates
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/tested-sha.txt")"
          results="${EVIDENCE_ROOT}/results.tsv"
          : > "${results}"
          failed=0

          run_gate() {
            local label="$1"
            shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${results}"
            if [ "${code}" -ne 0 ]; then failed=1; fi
          }

          run_gate 08-story-v4 pnpm test:story:v4
          run_gate 09-templates-typecheck pnpm --filter @ai-story/templates typecheck
          run_gate 10-templates-runtime-contract pnpm --filter @ai-story/templates test:runtime-contract
          run_gate 11-templates-story-package pnpm --filter @ai-story/templates test:story-package
          run_gate 12-templates-build pnpm --filter @ai-story/templates build
          run_gate 13-openovel-typecheck pnpm --filter @apps/openovel-runtime typecheck
          run_gate 14-openovel-test pnpm --filter @apps/openovel-runtime test
          run_gate 15-openovel-build pnpm --filter @apps/openovel-runtime build
          run_gate 16-prisma-generate pnpm db:generate
          run_gate 17-api-solo pnpm --filter @apps/api test:solo-story-engine
          run_gate 18-api-legacy-sangtian pnpm --filter @apps/api test:solo-story-engine:legacy-sangtian
          run_gate 19-branch-persistence pnpm test:story:branch-persistence
          run_gate 20-story-options pnpm test:story:options
          run_gate 21-story-convergence pnpm test:story:convergence

          if [ "${failed}" -eq 0 ]; then
            printf 'pass\n' > "${EVIDENCE_ROOT}/status.txt"
          else
            printf 'fail\n' > "${EVIDENCE_ROOT}/status.txt"
          fi

      - name: Summarize exact results
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"])
          rows = []
          patterns = {
              "tests": re.compile(r"^# tests (\d+)$", re.MULTILINE),
              "pass": re.compile(r"^# pass (\d+)$", re.MULTILINE),
              "fail": re.compile(r"^# fail (\d+)$", re.MULTILINE),
              "skip": re.compile(r"^# skipped (\d+)$", re.MULTILINE),
              "todo": re.compile(r"^# todo (\d+)$", re.MULTILINE),
          }
          results = root / "results.tsv"
          if results.exists():
              for line in results.read_text().splitlines():
                  label, code, log_path = line.split("\t", 2)
                  text = Path(log_path).read_text(errors="replace") if Path(log_path).exists() else ""
                  row = {"label": label, "exitCode": int(code), "logPath": log_path}
                  for key, pattern in patterns.items():
                      values = pattern.findall(text)
                      row[key] = int(values[-1]) if values else None
                  rows.append(row)
          summary = {
              "inputSha": os.environ.get("GITHUB_SHA"),
              "baseProductSha": os.environ.get("BASE_PRODUCT_SHA"),
              "testedSha": (root / "tested-sha.txt").read_text().strip() if (root / "tested-sha.txt").exists() else None,
              "baseTree": (root / "base-tree.txt").read_text().strip() if (root / "base-tree.txt").exists() else None,
              "testedTree": (root / "tested-tree.txt").read_text().strip() if (root / "tested-tree.txt").exists() else None,
              "status": (root / "status.txt").read_text().strip() if (root / "status.txt").exists() else "missing",
              "commands": rows,
              "supabaseFormal": "NOT_RUN",
              "deepSeek": "NOT_RUN",
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY

      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-requirement-product-r3b-${{ github.sha }}
          path: /tmp/dynamic-kernel-requirement-product-round3b/
          if-no-files-found: error
          retention-days: 14

      - name: Push exact tested product candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${EVIDENCE_ROOT}/status.txt"
          test "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass
          test "$(git rev-parse HEAD)" = "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/tested-sha.txt")"
          git push origin HEAD:"${BRANCH_NAME}"
          git rev-parse HEAD > "${EVIDENCE_ROOT}/final-sha.txt"

      - name: Remove temporary scaffolding after failed gates
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/repair/dynamic-kernel-requirement-product-r3.py.gz.b64 \
            .github/workflows/dynamic-kernel-requirement-product-round3b.yml
          git commit -m "chore(kernel-lite): remove failed product round 3B scaffolding"
          git push origin HEAD:"${BRANCH_NAME}"

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          description="Tracked Requirement dependency product round 3 failed"
          if [ -f "${EVIDENCE_ROOT}/final-sha.txt" ]; then
            state=success
            description="Tracked Requirement dependency product round 3 passed and was pushed"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/requirement-dependency-product-r3b" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
