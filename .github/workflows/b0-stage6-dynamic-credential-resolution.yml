name: B0 Stage 6 Dynamic Non-Production Credential Resolution

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage6-dynamic-credential-resolution.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage6-dynamic-credential-resolution
  cancel-in-progress: false

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "ourmanyworlds.com / test"
          - "stellar-encouragement / test"
          - "Preview"
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve types in memory and persist names only
        shell: bash
        env:
          B0_ENVIRONMENT_NAME: ${{ matrix.environment }}
          B0_SECRET_CONTEXT_JSON: ${{ toJSON(secrets) }}
          B0_OUTPUT: /tmp/b0-dynamic-${{ strategy.job-index }}.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const secrets = JSON.parse(process.env.B0_SECRET_CONTEXT_JSON || '{}');
          const entries = Object.entries(secrets);
          const databasePriority = [
            'SUPABASE_DIRECT_URL','POSTGRES_URL_NON_POOLING','DIRECT_URL','SUPABASE_DATABASE_URL',
            'SUPABASE_TEST_DATABASE_URL','TEST_DATABASE_URL','POSTGRES_PRISMA_URL','POSTGRES_URL','DATABASE_URL'
          ];
          const providerPriority = [
            'DEEPSEEK_API_KEY','OPENOVEL_DEEPSEEK_API_KEY','OPENOVEL_API_KEY','LLM_API_KEY','AI_API_KEY'
          ];
          const dbEntries = entries.filter(([name, value]) =>
            /(?:SUPABASE|DATABASE|POSTGRES|DIRECT)/i.test(name) && /^postgres(?:ql)?:\/\//i.test(String(value || ''))
          );
          const providerEntries = entries.filter(([name, value]) =>
            /(?:DEEPSEEK|OPENOVEL|LLM|AI_API)/i.test(name) && /(?:KEY|TOKEN)/i.test(name) && String(value || '').length >= 20
          );
          const rank = (name, priority) => {
            const index = priority.indexOf(name);
            return index >= 0 ? index : priority.length + 1;
          };
          dbEntries.sort((a,b) => rank(a[0], databasePriority) - rank(b[0], databasePriority) || a[0].localeCompare(b[0]));
          providerEntries.sort((a,b) => rank(a[0], providerPriority) - rank(b[0], providerPriority) || a[0].localeCompare(b[0]));
          const databaseSecretName = dbEntries[0]?.[0] || null;
          const providerSecretName = providerEntries[0]?.[0] || null;
          fs.writeFileSync(process.env.B0_OUTPUT, JSON.stringify({
            schemaVersion: 1,
            environment: process.env.B0_ENVIRONMENT_NAME,
            databaseSecretName,
            providerSecretName,
            databaseCredentialPresent: Boolean(databaseSecretName),
            providerCredentialPresent: Boolean(providerSecretName),
            pairAvailable: Boolean(databaseSecretName && providerSecretName),
            matchingDatabaseSecretNames: dbEntries.map(([name]) => name),
            matchingProviderSecretNames: providerEntries.map(([name]) => name),
            valuesPrinted: false,
            valuesPersisted: false,
            valuesHashed: false
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: b0-dynamic-credential-${{ strategy.job-index }}
          path: /tmp/b0-dynamic-${{ strategy.job-index }}.json
          if-no-files-found: error
          retention-days: 3

  aggregate:
    if: always()
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo,
              sha: context.sha, state: "pending", context: "b0/stage6-dynamic-credentials",
              description: `dynamic credential resolution running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          pattern: b0-dynamic-credential-*
          path: /tmp/b0-dynamic-credentials
          merge-multiple: true
      - name: Aggregate names-only result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/auto-execute/evidence/b0/c8 docs/auto-execute/evidence/b0/c9/readiness
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          preference=['ourmanyworlds.com / test','stellar-encouragement / test','Preview']
          rows=[json.loads(path.read_text()) for path in sorted(Path('/tmp/b0-dynamic-credentials').glob('*.json'))]
          rows.sort(key=lambda row: preference.index(row['environment']) if row['environment'] in preference else 99)
          selected=next((row for row in rows if row.get('pairAvailable')),None)
          payload={'schemaVersion':1,'status':'READY' if selected else 'BLOCKED_NO_SAFE_NONPRODUCTION_PAIR',
                   'generatedAt':datetime.now(timezone.utc).isoformat(),'sourceSha':os.environ['GITHUB_SHA'],
                   'workflowRunId':os.environ['GITHUB_RUN_ID'],'environments':rows,
                   'selectedEnvironment':selected['environment'] if selected else None,
                   'selectedDatabaseSecretName':selected['databaseSecretName'] if selected else None,
                   'selectedProviderSecretName':selected['providerSecretName'] if selected else None,
                   'valuesPrinted':False,'valuesPersisted':False,'valuesHashed':False,
                   'productionEnvironmentInspected':False,'productionDatabaseAccessed':False}
          for path in [Path('docs/auto-execute/evidence/b0/c8/dynamic-credential-resolution.json'),
                       Path('docs/auto-execute/evidence/b0/c9/readiness/dynamic-credential-resolution.json')]:
              path.write_text(json.dumps(payload,indent=2)+'\n')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write(f"ready={'true' if selected else 'false'}\n")
              handle.write(f"environment={selected['environment'] if selected else ''}\n")
              handle.write(f"database_secret_name={selected['databaseSecretName'] if selected else ''}\n")
              handle.write(f"provider_secret_name={selected['providerSecretName'] if selected else ''}\n")
          PY
      - name: Configure dynamic in-memory selection and trigger formal run
        if: steps.result.outputs.ready == 'true'
        shell: bash
        env:
          SELECTED_ENVIRONMENT: ${{ steps.result.outputs.environment }}
          DATABASE_SECRET_NAME: ${{ steps.result.outputs.database_secret_name }}
          PROVIDER_SECRET_NAME: ${{ steps.result.outputs.provider_secret_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path=Path('.github/workflows/b0-candidate-real-acceptance.yml')
          source=path.read_text()
          selected=os.environ['SELECTED_ENVIRONMENT']
          source=re.sub(r'environment: "(?:ourmanyworlds\.com / test|stellar-encouragement / test|Preview)"',f'environment: "{selected}"',source,count=1)
          source=re.sub(r'B0_ACCEPTANCE_ENVIRONMENT: "(?:ourmanyworlds\.com / test|stellar-encouragement / test|Preview)"',f'B0_ACCEPTANCE_ENVIRONMENT: "{selected}"',source,count=1)
          env_start=source.index('                CANDIDATE_SUPABASE_DATABASE_URL:')
          step_start=source.index('              steps:',env_start)
          source=source[:env_start] + '                B0_SECRET_CONTEXT_JSON: ${{ toJSON(secrets) }}\n' + source[step_start:]
          select_start=source.index('                - name: Select non-production credentials by name without printing values')
          next_step=source.index('\n                - uses: pnpm/action-setup@v4',select_start)
          replacement=r'''                - name: Select audited credentials in memory without printing values
                  shell: bash
                  env:
                    AUDITED_DATABASE_SECRET_NAME: __DATABASE_SECRET_NAME__
                    AUDITED_PROVIDER_SECRET_NAME: __PROVIDER_SECRET_NAME__
                  run: |
                    set -euo pipefail
                    node <<'NODE'
                    const fs = require('node:fs');
                    const secrets = JSON.parse(process.env.B0_SECRET_CONTEXT_JSON || '{}');
                    const databaseName = process.env.AUDITED_DATABASE_SECRET_NAME;
                    const providerName = process.env.AUDITED_PROVIDER_SECRET_NAME;
                    const databaseValue = String(secrets[databaseName] || '');
                    const providerValue = String(secrets[providerName] || '');
                    if (!/^postgres(?:ql)?:\/\//i.test(databaseValue)) throw new Error('audited database secret is not a PostgreSQL URL');
                    if (providerValue.length < 20) throw new Error('audited provider secret is empty or malformed');
                    console.log(`::add-mask::${databaseValue}`);
                    console.log(`::add-mask::${providerValue}`);
                    fs.appendFileSync(process.env.GITHUB_ENV,
                      `SUPABASE_DATABASE_URL=${databaseValue}\nDEEPSEEK_API_KEY=${providerValue}\nOPENOVEL_API_KEY=${providerValue}\n` +
                      `B0_DATABASE_SECRET_NAME=${databaseName}\nB0_PROVIDER_SECRET_NAME=${providerName}\n`);
                    console.log(`Using audited secret names ${databaseName} and ${providerName}; values remain masked.`);
                    NODE
'''.replace('__DATABASE_SECRET_NAME__',os.environ['DATABASE_SECRET_NAME']).replace('__PROVIDER_SECRET_NAME__',os.environ['PROVIDER_SECRET_NAME'])
          source=source[:select_start]+replacement+source[next_step:]
          path.write_text(source)
          trigger=Path('docs/auto-execute/B0_FORMAL_C8_TRIGGER.md')
          trigger.write_text('# B0 Formal C8 Trigger\n\n'
              f'- sourceSha: `{os.environ["GITHUB_SHA"]}`\n'
              f'- environment: `{selected}`\n'
              f'- databaseSecretName: `{os.environ["DATABASE_SECRET_NAME"]}`\n'
              f'- providerSecretName: `{os.environ["PROVIDER_SECRET_NAME"]}`\n'
              '- selectionMode: `in-memory-name-bound`\n'
              '- secretValuesPersisted: `false`\n'
              '- productionPublicSchemaAccess: `forbidden`\n')
          PY
          git diff --check
      - name: Record precise external blocker when no pair exists
        if: steps.result.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          resolution=json.loads(Path('docs/auto-execute/evidence/b0/c8/dynamic-credential-resolution.json').read_text())
          payload={'schemaVersion':1,'status':'EXTERNAL_BLOCKER','code':'B0_FORMAL_C8_NONPRODUCTION_CREDENTIALS_UNAVAILABLE',
                   'recordedAt':datetime.now(timezone.utc).isoformat(),'sourceSha':resolution['sourceSha'],
                   'auditedEnvironments':[row['environment'] for row in resolution['environments']],
                   'databaseCredentialPresentByEnvironment':{row['environment']:row['databaseCredentialPresent'] for row in resolution['environments']},
                   'providerCredentialPresentByEnvironment':{row['environment']:row['providerCredentialPresent'] for row in resolution['environments']},
                   'requiredToResume':['managed non-production Supabase PostgreSQL URL','real DeepSeek API key'],
                   'containerCannotSatisfyFormalC8':True,'productionCredentialsForbidden':True,
                   'secretValuesPrinted':False,'secretValuesPersisted':False}
          Path('docs/auto-execute/evidence/b0/c8/external-blocker.json').write_text(json.dumps(payload,indent=2)+'\n')
          Path('docs/auto-execute/evidence/b0/c9/readiness/external-blocker.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
      - name: Commit resolution result as ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/auto-execute/evidence/b0/c8 docs/auto-execute/evidence/b0/c9/readiness
          if [ "${{ steps.result.outputs.ready }}" = true ]; then
            git add .github/workflows/b0-candidate-real-acceptance.yml docs/auto-execute/B0_FORMAL_C8_TRIGGER.md
          fi
          git rm .github/workflows/b0-stage6-dynamic-credential-resolution.yml
          git diff --cached --check
          if [ "${{ steps.result.outputs.ready }}" = true ]; then
            git commit -m "ci(b0): retry formal C8 with audited credentials"
          else
            git commit -m "test(b0): record formal C8 external blocker"
          fi
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Publish stage outcome
        if: always()
        uses: actions/github-script@v7
        env:
          READY: ${{ steps.result.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo,
              sha: context.sha, state: ok ? "success" : "failure", context: "b0/stage6-dynamic-credentials",
              description: ok ? `dynamic credential resolution completed; ready=${process.env.READY}` : `dynamic credential resolution failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            if (!ok) core.setFailed('Dynamic credential resolution failed');
