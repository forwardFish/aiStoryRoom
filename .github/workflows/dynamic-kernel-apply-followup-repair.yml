name: Dynamic Kernel Follow-up Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-apply-followup-repair.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  repair-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EVIDENCE_ROOT: /tmp/dynamic-kernel-followup-repair
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/followup-repair" \
            -f description="Follow-up architecture repair running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify and apply follow-up patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          tr -d '[:space:]' \
            < .github/repair/dynamic-kernel-followup.patch.gz.b64 \
            > "${RUNNER_TEMP}/followup.patch.gz.b64"
          test "$(sha256sum "${RUNNER_TEMP}/followup.patch.gz.b64" | cut -d' ' -f1)" = \
            "3f67b893abbc8b63d0ace3cc286fb0bb16d078c21523a540c63d102a49a05d63"
          base64 --decode "${RUNNER_TEMP}/followup.patch.gz.b64" \
            | gzip --decompress \
            > "${RUNNER_TEMP}/followup.patch"
          test "$(sha256sum "${RUNNER_TEMP}/followup.patch" | cut -d' ' -f1)" = \
            "f5b21a509007fa1e069d69be823864ad37d88491d8f053822795591d7050d2f0"
          git apply --check "${RUNNER_TEMP}/followup.patch"
          git apply "${RUNNER_TEMP}/followup.patch"
          git diff --check
          git diff --stat | tee "${EVIDENCE_ROOT}/logs/00-applied-diff.log"
      - name: Install frozen workspace
        shell: bash
        run: pnpm install --frozen-lockfile 2>&1 | tee "${EVIDENCE_ROOT}/logs/01-install.log"
      - name: Run deterministic matrix
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          results="${EVIDENCE_ROOT}/results.tsv"
          : > "${results}"
          failed=0
          run_gate() {
            local label="$1"
            shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${results}"
            if [ "${code}" -ne 0 ]; then failed=1; fi
          }
          run_gate 02-templates-typecheck pnpm --filter @ai-story/templates typecheck
          run_gate 03-templates-runtime-contract pnpm --filter @ai-story/templates test:runtime-contract
          run_gate 04-templates-story-package pnpm --filter @ai-story/templates test:story-package
          run_gate 05-templates-build pnpm --filter @ai-story/templates build
          run_gate 06-openovel-typecheck pnpm --filter @apps/openovel-runtime typecheck
          run_gate 07-openovel-test pnpm --filter @apps/openovel-runtime test
          run_gate 08-openovel-build pnpm --filter @apps/openovel-runtime build
          run_gate 09-prisma-generate pnpm db:generate
          run_gate 10-api-solo pnpm --filter @apps/api test:solo-story-engine
          run_gate 11-api-legacy-sangtian pnpm --filter @apps/api test:solo-story-engine:legacy-sangtian
          run_gate 12-branch-persistence pnpm test:story:branch-persistence
          run_gate 13-story-options pnpm test:story:options
          run_gate 14-story-convergence pnpm test:story:convergence
          run_gate 15-story-v4 pnpm test:story:v4
          if [ "${failed}" -eq 0 ]; then
            printf 'pass\n' > "${EVIDENCE_ROOT}/status.txt"
          else
            printf 'fail\n' > "${EVIDENCE_ROOT}/status.txt"
          fi
      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-followup-repair-${{ github.sha }}
          path: /tmp/dynamic-kernel-followup-repair/
          if-no-files-found: error
          retention-days: 7
      - name: Commit green repair and remove temporary scaffolding
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${EVIDENCE_ROOT}/status.txt"
          test "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/templates/src/runtime-contract/kernel-selector-lite.ts \
            packages/templates/tests/kernel-selector-lite.test.ts \
            apps/api/src/solo-story-engine/context-compiler.ts \
            apps/openovel-runtime/tests/sangtian-dynamic-kernel-production.spec.ts
          git rm -f \
            .github/repair/dynamic-kernel-followup.patch.gz.b64 \
            .github/workflows/dynamic-kernel-apply-followup-repair.yml \
            .github/workflows/dynamic-kernel-final-deterministic-gates.yml \
            .github/workflows/dynamic-kernel-architecture-debug.yml
          git diff --cached --check
          git commit -m "fix(kernel-lite): preserve obligation priority across projections"
          git push origin HEAD:codex/chatgpt-pro-dynamic-kernel-lite
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          description="Follow-up deterministic repair failed"
          if [ -f "${EVIDENCE_ROOT}/status.txt" ] \
            && [ "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass ]; then
            state=success
            description="Follow-up deterministic repair passed"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/followup-repair" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
