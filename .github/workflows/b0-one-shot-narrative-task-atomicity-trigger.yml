name: B0 One-Shot Narrative Task Atomicity Trigger
# trigger-revision: 1

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-narrative-task-atomicity-trigger.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-one-shot-narrative-task-atomicity-trigger
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_BASELINE: 689bf663e256a9d9ca71892ddbc076c356cdc1d6
  B0_PATCH_SOURCE: .github/workflows/b0-one-shot-narrative-task-atomicity.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/narrative-task-atomicity",
              description: `narrative task atomicity running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 100

      - name: Apply the immutable product repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$B0_BASELINE" HEAD
          test -z "$(git status --short)"

          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          lines = Path(".github/workflows/b0-one-shot-narrative-task-atomicity.yml").read_text(encoding="utf-8").splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == "PY")
          code = dedent("\n".join(lines[start:end]))
          exec(compile(code, "narrative-task-atomicity", "exec"), {})
          PY
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run focused product gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/api test:b0-pipeline
          pnpm --filter @apps/api test:b0-ops
          pnpm --filter @apps/api exec node --import tsx src/story-task-outbox.service.spec.ts
          pnpm --filter @apps/api test:b0-window
          pnpm --filter @apps/api typecheck
          pnpm typecheck:b0:real-acceptance
          pnpm --filter @apps/api build
          pnpm --filter @apps/openovel-runtime build

      - name: Scan changed product files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          paths = [
              pathlib.Path("apps/api/src/story-task-outbox.contract.ts"),
              pathlib.Path("apps/api/src/story-task-outbox.service.ts"),
              pathlib.Path("apps/api/src/story-task-outbox.service.spec.ts"),
              pathlib.Path("apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts"),
              pathlib.Path("apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts"),
          ]
          patterns = [
              re.compile(r"postgres(?:ql)?://[^\s\"']+", re.I),
              re.compile(r"sk-[A-Za-z0-9_-]{16,}"),
              re.compile(r"Bearer\s+[A-Za-z0-9._~+/-]{16,}", re.I),
              re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"),
          ]
          findings = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for pattern in patterns:
                  if pattern.search(text):
                      findings.append({"path": str(path), "pattern": pattern.pattern})
          if findings:
              raise SystemExit(f"secret scan failed: {findings}")
          print("changed-file secret scan: PASS")
          PY

      - name: Commit and push product files only
        id: push
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/api/src/story-task-outbox.contract.ts
            apps/api/src/story-task-outbox.service.ts
            apps/api/src/story-task-outbox.service.spec.ts
            apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
            apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts
          )
          git fetch origin "$B0_BRANCH"
          remote_before="$(git rev-parse origin/$B0_BRANCH)"
          test "$remote_before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git diff --cached --check
          printf '%s\n' "${files[@]}" | LC_ALL=C sort > /tmp/expected
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git commit -m "fix(b0): finalize narrative entries with their outbox task"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$B0_BRANCH"
          remote_after="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          echo "local_head=$local_head" >> "$GITHUB_OUTPUT"
          echo "remote_before=$remote_before" >> "$GITHUB_OUTPUT"
          echo "remote_after=$remote_after" >> "$GITHUB_OUTPUT"
          echo "REMOTE_PRODUCT_FIX_PUSHED=$local_head"

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          LOCAL_HEAD: ${{ steps.push.outputs.local_head }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/narrative-task-atomicity",
              description: success
                ? `product fix pushed ${process.env.LOCAL_HEAD?.slice(0, 12)}`
                : `narrative task atomicity failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("narrative task atomicity repair failed");
