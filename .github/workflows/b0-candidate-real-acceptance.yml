name: B0 Candidate Real Supabase and Browser Acceptance

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths-ignore:
      - "docs/auto-execute/evidence/b0/**"

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-real-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-acceptance:
    name: Real Supabase, API, Web, Worker and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      B0_DATABASE_IMAGE: supabase/postgres:15.14.1.157-mmlb_amd64
      B0_PROVIDER_IMAGE: ollama/ollama:0.32.5
      B0_PROVIDER_MODEL: qwen2.5:1.5b
      B0_EVIDENCE_ROOT: docs/auto-execute/evidence/b0/c9/runtime
      B0_PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - name: Publish exact run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/real-acceptance",
              description: `real Supabase/browser acceptance running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(sha256sum scripts/acceptance/b0-selfhosted-real-acceptance.sh | cut -d' ' -f1)" = "9b146e454697b9ef68e122a2fc33b601e0e32434268bcc08d92d2cecf96a3930"
          test "$(sha256sum scripts/acceptance/b0-candidate-real-flow.ts | cut -d' ' -f1)" = "0dd15674e3d7dc52667b217ae48c988a64c01354a0ca232898152d24716ded95"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen install and Prisma generation
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance

      - name: Build exact runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-story/shared build
          pnpm --filter @ai-story/templates build
          pnpm --filter @apps/api build
          pnpm --filter @apps/openovel-runtime build
          pnpm --filter @apps/web typecheck
          pnpm --filter @apps/web build

      - name: Start official self-hosted Supabase PostgreSQL in a random schema
        id: database
        shell: bash
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh prepare-database

      - name: Start a real Ollama model with OpenAI-compatible transport
        id: provider
        shell: bash
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh prepare-provider

      - name: Execute the real six-window acceptance
        id: acceptance
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm test:b0:real-acceptance

      - name: Prove product traffic reached the real model
        id: provider_proof
        if: always()
        shell: bash
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh provider-proof

      - name: Verify public-schema isolation and clean all acceptance infrastructure
        id: cleanup
        if: always()
        shell: bash
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh cleanup

      - name: Redact and scan evidence
        id: redaction
        if: always()
        shell: bash
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh redact

      - name: Finalize C8 checkpoint and evidence hashes
        id: finalize
        if: success()
        shell: bash
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh finalize

      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0-real-acceptance-${{ github.sha }}
          path: |
            docs/auto-execute/evidence/b0/c8/checkpoint.json
            docs/auto-execute/evidence/b0/c9/runtime
          if-no-files-found: warn
          retention-days: 14

      - name: Commit passing C8 and runtime evidence as docs only
        id: evidence_commit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Candidate ref moved; refusing to publish stale evidence." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/auto-execute/evidence/b0/c8/checkpoint.json docs/auto-execute/evidence/b0/c9/runtime
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -Ev '^docs/auto-execute/evidence/b0/'; then
            echo "Evidence commit contains non-evidence files." >&2
            exit 1
          fi
          git commit -m "test(b0): record real Supabase and browser evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish real acceptance outcome
        if: always()
        uses: actions/github-script@v7
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          PROVIDER_OUTCOME: ${{ steps.provider_proof.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          REDACTION_OUTCOME: ${{ steps.redaction.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
          EVIDENCE_COMMIT_OUTCOME: ${{ steps.evidence_commit.outcome }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success"
              && process.env.ACCEPTANCE_OUTCOME === "success"
              && process.env.PROVIDER_OUTCOME === "success"
              && process.env.CLEANUP_OUTCOME === "success"
              && process.env.REDACTION_OUTCOME === "success"
              && process.env.FINALIZE_OUTCOME === "success"
              && process.env.EVIDENCE_COMMIT_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/real-acceptance",
              description: `${success ? "real acceptance passed" : "real acceptance failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) {
              core.setFailed(`B0 real acceptance did not close: acceptance=${process.env.ACCEPTANCE_OUTCOME}, provider=${process.env.PROVIDER_OUTCOME}, cleanup=${process.env.CLEANUP_OUTCOME}, redaction=${process.env.REDACTION_OUTCOME}, finalize=${process.env.FINALIZE_OUTCOME}, evidence=${process.env.EVIDENCE_COMMIT_OUTCOME}, job=${process.env.JOB_STATUS}`);
            }
