name: ChatGPT Pro Final Candidate Acceptance

on:
  pull_request:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: chatgpt-pro-p4-atomic-${{ github.event.pull_request.base.sha }}
  cancel-in-progress: false

jobs:
  p4-atomic:
    if: "${{ github.event.pull_request.title == 'ci(P4): finalize dramatic beat plan' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      TARGET_BRANCH: codex/chatgpt-pro-ai-story-convergence
      CANDIDATE_SHA: ${{ github.event.pull_request.base.sha }}
      FROZEN_BASE_SHA: 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c
      RESTORE_FINAL_WORKFLOW_SHA: e3bcd9d39e7f1f1559689f991f80aec982fa6e3a
      RESTORE_CONVERGENCE_SHA: 3dbaaa0915afd601d0a8c6b849a7c55d67773bdc
      FINAL_WORKFLOW_PATH: .github/workflows/chatgpt-pro-final-candidate-20260805.yml
      CONVERGENCE_PATH: .github/workflows/chatgpt-pro-convergence.yml
      P4_WORKFLOW_PATH: .github/workflows/chatgpt-pro-p4-finalize.yml
      P4_PATCH_PATH: docs/auto-execute/.chatgpt-pro-p4-final.patch
      P4_READY_PATH: docs/auto-execute/.chatgpt-pro-p4-ready
      EVIDENCE_ROOT: ${{ runner.temp }}/p4-evidence
      OPENOVEL_PROVIDER_BASE_URL: https://api.deepseek.com
      OPENOVEL_MODEL: deepseek-v4-pro
      OPENOVEL_NARRATOR_MODEL: deepseek-v4-pro
      OPENOVEL_REVIEWER_MODEL: deepseek-v4-pro
      OPENOVEL_OPTIONS_MODEL: deepseek-v4-pro
      OPENOVEL_STORYKEEPER_MODEL: deepseek-v4-pro
      OPENOVEL_DEEPSEEK_THINKING: disabled

    steps:
      - name: Check out exact candidate base SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "base_ref=${{ github.event.pull_request.base.ref }}"
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "checked_out=$(git rev-parse HEAD)"
            echo "merge_base=$(git merge-base HEAD ${FROZEN_BASE_SHA})"
            echo "main_remote=$(git rev-parse origin/main)"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee "${EVIDENCE_ROOT}/logs/00-boundary.log"
          test "${GITHUB_REPOSITORY}" = "forwardFish/aiStoryRoom"
          test "${{ github.event.pull_request.base.ref }}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git merge-base HEAD ${FROZEN_BASE_SHA})" = "${FROZEN_BASE_SHA}"
          test "$(git rev-parse origin/main)" = "${FROZEN_BASE_SHA}"
          test -z "$(git status --short)"

      - name: Extract and run complete audited P4 transform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'EXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/chatgpt-pro-convergence.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('P4_TRANSFORM_START_MISSING')
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('P4_TRANSFORM_END_MISSING')
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          script = '\n'.join(lines) + '\n'
          required = [
              'DramaticBeatSurfaceContract',
              'playerResultRenderedOnce',
              'dramaticPlanBoundToSurface',
          ]
          missing = [value for value in required if value not in script]
          if missing:
              raise SystemExit('P4_TRANSFORM_CONTRACT_MISSING:' + ','.join(missing))
          Path('/tmp/p4-transform.py').write_text(script, encoding='utf-8')
          EXTRACT
          python /tmp/p4-transform.py
          git diff --check
          git status --short | tee "${EVIDENCE_ROOT}/logs/01-p4-diff.log"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked workspace
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "${EVIDENCE_ROOT}/logs/02-install.log"

      - name: Run P4 focused and complete engineering gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-story/templates typecheck \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/03-templates-typecheck.log"
          pnpm --filter @ai-story/templates test:story-package \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/04-story-package.log"
          pnpm --filter @ai-story/templates build \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/05-templates-build.log"
          pnpm --filter @apps/openovel-runtime typecheck \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/06-openovel-typecheck.log"
          pnpm --filter @apps/openovel-runtime test \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/07-openovel-tests.log"
          pnpm --filter @apps/openovel-runtime build \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/08-openovel-build.log"
          pnpm test:story:v4 \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/09-story-v4.log"
          pnpm --filter @apps/openovel-runtime smoke:http \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/10-http-smoke.log"

          tmp_root="${RUNNER_TEMP}/sangtian-authoring"
          mkdir -p "${tmp_root}"
          export SANGTIAN_SKIP_SOURCE_WRITES=1
          export SANGTIAN_AUTHORING_OUTPUT_ROOT="${tmp_root}/authoring"
          export SANGTIAN_RUNTIME_PACKAGE_PATH="${tmp_root}/part-one-runtime.json"
          node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/11-authoring-recompile.log"
          cmp --silent \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${tmp_root}/part-one-runtime.json"
          sha256sum \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${tmp_root}/part-one-runtime.json" \
            | tee "${EVIDENCE_ROOT}/logs/12-authoring-sha256.log"

          export SANGTIAN_NARRATIVE_SUPPLEMENT_PATH="${tmp_root}/part-one-narrative-supplement.json"
          node scripts/story-decomposition/compile-sangtian-part-one-narrative-supplement.mjs \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/13-supplement.log"
          test -s "${SANGTIAN_NARRATIVE_SUPPLEMENT_PATH}"

      - name: Upload complete P4 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-dramatic-beat-plan-${{ env.CANDIDATE_SHA }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 7

      - name: Restore permanent workflows, remove staging files, and commit P4
        shell: bash
        run: |
          set -euo pipefail
          git checkout "${RESTORE_FINAL_WORKFLOW_SHA}" -- "${FINAL_WORKFLOW_PATH}"
          git checkout "${RESTORE_CONVERGENCE_SHA}" -- "${CONVERGENCE_PATH}"
          rm -f "${P4_WORKFLOW_PATH}" "${P4_PATCH_PATH}" "${P4_READY_PATH}"
          git diff --check

          python - <<'PY'
          import subprocess

          allowed_exact = {
              '.github/workflows/chatgpt-pro-convergence.yml',
              '.github/workflows/chatgpt-pro-final-candidate-20260805.yml',
              '.github/workflows/chatgpt-pro-p4-finalize.yml',
              'docs/auto-execute/.chatgpt-pro-p4-final.patch',
              'docs/auto-execute/.chatgpt-pro-p4-ready',
              'packages/templates/src/story-package/dramatic-beat-plan.ts',
              'packages/templates/src/story-package/part-one-runtime-engine.ts',
              'packages/templates/src/story-package/part-one-runtime-types.ts',
              'packages/templates/src/runtime-facade.ts',
              'packages/templates/tests/dramatic-beat-plan-pattern.test.ts',
              'packages/templates/tests/narrative-scene-pattern-multiworld.test.ts',
              'packages/templates/tests/story-package.test.ts',
              'packages/templates/authoring/sangtian/narrative/scene-patterns.section-02.approved.json',
              'packages/templates/authoring/sangtian/narrative/scene-patterns.section-03.approved.json',
              'packages/templates/authoring/sangtian/narrative/scene-patterns.section-04.approved.json',
              'packages/templates/config/sangtian/story-package/opening.json',
              'apps/openovel-runtime/src/decision-adapter.ts',
              'apps/openovel-runtime/src/foreground.ts',
              'apps/openovel-runtime/src/sangtian-decisions.ts',
              'apps/openovel-runtime/src/sangtian-workspace.ts',
              'apps/openovel-runtime/src/scene-expression.ts',
              'apps/openovel-runtime/src/types.ts',
              'apps/openovel-runtime/tests/p04-runtime-integration.spec.ts',
              'apps/openovel-runtime/tests/p04-scene-pattern-plan.spec.ts',
          }
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          unexpected = [row for row in rows if row[3:] not in allowed_exact]
          if unexpected:
              raise SystemExit('P4_UNEXPECTED_WORKTREE_FILES:\n' + '\n'.join(unexpected))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "${FINAL_WORKFLOW_PATH}" \
            "${CONVERGENCE_PATH}" \
            packages/templates/src/story-package/dramatic-beat-plan.ts \
            packages/templates/src/story-package/part-one-runtime-engine.ts \
            packages/templates/src/story-package/part-one-runtime-types.ts \
            packages/templates/src/runtime-facade.ts \
            packages/templates/tests/dramatic-beat-plan-pattern.test.ts \
            packages/templates/tests/narrative-scene-pattern-multiworld.test.ts \
            packages/templates/tests/story-package.test.ts \
            packages/templates/authoring/sangtian/narrative/scene-patterns.section-02.approved.json \
            packages/templates/authoring/sangtian/narrative/scene-patterns.section-03.approved.json \
            packages/templates/authoring/sangtian/narrative/scene-patterns.section-04.approved.json \
            packages/templates/config/sangtian/story-package/opening.json \
            apps/openovel-runtime/src/decision-adapter.ts \
            apps/openovel-runtime/src/foreground.ts \
            apps/openovel-runtime/src/sangtian-decisions.ts \
            apps/openovel-runtime/src/sangtian-workspace.ts \
            apps/openovel-runtime/src/scene-expression.ts \
            apps/openovel-runtime/src/types.ts \
            apps/openovel-runtime/tests/p04-runtime-integration.spec.ts \
            apps/openovel-runtime/tests/p04-scene-pattern-plan.spec.ts
          git add -u "${P4_WORKFLOW_PATH}" "${P4_PATCH_PATH}" "${P4_READY_PATH}"
          git commit -m "feat(P4): unify dramatic beat plan and expression ownership"

          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "${CANDIDATE_SHA}"
          git push origin HEAD:"${TARGET_BRANCH}"
