name: ChatGPT Pro Final Candidate Acceptance

on:
  pull_request:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    types: [opened, reopened, synchronize]

permissions:
  contents: write

env:
  CI: "true"
  CANDIDATE_BRANCH: codex/chatgpt-pro-ai-story-convergence
  FROZEN_BASE_SHA: 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c
  OPENOVEL_PROVIDER_BASE_URL: https://api.deepseek.com
  OPENOVEL_PROVIDER_API_KEY: ${{ secrets.OPENOVEL_PROVIDER_API_KEY || secrets.OPENOVEL_API_KEY || secrets.DEEPSEEK_API_KEY }}
  OPENOVEL_API_KEY: ${{ secrets.OPENOVEL_API_KEY || secrets.OPENOVEL_PROVIDER_API_KEY || secrets.DEEPSEEK_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.OPENOVEL_API_KEY || secrets.OPENOVEL_PROVIDER_API_KEY }}
  OPENOVEL_MODEL: deepseek-v4-pro
  OPENOVEL_NARRATOR_MODEL: deepseek-v4-pro
  OPENOVEL_REVIEWER_MODEL: deepseek-v4-pro
  OPENOVEL_OPTIONS_MODEL: deepseek-v4-pro
  OPENOVEL_STORYKEEPER_MODEL: deepseek-v4-pro
  OPENOVEL_DEEPSEEK_THINKING: disabled

concurrency:
  group: chatgpt-pro-final-candidate-acceptance
  cancel-in-progress: false

jobs:
  final-acceptance:
    if: github.event.pull_request.title == 'ci: final ai story candidate acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact candidate base SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Prove repository and branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "forwardFish/aiStoryRoom"
          test "${{ github.event.pull_request.base.ref }}" = "${CANDIDATE_BRANCH}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git merge-base HEAD ${FROZEN_BASE_SHA})" = "${FROZEN_BASE_SHA}"
          test "$(git rev-parse origin/main)" = "${FROZEN_BASE_SHA}"
          test -z "$(git status --short)"
          mkdir -p candidate-evidence/logs
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${CANDIDATE_BRANCH}"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "frozen_base_sha=${FROZEN_BASE_SHA}"
            echo "main_sha=$(git rev-parse origin/main)"
            echo "merge_base=$(git merge-base HEAD ${FROZEN_BASE_SHA})"
          } | tee candidate-evidence/logs/00-boundary.log

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Locked install
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee candidate-evidence/logs/01-install.log

      - name: Compile and verify source-grounded authoring assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee candidate-evidence/logs/02-compile-authoring.log
          node scripts/story-decomposition/compile-sangtian-part-one-narrative-supplement.mjs \
            2>&1 | tee candidate-evidence/logs/03-compile-supplement.log
          git diff --exit-code -- \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            packages/templates/config/sangtian/story-package/part-one-narrative-supplement.json

      - name: Full engineering gates
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @ai-story/templates typecheck \
            2>&1 | tee candidate-evidence/logs/04-templates-typecheck.log
          pnpm --filter @ai-story/templates build \
            2>&1 | tee candidate-evidence/logs/05-templates-build.log
          pnpm --filter @ai-story/templates test:story-package \
            2>&1 | tee candidate-evidence/logs/06-story-package.log
          pnpm --filter @apps/openovel-runtime typecheck \
            2>&1 | tee candidate-evidence/logs/07-openovel-typecheck.log
          pnpm --filter @apps/openovel-runtime build \
            2>&1 | tee candidate-evidence/logs/08-openovel-build.log
          pnpm test:story:v4 \
            2>&1 | tee candidate-evidence/logs/09-story-v4.log
          pnpm --filter @apps/openovel-runtime test \
            2>&1 | tee candidate-evidence/logs/10-openovel-tests.log
          pnpm test:story:convergence \
            2>&1 | tee candidate-evidence/logs/11-static-convergence.log
          pnpm test:story:branch-persistence \
            2>&1 | tee candidate-evidence/logs/12-branch-persistence.log
          pnpm --filter @apps/openovel-runtime smoke:http \
            2>&1 | tee candidate-evidence/logs/13-http-smoke.log

      - name: Reproducible immutable asset comparison
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="${RUNNER_TEMP}/sangtian-authoring"
          mkdir -p "${tmp_root}"
          export SANGTIAN_SKIP_SOURCE_WRITES=1
          export SANGTIAN_AUTHORING_OUTPUT_ROOT="${tmp_root}/authoring"
          export SANGTIAN_RUNTIME_PACKAGE_PATH="${tmp_root}/part-one-runtime.json"
          node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee candidate-evidence/logs/14-authoring-recompile.log
          sha256sum \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${tmp_root}/part-one-runtime.json" \
            | tee candidate-evidence/logs/15-authoring-sha256.log
          cmp --silent \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${tmp_root}/part-one-runtime.json"

      - name: Require real DeepSeek credentials and exact model
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENOVEL_PROVIDER_API_KEY}"
          test "${OPENOVEL_PROVIDER_BASE_URL}" = "https://api.deepseek.com"
          test "${OPENOVEL_MODEL}" = "deepseek-v4-pro"
          test "${OPENOVEL_NARRATOR_MODEL}" = "deepseek-v4-pro"
          test "${OPENOVEL_REVIEWER_MODEL}" = "deepseek-v4-pro"
          test "${OPENOVEL_OPTIONS_MODEL}" = "deepseek-v4-pro"
          test "${OPENOVEL_STORYKEEPER_MODEL}" = "deepseek-v4-pro"
          test "${OPENOVEL_DEEPSEEK_THINKING}" = "disabled"

      - name: Real DeepSeek G00-T20 continuous player acceptance
        shell: bash
        env:
          AI_STORY_REAL_MODEL_EVIDENCE_ROOT: ${{ github.workspace }}/docs/auto-execute/evidence/chatgpt-pro-g00-t20
          AI_STORY_REAL_MODEL_TIMEOUT_MS: "6300000"
        run: |
          set -o pipefail
          pnpm test:story:real-model:g00-t20 \
            2>&1 | tee candidate-evidence/logs/16-real-model-g00-t20.log
          node - <<'NODE'
          const fs = require('fs');
          const path = 'docs/auto-execute/evidence/chatgpt-pro-g00-t20/real-model-g00-t20-summary.json';
          const value = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (value.verdict !== 'PASS') throw new Error('REAL_MODEL_VERDICT_NOT_PASS');
          if (value.expectedModel !== 'deepseek-v4-pro') throw new Error(`REAL_MODEL_EXPECTED:${value.expectedModel}`);
          if (!Array.isArray(value.observedModels) || !value.observedModels.some((name) => String(name).toLowerCase() === 'deepseek-v4-pro')) {
            throw new Error(`REAL_MODEL_IDENTITY_NOT_OBSERVED:${JSON.stringify(value.observedModels)}`);
          }
          if (!Number.isInteger(value.providerCallCount) || value.providerCallCount < 1) throw new Error('REAL_MODEL_CALLS_MISSING');
          if (value.fixtureSignalCount !== 0) throw new Error('REAL_MODEL_FIXTURE_SIGNAL');
          if (!value.opening || value.opening.turnId !== 'G00') throw new Error('REAL_MODEL_G00_MISSING');
          if (value.turnCount !== 20) throw new Error(`REAL_MODEL_TURN_COUNT:${value.turnCount}`);
          const ids = value.turns.map((turn) => turn.turnId);
          const expected = Array.from({ length: 20 }, (_, index) => `T${String(index + 1).padStart(2, '0')}`);
          if (JSON.stringify(ids) !== JSON.stringify(expected)) throw new Error(`REAL_MODEL_TURN_IDS:${JSON.stringify(ids)}`);
          for (const turn of value.turns) {
            if (!turn.playerAction) throw new Error(`REAL_MODEL_ACTION_MISSING:${turn.turnId}`);
            if (!turn.narrativePreview) throw new Error(`REAL_MODEL_NARRATIVE_MISSING:${turn.turnId}`);
            if (turn.canonBinding === null || turn.canonBinding === undefined) throw new Error(`REAL_MODEL_CANON_MISSING:${turn.turnId}`);
            if (turn.reviewStatus === null || turn.reviewStatus === undefined) throw new Error(`REAL_MODEL_REVIEW_MISSING:${turn.turnId}`);
          }
          NODE

      - name: Build final evidence and clean temporary execution files
        shell: bash
        run: |
          set -euo pipefail
          evidence_root=docs/auto-execute/evidence/chatgpt-pro-final
          mkdir -p "${evidence_root}"
          cp candidate-evidence/logs/*.log "${evidence_root}/"
          cp docs/auto-execute/evidence/chatgpt-pro-g00-t20/real-model-g00-t20-summary.json \
            "${evidence_root}/real-model-g00-t20-summary.json"
          cp docs/auto-execute/evidence/chatgpt-pro-convergence/static-convergence.json \
            "${evidence_root}/static-convergence.json"
          cp docs/auto-execute/evidence/chatgpt-pro-convergence/branch-persistence.json \
            "${evidence_root}/branch-persistence.json"
          git log --reverse --format='%H%x09%s' "${FROZEN_BASE_SHA}..HEAD" \
            > "${evidence_root}/commit-list.tsv"
          git diff --name-status "${FROZEN_BASE_SHA}..HEAD" \
            > "${evidence_root}/changed-files.tsv"
          node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const cp = require('child_process');
          const path = require('path');
          const root = 'docs/auto-execute/evidence/chatgpt-pro-final';
          const real = JSON.parse(fs.readFileSync(path.join(root, 'real-model-g00-t20-summary.json'), 'utf8'));
          const structural = JSON.parse(fs.readFileSync(path.join(root, 'static-convergence.json'), 'utf8'));
          const branches = JSON.parse(fs.readFileSync(path.join(root, 'branch-persistence.json'), 'utf8'));
          for (const [name, value] of Object.entries({ real, structural, branches })) {
            if (value.verdict !== 'PASS') throw new Error(`${name.toUpperCase()}_NOT_PASS`);
          }
          const logs = fs.readdirSync(root).filter((name) => name.endsWith('.log')).sort();
          const logSha256 = Object.fromEntries(logs.map((name) => [
            name,
            crypto.createHash('sha256').update(fs.readFileSync(path.join(root, name))).digest('hex'),
          ]));
          const report = {
            schemaVersion: 'omw.chatgpt-pro-candidate-ready.v1',
            status: 'CANDIDATE_BRANCH_READY',
            repository: 'forwardFish/aiStoryRoom',
            branch: 'codex/chatgpt-pro-ai-story-convergence',
            testedSourceSha: cp.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            frozenBaseSha: '1b750e56858dabefb0ddb8b922c6bdcbe0574e4c',
            mainUntouched: cp.execFileSync('git', ['rev-parse', 'origin/main'], { encoding: 'utf8' }).trim() === '1b750e56858dabefb0ddb8b922c6bdcbe0574e4c',
            deterministicGates: {
              lockedInstall: 'PASS', templatesTypecheck: 'PASS', templatesBuild: 'PASS',
              storyPackage: 'PASS', openNovelTypecheck: 'PASS', openNovelBuild: 'PASS',
              storyV4: 'PASS', openNovelTests: 'PASS', staticConvergence: 'PASS',
              branchPersistence: 'PASS', httpSmoke: 'PASS', immutableAssetRecompile: 'PASS',
            },
            realModel: {
              verdict: real.verdict,
              providerBaseUrl: real.providerBaseUrl,
              expectedModel: real.expectedModel,
              observedModels: real.observedModels,
              providerCallCount: real.providerCallCount,
              fixtureSignalCount: real.fixtureSignalCount,
              opening: real.opening,
              turnCount: real.turnCount,
              turns: real.turns,
            },
            structuralCounts: structural.counts,
            branchDivergence: branches.divergence,
            logSha256,
            generatedAt: new Date().toISOString(),
          };
          if (!report.mainUntouched) throw new Error('MAIN_CHANGED');
          fs.writeFileSync(path.join(root, 'candidate-ready.json'), JSON.stringify(report, null, 2) + '\n');
          fs.writeFileSync(path.join(root, 'CANDIDATE_BRANCH_READY.md'), [
            '# CANDIDATE_BRANCH_READY', '',
            `- Repository: ${report.repository}`,
            `- Branch: ${report.branch}`,
            `- Tested source SHA: ${report.testedSourceSha}`,
            `- Frozen baseline/main SHA: ${report.frozenBaseSha}`,
            '- Deterministic engineering gates: PASS',
            `- Real provider: ${report.realModel.providerBaseUrl}`,
            `- Real model observed: ${report.realModel.observedModels.join(', ')}`,
            `- Provider calls: ${report.realModel.providerCallCount}`,
            '- Continuous player acceptance: G00 and T01-T20 PASS',
            '- Fixture/mock signals: 0',
            '- main modified or merged: NO', '',
            'Final validation and any merge into main remain the responsibility of local Codex.', '',
          ].join('\n'));
          NODE

          rm -f docs/auto-execute/PARTIAL_SUBMISSION_AI_STORY_CONVERGENCE_2026-08-05.md
          find docs/auto-execute -maxdepth 1 -type f \( \
            -name '.connector-*' -o \
            -name '.multi-file-*' -o \
            -name '.pre-push-*' -o \
            -name '.push-files-*' -o \
            -name '.chatgpt-pro-*.patch' -o \
            -name '.chatgpt-pro-*.patch.gz.b64' -o \
            -name '.chatgpt-pro-*.tar.gz' -o \
            -name '.chatgpt-pro-source-bootstrap.md' \
          \) -delete
          find .github/workflows -maxdepth 1 -type f -name 'chatgpt-pro-*' -delete
          git diff --check

      - name: Commit and push only the candidate branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "${FROZEN_BASE_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "test(ai-story): record final G00-T20 candidate acceptance"
          git fetch origin "${CANDIDATE_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.base.sha }}"
          git push origin HEAD:"${CANDIDATE_BRANCH}"
