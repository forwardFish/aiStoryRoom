name: Settled Reaction Real Product V2

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/settled-reaction-real-product-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  land-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TARGET_BRANCH: codex/chatgpt-pro-dynamic-kernel-lite
      PRODUCT_BASE: 321a9aa03ce33201a59da63350e385b885023d77
      EVIDENCE_ROOT: /tmp/settled-reaction-real-product-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chatgpt-pro-dynamic-kernel-lite
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Materialize and push real product code first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git branch --show-current)" = "${TARGET_BRANCH}"

          if [ ! -f packages/templates/src/story-package/requirement-dependency.ts ]; then
            python .github/repair/requirement-dependency-product.py
            python .github/repair/requirement-dependency-selection-purpose.py
            python .github/repair/requirement-dependency-due-override.py
            python .github/repair/requirement-dependency-due-test-fix.py
          fi
          if ! grep -R -q "SettledReactionContract" \
            packages/templates apps/openovel-runtime apps/api; then
            python .github/repair/settled-reaction-contract.py
          fi

          git diff --check
          git diff --name-status -- packages apps scripts \
            | tee "${EVIDENCE_ROOT}/logs/00-product-diff-before-commit.log"
          test -n "$(git diff --name-only -- packages apps scripts)"
          test -f packages/templates/src/story-package/requirement-dependency.ts
          grep -R "SettledReactionContract" \
            packages/templates apps/openovel-runtime apps/api \
            > "${EVIDENCE_ROOT}/logs/01-settled-reaction-symbols.log"
          grep -R "UnboundActionNarrativeSource" \
            packages/templates apps/openovel-runtime apps/api \
            > "${EVIDENCE_ROOT}/logs/02-unbound-source-symbols.log"

          git add -- packages apps scripts
          git diff --cached --check
          git commit -m "feat(kernel-lite): persist requirement and settled reaction contracts"
          git push origin HEAD:${TARGET_BRANCH}
          git rev-parse HEAD > "${EVIDENCE_ROOT}/product-sha.txt"
          git rev-parse HEAD^{tree} > "${EVIDENCE_ROOT}/product-tree.txt"
          git diff --name-status "${PRODUCT_BASE}"..HEAD -- packages apps scripts \
            | tee "${EVIDENCE_ROOT}/product-files.txt"
          test -n "$(cat "${EVIDENCE_ROOT}/product-files.txt")"

      - name: Install frozen workspace
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 \
            | tee "${EVIDENCE_ROOT}/logs/03-install.log"

      - name: Run complete deterministic matrix
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          results="${EVIDENCE_ROOT}/results.tsv"
          : > "${results}"
          failed=0
          run_gate() {
            local label="$1"
            shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${results}"
            if [ "${code}" -ne 0 ]; then failed=1; fi
          }
          run_gate 04-story-v4 pnpm test:story:v4
          run_gate 05-templates-typecheck pnpm --filter @ai-story/templates typecheck
          run_gate 06-templates-runtime-contract pnpm --filter @ai-story/templates test:runtime-contract
          run_gate 07-templates-story-package pnpm --filter @ai-story/templates test:story-package
          run_gate 08-templates-build pnpm --filter @ai-story/templates build
          run_gate 09-openovel-typecheck pnpm --filter @apps/openovel-runtime typecheck
          run_gate 10-openovel-test pnpm --filter @apps/openovel-runtime test
          run_gate 11-openovel-build pnpm --filter @apps/openovel-runtime build
          run_gate 12-prisma-generate pnpm db:generate
          run_gate 13-api-solo pnpm --filter @apps/api test:solo-story-engine
          run_gate 14-api-legacy-sangtian pnpm --filter @apps/api test:solo-story-engine:legacy-sangtian
          run_gate 15-branch-persistence pnpm test:story:branch-persistence
          run_gate 16-story-options pnpm test:story:options
          run_gate 17-story-convergence pnpm test:story:convergence
          if [ "${failed}" -eq 0 ]; then
            printf 'pass\n' > "${EVIDENCE_ROOT}/status.txt"
          else
            printf 'fail\n' > "${EVIDENCE_ROOT}/status.txt"
          fi

      - name: Parse and commit exact failure evidence when needed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/settled-reaction-real-product-v2')
          rows = []
          results = root / 'results.tsv'
          if results.exists():
              for line in results.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  label, code, log_path = line.split('\t', 2)
                  path = Path(log_path)
                  text = path.read_text(encoding='utf-8', errors='replace') if path.exists() else ''
                  def last(pattern):
                      matches = re.findall(pattern, text, flags=re.MULTILINE)
                      return int(matches[-1]) if matches else None
                  rows.append({
                      'label': label,
                      'tests': last(r'^# tests\s+(\d+)\s*$'),
                      'pass': last(r'^# pass\s+(\d+)\s*$'),
                      'fail': last(r'^# fail\s+(\d+)\s*$'),
                      'skip': last(r'^# skipped\s+(\d+)\s*$'),
                      'todo': last(r'^# todo\s+(\d+)\s*$'),
                      'exitCode': int(code),
                      'logPath': log_path,
                      'failureTail': '\n'.join(text.splitlines()[-160:]) if int(code) else '',
                  })
          payload = {
              'productSha': (root / 'product-sha.txt').read_text().strip() if (root / 'product-sha.txt').exists() else None,
              'productTree': (root / 'product-tree.txt').read_text().strip() if (root / 'product-tree.txt').exists() else None,
              'status': (root / 'status.txt').read_text().strip() if (root / 'status.txt').exists() else 'missing',
              'commands': rows,
          }
          root.mkdir(parents=True, exist_ok=True)
          (root / 'evidence.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          if [ ! -f "${EVIDENCE_ROOT}/status.txt" ] \
            || [ "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" != pass ]; then
            mkdir -p .github/diagnostics
            cp "${EVIDENCE_ROOT}/evidence.json" \
              .github/diagnostics/settled-reaction-product-v2.json
            git add .github/diagnostics/settled-reaction-product-v2.json
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git commit -m "test(kernel-lite): record exact settled reaction failures"
              git push origin HEAD:${TARGET_BRANCH}
            fi
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settled-reaction-real-product-v2-${{ github.sha }}
          path: /tmp/settled-reaction-real-product-v2/
          if-no-files-found: error
          retention-days: 7

      - name: Green cleanup and final push
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${EVIDENCE_ROOT}/status.txt"
          if [ "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" != pass ]; then
            exit 0
          fi

          mkdir -p docs
          cp "${EVIDENCE_ROOT}/evidence.json" \
            docs/Dynamic_Kernel_Lite_Settled_Reaction_Deterministic_Evidence.json
          git add docs/Dynamic_Kernel_Lite_Settled_Reaction_Deterministic_Evidence.json
          git rm -r --ignore-unmatch \
            .github/bootstrap/requirement-dependency-fast-forward
          git rm -f --ignore-unmatch \
            .github/repair/requirement-dependency-* \
            .github/repair/settled-reaction-contract.py \
            .github/workflows/requirement-dependency-* \
            .github/workflows/settled-reaction-* \
            .github/diagnostics/settled-reaction-*.json
          git diff --cached --check
          git commit -m "chore(kernel-lite): remove delivery scaffolding"

          test -z "$(git ls-files '.github/repair/requirement-dependency-*')"
          test -z "$(git ls-files '.github/repair/settled-reaction-contract.py')"
          test -z "$(git ls-files '.github/bootstrap/requirement-dependency-fast-forward/*')"
          test -z "$(git ls-files '.github/workflows/requirement-dependency-*')"
          test -z "$(git ls-files '.github/workflows/settled-reaction-*')"
          git diff --name-status "${PRODUCT_BASE}"..HEAD -- packages apps scripts \
            > "${EVIDENCE_ROOT}/final-product-files.txt"
          git diff --name-status "${PRODUCT_BASE}"..HEAD -- .github \
            > "${EVIDENCE_ROOT}/final-github-files.txt"
          test -n "$(cat "${EVIDENCE_ROOT}/final-product-files.txt")"
          git rev-parse HEAD > "${EVIDENCE_ROOT}/final-sha.txt"
          git rev-parse HEAD^{tree} > "${EVIDENCE_ROOT}/final-tree.txt"
          git push origin HEAD:${TARGET_BRANCH}
