name: Requirement Dependency Product Delivery

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/requirement-dependency-product-delivery.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EVIDENCE_ROOT: /tmp/requirement-dependency-product-delivery
      HISTORICAL_IMPLEMENTATION_SHA: 40908fd7583ea4006f328903d4b65c660670ad38
    steps:
      - name: Checkout exact branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          pnpm install --frozen-lockfile 2>&1 \
            | tee "${EVIDENCE_ROOT}/logs/00-install.log"

      - name: Materialize tracked product implementation
        shell: bash
        run: |
          set -euo pipefail
          git show "${HISTORICAL_IMPLEMENTATION_SHA}:.github/repair/dynamic-kernel-requirement-dependency.py.gz.b64" \
            | tr -d '[:space:]' \
            | base64 --decode \
            | gzip --decompress \
            > "${RUNNER_TEMP}/requirement-dependency-base.py"
          for file in \
            dynamic-kernel-requirement-dependency-round1-format.py \
            dynamic-kernel-dependency-runtime-semantics.py \
            dynamic-kernel-dependency-predecessor-kernels.py; do
            git show "${HISTORICAL_IMPLEMENTATION_SHA}:.github/repair/${file}" \
              > "${RUNNER_TEMP}/${file}"
          done

          python "${RUNNER_TEMP}/requirement-dependency-base.py"
          python "${RUNNER_TEMP}/dynamic-kernel-requirement-dependency-round1-format.py"
          python "${RUNNER_TEMP}/dynamic-kernel-dependency-runtime-semantics.py"
          python "${RUNNER_TEMP}/dynamic-kernel-dependency-predecessor-kernels.py"

          SANGTIAN_SKIP_SOURCE_WRITES=1 \
          SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring-output" \
          SANGTIAN_RUNTIME_PACKAGE_PATH="${GITHUB_WORKSPACE}/packages/templates/config/sangtian/story-package/part-one-runtime.json" \
            node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/01-compile-runtime-package.log"

          git diff --check
          git diff --name-status \
            | tee "${EVIDENCE_ROOT}/product-files-before-commit.txt"

          test -f packages/templates/src/story-package/requirement-dependency.ts
          grep -q 'predecessorRequirementId' packages/templates/src/story-package/requirement-dependency.ts
          grep -q 'successorRequirementId' packages/templates/src/story-package/requirement-dependency.ts
          grep -q 'requirementDependencies' packages/templates/src/story-package/part-one-runtime-types.ts
          grep -q 'REQ-P1-REVIEW-AUTHORITY' packages/templates/authoring/sangtian/requirements/part-01.requirements.json
          grep -q 'requirementDependencies' packages/templates/config/sangtian/story-package/part-one-runtime.json

          if git diff --quiet 321a9aa03ce33201a59da63350e385b885023d77 -- \
            packages/templates \
            scripts/story-decomposition; then
            echo 'Product tree did not change' >&2
            exit 1
          fi

      - name: Create exact candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            packages/templates/src/story-package/requirement-dependency.ts \
            packages/templates/src/story-package/part-one-runtime-types.ts \
            packages/templates/src/story-package/index.ts \
            packages/templates/src/story-package/part-one-runtime-loader.ts \
            packages/templates/src/story-package/dynamic-kernel-lite-runtime.ts \
            packages/templates/src/runtime-contract/kernel-selector-lite.ts \
            packages/templates/tests/requirement-dependency.test.ts \
            packages/templates/tests/part-one-dynamic-kernel-lite.test.ts \
            packages/templates/package.json \
            packages/templates/authoring/sangtian/requirements/part-01.requirements.json \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            scripts/story-decomposition/lib/requirement-dependency.mjs \
            scripts/story-decomposition/build-sangtian-part-one-authoring.mjs \
            scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs
          git rm .github/workflows/requirement-dependency-product-delivery.yml
          git diff --cached --check
          git commit -m "feat(kernel-lite): add validated requirement dependency routing"
          git rev-parse HEAD > "${EVIDENCE_ROOT}/tested-sha.txt"
          git rev-parse HEAD^{tree} > "${EVIDENCE_ROOT}/tested-tree.txt"
          git diff --name-status 321a9aa03ce33201a59da63350e385b885023d77..HEAD \
            > "${EVIDENCE_ROOT}/product-files.txt"
          test -z "$(git status --porcelain)"

      - name: Run complete deterministic matrix on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "${EVIDENCE_ROOT}/tested-sha.txt")"
          results="${EVIDENCE_ROOT}/results.tsv"
          : > "${results}"
          failed=0
          run_gate() {
            local label="$1"
            shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${results}"
            if [ "${code}" -ne 0 ]; then failed=1; fi
          }

          run_gate 02-story-v4 pnpm test:story:v4
          run_gate 03-templates-typecheck pnpm --filter @ai-story/templates typecheck
          run_gate 04-templates-runtime-contract pnpm --filter @ai-story/templates test:runtime-contract
          run_gate 05-templates-story-package pnpm --filter @ai-story/templates test:story-package
          run_gate 06-templates-build pnpm --filter @ai-story/templates build
          run_gate 07-openovel-typecheck pnpm --filter @apps/openovel-runtime typecheck
          run_gate 08-openovel-test pnpm --filter @apps/openovel-runtime test
          run_gate 09-openovel-build pnpm --filter @apps/openovel-runtime build
          run_gate 10-prisma-generate pnpm db:generate
          run_gate 11-api-solo pnpm --filter @apps/api test:solo-story-engine
          run_gate 12-api-legacy-sangtian pnpm --filter @apps/api test:solo-story-engine:legacy-sangtian
          run_gate 13-branch-persistence pnpm test:story:branch-persistence
          run_gate 14-story-options pnpm test:story:options
          run_gate 15-story-convergence pnpm test:story:convergence

          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_ROOT'])
          patterns = {
              'tests': re.compile(r'^# tests (\d+)$', re.MULTILINE),
              'pass': re.compile(r'^# pass (\d+)$', re.MULTILINE),
              'fail': re.compile(r'^# fail (\d+)$', re.MULTILINE),
              'skip': re.compile(r'^# skipped (\d+)$', re.MULTILINE),
              'todo': re.compile(r'^# todo (\d+)$', re.MULTILINE),
          }
          rows = []
          for line in (root / 'results.tsv').read_text().splitlines():
              label, code, log_path = line.split('\t', 2)
              text = Path(log_path).read_text(errors='replace')
              row = {'command': label, 'exitCode': int(code), 'logPath': log_path}
              for key, pattern in patterns.items():
                  values = pattern.findall(text)
                  row[key] = int(values[-1]) if values else None
              rows.append(row)
          summary = {
              'baseSha': '321a9aa03ce33201a59da63350e385b885023d77',
              'baseTree': '2a1f4e09efe698e797dd80ed176cf75bf5d1796e',
              'testedSha': (root / 'tested-sha.txt').read_text().strip(),
              'testedTree': (root / 'tested-tree.txt').read_text().strip(),
              'commands': rows,
              'supabaseFormal': 'NOT_RUN',
              'deepSeek': 'NOT_RUN',
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY

          if [ "${failed}" -ne 0 ]; then
            printf 'fail\n' > "${EVIDENCE_ROOT}/status.txt"
            exit 1
          fi
          printf 'pass\n' > "${EVIDENCE_ROOT}/status.txt"

      - name: Upload exact candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirement-dependency-product-${{ github.sha }}
          path: /tmp/requirement-dependency-product-delivery/
          if-no-files-found: error
          retention-days: 7

      - name: Push exact tested product commit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "${EVIDENCE_ROOT}/status.txt")" = pass
          test "$(git rev-parse HEAD)" = "$(cat "${EVIDENCE_ROOT}/tested-sha.txt")"
          git push origin HEAD:codex/chatgpt-pro-dynamic-kernel-lite
          git rev-parse HEAD > "${EVIDENCE_ROOT}/final-sha.txt"
