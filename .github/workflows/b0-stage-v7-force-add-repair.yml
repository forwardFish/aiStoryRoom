name: B0 Stage V7 Forced Evidence Add Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage-v7-force-add-repair.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage-v7-force-add-repair
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_EXPECTED_PARENT: d936a7c02ab3c9f34468c2f1702949b6efa6cf92

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact ordinary fast-forward start
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$B0_EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage-v7-force-add-repair.yml"

      - name: Patch only the ignored evidence staging command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/b0-fail-closed-finalizer-v7.yml')
          source = path.read_text(encoding='utf-8')
          old = '          git add "$B0_ROOT"\n'
          new = '          git add -f "$B0_ROOT"\n'
          if source.count(old) != 1:
              raise SystemExit(f'v7 force-add anchor count={source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -F 'git add -f "$B0_ROOT"' .github/workflows/b0-fail-closed-finalizer-v7.yml
          test "$(git diff --name-only)" = ".github/workflows/b0-fail-closed-finalizer-v7.yml"

      - name: Commit repaired v7 workflow and upload the commit object
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/b0-fail-closed-finalizer-v7.yml
          test "$(git diff --cached --name-only)" = ".github/workflows/b0-fail-closed-finalizer-v7.yml"
          git diff --cached --check
          git commit -m "ci(b0): force-add the ignored evidence tree"
          candidate="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "V7_FORCE_ADD_REPAIR_COMMIT_SHA=$candidate"
          set +e
          git push origin "HEAD:$B0_BRANCH"
          status=$?
          set -e
          echo "push_status=$status" >> "$GITHUB_OUTPUT"
          if test "$status" -eq 0; then
            test "$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')" = "$candidate"
          else
            echo "Workflow-token ref update rejected after object transfer; connector must perform the verified force=false fast-forward."
          fi

      - name: Publish staged object status
        if: always()
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ steps.commit.outputs.candidate_sha }}
          PUSH_STATUS: ${{ steps.commit.outputs.push_status }}
        with:
          script: |
            const ok = Boolean(process.env.CANDIDATE_SHA);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'b0/v7-force-add-repair',
              description: ok ? `staged ${process.env.CANDIDATE_SHA.slice(0,12)} push=${process.env.PUSH_STATUS}` : `repair failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!ok) core.setFailed('v7 force-add repair failed');
