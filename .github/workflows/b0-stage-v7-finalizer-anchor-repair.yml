name: B0 Stage V7 Finalizer Anchor Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage-v7-finalizer-anchor-repair.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage-v7-finalizer-anchor-repair
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_EXPECTED_PARENT: d0eb8fc82e8b039cf20b1aa2a44c9df60953329e

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publish repair locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/v7-anchor-repair",
              description: `v7 baseline-anchor repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact ordinary fast-forward start
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH" main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$B0_EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage-v7-finalizer-anchor-repair.yml"
          test -z "$(git status --short)"

      - name: Patch v7 to validate ancestry instead of stale main equality
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/b0-fail-closed-finalizer-v7.yml")
          source = path.read_text(encoding="utf-8")
          old = '''          set -euo pipefail
                    git fetch origin "$B0_BRANCH" main
                    test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
                    test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
                    test "$(git rev-parse origin/main)" = "$B0_MAIN_BASELINE"
                    test -z "$(git status --short)"
                    mkdir -p .artifacts/b0-finalizer-v7
                    printf '%s\\n' "$GITHUB_SHA" > .artifacts/b0-finalizer-v7/local-head.txt
                    printf '%s\\n' "$(git rev-parse origin/$B0_BRANCH)" > .artifacts/b0-finalizer-v7/remote-tip-before-push.txt
          '''.replace("          ", "")
          new = '''          set -euo pipefail
                    mkdir -p .artifacts/b0-finalizer-v7
                    git fetch origin "$B0_BRANCH" main
                    test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
                    test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
                    git cat-file -e "$B0_MAIN_BASELINE^{commit}"
                    git merge-base --is-ancestor "$B0_MAIN_BASELINE" HEAD
                    test -z "$(git status --short)"
                    printf '%s\\n' "$GITHUB_SHA" > .artifacts/b0-finalizer-v7/local-head.txt
                    printf '%s\\n' "$(git rev-parse origin/$B0_BRANCH)" > .artifacts/b0-finalizer-v7/remote-tip-before-push.txt
                    printf '%s\\n' "$(git rev-parse origin/main)" > .artifacts/b0-finalizer-v7/remote-main-at-finalization.txt
          '''.replace("          ", "")
          if source.count(old) != 1:
              raise SystemExit(f"v7 anchor count={source.count(old)}")
          source = source.replace(old, new, 1)

          copy_anchor = '''          shutil.copy2(stage / "status-summary.json", c9 / "gates/status-summary.json")
                    shutil.copy2(stage / "downloads/selected-artifacts.json", c9 / "gates/selected-artifacts.json")
          '''.replace("          ", "")
          copy_replacement = '''          shutil.copy2(stage / "status-summary.json", c9 / "gates/status-summary.json")
                    shutil.copy2(stage / "downloads/selected-artifacts.json", c9 / "gates/selected-artifacts.json")
                    shutil.copy2(stage / "remote-main-at-finalization.txt", c9 / "readback/remote-main-at-finalization.txt")
          '''.replace("          ", "")
          if source.count(copy_anchor) != 1:
              raise SystemExit(f"v7 readback copy anchor count={source.count(copy_anchor)}")
          path.write_text(source.replace(copy_anchor, copy_replacement, 1), encoding="utf-8")
          PY
          git diff --check
          grep -F 'git merge-base --is-ancestor "$B0_MAIN_BASELINE" HEAD' .github/workflows/b0-fail-closed-finalizer-v7.yml
          grep -F 'remote-main-at-finalization.txt' .github/workflows/b0-fail-closed-finalizer-v7.yml
          test "$(git diff --name-only)" = ".github/workflows/b0-fail-closed-finalizer-v7.yml"

      - name: Commit repaired v7 workflow and upload the object
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/b0-fail-closed-finalizer-v7.yml
          test "$(git diff --cached --name-only)" = ".github/workflows/b0-fail-closed-finalizer-v7.yml"
          git diff --cached --check
          git commit -m "ci(b0): anchor v7 to the required main ancestor"
          candidate="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          set +e
          git push origin "HEAD:$B0_BRANCH"
          push_status=$?
          set -e
          echo "push_status=$push_status" >> "$GITHUB_OUTPUT"
          echo "V7_REPAIRED_COMMIT_SHA=$candidate"
          if test "$push_status" -eq 0; then
            after="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
            test "$after" = "$candidate"
          else
            echo "Workflow-token ref update was rejected after object upload; connector must perform the verified non-force fast-forward ref update."
          fi

      - name: Publish repair outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ steps.commit.outputs.candidate_sha }}
          PUSH_STATUS: ${{ steps.commit.outputs.push_status }}
        with:
          script: |
            const staged = process.env.JOB_STATUS === "success" && Boolean(process.env.CANDIDATE_SHA);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: staged ? "success" : "failure",
              context: "b0/v7-anchor-repair",
              description: staged ? `v7 repair object ${process.env.CANDIDATE_SHA.slice(0, 12)} staged; push=${process.env.PUSH_STATUS}` : `v7 anchor repair failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!staged) core.setFailed("B0 v7 anchor repair failed");
