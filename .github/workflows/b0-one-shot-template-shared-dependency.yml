name: B0 One-Shot Template Shared Dependency Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-template-shared-dependency.yml

permissions:
  contents: write

concurrency:
  group: b0-one-shot-template-shared-dependency
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact branch tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
      - name: Declare the real runtime dependency and update the frozen importer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path("packages/templates/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          existing = package.get("dependencies", {})
          if existing not in ({}, {"@ai-story/shared": "workspace:*"}):
              raise SystemExit(f"unexpected templates dependencies: {existing}")
          package["dependencies"] = {"@ai-story/shared": "workspace:*"}
          ordered = {}
          for key in ("name", "version", "private", "main", "types", "scripts", "dependencies", "devDependencies"):
              if key in package:
                  ordered[key] = package[key]
          package_path.write_text(json.dumps(ordered, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          lock_path = Path("pnpm-lock.yaml")
          lock = lock_path.read_text(encoding="utf-8")
          old = """  packages/templates:\n    devDependencies:\n      typescript:\n        specifier: ^5.9.3\n        version: 5.9.3\n"""
          new = """  packages/templates:\n    dependencies:\n      '@ai-story/shared':\n        specifier: workspace:*\n        version: link:../shared\n    devDependencies:\n      typescript:\n        specifier: ^5.9.3\n        version: 5.9.3\n"""
          if old in lock:
              if lock.count(old) != 1:
                  raise SystemExit("templates importer is not unique")
              lock = lock.replace(old, new)
          elif new not in lock:
              raise SystemExit("templates importer has an unexpected shape")
          lock_path.write_text(lock, encoding="utf-8")
          PY
          git diff --check
          git diff -- packages/templates/package.json pnpm-lock.yaml
      - name: Commit the atomic repair and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/templates/package.json pnpm-lock.yaml
          git rm .github/workflows/b0-one-shot-template-shared-dependency.yml
          git diff --cached --check
          git commit -m "fix(openovel): declare shared runtime dependency"
          git push origin "HEAD:$GITHUB_REF_NAME"
