name: Dynamic Kernel Structural Candidate Trace

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-candidate-trace.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_ROOT: /tmp/dynamic-kernel-candidate-trace
    steps:
      - name: Publish trace status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/candidate-trace" \
            -f description="Structural candidate trace running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply current repair layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}"
          tr -d '[:space:]' < .github/repair/dynamic-kernel-followup.patch.gz.b64 \
            | base64 --decode | gzip --decompress > "${RUNNER_TEMP}/followup.patch"
          git apply --check "${RUNNER_TEMP}/followup.patch"
          git apply "${RUNNER_TEMP}/followup.patch"
          python .github/repair/apply-dynamic-kernel-final-repair.py
          python .github/repair/apply-dynamic-kernel-continuity-repair.py
          pnpm install --frozen-lockfile
      - name: Capture opening candidate trace
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE' \
            | tee "${EVIDENCE_ROOT}/opening-candidate-trace.json"
          import { resolve } from "node:path";
          import {
            loadPlayablePartOneRuntimePackage,
          } from "./packages/templates/src/story-package/playable-part-one-runtime.ts";
          import {
            createInitialPartOneState,
          } from "./packages/templates/src/story-package/part-one-runtime-engine.ts";
          import {
            settleDynamicPartOneAction,
          } from "./packages/templates/src/story-package/dynamic-kernel-lite-settlement.ts";

          const pkg = loadPlayablePartOneRuntimePackage(
            "sangtian",
            resolve("packages/templates/config"),
          ).package;
          const initial = createInitialPartOneState(pkg);
          const settlement = settleDynamicPartOneAction(
            pkg,
            initial,
            {
              source: "RECOMMENDED",
              decisionId: "opening_d1",
              actionText: "opening_d1",
            },
            1,
          );
          const trace = settlement.event.nextKernelSelection;
          console.log(JSON.stringify({
            state: {
              sectionId: settlement.proposedState.sectionId,
              completedKernelIds: settlement.proposedState.completedKernelIds,
              review: settlement.proposedState.review,
              reform: settlement.proposedState.reform,
              responsibility: settlement.proposedState.responsibility,
              pendingConsequences: settlement.proposedState.pendingConsequences,
            },
            nextDecisionPoint: settlement.event.nextDecisionPoint,
            selected: trace && {
              mode: trace.mode,
              kernelId: trace.selectedKernelId,
              affordanceIds: trace.selectedAffordanceIds,
            },
            candidates: trace?.candidates,
            kernelStructures: pkg.assets
              .filter((asset) => asset.assetType === "DECISION_KERNEL")
              .filter((asset) => asset.sectionIds.includes("SEC-P1-01"))
              .map((asset) => ({
                kernelId: asset.assetId,
                requirementIds: asset.requirementIds,
                causalArcIds: asset.causalArcIds,
                stateDependencies: asset.stateDependencies,
              })),
          }, null, 2));
          NODE
      - name: Upload trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-candidate-trace-${{ github.sha }}
          path: /tmp/dynamic-kernel-candidate-trace/
          if-no-files-found: error
          retention-days: 3
      - name: Publish trace completion
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="dynamic-kernel-lite/candidate-trace" \
            -f description="Structural candidate trace uploaded" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
