name: Export Exact Settled Reaction Product Baseline

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/settled-reaction-complete-delivery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8fba8ef1e0305a6651b2b2cd7eb737815da07ab8
          fetch-depth: 0

      - name: Archive exact baseline repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8fba8ef1e0305a6651b2b2cd7eb737815da07ab8"
          git archive \
            --format=zip \
            --output=/tmp/aiStoryRoom-8fba8ef1.zip \
            8fba8ef1e0305a6651b2b2cd7eb737815da07ab8
          sha256sum /tmp/aiStoryRoom-8fba8ef1.zip \
            > /tmp/aiStoryRoom-8fba8ef1.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: aiStoryRoom-exact-baseline-8fba8ef1
          path: |
            /tmp/aiStoryRoom-8fba8ef1.zip
            /tmp/aiStoryRoom-8fba8ef1.zip.sha256
          if-no-files-found: error
          retention-days: 2
