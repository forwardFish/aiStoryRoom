name: Settled Reaction Complete Product Delivery

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/settled-reaction-complete-delivery.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BRANCH: codex/chatgpt-pro-dynamic-kernel-lite
      PRODUCT_BASE: c6aafdc1a68811839c56e5e8ab3cdc9c3c3ac4ad
      EVIDENCE_ROOT: /tmp/settled-reaction-complete-delivery
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/settled-reaction-complete" \
            -f description="Building complete reaction and unbound narrative contracts" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: codex/chatgpt-pro-dynamic-kernel-lite
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Materialize real product source
        id: materialize
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          git rev-parse HEAD > "${EVIDENCE_ROOT}/transport-sha.txt"
          git merge-base --is-ancestor "${PRODUCT_BASE}" HEAD
          test "$(git branch --show-current)" = "${TARGET_BRANCH}"
          status=0
          python .github/transport/settled-reaction-contract-product.py \
            > "${EVIDENCE_ROOT}/logs/01-product-types.log" 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            python .github/transport/settled-reaction-wiring.py \
              > "${EVIDENCE_ROOT}/logs/02-product-wiring.log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python .github/transport/settled-reaction-tests.py \
              > "${EVIDENCE_ROOT}/logs/03-product-tests.log" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            SANGTIAN_SKIP_SOURCE_WRITES=1 \
            SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring-output" \
            SANGTIAN_RUNTIME_PACKAGE_PATH="${GITHUB_WORKSPACE}/packages/templates/config/sangtian/story-package/part-one-runtime.json" \
              node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
              > "${EVIDENCE_ROOT}/logs/04-compile-authoring.log" 2>&1 || status=$?
          fi
          git diff --name-status -- packages apps scripts \
            > "${EVIDENCE_ROOT}/materialized-product-files.txt"
          git diff --check > "${EVIDENCE_ROOT}/logs/05-diff-check.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "${EVIDENCE_ROOT}/materialize-exit-code.txt"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          test -s "${EVIDENCE_ROOT}/materialized-product-files.txt"
          test -f packages/templates/src/story-package/settled-reaction-contract.ts
          grep -q 'schemaVersion: "settled-reaction-contract-v1"' \
            packages/templates/src/story-package/part-one-runtime-types.ts
          grep -q 'schemaVersion: "unbound-action-narrative-source-v1"' \
            packages/templates/src/story-package/part-one-runtime-types.ts

      - name: Install frozen workspace
        id: install
        if: steps.materialize.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile \
            > "${EVIDENCE_ROOT}/logs/06-install.log" 2>&1

      - name: Run focused deterministic product tests
        id: tests
        if: steps.materialize.outcome == 'success' && steps.install.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          results="${EVIDENCE_ROOT}/results.tsv"
          : > "$results"
          failed=0
          run_gate() {
            label="$1"; shift
            log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" > "$log" 2>&1
            code=$?
            set -e
            printf '%s\t%s\t%s\n' "$label" "$code" "$log" >> "$results"
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          run_gate 07-templates-typecheck \
            pnpm --filter @ai-story/templates typecheck
          run_gate 08-settled-reaction-focused \
            pnpm --filter @ai-story/templates test:settled-reaction-contract
          run_gate 09-templates-story-package \
            pnpm --filter @ai-story/templates test:story-package
          run_gate 10-api-solo \
            pnpm --filter @apps/api test:solo-story-engine
          if [ "$failed" -eq 0 ]; then
            echo pass > "${EVIDENCE_ROOT}/test-status.txt"
          else
            echo fail > "${EVIDENCE_ROOT}/test-status.txt"
            exit 1
          fi

      - name: Commit and push tested product source
        id: product
        if: steps.tests.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(cat "${EVIDENCE_ROOT}/test-status.txt")" = pass
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages apps scripts
          git diff --cached --check
          git diff --cached --name-status -- packages apps scripts \
            > "${EVIDENCE_ROOT}/product-commit-files.txt"
          test -s "${EVIDENCE_ROOT}/product-commit-files.txt"
          git commit -m "feat(kernel-lite): complete settled reaction and unbound narrative contracts"
          git rev-parse HEAD > "${EVIDENCE_ROOT}/product-commit-sha.txt"
          git rev-parse HEAD^{tree} > "${EVIDENCE_ROOT}/product-tree.txt"
          git diff --name-status "${PRODUCT_BASE}"..HEAD -- packages apps scripts \
            > "${EVIDENCE_ROOT}/product-diff-from-base.txt"
          test -s "${EVIDENCE_ROOT}/product-diff-from-base.txt"
          git push origin HEAD:"${TARGET_BRANCH}"

      - name: Remove temporary transport after product push
        id: cleanup
        if: steps.product.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .github/transport
          git rm -f --ignore-unmatch \
            .github/workflows/settled-reaction-complete-delivery.yml
          git diff --cached --check
          git commit -m "chore(kernel-lite): remove settled reaction delivery transport"
          git rev-parse HEAD > "${EVIDENCE_ROOT}/final-remote-sha.txt"
          git rev-parse HEAD^{tree} > "${EVIDENCE_ROOT}/final-tree.txt"
          git push origin HEAD:"${TARGET_BRANCH}"
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = \
            "$(git rev-parse origin/${TARGET_BRANCH})"
          test -z "$(git ls-files '.github/transport/*')"
          test -z "$(git ls-files '.github/workflows/settled-reaction-complete-delivery.yml')"
          git diff --name-status "${PRODUCT_BASE}"..HEAD -- .github \
            > "${EVIDENCE_ROOT}/final-github-diff.txt"
          test ! -s "${EVIDENCE_ROOT}/final-github-diff.txt"

      - name: Summarize evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_ROOT"])
          commands = []
          result_file = root / "results.tsv"
          patterns = {
              "tests": re.compile(r"^# tests (\d+)$", re.M),
              "pass": re.compile(r"^# pass (\d+)$", re.M),
              "fail": re.compile(r"^# fail (\d+)$", re.M),
              "skipped": re.compile(r"^# skipped (\d+)$", re.M),
          }
          if result_file.exists():
              for row in result_file.read_text().splitlines():
                  label, code, log_path = row.split("\t", 2)
                  text = Path(log_path).read_text(errors="replace")
                  item = {"label": label, "exitCode": int(code), "log": log_path}
                  for key, pattern in patterns.items():
                      matches = pattern.findall(text)
                      item[key] = int(matches[-1]) if matches else None
                  commands.append(item)
          def value(name):
              path = root / name
              return path.read_text().strip() if path.exists() else None
          ready = (
              value("test-status.txt") == "pass"
              and value("product-commit-sha.txt")
              and value("final-remote-sha.txt")
          )
          summary = {
              "status": "pass" if ready else "fail",
              "branch": os.environ["TARGET_BRANCH"],
              "baseRemoteSha": os.environ["PRODUCT_BASE"],
              "transportSha": value("transport-sha.txt"),
              "productCommitSha": value("product-commit-sha.txt"),
              "productTree": value("product-tree.txt"),
              "finalRemoteSha": value("final-remote-sha.txt"),
              "finalTree": value("final-tree.txt"),
              "commands": commands,
              "supabase": "NOT_RUN",
              "deepSeek": "NOT_RUN",
          }
          (root / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n"
          )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settled-reaction-complete-${{ github.sha }}
          path: /tmp/settled-reaction-complete-delivery/
          if-no-files-found: error
          retention-days: 14

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          description="Complete settled-reaction product delivery failed"
          sha="${GITHUB_SHA}"
          if [ -f "${EVIDENCE_ROOT}/summary.json" ] \
            && grep -q '"status": "pass"' "${EVIDENCE_ROOT}/summary.json"; then
            state=success
            description="Complete reaction and unbound narrative contracts passed"
            sha="$(cat "${EVIDENCE_ROOT}/final-remote-sha.txt")"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state="$state" \
            -f context="dynamic-kernel-lite/settled-reaction-complete" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
