name: Apply and Test Exact Settled Reaction Product Sources

# Exact source patch v4; no source-text marker replacement.
on:
  push:
    branches: [codex/chatgpt-pro-dynamic-kernel-lite]
    paths: [.github/workflows/settled-reaction-complete-delivery.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: settled-reaction-exact-product
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/chatgpt-pro-dynamic-kernel-lite
  PRODUCT_BASE: 8fba8ef1e0305a6651b2b2cd7eb737815da07ab8
  PATCH_SHA256: 869a0dc55485bed4b77e93c271cfdd33ae0d6bda55e9d00477ae82e080886d09

jobs:
  apply-test-commit-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chatgpt-pro-dynamic-kernel-lite
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply exact product patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "${TARGET_BRANCH}"
          git merge-base --is-ancestor "${PRODUCT_BASE}" HEAD
          git diff --quiet "${PRODUCT_BASE}"..HEAD -- packages apps scripts
          test -z "$(git status --porcelain)"
          tr -d '[:space:]' \
            < .github/transport/settled-reaction-contract-product.py \
            | base64 --decode > "${RUNNER_TEMP}/product.patch.xz"
          echo "${PATCH_SHA256}  ${RUNNER_TEMP}/product.patch.xz" | sha256sum --check
          xz -dc "${RUNNER_TEMP}/product.patch.xz" > "${RUNNER_TEMP}/product.patch"
          git apply --check "${RUNNER_TEMP}/product.patch"
          git apply "${RUNNER_TEMP}/product.patch"
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/templates/tests/unbound-action-narrative-source.test.ts')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          cat > "${RUNNER_TEMP}/expected-12.txt" <<'EOF'
          apps/api/src/solo-story-engine/context-compiler.ts
          packages/templates/package.json
          packages/templates/src/runtime-facade.ts
          packages/templates/src/story-package/index.ts
          packages/templates/src/story-package/part-one-runtime-engine.ts
          packages/templates/src/story-package/part-one-runtime-types.ts
          packages/templates/src/story-package/settled-reaction-contract.ts
          packages/templates/tests/fixtures/neutral-unbound-world.ts
          packages/templates/tests/part-one-dynamic-kernel-lite.test.ts
          packages/templates/tests/settled-reaction-contract.test.ts
          packages/templates/tests/unbound-action-narrative-source.test.ts
          scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs
          EOF
          {
            git diff --name-only -- packages apps scripts
            git ls-files --others --exclude-standard -- packages apps scripts
          } | sort -u > "${RUNNER_TEMP}/actual-12.txt"
          diff -u "${RUNNER_TEMP}/expected-12.txt" "${RUNNER_TEMP}/actual-12.txt"
          git diff --check
          if grep -E -i 'sangtian|zhejiang|qingliu|巡抚|县册|回文' \
            packages/templates/src/story-package/settled-reaction-contract.ts; then
            exit 1
          fi

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Compile authoritative runtime package
        shell: bash
        run: |
          set -euo pipefail
          SANGTIAN_SKIP_SOURCE_WRITES=1 \
          SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring-output" \
          SANGTIAN_RUNTIME_PACKAGE_PATH="${GITHUB_WORKSPACE}/packages/templates/config/sangtian/story-package/part-one-runtime.json" \
            node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs
          cat > "${RUNNER_TEMP}/expected-13.txt" <<'EOF'
          apps/api/src/solo-story-engine/context-compiler.ts
          packages/templates/config/sangtian/story-package/part-one-runtime.json
          packages/templates/package.json
          packages/templates/src/runtime-facade.ts
          packages/templates/src/story-package/index.ts
          packages/templates/src/story-package/part-one-runtime-engine.ts
          packages/templates/src/story-package/part-one-runtime-types.ts
          packages/templates/src/story-package/settled-reaction-contract.ts
          packages/templates/tests/fixtures/neutral-unbound-world.ts
          packages/templates/tests/part-one-dynamic-kernel-lite.test.ts
          packages/templates/tests/settled-reaction-contract.test.ts
          packages/templates/tests/unbound-action-narrative-source.test.ts
          scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs
          EOF
          {
            git diff --name-only -- packages apps scripts
            git ls-files --others --exclude-standard -- packages apps scripts
          } | sort -u > "${RUNNER_TEMP}/actual-13.txt"
          diff -u "${RUNNER_TEMP}/expected-13.txt" "${RUNNER_TEMP}/actual-13.txt"
          git diff --check

      - name: Focused deterministic test matrix
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-story/templates typecheck
          pnpm --filter @ai-story/templates test:settled-reaction-contract
          pnpm --filter @ai-story/templates test:story-package
          pnpm --filter @ai-story/templates build
          pnpm --filter @apps/openovel-runtime typecheck
          pnpm --filter @apps/openovel-runtime exec node --import tsx --test tests/intent-capability-routing.spec.ts
          pnpm --filter @apps/openovel-runtime test
          pnpm --filter @apps/api test:solo-story-engine
          pnpm test:story:v4

      - name: Commit and push tested 13-file product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t PRODUCT_FILES < "${RUNNER_TEMP}/expected-13.txt"
          git add -- "${PRODUCT_FILES[@]}"
          git diff --cached --check
          git diff --cached --name-only | sort > "${RUNNER_TEMP}/staged-13.txt"
          diff -u "${RUNNER_TEMP}/expected-13.txt" "${RUNNER_TEMP}/staged-13.txt"
          git commit -m "feat(kernel-lite): complete settled reaction and unbound narrative contracts"
          git rev-parse HEAD > "${RUNNER_TEMP}/product-sha.txt"
          git push origin HEAD:"${TARGET_BRANCH}"

      - name: Clean transport only after product push
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/transport/settled-reaction-contract-product.py \
            .github/transport/settled-reaction-wiring.py \
            .github/transport/settled-reaction-tests.py \
            .github/workflows/settled-reaction-complete-delivery.yml
          git diff --cached --check
          git commit -m "chore(kernel-lite): remove settled reaction delivery transport"
          git push origin HEAD:"${TARGET_BRANCH}"
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/${TARGET_BRANCH})"
          echo "PRODUCT_COMMIT_SHA=$(cat "${RUNNER_TEMP}/product-sha.txt")"
          echo "FINAL_REMOTE_SHA=$(git rev-parse HEAD)"
          echo "FINAL_REMOTE_TREE=$(git rev-parse HEAD^{tree})"
          git diff --name-status "${PRODUCT_BASE}"..HEAD -- packages apps scripts
