name: OpenNovel Authoritative Narrative Cycle 1

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/openovel-authoritative-narrative-cycle1.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: openovel-authoritative-narrative-cycle1
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  BASELINE_SHA: 7ab3406c99ccafb68ad410981290a55ea67f40e7
  PATCH_BYTES: "100883"
  PATCH_SHA256: a69ee20236446bfa1b94b0aa4028518984c3c38cf4a64f48fda64b5f848c2854
  PATCH_GZIP_SHA256: 8d38561833381faf688eb038462dd03c8a73d01d969b27eed3b0091d1c8597d3
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aistory_cycle1?schema=public

jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aistory_cycle1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aistory_cycle1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Publish run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "openovel/authoritative-narrative-cycle1",
              description: `cycle 1 product gates running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 250

      - name: Reconstruct and apply verified product patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          test -z "$(git status --short)"

          chunk_dir=.github/openovel-cycle1-patch
          test "$(find "$chunk_dir" -maxdepth 1 -type f -name 'chunk-*.b64' | wc -l | tr -d ' ')" = 6
          cat > /tmp/chunk-sha256 <<'CHUNK_SHA256'
          29532aab21bb6876c3453e3324e77d04dc28dc3467fce101ae0995d01d61dd08  .github/openovel-cycle1-patch/chunk-00.b64
          d2277500bf773cc7ff587045d258505a4aed4e331e2052c4c2b0049348c5750c  .github/openovel-cycle1-patch/chunk-01.b64
          1f2e608b2971a6dba4031d91dc1113211e9a3d3796b4e984c4c0a5f940809b6a  .github/openovel-cycle1-patch/chunk-02.b64
          86f3e18e725eda3283801f02cc1c2555178b406710daab67ebf4936ba9479fc2  .github/openovel-cycle1-patch/chunk-03.b64
          ed71cba68544c3d43cdfef06276a80ad99911f25d610c3d69865e6f26d4c507f  .github/openovel-cycle1-patch/chunk-04.b64
          60f77f188c7e5c1b8877cf299f5c0968331af0cd653255edf266d363c7247164  .github/openovel-cycle1-patch/chunk-05.b64
          CHUNK_SHA256
          sha256sum -c /tmp/chunk-sha256

          mapfile -t chunks < <(find "$chunk_dir" -maxdepth 1 -type f -name 'chunk-*.b64' | LC_ALL=C sort)
          test "${#chunks[@]}" = 6
          cat "${chunks[@]}" | tr -d '[:space:]' > /tmp/cycle1.patch.gz.b64
          test "$(wc -c < /tmp/cycle1.patch.gz.b64 | tr -d ' ')" = 29188
          base64 --decode /tmp/cycle1.patch.gz.b64 > /tmp/cycle1.patch.gz
          test "$(sha256sum /tmp/cycle1.patch.gz | awk '{print $1}')" = "$PATCH_GZIP_SHA256"
          gzip -dc /tmp/cycle1.patch.gz > /tmp/cycle1.patch
          test "$(wc -c < /tmp/cycle1.patch | tr -d ' ')" = "$PATCH_BYTES"
          test "$(sha256sum /tmp/cycle1.patch | awk '{print $1}')" = "$PATCH_SHA256"
          git apply --check /tmp/cycle1.patch
          git apply /tmp/cycle1.patch
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen install, migration and product gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm exec prisma validate
          pnpm db:migrate:deploy
          pnpm --filter @ai-story/shared typecheck
          pnpm --filter @ai-story/shared build
          pnpm --filter @apps/api test:narrative-projector
          pnpm --filter @apps/api test:b0-pipeline
          pnpm --filter @apps/api test:b0-player-window
          pnpm --filter @apps/api test:b0-ops
          pnpm --filter @apps/api test:b0-window
          pnpm --filter @apps/api typecheck
          pnpm typecheck:b0:real-acceptance
          pnpm --filter @apps/web test:b0-window
          pnpm --filter @apps/web typecheck
          pnpm --filter @apps/web build
          pnpm --filter @apps/openovel-runtime typecheck
          pnpm --filter @apps/openovel-runtime test
          pnpm --filter @apps/openovel-runtime build
          pnpm --filter @apps/api build

      - name: Architecture and secret boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'class[[:space:]]+[A-Za-z0-9_]*Narrator|@Module\([^)]*Narrator' apps/api/src/openovel-narrative-projector
          ! grep -nE 'PrismaService|B0SettlementCommitService|StoryService|FinaleCommitter|\$transaction' apps/api/src/openovel-narrative-projector/openovel-narrative-projector.service.ts
          python3 - <<'PY'
          import pathlib, re
          changed = [pathlib.Path(line) for line in '''
          apps/api/package.json
          apps/api/src/app.module.ts
          apps/api/src/b0-settlement/b0-outbox-bridge.service.spec.ts
          apps/api/src/b0-settlement/b0-outbox-bridge.service.ts
          apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts
          apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
          apps/api/src/b0-settlement/b0-window-initialization-concurrency.spec.ts
          apps/api/src/b0-settlement/b0-window-player.core.spec.ts
          apps/api/src/b0-settlement/b0-window-player.core.ts
          apps/api/src/b0-settlement/b0-window-player.service.ts
          apps/api/src/openovel-narrative-projector/narrative-context-compiler.ts
          apps/api/src/openovel-narrative-projector/narrative-fallback-renderer.ts
          apps/api/src/openovel-narrative-projector/narrative-publisher.spec.ts
          apps/api/src/openovel-narrative-projector/narrative-publisher.ts
          apps/api/src/openovel-narrative-projector/narrative-renderer.ts
          apps/api/src/openovel-narrative-projector/narrative-source-reader.ts
          apps/api/src/openovel-narrative-projector/narrative-truth-guard.ts
          apps/api/src/openovel-narrative-projector/openovel-narrative-projector.architecture.spec.ts
          apps/api/src/openovel-narrative-projector/openovel-narrative-projector.contract.ts
          apps/api/src/openovel-narrative-projector/openovel-narrative-projector.service.spec.ts
          apps/api/src/openovel-narrative-projector/openovel-narrative-projector.service.ts
          apps/web/public/b0-window/b0-window-state.js
          apps/web/public/b0-window/b0-window-view.js
          apps/web/tests/b0-window-web.test.mjs
          packages/shared/src/index.ts
          packages/shared/src/narrative-projection.ts
          prisma/migrations/20260811140000_openovel_narrative_projection/migration.sql
          prisma/schema.prisma
          '''.strip().splitlines()]
          patterns = [
              re.compile(r"postgres(?:ql)?://[^\s\"']+", re.I),
              re.compile(r"(?<![A-Za-z0-9_-])sk-[A-Za-z0-9_-]{16,}"),
              re.compile(r"Bearer\s+[A-Za-z0-9._~+/-]{16,}", re.I),
              re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"),
          ]
          findings=[]
          for path in changed:
              text=path.read_text(encoding='utf-8')
              for pattern in patterns:
                  if pattern.search(text): findings.append((str(path), pattern.pattern))
          if findings: raise SystemExit(f"secret scan failed: {findings}")
          print('changed-file secret scan: PASS')
          PY

      - name: Commit and push product files only
        id: push
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/api/package.json
            apps/api/src/app.module.ts
            apps/api/src/b0-settlement/b0-outbox-bridge.service.spec.ts
            apps/api/src/b0-settlement/b0-outbox-bridge.service.ts
            apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts
            apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
            apps/api/src/b0-settlement/b0-window-initialization-concurrency.spec.ts
            apps/api/src/b0-settlement/b0-window-player.core.spec.ts
            apps/api/src/b0-settlement/b0-window-player.core.ts
            apps/api/src/b0-settlement/b0-window-player.service.ts
            apps/api/src/openovel-narrative-projector/narrative-context-compiler.ts
            apps/api/src/openovel-narrative-projector/narrative-fallback-renderer.ts
            apps/api/src/openovel-narrative-projector/narrative-publisher.spec.ts
            apps/api/src/openovel-narrative-projector/narrative-publisher.ts
            apps/api/src/openovel-narrative-projector/narrative-renderer.ts
            apps/api/src/openovel-narrative-projector/narrative-source-reader.ts
            apps/api/src/openovel-narrative-projector/narrative-truth-guard.ts
            apps/api/src/openovel-narrative-projector/openovel-narrative-projector.architecture.spec.ts
            apps/api/src/openovel-narrative-projector/openovel-narrative-projector.contract.ts
            apps/api/src/openovel-narrative-projector/openovel-narrative-projector.service.spec.ts
            apps/api/src/openovel-narrative-projector/openovel-narrative-projector.service.ts
            apps/web/public/b0-window/b0-window-state.js
            apps/web/public/b0-window/b0-window-view.js
            apps/web/tests/b0-window-web.test.mjs
            packages/shared/src/index.ts
            packages/shared/src/narrative-projection.ts
            prisma/migrations/20260811140000_openovel_narrative_projection/migration.sql
            prisma/schema.prisma
          )
          git fetch origin "$TARGET_BRANCH"
          remote_before="$(git rev-parse origin/$TARGET_BRANCH)"
          test "$remote_before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git diff --cached --check
          printf '%s\n' "${files[@]}" | LC_ALL=C sort > /tmp/expected
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git commit -m "feat(openovel): project narrative after authoritative results"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          remote_after="$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          echo "local_head=$local_head" >> "$GITHUB_OUTPUT"
          echo "remote_before=$remote_before" >> "$GITHUB_OUTPUT"
          echo "remote_after=$remote_after" >> "$GITHUB_OUTPUT"
          echo "REMOTE_PRODUCT_FIX_PUSHED=$local_head"

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          PRODUCT_SHA: ${{ steps.push.outputs.local_head }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "openovel/authoritative-narrative-cycle1",
              description: success
                ? `product pushed ${process.env.PRODUCT_SHA?.slice(0, 12)}`
                : `cycle 1 failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("cycle 1 product repair failed");
