name: Generic Endgame v3 S1-S4 Exact SHA Gate

on:
  push:
    branches:
      - codex/chatgpt-pro-main-game-final-v1
    paths:
      - .github/workflows/generic-endgame-s1-s4-exact.yml
      - packages/shared/src/endgame/**
      - packages/shared/tests/generic-endgame-*.spec.mjs
      - packages/shared/tests/generic-endgame-*.mjs
      - packages/shared/tsconfig.json
      - packages/shared/tsconfig.build.json
      - docs/auto-execute/evidence/generic-endgame-v3-s1-s4/**
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: generic-endgame-v3-s1-s4-exact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-exact-remote-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: codex/chatgpt-pro-main-game-final-v1
      S0_BASE_SHA: c9d268e0c49a9f8c196820853f82d2262df3b28d
      CLEAN_CLONE_DIR: ${{ runner.temp }}/generic-endgame-v3-s1-s4-exact
      EVIDENCE_DIR: ${{ runner.temp }}/generic-endgame-v3-s1-s4-exact-evidence
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Verify pnpm executable
        shell: bash
        run: |
          set -euo pipefail
          pnpm_path="$(command -v pnpm)"
          pnpm_version="$(pnpm --version)"
          test -n "$pnpm_path"
          test "$pnpm_version" = "10.24.0"
          printf 'PNPM_PATH=%s\nPNPM_VERSION=%s\n' "$pnpm_path" "$pnpm_version"

      - name: Clone exact remote branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf "$CLEAN_CLONE_DIR" "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR/logs"
          git clone --no-tags --single-branch --branch "$BRANCH" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$CLEAN_CLONE_DIR" \
            > "$EVIDENCE_DIR/logs/00-clone.log" 2>&1

      - name: Prove exact SHA and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          cd "$CLEAN_CLONE_DIR"
          git fetch origin --prune
          local_sha="$(git rev-parse HEAD)"
          tracking_sha="$(git rev-parse "origin/${BRANCH}")"
          ls_remote_raw="$(git ls-remote origin "refs/heads/${BRANCH}")"
          remote_sha="$(printf '%s\n' "$ls_remote_raw" | awk '{print $1}')"
          status_short="$(git status --short)"
          test "$local_sha" = "$GITHUB_SHA"
          test "$tracking_sha" = "$GITHUB_SHA"
          test "$remote_sha" = "$GITHUB_SHA"
          test -z "$status_short"
          git merge-base --is-ancestor "$S0_BASE_SHA" "$GITHUB_SHA"
          {
            printf 'LOCAL_HEAD=%s\n' "$local_sha"
            printf 'TRACKING_HEAD=%s\n' "$tracking_sha"
            printf 'LS_REMOTE_RAW=%s\n' "$ls_remote_raw"
            printf 'STATUS_SHORT=%s\n' "$status_short"
          } | tee "$EVIDENCE_DIR/git-proof.txt"
          git log --reverse --format='%H%x09%P%x09%s' "$S0_BASE_SHA..$GITHUB_SHA" \
            > "$EVIDENCE_DIR/commit-chain.tsv"

      - name: Install frozen workspace
        shell: bash
        run: |
          set -euo pipefail
          cd "$CLEAN_CLONE_DIR"
          pnpm install --frozen-lockfile \
            > "$EVIDENCE_DIR/logs/01-install.log" 2>&1

      - name: Run strict S0-S4 suites
        shell: bash
        run: |
          set -euo pipefail
          cd "$CLEAN_CLONE_DIR"
          specs=(
            packages/shared/tests/generic-endgame-package-v1.s0.spec.mjs
            packages/shared/tests/generic-endgame-s1-loader.spec.mjs
            packages/shared/tests/generic-endgame-s2-metrics.spec.mjs
            packages/shared/tests/generic-endgame-s3-adjudication.spec.mjs
            packages/shared/tests/generic-endgame-s4-details.spec.mjs
          )
          minimums=(92 21 25 28 35)
          printf 'suite\ttests\tpass\tfail\tskipped\ttodo\texit_code\n' \
            > "$EVIDENCE_DIR/test-summary.tsv"
          total_tests=0
          total_pass=0
          for index in "${!specs[@]}"; do
            spec="${specs[$index]}"
            minimum="${minimums[$index]}"
            test -f "$spec"
            label="$(basename "$spec" .mjs)"
            log="$EVIDENCE_DIR/logs/${label}.log"
            set +e
            node --test "$spec" > "$log" 2>&1
            code=$?
            set -e
            cat "$log"
            tests="$(awk '/^# tests /{print $3}' "$log" | tail -1)"
            pass="$(awk '/^# pass /{print $3}' "$log" | tail -1)"
            fail="$(awk '/^# fail /{print $3}' "$log" | tail -1)"
            skipped="$(awk '/^# skipped /{print $3}' "$log" | tail -1)"
            todo="$(awk '/^# todo /{print $3}' "$log" | tail -1)"
            test "$code" -eq 0
            test "$tests" -ge "$minimum"
            test "$pass" = "$tests"
            test "$fail" = "0"
            test "$skipped" = "0"
            test "$todo" = "0"
            total_tests=$((total_tests + tests))
            total_pass=$((total_pass + pass))
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$label" "$tests" "$pass" "$fail" "$skipped" "$todo" "$code" \
              >> "$EVIDENCE_DIR/test-summary.tsv"
          done
          test "$total_tests" -ge 201
          test "$total_pass" -eq "$total_tests"
          printf 'TOTAL_TESTS=%s\nTOTAL_PASS=%s\nTOTAL_FAIL=0\nTOTAL_SKIPPED=0\nTOTAL_TODO=0\n' \
            "$total_tests" "$total_pass" | tee "$EVIDENCE_DIR/test-totals.txt"

      - name: Shared typecheck
        shell: bash
        run: |
          set -euo pipefail
          cd "$CLEAN_CLONE_DIR"
          pnpm --filter @ai-story/shared typecheck \
            > "$EVIDENCE_DIR/logs/90-shared-typecheck.log" 2>&1
          ! grep -qi "No projects matched" "$EVIDENCE_DIR/logs/90-shared-typecheck.log"

      - name: Shared build
        shell: bash
        run: |
          set -euo pipefail
          cd "$CLEAN_CLONE_DIR"
          pnpm --filter @ai-story/shared build \
            > "$EVIDENCE_DIR/logs/91-shared-build.log" 2>&1
          ! grep -qi "No projects matched" "$EVIDENCE_DIR/logs/91-shared-build.log"
          rm -rf packages/shared/dist

      - name: Diff and final cleanliness gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$CLEAN_CLONE_DIR"
          git diff --check "$S0_BASE_SHA..$GITHUB_SHA" \
            > "$EVIDENCE_DIR/logs/92-git-diff-check.log" 2>&1
          final_status="$(git status --short)"
          test -z "$final_status"
          printf '%s\n' "$final_status" > "$EVIDENCE_DIR/final-status.txt"

      - name: Write evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          local_sha="$(git -C "$CLEAN_CLONE_DIR" rev-parse HEAD 2>/dev/null || true)"
          tracking_sha="$(git -C "$CLEAN_CLONE_DIR" rev-parse "origin/${BRANCH}" 2>/dev/null || true)"
          remote_sha="$(git -C "$CLEAN_CLONE_DIR" ls-remote origin "refs/heads/${BRANCH}" 2>/dev/null | awk '{print $1}' || true)"
          status_short="$(git -C "$CLEAN_CLONE_DIR" status --short 2>/dev/null || true)"
          tests="$(awk -F '\t' 'NR > 1 {sum += $2} END {print sum + 0}' "$EVIDENCE_DIR/test-summary.tsv" 2>/dev/null || true)"
          pass="$(awk -F '\t' 'NR > 1 {sum += $3} END {print sum + 0}' "$EVIDENCE_DIR/test-summary.tsv" 2>/dev/null || true)"
          fail="$(awk -F '\t' 'NR > 1 {sum += $4} END {print sum + 0}' "$EVIDENCE_DIR/test-summary.tsv" 2>/dev/null || true)"
          skipped="$(awk -F '\t' 'NR > 1 {sum += $5} END {print sum + 0}' "$EVIDENCE_DIR/test-summary.tsv" 2>/dev/null || true)"
          todo="$(awk -F '\t' 'NR > 1 {sum += $6} END {print sum + 0}' "$EVIDENCE_DIR/test-summary.tsv" 2>/dev/null || true)"
          cat > "$EVIDENCE_DIR/manifest.json" <<JSON
          {
            "schemaVersion": "generic_endgame_v3_s1_s4_exact_remote_evidence_v1",
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${BRANCH}",
            "commitSha": "${GITHUB_SHA}",
            "cleanCloneHead": "${local_sha}",
            "trackingHead": "${tracking_sha}",
            "lsRemoteSha": "${remote_sha}",
            "cleanCloneStatusShort": "${status_short}",
            "tests": ${tests:-0},
            "pass": ${pass:-0},
            "fail": ${fail:-0},
            "skipped": ${skipped:-0},
            "todo": ${todo:-0},
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "jobStatus": "${{ job.status }}"
          }
          JSON

      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-endgame-v3-s1-s4-exact-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact-SHA status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'generic-endgame-v3/s1-s4-exact',
              description: '${{ job.status }}' === 'success'
                ? 'Exact SHA, 201+ strict tests, typecheck, build, diff passed'
                : 'Generic Endgame v3 S1-S4 exact-SHA verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
