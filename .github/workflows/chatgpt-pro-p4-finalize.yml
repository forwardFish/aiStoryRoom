name: ChatGPT Pro P4 Finalize

on:
  pull_request:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: chatgpt-pro-p4-finalize
  cancel-in-progress: false

env:
  CI: "true"
  CANDIDATE_BRANCH: codex/chatgpt-pro-ai-story-convergence
  FROZEN_BASE_SHA: 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c
  PATCH_PATH: docs/auto-execute/.chatgpt-pro-p4-final.patch
  PATCH_SHA256: 8ba3afac4947e4c5366acd89152ef6a0109a9992d1949c259c4d2a8f643c4767

jobs:
  finalize-p4:
    if: github.event.pull_request.title == 'ci(P4): finalize dramatic surface contract'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Prove branch boundary and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "forwardFish/aiStoryRoom"
          test "${{ github.event.pull_request.base.ref }}" = "${CANDIDATE_BRANCH}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git merge-base HEAD ${FROZEN_BASE_SHA})" = "${FROZEN_BASE_SHA}"
          test "$(git rev-parse origin/main)" = "${FROZEN_BASE_SHA}"
          test "$(sha256sum "${PATCH_PATH}" | awk '{print $1}')" = "${PATCH_SHA256}"
          git apply --check "${PATCH_PATH}"
          git apply "${PATCH_PATH}"
          rm -f "${PATCH_PATH}" .github/workflows/chatgpt-pro-p4-finalize.yml
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: P4 focused and full engineering gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-story/templates typecheck
          pnpm --filter @ai-story/templates build
          pnpm --filter @apps/openovel-runtime typecheck
          pnpm --filter @apps/openovel-runtime build
          node --import tsx --test \
            apps/openovel-runtime/tests/p04-player-surface-contract.spec.ts \
            apps/openovel-runtime/tests/p04-scene-pattern-plan.spec.ts \
            apps/openovel-runtime/tests/p05-narrator-context.spec.ts
          pnpm --filter @apps/openovel-runtime test
          pnpm test:story:v4
          pnpm --filter @apps/openovel-runtime smoke:http
          git diff --check

      - name: Commit tested P4 closure to candidate only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "${FROZEN_BASE_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(P4): close dramatic beat surface contract"
          git fetch origin "${CANDIDATE_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.base.sha }}"
          git push origin HEAD:"${CANDIDATE_BRANCH}"
