name: B0 One-Shot Credential Context Key Probe

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-credential-alias-probe.yml

permissions:
  contents: read
  statuses: write

jobs:
  locator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish exact run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/credential-context-key-probe",
              description: `credential context key probe running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  repository-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print repository context keys only
        shell: bash
        env:
          SECRET_CONTEXT_JSON: ${{ toJSON(secrets) }}
          VARIABLE_CONTEXT_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const secretKeys = Object.keys(JSON.parse(process.env.SECRET_CONTEXT_JSON || "{}"));
          const variableKeys = Object.keys(JSON.parse(process.env.VARIABLE_CONTEXT_JSON || "{}"));
          console.log("B0_REPOSITORY_SECRET_CONTEXT_KEYS=" + secretKeys.sort().join(","));
          console.log("B0_REPOSITORY_VARIABLE_CONTEXT_KEYS=" + variableKeys.sort().join(","));
          NODE

  environment-context:
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "ourmanyworlds.com / test"
          - "stellar-encouragement / test"
          - "Preview"
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print non-production environment context keys only
        shell: bash
        env:
          ENVIRONMENT_NAME: ${{ matrix.environment }}
          SECRET_CONTEXT_JSON: ${{ toJSON(secrets) }}
          VARIABLE_CONTEXT_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const secretKeys = Object.keys(JSON.parse(process.env.SECRET_CONTEXT_JSON || "{}"));
          const variableKeys = Object.keys(JSON.parse(process.env.VARIABLE_CONTEXT_JSON || "{}"));
          console.log("B0_NONPROD_ENVIRONMENT=" + process.env.ENVIRONMENT_NAME);
          console.log("B0_ENV_SECRET_CONTEXT_KEYS=" + secretKeys.sort().join(","));
          console.log("B0_ENV_VARIABLE_CONTEXT_KEYS=" + variableKeys.sort().join(","));
          NODE

  finalize:
    if: always()
    needs: [locator, repository-context, environment-context]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish probe outcome
        uses: actions/github-script@v7
        env:
          REPOSITORY_RESULT: ${{ needs.repository-context.result }}
          ENVIRONMENT_RESULT: ${{ needs.environment-context.result }}
        with:
          script: |
            const success = process.env.REPOSITORY_RESULT === "success" && process.env.ENVIRONMENT_RESULT === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/credential-context-key-probe",
              description: `credential context key probe ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
