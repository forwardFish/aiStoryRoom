name: B0 One-Shot Credential Metadata Probe

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-credential-alias-probe.yml

permissions:
  contents: read
  statuses: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/credential-metadata-probe",
              description: `credential metadata probe running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: List environment and credential names only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          echo 'B0_ENVIRONMENTS_BEGIN'
          gh api "repos/$GITHUB_REPOSITORY/environments" --jq '.environments[]?.name' 2>&1 || true
          echo 'B0_ENVIRONMENTS_END'
          echo 'B0_REPOSITORY_SECRET_NAMES_BEGIN'
          gh api "repos/$GITHUB_REPOSITORY/actions/secrets" --jq '.secrets[]?.name' 2>&1 || true
          echo 'B0_REPOSITORY_SECRET_NAMES_END'
          echo 'B0_REPOSITORY_VARIABLE_NAMES_BEGIN'
          gh api "repos/$GITHUB_REPOSITORY/actions/variables" --jq '.variables[]?.name' 2>&1 || true
          echo 'B0_REPOSITORY_VARIABLE_NAMES_END'
      - name: Publish probe outcome
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "b0/credential-metadata-probe",
              description: `credential metadata probe completed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
