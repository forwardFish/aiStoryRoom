name: B0 One-Shot Non-Production Environment Metadata Probe

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-credential-alias-probe.yml

permissions:
  contents: read
  statuses: write

jobs:
  locator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish exact run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/nonprod-environment-metadata-probe",
              description: `non-production environment metadata probe running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  probe:
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "ourmanyworlds.com / test"
          - "stellar-encouragement / test"
          - "Preview"
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List environment secret and variable names only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT_NAME: ${{ matrix.environment }}
        run: |
          set -u
          encoded="$(printf '%s' "$ENVIRONMENT_NAME" | jq -sRr @uri)"
          echo "B0_NONPROD_ENVIRONMENT=$ENVIRONMENT_NAME"
          echo 'B0_ENVIRONMENT_SECRET_NAMES_BEGIN'
          gh api "repos/$GITHUB_REPOSITORY/environments/$encoded/secrets" --jq '.secrets[]?.name' 2>&1 || true
          echo 'B0_ENVIRONMENT_SECRET_NAMES_END'
          echo 'B0_ENVIRONMENT_VARIABLE_NAMES_BEGIN'
          gh api "repos/$GITHUB_REPOSITORY/environments/$encoded/variables" --jq '.variables[]?.name' 2>&1 || true
          echo 'B0_ENVIRONMENT_VARIABLE_NAMES_END'

  finalize:
    if: always()
    needs: [locator, probe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish probe outcome
        uses: actions/github-script@v7
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
        with:
          script: |
            const success = process.env.PROBE_RESULT === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/nonprod-environment-metadata-probe",
              description: `non-production environment metadata probe ${process.env.PROBE_RESULT} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
