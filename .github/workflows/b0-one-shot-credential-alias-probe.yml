name: B0 One-Shot Historical Credential Footprint Audit

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-credential-alias-probe.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publish exact run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/historical-credential-footprint",
              description: `historical credential footprint audit running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Scan complete Git object history without printing values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import parse_qs, urlsplit

          variables = (
              "DATABASE_URL",
              "SUPABASE_DATABASE_URL",
              "TEST_DATABASE_URL",
              "SUPABASE_TEST_DATABASE_URL",
              "TEST_SUPABASE_DATABASE_URL",
              "DIRECT_URL",
              "POSTGRES_URL",
              "POSTGRES_PRISMA_URL",
              "POSTGRES_URL_NON_POOLING",
              "DEEPSEEK_API_KEY",
              "OPENOVEL_DEEPSEEK_API_KEY",
              "AI_API_KEY",
              "LLM_API_KEY",
              "SILICONFLOW_API_KEY",
              "GLM_API_KEY",
          )
          assignment = re.compile(
              r"(?m)^\s*(?:export\s+)?(" + "|".join(map(re.escape, variables)) + r")\s*=\s*([^\r\n]*)$"
          )
          placeholder_tokens = (
              "example", "placeholder", "changeme", "change-me", "your_", "your-", "<", ">",
              "localhost", "127.0.0.1", "postgres:postgres", "self-check-only", "xxx", "todo",
              "${", "process.env", "secret", "password_here", "api_key_here",
          )

          objects: dict[str, str] = {}
          raw = subprocess.check_output(["git", "rev-list", "--objects", "--all"], text=True, encoding="utf-8", errors="replace")
          for line in raw.splitlines():
              parts = line.split(" ", 1)
              if len(parts) == 2:
                  objects.setdefault(parts[0], parts[1])

          records = []
          scanned = 0
          for sha, path in objects.items():
              try:
                  obj_type = subprocess.check_output(["git", "cat-file", "-t", sha], text=True).strip()
                  if obj_type != "blob":
                      continue
                  size = int(subprocess.check_output(["git", "cat-file", "-s", sha], text=True).strip())
                  if size > 2_000_000:
                      continue
                  data = subprocess.check_output(["git", "cat-file", "-p", sha])
              except Exception:
                  continue
              if b"\x00" in data[:8192]:
                  continue
              text = data.decode("utf-8", errors="replace")
              if not any(name in text for name in variables):
                  continue
              scanned += 1
              for match in assignment.finditer(text):
                  name = match.group(1)
                  raw_value = match.group(2).strip()
                  if len(raw_value) >= 2 and raw_value[0] == raw_value[-1] and raw_value[0] in {'"', "'"}:
                      value = raw_value[1:-1]
                  else:
                      value = re.split(r"\s+#", raw_value, maxsplit=1)[0].strip()
                  lowered = value.lower()
                  placeholder = (not value) or any(token in lowered for token in placeholder_tokens)
                  record = {
                      "blobSha": sha,
                      "path": path,
                      "variable": name,
                      "nonEmpty": bool(value),
                      "placeholder": placeholder,
                      "valueLength": len(value),
                      "valueSha256": hashlib.sha256(value.encode("utf-8")).hexdigest(),
                      "pathLooksNonProduction": bool(re.search(r"(?:^|[./_-])(test|testing|staging|stage|preview|dev|development)(?:$|[./_-])", path, re.I)),
                  }
                  if name.endswith("DATABASE_URL") or name in {"DIRECT_URL", "POSTGRES_URL", "POSTGRES_PRISMA_URL", "POSTGRES_URL_NON_POOLING"}:
                      try:
                          split = urlsplit(value)
                          query = parse_qs(split.query)
                          record.update({
                              "kind": "database",
                              "postgresScheme": split.scheme in {"postgres", "postgresql"},
                              "hostContainsSupabase": "supabase" in (split.hostname or "").lower(),
                              "hostSha256": hashlib.sha256((split.hostname or "").encode("utf-8")).hexdigest(),
                              "port": split.port,
                              "databaseNameSha256": hashlib.sha256(split.path.lstrip("/").encode("utf-8")).hexdigest(),
                              "schemaParameter": (query.get("schema") or [None])[0],
                          })
                      except Exception:
                          record.update({"kind": "database", "postgresScheme": False, "hostContainsSupabase": False})
                  else:
                      record.update({
                          "kind": "provider-key",
                          "looksLikeKey": len(value) >= 20 and not placeholder,
                          "prefixClass": "sk" if value.startswith("sk-") else "other",
                      })
                  records.append(record)

          unique = {}
          for record in records:
              key = (record["blobSha"], record["path"], record["variable"], record["valueSha256"])
              unique[key] = record
          records = sorted(unique.values(), key=lambda item: (item["variable"], item["path"], item["blobSha"]))
          candidates = [record for record in records if record["nonEmpty"] and not record["placeholder"]]
          report = {
              "schemaVersion": 1,
              "headSha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "textBlobsWithVariableNamesScanned": scanned,
              "assignmentCount": len(records),
              "nonPlaceholderCandidateCount": len(candidates),
              "records": records,
          }
          output = Path("historical-credential-footprint.json")
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "headSha": report["headSha"],
              "textBlobsWithVariableNamesScanned": scanned,
              "assignmentCount": len(records),
              "nonPlaceholderCandidateCount": len(candidates),
              "candidates": [
                  {
                      key: record.get(key)
                      for key in (
                          "blobSha", "path", "variable", "kind", "valueLength", "valueSha256",
                          "pathLooksNonProduction", "postgresScheme", "hostContainsSupabase",
                          "hostSha256", "port", "schemaParameter", "looksLikeKey", "prefixClass",
                      )
                      if key in record
                  }
                  for record in candidates
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload sanitized footprint report
        uses: actions/upload-artifact@v4
        with:
          name: b0-historical-credential-footprint-${{ github.sha }}
          path: historical-credential-footprint.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish audit outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/historical-credential-footprint",
              description: `historical credential footprint audit ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
