name: B0 One-Shot Historical Supabase Footprint Audit

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-credential-alias-probe.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Publish exact run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/historical-supabase-footprint",
              description: `historical Supabase footprint audit running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Scan all Git blobs without printing connection values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import re
          import subprocess
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlsplit

          def digest(value: str) -> str:
              return hashlib.sha256(value.encode("utf-8")).hexdigest()

          def entropy(value: str) -> float:
              if not value:
                  return 0.0
              counts = Counter(value)
              total = len(value)
              return round(-sum((count / total) * math.log2(count / total) for count in counts.values()), 3)

          raw = subprocess.check_output(
              ["git", "rev-list", "--objects", "--all"],
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          objects: dict[str, str] = {}
          for line in raw.splitlines():
              parts = line.split(" ", 1)
              if len(parts) == 2:
                  objects.setdefault(parts[0], parts[1])

          postgres_pattern = re.compile(r"postgres(?:ql)?://[^\s\"'<>`]+", re.I)
          project_pattern = re.compile(r"https?://([a-z0-9-]+)\.supabase\.co", re.I)
          key_pattern = re.compile(
              r"(?m)^\s*(?:export\s+)?(?:DEEPSEEK_API_KEY|OPENOVEL_DEEPSEEK_API_KEY)\s*=\s*([^\r\n]+)$"
          )
          placeholder_pattern = re.compile(
              r"(?:your|replace|example|placeholder|changeme|change-me|deepseek[_ -]?api[_ -]?key|api[_ -]?key[_ -]?here|xxxx|todo|dummy|sample|test[_ -]?key)",
              re.I,
          )
          nonprod_path = re.compile(
              r"(?:^|[./_-])(test|testing|stage|staging|preview|dev|development)(?:$|[./_-])",
              re.I,
          )

          postgres_records: list[dict] = []
          project_records: list[dict] = []
          key_records: list[dict] = []
          scanned = 0

          for blob_sha, path in objects.items():
              try:
                  if subprocess.check_output(["git", "cat-file", "-t", blob_sha], text=True).strip() != "blob":
                      continue
                  size = int(subprocess.check_output(["git", "cat-file", "-s", blob_sha], text=True).strip())
                  if size > 3_000_000:
                      continue
                  data = subprocess.check_output(["git", "cat-file", "-p", blob_sha])
              except Exception:
                  continue
              if b"\x00" in data[:8192]:
                  continue
              text = data.decode("utf-8", errors="replace")
              if not re.search(r"supabase|postgres(?:ql)?://|DEEPSEEK_API_KEY|OPENOVEL_DEEPSEEK_API_KEY", text, re.I):
                  continue
              scanned += 1

              for match in postgres_pattern.finditer(text):
                  value = match.group(0).rstrip(".,);]}\\")
                  try:
                      parsed = urlsplit(value)
                      hostname = parsed.hostname or ""
                      username = parsed.username or ""
                      password = parsed.password or ""
                      try:
                          port = parsed.port
                          valid_port = True
                      except ValueError:
                          port = None
                          valid_port = False
                      database = parsed.path.lstrip("/")
                  except Exception:
                      hostname = username = password = database = ""
                      port = None
                      valid_port = False
                  host_is_supabase = "supabase." in hostname.lower()
                  postgres_records.append({
                      "blobSha": blob_sha,
                      "path": path,
                      "urlSha256": digest(value),
                      "valueLength": len(value),
                      "hostContainsSupabase": host_is_supabase,
                      "hostSha256": digest(hostname),
                      "port": port,
                      "validPort": valid_port,
                      "usernamePresent": bool(username),
                      "usernameLength": len(username),
                      "usernameSha256": digest(username),
                      "passwordPresent": bool(password),
                      "passwordLength": len(password),
                      "passwordSha256": digest(password),
                      "databaseNameSha256": digest(database),
                      "pathLooksNonProduction": bool(nonprod_path.search(path)),
                      "looksExecutable": bool(hostname and username and password and database and valid_port),
                  })

              for match in project_pattern.finditer(text):
                  project_ref = match.group(1)
                  project_records.append({
                      "blobSha": blob_sha,
                      "path": path,
                      "projectRefLength": len(project_ref),
                      "projectRefSha256": digest(project_ref),
                      "pathLooksNonProduction": bool(nonprod_path.search(path)),
                  })

              for match in key_pattern.finditer(text):
                  raw_value = match.group(1).strip()
                  if len(raw_value) >= 2 and raw_value[0] == raw_value[-1] and raw_value[0] in {'"', "'"}:
                      value = raw_value[1:-1]
                  else:
                      value = re.split(r"\s+#", raw_value, maxsplit=1)[0].strip()
                  placeholder = bool(placeholder_pattern.search(value))
                  key_records.append({
                      "blobSha": blob_sha,
                      "path": path,
                      "valueLength": len(value),
                      "valueSha256": digest(value),
                      "startsWithSk": value.startswith("sk-"),
                      "containsPlaceholderLanguage": placeholder,
                      "characterEntropy": entropy(value),
                      "uniqueCharacterCount": len(set(value)),
                      "looksPotentiallyLive": len(value) >= 20 and value.startswith("sk-") and not placeholder,
                  })

          def dedupe(records: list[dict]) -> list[dict]:
              found = {}
              for record in records:
                  found[json.dumps(record, sort_keys=True)] = record
              return sorted(found.values(), key=lambda item: (item.get("path", ""), item.get("blobSha", ""), item.get("urlSha256", item.get("valueSha256", ""))))

          postgres_records = dedupe(postgres_records)
          project_records = dedupe(project_records)
          key_records = dedupe(key_records)
          executable_supabase = [r for r in postgres_records if r["hostContainsSupabase"] and r["looksExecutable"]]
          potentially_live_keys = [r for r in key_records if r["looksPotentiallyLive"]]

          report = {
              "schemaVersion": 1,
              "headSha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "scannedTextBlobCount": scanned,
              "postgresUrlRecordCount": len(postgres_records),
              "supabaseProjectUrlRecordCount": len(project_records),
              "deepSeekAssignmentRecordCount": len(key_records),
              "executableSupabaseUrlCount": len(executable_supabase),
              "potentiallyLiveDeepSeekKeyCount": len(potentially_live_keys),
              "postgresUrls": postgres_records,
              "supabaseProjects": project_records,
              "deepSeekAssignments": key_records,
          }
          Path("historical-supabase-footprint.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "headSha": report["headSha"],
              "scannedTextBlobCount": scanned,
              "postgresUrlRecordCount": len(postgres_records),
              "supabaseProjectUrlRecordCount": len(project_records),
              "deepSeekAssignmentRecordCount": len(key_records),
              "executableSupabaseUrlCount": len(executable_supabase),
              "potentiallyLiveDeepSeekKeyCount": len(potentially_live_keys),
              "executableSupabaseUrls": executable_supabase,
              "potentiallyLiveDeepSeekKeys": potentially_live_keys,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload sanitized audit
        uses: actions/upload-artifact@v4
        with:
          name: b0-historical-supabase-footprint-${{ github.sha }}
          path: historical-supabase-footprint.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish audit outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/historical-supabase-footprint",
              description: `historical Supabase footprint audit ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
