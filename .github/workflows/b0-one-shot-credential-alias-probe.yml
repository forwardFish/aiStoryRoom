name: B0 One-Shot Credential Alias Probe

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-credential-alias-probe.yml

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      S_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
      S_SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL != '' }}
      S_TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL != '' }}
      S_SUPABASE_TEST_DATABASE_URL: ${{ secrets.SUPABASE_TEST_DATABASE_URL != '' }}
      S_TEST_SUPABASE_DATABASE_URL: ${{ secrets.TEST_SUPABASE_DATABASE_URL != '' }}
      S_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
      S_SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL != '' }}
      S_SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL != '' }}
      S_DIRECT_URL: ${{ secrets.DIRECT_URL != '' }}
      S_POSTGRES_URL: ${{ secrets.POSTGRES_URL != '' }}
      S_POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL != '' }}
      S_POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING != '' }}
      S_TEST_POSTGRES_URL: ${{ secrets.TEST_POSTGRES_URL != '' }}
      S_DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST != '' }}
      S_DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING != '' }}
      S_STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL != '' }}
      S_PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL != '' }}
      S_RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL != '' }}
      S_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF != '' }}
      S_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
      S_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD != '' }}
      S_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
      S_OPENOVEL_DEEPSEEK_API_KEY: ${{ secrets.OPENOVEL_DEEPSEEK_API_KEY != '' }}
      S_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY != '' }}
      S_AI_API_KEY: ${{ secrets.AI_API_KEY != '' }}
      S_LLM_API_KEY: ${{ secrets.LLM_API_KEY != '' }}
      S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      S_SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY != '' }}
      S_GLM_API_KEY: ${{ secrets.GLM_API_KEY != '' }}
      S_MODEL_API_KEY: ${{ secrets.MODEL_API_KEY != '' }}
      S_ROLE_AGENT_API_KEY: ${{ secrets.ROLE_AGENT_API_KEY != '' }}
      S_OPENOVEL_API_KEY: ${{ secrets.OPENOVEL_API_KEY != '' }}
      S_ENV_TEST: ${{ secrets.ENV_TEST != '' }}
      S_TEST_ENV: ${{ secrets.TEST_ENV != '' }}
      S_DOTENV_TEST: ${{ secrets.DOTENV_TEST != '' }}
      S_ENV_FILE_TEST: ${{ secrets.ENV_FILE_TEST != '' }}
      S_AI_STORY_TEST_ENV: ${{ secrets.AI_STORY_TEST_ENV != '' }}
      S_B0_ACCEPTANCE_ENV: ${{ secrets.B0_ACCEPTANCE_ENV != '' }}
      V_DATABASE_URL: ${{ vars.DATABASE_URL != '' }}
      V_SUPABASE_DATABASE_URL: ${{ vars.SUPABASE_DATABASE_URL != '' }}
      V_TEST_DATABASE_URL: ${{ vars.TEST_DATABASE_URL != '' }}
      V_DEEPSEEK_API_KEY: ${{ vars.DEEPSEEK_API_KEY != '' }}
      V_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    steps:
      - name: Publish run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/credential-alias-probe",
              description: `credential alias probe running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Print presence booleans only
        shell: bash
        run: |
          set -euo pipefail
          echo 'B0_CREDENTIAL_ALIAS_PROBE_BEGIN'
          env | grep -E '^[SV]_' | LC_ALL=C sort
          echo 'B0_CREDENTIAL_ALIAS_PROBE_END'
      - name: Publish probe outcome
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "b0/credential-alias-probe",
              description: `credential alias probe completed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
