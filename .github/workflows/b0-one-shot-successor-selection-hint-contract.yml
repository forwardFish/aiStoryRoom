name: B0 One-Shot Successor Selection Hint Contract

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-successor-selection-hint-contract.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-one-shot-successor-selection-hint-contract
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_BASELINE: b7065d88a8d4035701bf781c5db23b96c75703be

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/successor-selection-hints",
              description: `successor selection hint repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50

      - name: Apply the minimal product and contract repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$B0_BASELINE" HEAD
          test -z "$(git status --short)"

          python3 - <<'PY'
          from pathlib import Path

          read_path = Path("apps/api/src/maneuver-v1/maneuver-v1.prisma-read.ts")
          source = read_path.read_text(encoding="utf-8")
          old_selector = '''export function selectCurrentB0WindowV1<T extends B0WindowCandidateV1>(
            windows: readonly T[],
            currentNodeId?: string | null,
          ): T | null {
            const candidates = windows
              .filter((entry) => optionalRecord(entry.configJson)?.schemaVersion === "b0-window-config-v1")
              .slice()
              .sort(compareB0WindowPositionV1);
            const current = currentNodeId
              ? candidates.find((entry) => entry.nodeId === currentNodeId) ?? null
              : null;
            if (current && CURRENT_B0_WINDOW_STATUSES.has(current.status)) return current;
            return candidates.find((entry) => CURRENT_B0_WINDOW_STATUSES.has(entry.status))
              ?? current
              ?? candidates[0]
              ?? null;
          }
          '''
          new_selector = '''export type B0WindowSelectionHintV1 = Readonly<{
            windowId?: string | null;
            nodeId?: string | null;
          }>;

          export function selectCurrentB0WindowV1<T extends B0WindowCandidateV1>(
            windows: readonly T[],
            hint: B0WindowSelectionHintV1 = {},
          ): T | null {
            const candidates = windows
              .filter((entry) => optionalRecord(entry.configJson)?.schemaVersion === "b0-window-config-v1")
              .slice()
              .sort(compareB0WindowPositionV1);
            const exactWindow = hint.windowId
              ? candidates.find((entry) => entry.id === hint.windowId) ?? null
              : null;
            if (exactWindow) return exactWindow;
            const currentNode = hint.nodeId
              ? candidates.find((entry) => entry.nodeId === hint.nodeId) ?? null
              : null;
            if (currentNode && CURRENT_B0_WINDOW_STATUSES.has(currentNode.status)) return currentNode;
            return candidates.find((entry) => CURRENT_B0_WINDOW_STATUSES.has(entry.status))
              ?? currentNode
              ?? candidates[0]
              ?? null;
          }
          '''
          if source.count(old_selector) != 1:
              raise SystemExit("unexpected selector source state")
          source = source.replace(old_selector, new_selector, 1)
          old_call = "const window = selectCurrentB0WindowV1<any>(windows, run.currentNodeId);"
          new_call = "const window = selectCurrentB0WindowV1<any>(windows, { nodeId: run.currentNodeId });"
          if source.count(old_call) != 1:
              raise SystemExit("unexpected maneuver selector call")
          source = source.replace(old_call, new_call, 1)
          read_path.write_text(source, encoding="utf-8")

          player_path = Path("apps/api/src/b0-settlement/b0-window-player.service.ts")
          player = player_path.read_text(encoding="utf-8")
          old_player_call = "    const window = selectCurrentB0WindowV1(windows, windowId ?? null);"
          new_player_call = "    const window = selectCurrentB0WindowV1(windows, { windowId: windowId ?? null });"
          if player.count(old_player_call) != 1:
              raise SystemExit("unexpected player selector call")
          player_path.write_text(player.replace(old_player_call, new_player_call, 1), encoding="utf-8")

          spec_path = Path("apps/api/src/maneuver-v1/maneuver-v1.prisma-read.spec.ts")
          spec = spec_path.read_text(encoding="utf-8")
          old_import = '''  readB0ManeuverContextV1,
            readManeuverProjectionV1,
          } from "./maneuver-v1.prisma-read";'''
          new_import = '''  readB0ManeuverContextV1,
            readManeuverProjectionV1,
            selectCurrentB0WindowV1,
          } from "./maneuver-v1.prisma-read";'''
          if spec.count(old_import) != 1:
              raise SystemExit("unexpected spec import state")
          spec = spec.replace(old_import, new_import, 1)
          if "distinguishes explicit window and node hints" in spec:
              raise SystemExit("selection hint regression already exists")
          spec += r'''

          test("B0 selector distinguishes explicit window and node hints", () => {
            const windows = [
              {
                id: "window.completed",
                nodeId: "node.completed",
                status: "COMPLETED",
                configJson: { schemaVersion: "b0-window-config-v1" },
                node: { chapterIndex: 1, nodeIndex: 1 },
              },
              {
                id: "window.open",
                nodeId: "node.open",
                status: "OPEN",
                configJson: { schemaVersion: "b0-window-config-v1" },
                node: { chapterIndex: 1, nodeIndex: 2 },
              },
            ];

            assert.equal(
              selectCurrentB0WindowV1(windows, { windowId: "window.completed" })?.id,
              "window.completed",
              "an explicit window contract must compare against the window id rather than the node id",
            );
            assert.equal(
              selectCurrentB0WindowV1(windows, { nodeId: "node.open" })?.id,
              "window.open",
            );
            assert.equal(
              selectCurrentB0WindowV1(windows, { nodeId: "node.completed" })?.id,
              "window.open",
              "a stale completed current node must not hide an open successor",
            );
          });
          '''
          spec_path.write_text(spec, encoding="utf-8")
          PY

          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run focused product gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/api test:maneuver-v1
          pnpm --filter @apps/api test:b0-player-window
          pnpm --filter @apps/api test:b0-window
          pnpm --filter @apps/api typecheck
          pnpm typecheck:b0:real-acceptance
          pnpm --filter @apps/api build
          pnpm --filter @apps/web test:b0-window
          pnpm --filter @apps/web typecheck
          pnpm --filter @apps/web build
          pnpm --filter @apps/openovel-runtime build

      - name: Scan changed product files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          paths = [
              pathlib.Path("apps/api/src/maneuver-v1/maneuver-v1.prisma-read.ts"),
              pathlib.Path("apps/api/src/maneuver-v1/maneuver-v1.prisma-read.spec.ts"),
              pathlib.Path("apps/api/src/b0-settlement/b0-window-player.service.ts"),
          ]
          patterns = [
              re.compile(r"postgres(?:ql)?://[^\s\"']+", re.I),
              re.compile(r"sk-[A-Za-z0-9_-]{16,}"),
              re.compile(r"Bearer\s+[A-Za-z0-9._~+/-]{16,}", re.I),
              re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"),
          ]
          findings = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for pattern in patterns:
                  if pattern.search(text):
                      findings.append({"path": str(path), "pattern": pattern.pattern})
          if findings:
              raise SystemExit(f"secret scan failed: {findings}")
          print("changed-file secret scan: PASS")
          PY

      - name: Commit and push product files only
        id: push
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/api/src/maneuver-v1/maneuver-v1.prisma-read.ts
            apps/api/src/maneuver-v1/maneuver-v1.prisma-read.spec.ts
            apps/api/src/b0-settlement/b0-window-player.service.ts
          )
          git fetch origin "$B0_BRANCH"
          remote_before="$(git rev-parse origin/$B0_BRANCH)"
          test "$remote_before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git diff --cached --check
          printf '%s\n' "${files[@]}" | LC_ALL=C sort > /tmp/expected
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git commit -m "fix(b0): separate window and node selection hints"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$B0_BRANCH"
          remote_after="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          echo "local_head=$local_head" >> "$GITHUB_OUTPUT"
          echo "remote_before=$remote_before" >> "$GITHUB_OUTPUT"
          echo "remote_after=$remote_after" >> "$GITHUB_OUTPUT"
          echo "REMOTE_PRODUCT_FIX_PUSHED=$local_head"

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          LOCAL_HEAD: ${{ steps.push.outputs.local_head }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/successor-selection-hints",
              description: success
                ? `product fix pushed ${process.env.LOCAL_HEAD?.slice(0, 12)}`
                : `successor selection hint repair failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("successor selection hint repair failed");
