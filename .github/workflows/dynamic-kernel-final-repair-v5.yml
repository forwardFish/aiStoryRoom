name: Dynamic Kernel Final Generic Repair V5

# Re-run after balanced Narrator context and focused-obligation scoring.
on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-final-repair-v5.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EVIDENCE_ROOT: /tmp/dynamic-kernel-final-repair-v5
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/final-repair-v5" \
            -f description="Balanced-context final matrix running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply repair and run deterministic matrix
        shell: bash
        continue-on-error: true
        run: bash .github/repair/run-dynamic-kernel-final-v5.sh
      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-final-repair-v5-${{ github.sha }}
          path: /tmp/dynamic-kernel-final-repair-v5/
          if-no-files-found: error
          retention-days: 7
      - name: Commit only a green repair
        if: always()
        shell: bash
        run: bash .github/repair/commit-dynamic-kernel-final-v5.sh
      - name: Publish result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          description="Balanced-context repair failed deterministic gates"
          if [ -f "${EVIDENCE_ROOT}/status.txt" ] \
            && [ "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/status.txt")" = pass ]; then
            state=success
            description="Balanced-context repair passed deterministic gates"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/final-repair-v5" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
