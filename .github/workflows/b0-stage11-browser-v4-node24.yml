name: B0 Stage 11 Real Browser Six-Window Repair V4 Node 24

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage11-browser-v4-node24.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage11-real-browser-v4-node24
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      B0_DATABASE_IMAGE: supabase/postgres:15.14.1.157-mmlb_amd64
      B0_PROVIDER_IMAGE: ollama/ollama:0.32.5
      B0_PROVIDER_MODEL: qwen2.5:1.5b
      B0_ACCEPTANCE_TIER: engineering-selfhosted
      B0_ACCEPTANCE_ENVIRONMENT: github-hosted-isolated-engineering
      B0_EVIDENCE_ROOT: .artifacts/b0-stage11-v4/${{ github.sha }}
      B0_PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - name: Publish locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage11-real-browser-v4",
              description: `real browser Node 24 repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify exact input and reuse the reviewed V3 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "9c60d02ba2475fcfaacc18fb425d63420a79109b"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage11-browser-v4-node24.yml"
          test "$(git hash-object scripts/acceptance/b0-candidate-real-flow.ts)" = "f434c6bf4c2d6d26d1231fd9343e87672ad58bef"

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/b0-stage11-browser-window-driver.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index("\n          PY", start)
          block = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in block) + "\n"
          Path('/tmp/b0-stage11-reviewed-patch.py').write_text(script, encoding='utf-8')
          PY

          python3 /tmp/b0-stage11-reviewed-patch.py
          git diff --check
          grep -F 'const preWorkerWindow = snap.window;' scripts/acceptance/b0-candidate-real-flow.ts
          grep -F 'const preWorkerRun = snap.run;' scripts/acceptance/b0-candidate-real-flow.ts
          grep -F 'async function submitCyclicPlansThroughBrowser(' scripts/acceptance/b0-candidate-real-flow.ts

      - name: Frozen install and complete focused verification on Node 24
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance
          pnpm --filter @apps/web typecheck
          pnpm --filter @apps/web test:b0-window
          pnpm --filter @apps/web test
          pnpm --filter @apps/api typecheck
          pnpm --filter @apps/api test:b0-window
          pnpm --filter @apps/api test:b0-player-window
          pnpm --filter @apps/api test:b0-pipeline
          pnpm --filter @apps/api test:b0-ops

      - name: Build exact runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-story/shared build
          pnpm --filter @ai-story/templates build
          pnpm --filter @apps/api build
          pnpm --filter @apps/openovel-runtime build
          pnpm --filter @apps/web build

      - name: Start isolated Supabase PostgreSQL
        shell: bash
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh prepare-database

      - name: Start real local Ollama
        shell: bash
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh prepare-provider

      - name: Execute real three-browser six-window acceptance
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm test:b0:real-acceptance

      - name: Prove product traffic reached provider
        shell: bash
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh provider-proof

      - name: Clean isolated infrastructure
        if: always()
        shell: bash
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh cleanup || true

      - name: Redact engineering evidence
        if: always()
        shell: bash
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh redact || true

      - name: Finalize engineering evidence
        shell: bash
        run: scripts/acceptance/b0-selfhosted-real-acceptance.sh finalize

      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0-stage11-real-browser-v4-${{ github.sha }}
          path: ${{ env.B0_EVIDENCE_ROOT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Commit verified repair as ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/acceptance/b0-candidate-real-flow.ts
          git rm .github/workflows/b0-stage11-browser-window-driver.yml
          git rm .github/workflows/b0-stage11-browser-alias-fix.yml
          git rm .github/workflows/b0-stage11-browser-v4-node24.yml
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          .github/workflows/b0-stage11-browser-alias-fix.yml
          .github/workflows/b0-stage11-browser-v4-node24.yml
          .github/workflows/b0-stage11-browser-window-driver.yml
          scripts/acceptance/b0-candidate-real-flow.ts
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "test(b0): drive all synchronized windows through real browsers"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/stage11-real-browser-v4",
              description: `real browser Node 24 repair ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("real browser Node 24 repair failed");
