name: Maneuver MVP P5 acceptance continuation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/mvp-four-maneuver-actions

concurrency:
  group: maneuver-mvp-p5
  cancel-in-progress: false

jobs:
  implement-p5:
    if: github.head_ref == 'feat/mvp-four-maneuver-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/mvp-four-maneuver-actions
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Implement and verify P5
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_spec = Path('apps/api/src/mvp-four-maneuver-runtime.spec.ts')
          source = runtime_spec.read_text(encoding='utf-8')
          source = source.replace(
              'dashboard: {}, decisionHistory: [], events: [], causalLedger: {}, daySummary: null,',
              'dashboard: {}, decisionHistory: [], events: [], causalLedger: { fateSeeds: [], evidenceLedger: [], responsibilityLedger: [], narrativeFrames: [], finalJudgementInputs: [] }, daySummary: null,'
          )
          runtime_spec.write_text(source, encoding='utf-8')

          web_package = Path('apps/web/package.json')
          source = web_package.read_text(encoding='utf-8')
          source = source.replace('node --test --test-isolation=none tests/*.test.mjs', 'node --test tests/*.test.mjs')
          web_package.write_text(source, encoding='utf-8')

          legacy_test = Path('apps/web/tests/continuous-story-v2.test.mjs')
          source = legacy_test.read_text(encoding='utf-8')
          start = source.index('const maneuverScenarios = [')
          end = source.index('async function waitForTest', start)
          replacement = '''test("legacy Continuous Story V2 projections keep the four-action surface fail-closed", async () => {
            const initial = projection();
            const requests = [];
            const { dom, root, app } = await bootOldPage(initial, async (input, init = {}) => {
              requests.push({ input: String(input), method: init.method || "GET" });
              return json(initial);
            });
            enterSituation(root);

            const actions = [...root.querySelectorAll("[data-maneuver-type]")];
            assert.equal(actions.length, 4);
            assert.ok(actions.every((button) => button.disabled));
            assert.equal(root.querySelector("#maneuverSubmit"), null);
            assert.equal(root.querySelector("[data-maneuver-contact]"), null);
            assert.equal(root.querySelector("#maneuverCustomText"), null);
            assert.equal(requests.length, 0);
            app.destroy();
            dom.window.close();
          });

          '''
          legacy_test.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          room_test = Path('apps/web/tests/room-main-game.test.mjs')
          source = room_test.read_text(encoding='utf-8')
          source = source.replace(
              '  assert.match(harness.root.textContent, /Maneuver Board/);',
              '  assert.ok(harness.root.querySelector(".maneuver-panel"));\n  assert.equal(harness.root.querySelectorAll("[data-maneuver-type]").length, 4);'
          )
          room_test.write_text(source, encoding='utf-8')

          batching_provider = Path('apps/api/src/continuous-story-v2/story-narrative.provider.ts')
          source = batching_provider.read_text(encoding='utf-8')
          source = source.replace('        batch.timer.unref?.();\n', '')
          batching_provider.write_text(source, encoding='utf-8')

          automation = Path('scripts/automation/apply-maneuver-p5.py')
          source = automation.read_text(encoding='utf-8')
          source = source.replace(
              'assert.match(root.textContent, /今日谋划机会已用完/);',
              'assert.equal(root.textContent.includes("今日谋划0 / 2"), true);'
          )
          automation.write_text(source, encoding='utf-8')
          PY
          python3 scripts/automation/apply-maneuver-p5.py
