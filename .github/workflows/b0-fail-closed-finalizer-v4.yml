name: B0 Fail-Closed C8 C9 Finalizer V4

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-fail-closed-finalizer-v4.yml

permissions:
  actions: read
  contents: write
  statuses: write

concurrency:
  group: b0-fail-closed-finalizer-v4-${{ github.ref }}
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_MAIN_BASELINE: 86da64eea18ab773312f40c7024ace9cb393344a
  B0_ROOT: docs/auto-execute/evidence/b0

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Publish locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/finalizer-v4",
              description: `fail-closed finalizer v4 running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact fast-forward starting point
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH" main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$B0_MAIN_BASELINE"
          test -z "$(git status --short)"
          mkdir -p .artifacts/b0-finalizer-v4
          printf '%s\n' "$GITHUB_SHA" > .artifacts/b0-finalizer-v4/local-head.txt
          printf '%s\n' "$(git rev-parse origin/$B0_BRANCH)" > .artifacts/b0-finalizer-v4/remote-tip-before-push.txt

      - name: Wait for authoritative same-SHA workflows
        id: observe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, time
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          out = pathlib.Path(".artifacts/b0-finalizer-v4")
          required = {
              "exact": "b0/exact-push",
              "contract": "b0/acceptance-contract",
              "engineering": "b0/engineering-real-acceptance",
              "formal": "b0/formal-c8",
          }
          deadline = time.time() + 4 * 60 * 60
          records = None
          while time.time() < deadline:
              payload = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/commits/{sha}/status"], text=True))
              by_context = {row.get("context"): row for row in payload.get("statuses", [])}
              current = {}
              complete = True
              for key, context in required.items():
                  row = by_context.get(context)
                  state = (row or {}).get("state")
                  target = str((row or {}).get("target_url", ""))
                  match = re.search(r"/actions/runs/(\d+)", target)
                  current[key] = {
                      "context": context,
                      "state": state,
                      "description": (row or {}).get("description"),
                      "targetUrl": target or None,
                      "runId": int(match.group(1)) if match else None,
                  }
                  complete = complete and state in {"success", "failure", "error"}
              records = current
              (out / "workflow-statuses.json").write_text(json.dumps({"testedCodeSha": sha, "records": current}, indent=2) + "\n")
              if complete:
                  break
              time.sleep(20)
          else:
              raise SystemExit("Timed out waiting for exact/contract/engineering/formal commit statuses")
          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a") as handle:
              for key, row in records.items():
                  handle.write(f"{key}_state={row.get('state') or ''}\n")
                  handle.write(f"{key}_run_id={row.get('runId') or ''}\n")
          print(json.dumps(records, indent=2))
          PY

      - name: Download authoritative logs and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_RUN_ID: ${{ steps.observe.outputs.exact_run_id }}
          ACCEPTANCE_RUN_ID: ${{ steps.observe.outputs.engineering_run_id }}
        run: |
          set -euo pipefail
          root=.artifacts/b0-finalizer-v4
          mkdir -p "$root/gates" "$root/downloads" "$root/extracted"
          for run_id in "$EXACT_RUN_ID" "$ACCEPTANCE_RUN_ID"; do
            test -n "$run_id" || continue
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$root/gates/run-$run_id.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$root/gates/run-$run_id-jobs.json"
            gh run view "$run_id" --log > "$root/gates/run-$run_id.log" 2>&1 || true
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$root/downloads/run-$run_id-artifacts.json"
          done
          python3 - <<'PY'
          import json, pathlib, subprocess, zipfile, os
          root = pathlib.Path(".artifacts/b0-finalizer-v4")
          repo = os.environ["GITHUB_REPOSITORY"]
          selected = []
          for index in root.glob("downloads/run-*-artifacts.json"):
              payload = json.loads(index.read_text())
              for row in payload.get("artifacts", []):
                  name = str(row.get("name", ""))
                  if name.startswith(("b0-engineering-real-acceptance-", "b0-formal-c8-credential-blocker-", "b0-formal-c8-real-acceptance-", "b0-candidate-code-")):
                      selected.append({"id": row["id"], "name": name, "digest": row.get("digest"), "bytes": row.get("size_in_bytes")})
          (root / "selected-artifacts.json").write_text(json.dumps({"artifacts": selected}, indent=2) + "\n")
          for row in selected:
              archive = root / "downloads" / f"{row['name']}.zip"
              with archive.open("wb") as stream:
                  subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts/{row['id']}/zip"], stdout=stream, check=True)
              target = root / "extracted" / row["name"]
              target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(target)
          PY

      - name: Build accurate fail-closed evidence
        id: generate
        shell: bash
        env:
          EXACT_STATE: ${{ steps.observe.outputs.exact_state }}
          CONTRACT_STATE: ${{ steps.observe.outputs.contract_state }}
          ENGINEERING_STATE: ${{ steps.observe.outputs.engineering_state }}
          FORMAL_STATE: ${{ steps.observe.outputs.formal_state }}
          EXACT_RUN_ID: ${{ steps.observe.outputs.exact_run_id }}
          ACCEPTANCE_RUN_ID: ${{ steps.observe.outputs.engineering_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, re, shutil
          from datetime import datetime, timezone

          repo = pathlib.Path.cwd()
          stage = repo / ".artifacts/b0-finalizer-v4"
          root = repo / os.environ["B0_ROOT"]
          c8 = root / "c8"
          c9 = root / "c9"
          if root.exists():
              shutil.rmtree(root)
          for path in [c8, c9 / "gates", c9 / "runtime/engineering", c9 / "runtime/formal", c9 / "recovery", c9 / "readback"]:
              path.mkdir(parents=True, exist_ok=True)

          def read_json(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return None
          def copy_files(source, target):
              if not source.exists():
                  return
              for item in source.rglob("*"):
                  if item.is_file():
                      destination = target / item.relative_to(source)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(item, destination)
          def utc():
              return datetime.now(timezone.utc).isoformat()

          exact_state = os.environ.get("EXACT_STATE")
          contract_state = os.environ.get("CONTRACT_STATE")
          engineering_state = os.environ.get("ENGINEERING_STATE")
          formal_state = os.environ.get("FORMAL_STATE")
          exact_pass = exact_state == "success"
          contract_pass = contract_state == "success"

          engineering_dirs = sorted(p for p in (stage / "extracted").glob("b0-engineering-real-acceptance-*") if p.is_dir())
          blocker_dirs = sorted(p for p in (stage / "extracted").glob("b0-formal-c8-credential-blocker-*") if p.is_dir())
          formal_dirs = sorted(p for p in (stage / "extracted").glob("b0-formal-c8-real-acceptance-*") if p.is_dir())
          for source in engineering_dirs:
              copy_files(source, c9 / "runtime/engineering" / source.name)
          for source in blocker_dirs + formal_dirs:
              copy_files(source, c9 / "runtime/formal" / source.name)
          copy_files(stage / "gates", c9 / "gates")
          copy_files(stage / "extracted", c9 / "recovery/downloaded-artifacts")
          shutil.copy2(stage / "workflow-statuses.json", c9 / "gates/workflow-statuses.json")
          shutil.copy2(stage / "selected-artifacts.json", c9 / "gates/selected-artifacts.json")

          acceptance_result = None
          acceptance_path = None
          for directory in engineering_dirs:
              for path in directory.rglob("acceptance-result.json"):
                  payload = read_json(path)
                  if isinstance(payload, dict):
                      acceptance_result = payload
                      acceptance_path = path
                      break
              if acceptance_result:
                  break
          engineering_pass = bool(engineering_state == "success" and acceptance_result and acceptance_result.get("status") == "PASS")
          screenshot_count = sum(1 for directory in engineering_dirs for path in directory.rglob("*.png") if path.is_file())

          jobs_path = stage / "gates" / f"run-{os.environ.get('ACCEPTANCE_RUN_ID')}-jobs.json"
          jobs_payload = read_json(jobs_path) or {}
          jobs = jobs_payload.get("jobs", []) if isinstance(jobs_payload, dict) else []
          blocker_job = next((job for job in jobs if "credential blocker" in str(job.get("name", "")).lower()), None)
          formal_job = next((job for job in jobs if str(job.get("name", "")).lower().startswith("formal c8 on real")), None)
          external_blocked = bool(
              formal_state == "failure"
              and blocker_dirs
              and blocker_job
              and blocker_job.get("conclusion") == "failure"
              and (not formal_job or formal_job.get("conclusion") == "skipped")
          )
          formal_pass = bool(formal_state == "success" and formal_dirs)

          if exact_pass and contract_pass and engineering_pass and formal_pass:
              status = "PASS"
              classification = "FULL_PASS"
              ready = True
          elif exact_pass and contract_pass and engineering_pass and external_blocked:
              status = "EXTERNAL_BLOCKED"
              classification = "ENGINEERING_PASS_FORMAL_C8_EXTERNAL_BLOCKED"
              ready = False
          else:
              status = "INCOMPLETE"
              classification = "ENGINEERING_OR_FORMAL_VERIFICATION_INCOMPLETE"
              ready = False

          tested = os.environ["GITHUB_SHA"] if exact_pass and contract_pass and engineering_pass else None
          generated = utc()
          workflow_statuses = read_json(stage / "workflow-statuses.json")
          engineering = {
              "status": "PASS_ENGINEERING_ONLY" if engineering_pass else "FAIL",
              "passed": engineering_pass,
              "formalC8Substitute": False,
              "databaseKind": "official-self-hosted-supabase-postgres-random-schema",
              "realBrowserSessions": 3 if engineering_pass else None,
              "synchronizedWindows": 6 if engineering_pass else None,
              "screenshotCount": screenshot_count,
              "acceptanceResultPath": str(acceptance_path.relative_to(repo)).replace("\\", "/") if acceptance_path else None,
              "workflowRunId": int(os.environ["ACCEPTANCE_RUN_ID"]) if os.environ.get("ACCEPTANCE_RUN_ID") else None,
          }
          formal = {
              "status": "PASS" if formal_pass else ("EXTERNAL_BLOCKED" if external_blocked else "INCOMPLETE"),
              "passed": formal_pass,
              "externalBlocked": external_blocked,
              "managedNonProductionSupabaseRequired": True,
              "managedNonProductionSupabaseAvailable": formal_pass,
              "randomSchemaRequired": True,
              "publicSchemaForbiddenAsTestSchema": True,
              "selfHostedContainerMaySubstitute": False,
              "credentialValuesPersisted": False,
              "workflowRunId": int(os.environ["ACCEPTANCE_RUN_ID"]) if os.environ.get("ACCEPTANCE_RUN_ID") else None,
          }
          checkpoint = {
              "schemaVersion": 1,
              "generatedAtUtc": generated,
              "testedCodeSha": tested,
              "status": status,
              "classification": classification,
              "formalC8": formal,
              "engineeringAcceptance": engineering,
              "workflowStatuses": workflow_statuses,
          }
          (c8 / "checkpoint.json").write_text(json.dumps(checkpoint, indent=2) + "\n")

          job_rows = []
          for path in sorted((c9 / "gates").glob("run-*-jobs.json")):
              data = read_json(path) or {}
              for job in data.get("jobs", []):
                  job_rows.append({
                      "runId": job.get("run_id"),
                      "jobId": job.get("id"),
                      "name": job.get("name"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "startedAt": job.get("started_at"),
                      "completedAt": job.get("completed_at"),
                  })
          matrix = {
              "schemaVersion": 1,
              "generatedAtUtc": generated,
              "testedCodeSha": tested,
              "overall": status,
              "jobs": job_rows,
              "coverage": {
                  "exactEngineeringGates": exact_pass,
                  "acceptanceContract": contract_pass,
                  "threeIsolatedBrowserSessions": engineering_pass,
                  "sixSynchronizedWindows": engineering_pass,
                  "worldSequenceExactlyOnce": engineering_pass,
                  "privacyAndTypedAudience": engineering_pass,
                  "idempotentReplay": engineering_pass,
                  "narrativeSuccessFailure": engineering_pass,
                  "aiVacancyActionContract": engineering_pass,
                  "embeddedIndependentWorkers": engineering_pass,
                  "pauseResumeDeadlineLeaseCrashRecovery": engineering_pass,
                  "desktopAnd390px": engineering_pass,
                  "formalManagedNonProductionSupabase": formal_pass,
              },
          }
          (c9 / "test-matrix.json").write_text(json.dumps(matrix, indent=2) + "\n")
          (c9 / "checkpoint.json").write_text(json.dumps({
              "schemaVersion": 1,
              "generatedAtUtc": generated,
              "testedCodeSha": tested,
              "status": status,
              "classification": classification,
              "candidateBranchReady": ready,
              "completionMarkersAllowed": ready,
          }, indent=2) + "\n")
          result = {
              "schemaVersion": 1,
              "generatedAtUtc": generated,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["B0_BRANCH"],
              "mainBaselineSha": os.environ["B0_MAIN_BASELINE"],
              "testedCodeSha": tested,
              "evidenceCommitSha": None,
              "finalRemoteSha": None,
              "status": status,
              "classification": classification,
              "candidateBranchReady": ready,
              "completionMarkersAllowed": ready,
              "formalC8": formal,
              "engineeringAcceptance": engineering,
              "boundaries": {
                  "forcePushUsed": False,
                  "pullRequestUsed": False,
                  "deploymentPerformed": False,
                  "productionDatabaseTouched": False,
                  "productionConfigurationChanged": False,
                  "realUserDataTouched": False,
              },
          }
          (c9 / "B0_FINAL_DELIVERY_RESULT.json").write_text(json.dumps(result, indent=2) + "\n")
          (c9 / "recovery-audit.json").write_text(json.dumps({
              "schemaVersion": 1,
              "generatedAtUtc": generated,
              "startingRemoteSha": os.environ["GITHUB_SHA"],
              "priorFinalizers": ["v2", "v3"],
              "repair": "v4 removed heuristic engineering classification and uses authoritative same-SHA status plus acceptance-result PASS",
              "normalFastForwardRequired": True,
              "forcePushUsed": False,
          }, indent=2) + "\n")
          (c9 / "final-pointer.json").write_text(json.dumps({
              "schemaVersion": 1,
              "testedCodeSha": tested,
              "evidenceCommitSha": None,
              "finalRemoteSha": None,
              "finalRemoteShaResolution": "external git ls-remote plus clean clone, because a commit cannot contain its own SHA",
              "status": status,
              "classification": classification,
          }, indent=2) + "\n")
          (c9 / "HANDOFF.md").write_text(f"""# B0 C8/C9 HANDOFF\n\n- status: `{status}`\n- classification: `{classification}`\n- testedCodeSha: `{tested or 'not frozen'}`\n- exact run: `{os.environ.get('EXACT_RUN_ID') or 'unknown'}`\n- acceptance run: `{os.environ.get('ACCEPTANCE_RUN_ID') or 'unknown'}`\n\nEngineering artifacts are under `runtime/engineering/**`; formal managed-Supabase evidence or the fail-closed credential blocker is under `runtime/formal/**`. A local `supabase/postgres` container is `PASS_ENGINEERING_ONLY` and never substitutes for formal C8. Do not claim candidate readiness while formal C8 is `EXTERNAL_BLOCKED`.\n""")
          (c9 / "B0_FINAL_DELIVERY_REPORT.md").write_text(f"""# B0 Final Delivery Report\n\n## Result\n\n- status: `{status}`\n- classification: `{classification}`\n- candidate ready: `{str(ready).lower()}`\n- tested code SHA: `{tested or 'not frozen'}`\n\n## Engineering\n\n- exact gates: `{exact_state}`\n- acceptance contract: `{contract_state}`\n- engineering acceptance: `{engineering['status']}`\n- real browser screenshots: `{screenshot_count}`\n\n## Formal C8\n\n- status: `{formal['status']}`\n- managed non-production Supabase required: `true`\n- self-hosted container substitute: `false`\n\nNo force push, PR operation, deployment, production database/configuration access, or real-user data access was performed.\n""")

          # Redact text evidence before scanning and committing.
          patterns = [
              (re.compile(r"postgres(?:ql)?://[^\s\"'<>`]+", re.I), "[REDACTED_DATABASE_URL]"),
              (re.compile(r"Bearer\s+[A-Za-z0-9._~+/-]+=*", re.I), "Bearer [REDACTED]"),
              (re.compile(r"sk-[A-Za-z0-9_-]{16,}"), "[REDACTED_API_KEY]"),
              (re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"), "[REDACTED_JWT]"),
          ]
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp", ".zip"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              for pattern, replacement in patterns:
                  text = pattern.sub(replacement, text)
              path.write_text(text, encoding="utf-8")

          findings = []
          scan_patterns = [
              ("database-url", re.compile(r"postgres(?:ql)?://[^\s\"'<>`]+", re.I)),
              ("bearer", re.compile(r"Bearer\s+(?!\[REDACTED\])[A-Za-z0-9._~+/-]+=*", re.I)),
              ("api-key", re.compile(r"sk-[A-Za-z0-9_-]{16,}")),
              ("jwt", re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}")),
          ]
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp", ".zip"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              for kind, pattern in scan_patterns:
                  if pattern.search(text):
                      findings.append({"path": str(path.relative_to(repo)).replace("\\", "/"), "kind": kind})
          scan = {"schemaVersion": 1, "generatedAtUtc": generated, "status": "PASS" if not findings else "FAIL", "findingCount": len(findings), "findings": findings}
          (c9 / "redaction-scan.json").write_text(json.dumps(scan, indent=2) + "\n")
          if findings:
              raise SystemExit(f"secret scan failed: {findings}")

          excluded = {"manifest.json", "manifest.sha256", "final-pointer.json"}
          artifacts = []
          total = 0
          for path in sorted(c9.rglob("*")):
              if not path.is_file() or path.name in excluded:
                  continue
              raw = path.read_bytes()
              artifacts.append({"path": str(path.relative_to(c9)).replace("\\", "/"), "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()})
              total += len(raw)
          manifest = {
              "schemaVersion": 1,
              "generatedAtUtc": generated,
              "testedCodeSha": tested,
              "artifactCount": len(artifacts),
              "totalBytes": total,
              "excludedSelfReferentialFiles": sorted(excluded),
              "artifacts": artifacts,
          }
          manifest_path = c9 / "manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          (c9 / "manifest.sha256").write_text(f"{hashlib.sha256(manifest_path.read_bytes()).hexdigest()}  manifest.json\n")

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
              handle.write(f"status={status}\n")
              handle.write(f"classification={classification}\n")
              handle.write(f"tested_sha={tested or ''}\n")
          print(json.dumps({"status": status, "classification": classification, "testedCodeSha": tested, "engineeringPass": engineering_pass, "formalPass": formal_pass, "externalBlocked": external_blocked}, indent=2))
          PY
          for file in \
            "$B0_ROOT/c8/checkpoint.json" \
            "$B0_ROOT/c9/manifest.json" \
            "$B0_ROOT/c9/checkpoint.json" \
            "$B0_ROOT/c9/final-pointer.json" \
            "$B0_ROOT/c9/HANDOFF.md" \
            "$B0_ROOT/c9/test-matrix.json" \
            "$B0_ROOT/c9/B0_FINAL_DELIVERY_RESULT.json" \
            "$B0_ROOT/c9/B0_FINAL_DELIVERY_REPORT.md" \
            "$B0_ROOT/c9/recovery-audit.json"; do
            test -f "$file"
          done
          git diff --check -- "$B0_ROOT"

      - name: Commit and push two docs-only evidence commits
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          before="$(git rev-parse origin/$B0_BRANCH)"
          test "$before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$B0_ROOT"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -Ev '^docs/auto-execute/evidence/b0/' || true)"
          git commit -m "docs(b0): record fail-closed C8 C9 evidence v4"
          evidence_sha="$(git rev-parse HEAD)"
          python3 - "$evidence_sha" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path("docs/auto-execute/evidence/b0/c9/final-pointer.json")
          payload = json.loads(path.read_text())
          payload["evidenceCommitSha"] = sys.argv[1]
          path.write_text(json.dumps(payload, indent=2) + "\n")
          PY
          git add "$B0_ROOT/c9/final-pointer.json"
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$B0_ROOT/c9/final-pointer.json"
          git commit -m "docs(b0): seal fail-closed evidence pointer v4"
          final_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$B0_BRANCH"
          after="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
          test "$after" = "$final_sha"
          {
            echo "remote_before=$before"
            echo "evidence_sha=$evidence_sha"
            echo "final_sha=$final_sha"
            echo "remote_after=$after"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$after" > .artifacts/b0-finalizer-v4/remote-tip-after-push.txt

      - name: Verify final SHA from a clean clone
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.generate.outputs.tested_sha }}
          EVIDENCE_SHA: ${{ steps.push.outputs.evidence_sha }}
          FINAL_SHA: ${{ steps.push.outputs.final_sha }}
        run: |
          set -euo pipefail
          clone="$RUNNER_TEMP/b0-final-v4-clone"
          rm -rf "$clone"
          git clone --no-tags --single-branch --branch "$B0_BRANCH" "https://github.com/$GITHUB_REPOSITORY.git" "$clone"
          cd "$clone"
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')" = "$FINAL_SHA"
          test "$(git rev-parse HEAD^)" = "$EVIDENCE_SHA"
          if test -n "$TESTED_SHA"; then
            git merge-base --is-ancestor "$TESTED_SHA" "$EVIDENCE_SHA"
            git merge-base --is-ancestor "$EVIDENCE_SHA" "$FINAL_SHA"
            git diff --name-only "$TESTED_SHA..$FINAL_SHA" > "$RUNNER_TEMP/tested-to-final.txt"
            test -s "$RUNNER_TEMP/tested-to-final.txt"
            test -z "$(grep -Ev '^docs/auto-execute/evidence/b0/' "$RUNNER_TEMP/tested-to-final.txt" || true)"
          else
            : > "$RUNNER_TEMP/tested-to-final.txt"
          fi
          git ls-tree -r --name-only "$FINAL_SHA" -- docs/auto-execute/evidence/b0/c8 docs/auto-execute/evidence/b0/c9 > "$RUNNER_TEMP/c8-c9-tree.txt"
          test "$(wc -l < "$RUNNER_TEMP/c8-c9-tree.txt")" -gt 9
          python3 - "$TESTED_SHA" "$EVIDENCE_SHA" "$FINAL_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          tested, evidence, final = sys.argv[1:]
          root = pathlib.Path("docs/auto-execute/evidence/b0")
          c9 = root / "c9"
          for path in root.rglob("*.json"):
              json.loads(path.read_text())
          manifest_path = c9 / "manifest.json"
          manifest = json.loads(manifest_path.read_text())
          errors = []
          total = 0
          for row in manifest.get("artifacts", []):
              path = c9 / row["path"]
              if not path.is_file():
                  errors.append(f"missing:{row['path']}")
                  continue
              raw = path.read_bytes()
              total += len(raw)
              if len(raw) != row["bytes"]: errors.append(f"bytes:{row['path']}")
              if hashlib.sha256(raw).hexdigest() != row["sha256"]: errors.append(f"sha:{row['path']}")
          if total != manifest.get("totalBytes"): errors.append("totalBytes")
          if len(manifest.get("artifacts", [])) != manifest.get("artifactCount"): errors.append("artifactCount")
          if hashlib.sha256(manifest_path.read_bytes()).hexdigest() != (c9 / "manifest.sha256").read_text().split()[0]: errors.append("manifest.sha256")
          scan = json.loads((c9 / "redaction-scan.json").read_text())
          if scan.get("status") != "PASS" or scan.get("findingCount") != 0: errors.append("redaction")
          pointer = json.loads((c9 / "final-pointer.json").read_text())
          if pointer.get("evidenceCommitSha") != evidence: errors.append("evidenceCommitSha")
          if tested and pointer.get("testedCodeSha") != tested: errors.append("testedCodeSha")
          if errors: raise SystemExit(str(errors))
          proof = {
              "schemaVersion": 1,
              "status": "PASS",
              "testedCodeSha": tested or None,
              "evidenceCommitSha": evidence,
              "finalRemoteSha": final,
              "liveTipMatches": True,
              "c8c9TrackedPathCount": len(pathlib.Path("%s").read_text().splitlines()) if False else None,
              "manifestArtifactCount": manifest.get("artifactCount"),
              "redactionStatus": scan.get("status"),
          }
          pathlib.Path("/tmp/b0-final-v4-readback.json").write_text(json.dumps(proof, indent=2) + "\n")
          PY
          cp /tmp/b0-final-v4-readback.json "$GITHUB_WORKSPACE/.artifacts/b0-finalizer-v4/fresh-clone-readback.json"
          cp "$RUNNER_TEMP/c8-c9-tree.txt" "$GITHUB_WORKSPACE/.artifacts/b0-finalizer-v4/c8-c9-tree.txt"
          cp "$RUNNER_TEMP/tested-to-final.txt" "$GITHUB_WORKSPACE/.artifacts/b0-finalizer-v4/tested-to-final.txt"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
            -f state=success \
            -f context='b0/finalizer-v4-readback' \
            -f description="clean-clone evidence verification passed in $GITHUB_RUN_ID" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Upload finalizer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0-fail-closed-finalizer-v4-${{ github.sha }}
          path: .artifacts/b0-finalizer-v4
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          DELIVERY_STATUS: ${{ steps.generate.outputs.status }}
          CLASSIFICATION: ${{ steps.generate.outputs.classification }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/finalizer-v4",
              description: success
                ? `${process.env.DELIVERY_STATUS || "UNKNOWN"}: ${process.env.CLASSIFICATION || "UNKNOWN"}`.slice(0, 140)
                : `fail-closed finalizer v4 failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("B0 fail-closed finalizer v4 failed");
