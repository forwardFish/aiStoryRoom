name: Repair and verify main baseline integrity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/main-baseline-integrity-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: b1315004ef836fb3a625c8201d362a395284b0dc
      BASE_TREE: 130aecca82cd213410ddff26f1dd78d1c0c31b42
      STAGING_WORKFLOW: .github/workflows/main-baseline-integrity-repair.yml
      SOURCE_MANIFEST: packages/templates/config/sangtian/pressure-chapter-v1/release/source-regression-manifest.json
      RELEASE_MANIFEST: packages/templates/config/sangtian/pressure-chapter-v1/release/release-manifest.json
      SEAT_TEST: apps/api/src/pressure-chapter/seat-control-persistence/seat-control-persistence.spec.ts
      EXPECTED_SEAT_TEST_SHA256: eb8c8a8496d5b2a12df815831cf3b3a2f0cb02c9fe7ea8853283708eb12bb5da
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify staging parent and repository rules
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test -f AGENTS.md
          git merge-base --is-ancestor "$BASE_SHA" HEAD

      - name: Set up repository pnpm major
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate minimal lockfile repair
        run: |
          set -o pipefail
          mkdir -p .main-baseline-evidence
          pnpm install --no-frozen-lockfile --lockfile-only \
            2>&1 | tee .main-baseline-evidence/lockfile-generation.log

      - name: Prove lockfile change is the single missing workspace importer
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          import pathlib
          import subprocess
          import sys

          base_sha = os.environ["BASE_SHA"]
          base = subprocess.check_output(
              ["git", "show", f"{base_sha}:pnpm-lock.yaml"],
              text=True,
          )
          marker = "  apps/api:\n    dependencies:\n      '@ai-story/shared':"
          insertion = (
              "  apps/api:\n"
              "    dependencies:\n"
              "      '@apps/openovel-runtime':\n"
              "        specifier: workspace:*\n"
              "        version: link:../openovel-runtime\n"
              "      '@ai-story/shared':"
          )
          if base.count(marker) != 1:
              raise SystemExit("apps/api lock importer marker is not unique")
          expected = base.replace(marker, insertion, 1)
          actual = pathlib.Path("pnpm-lock.yaml").read_text(encoding="utf-8")
          if actual != expected:
              subprocess.run(
                  ["git", "diff", "--", "pnpm-lock.yaml"],
                  check=False,
              )
              raise SystemExit("pnpm produced a non-minimal lockfile change")
          print("LOCKFILE_MINIMAL_CHANGE=PASS")
          PY

      - name: Run exact clean frozen install gate
        run: |
          set -o pipefail
          CI=true pnpm install --frozen-lockfile \
            2>&1 | tee .main-baseline-evidence/frozen-install.log

      - name: Re-sign source regression and release artifact chain
        run: |
          set -o pipefail
          node --import tsx --input-type=module <<'NODE' \
            2>&1 | tee .main-baseline-evidence/hash-resign.log
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { sha256Canonical } from "./packages/shared/src/index.ts";

          const sourceManifestPath = process.env.SOURCE_MANIFEST;
          const releaseManifestPath = process.env.RELEASE_MANIFEST;
          const seatTestPath = process.env.SEAT_TEST;
          const expectedSeatHash = process.env.EXPECTED_SEAT_TEST_SHA256;
          if (!sourceManifestPath || !releaseManifestPath || !seatTestPath || !expectedSeatHash) {
            throw new Error("required hash repair environment is missing");
          }

          const seatHash = createHash("sha256")
            .update(readFileSync(seatTestPath))
            .digest("hex");
          if (seatHash !== expectedSeatHash) {
            throw new Error(`seat test SHA drifted: ${seatHash}`);
          }

          const sourceManifest = JSON.parse(readFileSync(sourceManifestPath, "utf8"));
          const entry = sourceManifest.entries.find(
            (candidate) => candidate.sourceBranch === "codex/openovel-multiplayer-v1",
          );
          if (!entry) throw new Error("OpenNovel multiplayer source-regression entry is missing");
          const target = entry.targetTests.find(
            (candidate) => candidate.path === seatTestPath,
          );
          if (!target) throw new Error("Seat persistence target test is missing from source regression");
          const oldTargetHash = target.sha256RawBytes;
          target.sha256RawBytes = seatHash;
          writeFileSync(sourceManifestPath, `${JSON.stringify(sourceManifest, null, 2)}\n`);

          const sourceManifestHash = sha256Canonical(sourceManifest);
          const releaseManifest = JSON.parse(readFileSync(releaseManifestPath, "utf8"));
          const artifact = releaseManifest.artifacts.find(
            (candidate) => candidate.artifactId === "source_regression_manifest",
          );
          if (!artifact || artifact.hashMode !== "CANONICAL_JSON") {
            throw new Error("source-regression release artifact binding is missing or invalid");
          }
          const oldArtifactHash = artifact.sha256;
          artifact.sha256 = sourceManifestHash;
          writeFileSync(releaseManifestPath, `${JSON.stringify(releaseManifest, null, 2)}\n`);

          console.log(`SEAT_TEST_SHA256=${seatHash}`);
          console.log(`OLD_TARGET_SHA256=${oldTargetHash}`);
          console.log(`SOURCE_REGRESSION_MANIFEST_SHA256=${sourceManifestHash}`);
          console.log(`OLD_RELEASE_ARTIFACT_SHA256=${oldArtifactHash}`);
          NODE

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run release source-regression gate
        run: |
          set -o pipefail
          pnpm exec node --import tsx --test \
            packages/templates/tests/pressure-chapter-release-artifacts.test.ts \
            2>&1 | tee .main-baseline-evidence/release-artifacts.log

      - name: Run full API TypeScript gate
        run: |
          set -o pipefail
          pnpm --filter @apps/api exec tsc --noEmit --pretty false \
            2>&1 | tee .main-baseline-evidence/api-tsc.log

      - name: Run all five convergence test files
        run: |
          set -o pipefail
          node --import tsx --test \
            apps/api/src/pressure-chapter/decision-automation/decision-convergence.api.spec.ts \
            apps/api/src/pressure-chapter/decision-automation/decision-convergence-capability.api.spec.ts \
            apps/api/src/pressure-chapter/decision-automation/prisma-snapshot.api.spec.ts \
            apps/api/src/pressure-chapter/persistence/prepared-automation-action.prisma-adapter.api.spec.ts \
            apps/api/src/pressure-chapter/orchestrator/decision-convergence-reconciliation.api.spec.ts \
            2>&1 | tee .main-baseline-evidence/convergence-tests.log

      - name: Remove staging workflow and verify final scope
        run: |
          set -euo pipefail
          git rm "$STAGING_WORKFLOW"
          git diff --check
          git diff --name-status "$BASE_SHA" | tee .main-baseline-evidence/final-diff-name-status.txt
          actual="$(git diff --name-only "$BASE_SHA" | sort)"
          expected=$'packages/templates/config/sangtian/pressure-chapter-v1/release/release-manifest.json\npackages/templates/config/sangtian/pressure-chapter-v1/release/source-regression-manifest.json\npnpm-lock.yaml'
          test "$actual" = "$expected"
          if printf '%s\n' "$actual" | grep -E '^(apps/web/|prisma/schema\.prisma$|prisma/migrations/|apps/openovel-runtime/|apps/api/src/pressure-chapter/decision-automation/.*\.ts$)' ; then
            echo "forbidden path changed" >&2
            exit 1
          fi

      - name: Commit and push without force
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Pro"
          git config user.email "chatgpt-pro@users.noreply.github.com"
          git add \
            pnpm-lock.yaml \
            "$SOURCE_MANIFEST" \
            "$RELEASE_MANIFEST" \
            "$STAGING_WORKFLOW"
          git commit -m "fix(build): restore lockfile and release integrity"
          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          final_parent="$(git rev-parse HEAD^)"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          {
            echo "FINAL_COMMIT_SHA=$final_sha"
            echo "FINAL_TREE_SHA=$final_tree"
            echo "FINAL_PARENT_SHA=$final_parent"
            echo "BASE_SHA=$BASE_SHA"
          } | tee .main-baseline-evidence/final-sha.txt
          git diff --name-status "$BASE_SHA...$final_sha" \
            | tee .main-baseline-evidence/committed-diff-name-status.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-baseline-integrity-evidence
          path: .main-baseline-evidence
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
