name: B0 Candidate Engineering Gates

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths-ignore:
      - "docs/auto-execute/evidence/b0/**"

permissions:
  contents: read
  statuses: write

concurrency:
  group: b0-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    name: Exact candidate code snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish exact run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/exact-push",
              description: `engineering gates running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact push checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Create downloadable code-only archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          archive = Path(f"b0-candidate-code-{sha}.zip")
          manifest_path = Path(f"b0-candidate-code-{sha}.manifest.json")
          roots = (".github/", "api/", "apps/", "packages/", "prisma/", "scripts/", "third_party/")
          extensions = {
              ".cjs", ".css", ".graphql", ".html", ".js", ".json", ".md", ".mjs",
              ".prisma", ".ps1", ".sh", ".sql", ".toml", ".ts", ".tsx", ".txt",
              ".xml", ".yaml", ".yml",
          }
          root_names = {
              ".dockerignore", ".env.example", ".gitattributes", ".gitignore", ".vercelignore",
              "AGENTS.md", "README.md", "docker-compose.yml", "harness.yml", "package.json",
              "pnpm-lock.yaml", "pnpm-workspace.yaml", "railway.toml", "tsconfig.base.json", "vercel.json",
          }
          required_docs = (
              "docs/Our_Many_Worlds_B0同步结算多人博弈_完整实施开发测试与受控上线方案_v1.0.md",
              "docs/b0/",
              "docs/auto-execute/evidence/b0/",
          )
          tracked = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          selected: list[str] = []
          excluded_large: list[dict[str, object]] = []
          for name in tracked:
              path = Path(name)
              in_scope = name in root_names or name.startswith(roots) or name == required_docs[0] or name.startswith(required_docs[1:])
              if not in_scope:
                  continue
              if name not in root_names and path.suffix.lower() not in extensions:
                  continue
              size = path.stat().st_size
              if size > 20 * 1024 * 1024:
                  excluded_large.append({"path": name, "sizeBytes": size})
                  continue
              selected.append(name)
          selected.sort()
          if not selected:
              raise SystemExit("code-only source selection is empty")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as output:
              for name in selected:
                  output.write(name, arcname=name)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          manifest = {
              "schemaVersion": 1,
              "testedCodeSha": sha,
              "archive": archive.name,
              "archiveSizeBytes": archive.stat().st_size,
              "archiveSha256": digest,
              "trackedFileCount": len(tracked),
              "archivedFileCount": len(selected),
              "excludedLargeFiles": excluded_large,
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          if archive.stat().st_size >= 500 * 1024 * 1024:
              raise SystemExit("code-only source archive is too large for connector retrieval")
          PY
      - name: Upload exact code archive
        uses: actions/upload-artifact@v4
        with:
          name: b0-candidate-code-${{ github.sha }}
          path: |
            b0-candidate-code-${{ github.sha }}.zip
            b0-candidate-code-${{ github.sha }}.manifest.json
          if-no-files-found: error
          retention-days: 7

  focused-contracts:
    name: Focused B0 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact push checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Shared typecheck
        run: pnpm --filter @ai-story/shared typecheck
      - name: Templates typecheck
        run: pnpm --filter @ai-story/templates typecheck
      - name: B0 contract
        run: pnpm --filter @ai-story/templates test:b0-contract
      - name: B0 batch
        run: pnpm --filter @ai-story/templates test:b0-batch
      - name: B0 multi-role
        run: pnpm --filter @ai-story/templates test:b0-multi
      - name: B0 typed audience
        run: pnpm --filter @ai-story/templates test:b0-audience
      - name: Shared build
        run: pnpm --filter @ai-story/shared build
      - name: Templates build
        run: pnpm --filter @ai-story/templates build
      - name: OpenNovel B0 runtime
        run: pnpm --filter @apps/openovel-runtime test:b0-runtime
      - name: OpenNovel runtime typecheck
        run: pnpm --filter @apps/openovel-runtime typecheck
      - name: API B0 commit
        run: pnpm --filter @apps/api test:b0-batch
      - name: API B0 window coordinator
        run: pnpm --filter @apps/api test:b0-window
      - name: API B0 player window
        run: pnpm --filter @apps/api test:b0-player-window
      - name: API B0 worker and outbox
        run: pnpm --filter @apps/api test:b0-pipeline
      - name: API B0 operations
        run: pnpm --filter @apps/api test:b0-ops
      - name: API typecheck
        run: pnpm --filter @apps/api typecheck
      - name: Web typecheck
        run: pnpm --filter @apps/web typecheck
      - name: Web B0 window
        run: pnpm --filter @apps/web test:b0-window

  full-api-story-build:
    name: API, Story V4, Maneuver and builds
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact push checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Root typecheck
        run: pnpm typecheck
      - name: Full API regression
        run: pnpm --filter @apps/api test
      - name: OpenNovel compiler full regression
        run: pnpm --filter @ai-story/openovel-runtime test
      - name: OpenNovel compiler typecheck
        run: pnpm --filter @ai-story/openovel-runtime typecheck
      - name: Story V4 contracts and runtime
        run: pnpm test:story:v4
      - name: Maneuver acceptance matrix
        run: pnpm test:maneuver
      - name: API build
        run: pnpm --filter @apps/api build
      - name: OpenNovel runtime build
        run: pnpm --filter @apps/openovel-runtime build
      - name: Web build
        run: pnpm --filter @apps/web build
      - name: Root build
        run: pnpm build

  full-web:
    name: Full Web regression on Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact push checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Web typecheck
        run: pnpm --filter @apps/web typecheck
      - name: Web B0 window
        run: pnpm --filter @apps/web test:b0-window
      - name: Full Web regression
        run: pnpm --filter @apps/web test
      - name: Web build
        run: pnpm --filter @apps/web build

  causal-aggregate:
    name: Causal aggregate on Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact push checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Causal aggregate
        run: pnpm test:causal

  user-test-seed:
    name: USER_TEST_READY clean-clone seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_story
          POSTGRES_PASSWORD: ai_story_pwd
          POSTGRES_DB: ai_story_run
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_story -d ai_story_run"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Create the documented local environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://ai_story:ai_story_pwd@127.0.0.1:5432/ai_story_run?schema=public
          EOF
      - name: Generate client and apply migrations
        shell: bash
        run: |
          set -euo pipefail
          pnpm db:generate
          pnpm db:migrate:deploy
      - name: Run the documented seed command and record its exit code
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .artifacts/user-test-seed
          set +e
          pnpm db:seed > .artifacts/user-test-seed/db-seed.log 2>&1
          exit_code=$?
          set -e
          cat .artifacts/user-test-seed/db-seed.log
          cat > .artifacts/user-test-seed/result.json <<EOF
          {"testedCodeSha":"$GITHUB_SHA","command":"pnpm db:seed","exitCode":$exit_code}
          EOF
          test "$exit_code" -eq 0
      - name: Read back seeded records
        shell: bash
        run: |
          set -euo pipefail
          node --env-file=.env --import tsx --input-type=module <<'NODE'
          import { PrismaClient } from "@prisma/client";
          const prisma = new PrismaClient();
          try {
            const [templateCount, userCount, runCount] = await Promise.all([
              prisma.worldTemplate.count(),
              prisma.user.count({ where: { openid: "mock_openid_owner_001" } }),
              prisma.storyRun.count({ where: { inviteCode: "LOCAL1" } }),
            ]);
            const result = { templateCount, userCount, runCount };
            console.log(JSON.stringify(result));
            if (templateCount < 1 || userCount !== 1 || runCount !== 1) {
              throw new Error(`seed readback failed: ${JSON.stringify(result)}`);
            }
          } finally {
            await prisma.$disconnect();
          }
          NODE
      - name: Minimum regression and changed-file secret scan
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(p.scripts["db:seed"]!=="node --env-file-if-exists=.env --import tsx prisma/seed.ts") process.exit(1)'
          python3 - <<'PY'
          import pathlib, re
          paths = [pathlib.Path("package.json"), pathlib.Path(".github/workflows/causal-mvp.yml")]
          patterns = {
              "api-key": re.compile(r"sk-[A-Za-z0-9_-]{16,}"),
              "bearer": re.compile(r"Bearer\s+[A-Za-z0-9._~+/-]{16,}", re.I),
              "jwt": re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"),
          }
          findings = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for kind, pattern in patterns.items():
                  if pattern.search(text): findings.append({"path": str(path), "kind": kind})
          if findings: raise SystemExit(str(findings))
          print("changed-file secret scan: PASS")
          PY
      - name: Upload clean-clone seed proof
        uses: actions/upload-artifact@v4
        with:
          name: b0-user-test-seed-${{ github.sha }}
          path: .artifacts/user-test-seed
          if-no-files-found: error
          retention-days: 14

  record-outcome:
    name: Record exact push outcome
    if: always()
    needs:
      - source-snapshot
      - focused-contracts
      - full-api-story-build
      - full-web
      - causal-aggregate
      - user-test-seed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish final commit status
        uses: actions/github-script@v7
        env:
          SOURCE_RESULT: ${{ needs.source-snapshot.result }}
          FOCUSED_RESULT: ${{ needs.focused-contracts.result }}
          FULL_API_STORY_BUILD_RESULT: ${{ needs.full-api-story-build.result }}
          FULL_WEB_RESULT: ${{ needs.full-web.result }}
          CAUSAL_AGGREGATE_RESULT: ${{ needs.causal-aggregate.result }}
          USER_TEST_SEED_RESULT: ${{ needs.user-test-seed.result }}
        with:
          script: |
            const results = {
              source: process.env.SOURCE_RESULT,
              focused: process.env.FOCUSED_RESULT,
              apiStoryBuild: process.env.FULL_API_STORY_BUILD_RESULT,
              web: process.env.FULL_WEB_RESULT,
              causal: process.env.CAUSAL_AGGREGATE_RESULT,
              userTestSeed: process.env.USER_TEST_SEED_RESULT,
            };
            const success = Object.values(results).every((value) => value === "success");
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/exact-push",
              description: success ? `all engineering gates passed in ${context.runId}` : `engineering gates failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.summary.addHeading("B0 exact-push results").addCodeBlock(JSON.stringify({ sha: context.sha, runId: context.runId, results }, null, 2), "json").write();
            if (!success) core.setFailed(`One or more B0 engineering jobs failed: ${JSON.stringify(results)}`);
