name: Causal MVP

on:
  pull_request:
    paths:
      - ".github/workflows/causal-mvp.yml"
      - ".github/workflows/maneuver-r2-1.yml"
      - "scripts/automation/r2-1-chunks/**"
      - "apps/api/**"
      - "apps/web/**"
      - "apps/openovel-runtime/**"
      - "packages/shared/**"
      - "packages/templates/**"
      - "scripts/acceptance/openovel-maneuver-live-browser.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - agent/causal-mvp

permissions:
  contents: write

concurrency:
  group: causal-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement-r2-1:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/mvp-four-maneuver-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Implement, test, commit and push R2-1
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          expected = '55952a74b32d0ef59fdcc1f4a70af2f856f5e7f6'
          chunk_root = Path('scripts/automation/r2-1-chunks')
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in sorted(chunk_root.glob('*.txt')))
          source = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          source = source.replace(
              "subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=ROOT, text=True).strip()",
              "subprocess.check_output(['git', 'merge-base', 'HEAD', expected], cwd=ROOT, text=True).strip()",
              1,
          )
          source = source.replace(
              "    # Remove temporary execution scaffolding from the final stage commit.\n",
              "    # Remove temporary execution scaffolding from the final stage commit.\n    import shutil\n    subprocess.run(['git', 'checkout', expected, '--', '.github/workflows/causal-mvp.yml'], cwd=ROOT, check=True)\n    shutil.rmtree(ROOT / 'scripts/automation/r2-1-chunks', ignore_errors=True)\n",
              1,
          )
          Path('/tmp/apply-maneuver-r2-1.py').write_text(source, encoding='utf-8')
          PY
          python3 /tmp/apply-maneuver-r2-1.py

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @apps/api typecheck
      - run: pnpm --filter @apps/web typecheck
      - run: pnpm test:causal

  openovel-maneuver-live-browser:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/mvp-four-maneuver-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openovel_maneuver_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openovel_maneuver_live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/openovel_maneuver_live?schema=public
      OPENOVEL_MANEUVER_EVIDENCE_ROOT: artifacts/openovel-maneuver-live
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply existing schema to isolated PostgreSQL
        run: pnpm exec prisma db push --skip-generate
      - name: Validate acceptance script syntax
        run: node --check scripts/acceptance/openovel-maneuver-live-browser.mjs
      - name: Build real OpenNovel runtime
        run: pnpm --filter @apps/openovel-runtime build
      - name: Build real API
        run: pnpm --filter @apps/api build
      - name: Confirm real Chrome is available
        run: google-chrome --version || google-chrome-stable --version || chromium --version
      - name: Run role-select to game live browser journey
        run: node scripts/acceptance/openovel-maneuver-live-browser.mjs
      - name: Upload browser, network, database, and process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openovel-maneuver-live-${{ github.sha }}
          path: artifacts/openovel-maneuver-live
          if-no-files-found: error
          retention-days: 30
