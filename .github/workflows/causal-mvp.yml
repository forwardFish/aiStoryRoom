name: Temporary browser-smoke chunk audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/causal-mvp.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit browser-smoke chunk blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          shas = [
              '9d255cf92478ec2f474a243bca2ee8b3c04814b8','28303d17ca88db18d350d543ea7da83e58f777f9','18654d3c209bdc90ad3d79ce96381a4f568021d9','2d1e60e4eba01fef4707cfd959602c101fa75998','aa04b01e95efd579c1a35727bbbd34e06335c326',
              '54bb15124fbbd5a5f53d2891ff1f4c36f9d10a2d','923303268534f297dce1ff197e3530719fca3be5','705be59fc30d8dc13dbbebfc2709dd77f3a91224','9240548d150d2672fc134271bbdb41f8bafe9549','872f49d414adf13a831005629ad7eead3221b523',
              '8d800feaba279dd87a5334b6a29aa51e3c9184fc','45afea8cd1ad5533cbd5d763d89a4e8030fe0a13','5a169d8c7e1a256adc84411fce08ec633e6980e2','041fd3166376edf582e260b18f7ca564ca18e62c','e73452990fd117289acc4f523f4d01ab45cdb7e4',
              '3b1746b0af800cea4eb0bc0ae34fb5eadab0a0ba','1318ded99c2bafff75149defea52eb64ac7dd1f8','1469ce067b4694f515782ae3c252dc9fae579168','aab6d939dccf7730f6eb528e5c71c96e9d8c2e77','8963ed3d1982368f5941614dd5e61df344dad8e5',
          ]
          missing = []
          for sha in shas:
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}', headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
                      print(f'OK {sha} size={payload.get("size")}')
              except urllib.error.HTTPError as error:
                  print(f'MISSING {sha} http={error.code}')
                  missing.append(sha)
          print('MISSING_LIST=' + ','.join(missing))
          raise SystemExit(1 if missing else 0)
          PY
