name: Causal MVP

on:
  pull_request:
    paths:
      - ".github/workflows/causal-mvp.yml"
      - "apps/api/**"
      - "apps/web/**"
      - "apps/openovel-runtime/**"
      - "packages/shared/**"
      - "packages/templates/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - agent/causal-mvp
      - codex/chatgpt-pro-maneuver-evidence-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @ai-story/shared typecheck
      - run: pnpm --filter @ai-story/templates typecheck
      - run: pnpm --filter @ai-story/templates test:b0-contract
      - run: pnpm --filter @ai-story/templates test:b0-batch
      - run: pnpm --filter @ai-story/templates test:b0-multi
      - run: pnpm --filter @ai-story/templates test:b0-audience
      - run: pnpm --filter @ai-story/shared build
      - run: pnpm --filter @ai-story/templates build
      - run: pnpm --filter @apps/openovel-runtime test:b0-runtime
      - run: pnpm --filter @apps/openovel-runtime typecheck
      - run: pnpm --filter @apps/api test:b0-batch
      - run: pnpm --filter @apps/api test:b0-window
      - run: pnpm --filter @apps/api test:b0-player-window
      - run: pnpm --filter @apps/api test:b0-pipeline
      - run: pnpm --filter @apps/api test:b0-ops
      - run: pnpm --filter @apps/api typecheck
      - run: pnpm --filter @apps/web typecheck
      - run: pnpm --filter @apps/web test:b0-window
      - name: Use Node 24 for the repository's browser regression mode
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Full Web regression
        run: |
          set -o pipefail
          pnpm --filter @apps/web test 2>&1 | tee /tmp/b0-web-regression.log
      - name: Upload Web regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0-web-regression-${{ github.sha }}
          path: /tmp/b0-web-regression.log
          if-no-files-found: error
          retention-days: 14
      - name: Restore Node 22 for the aggregate gate
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aggregate regression
        if: always()
        run: |
          set -o pipefail
          pnpm test:causal 2>&1 | tee /tmp/b0-aggregate-regression.log
      - name: Upload aggregate regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0-aggregate-regression-${{ github.sha }}
          path: /tmp/b0-aggregate-regression.log
          if-no-files-found: error
          retention-days: 14
