name: B0 Candidate Engineering Gates

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths-ignore:
      - "docs/auto-execute/evidence/b0/ci/**"

permissions:
  contents: write

concurrency:
  group: b0-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    name: Exact candidate source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact push checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Create exact source archive
        run: git archive --format=zip --output="b0-candidate-${GITHUB_SHA}.zip" HEAD
      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: b0-candidate-source-${{ github.sha }}
          path: b0-candidate-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 7

  publish-run-pointer:
    name: Publish exact push run pointer
    needs: source-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Publish run pointer only while this SHA is live
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          remote_sha="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Not publishing stale run pointer: remote=$remote_sha run=$GITHUB_SHA"
            exit 0
          fi
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          destination="docs/auto-execute/evidence/b0/ci/live-run.json"
          mkdir -p "$(dirname "$destination")"
          cat > "$destination" <<JSON
          {
            "schemaVersion": 1,
            "status": "RUNNING",
            "event": "$GITHUB_EVENT_NAME",
            "ref": "$GITHUB_REF",
            "testedCodeSha": "$GITHUB_SHA",
            "workflow": "$GITHUB_WORKFLOW",
            "runId": $GITHUB_RUN_ID,
            "runAttempt": $GITHUB_RUN_ATTEMPT,
            "sourceArtifactName": "b0-candidate-source-${GITHUB_SHA}",
            "createdAt": "$created_at",
            "jobs": {}
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          git commit -m "docs(b0): publish engineering run ${GITHUB_RUN_ID} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  focused-contracts:
    name: Focused B0 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact push checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Shared typecheck
        run: pnpm --filter @ai-story/shared typecheck
      - name: Templates typecheck
        run: pnpm --filter @ai-story/templates typecheck
      - name: B0 contract
        run: pnpm --filter @ai-story/templates test:b0-contract
      - name: B0 batch
        run: pnpm --filter @ai-story/templates test:b0-batch
      - name: B0 multi-role
        run: pnpm --filter @ai-story/templates test:b0-multi
      - name: B0 typed audience
        run: pnpm --filter @ai-story/templates test:b0-audience
      - name: Shared build
        run: pnpm --filter @ai-story/shared build
      - name: Templates build
        run: pnpm --filter @ai-story/templates build
      - name: OpenNovel B0 runtime
        run: pnpm --filter @apps/openovel-runtime test:b0-runtime
      - name: OpenNovel typecheck
        run: pnpm --filter @apps/openovel-runtime typecheck
      - name: API B0 commit
        run: pnpm --filter @apps/api test:b0-batch
      - name: API B0 window coordinator
        run: pnpm --filter @apps/api test:b0-window
      - name: API B0 player window
        run: pnpm --filter @apps/api test:b0-player-window
      - name: API B0 worker and outbox
        run: pnpm --filter @apps/api test:b0-pipeline
      - name: API B0 operations
        run: pnpm --filter @apps/api test:b0-ops
      - name: API typecheck
        run: pnpm --filter @apps/api typecheck
      - name: Web typecheck
        run: pnpm --filter @apps/web typecheck
      - name: Web B0 window
        run: pnpm --filter @apps/web test:b0-window

  full-api-story-build:
    name: API, Story V4, Maneuver and builds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact push checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Root typecheck
        run: pnpm typecheck
      - name: Full API regression
        run: pnpm --filter @apps/api test
      - name: Story V4 contracts and runtime
        run: pnpm test:story:v4
      - name: Maneuver acceptance matrix
        run: pnpm test:maneuver
      - name: OpenNovel build
        run: pnpm --filter @apps/openovel-runtime build
      - name: Web build
        run: pnpm --filter @apps/web build
      - name: Root build
        run: pnpm build

  full-web:
    name: Full Web regression on Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact push checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Web typecheck
        run: pnpm --filter @apps/web typecheck
      - name: Web B0 window
        run: pnpm --filter @apps/web test:b0-window
      - name: Full Web regression
        run: pnpm --filter @apps/web test
      - name: Web build
        run: pnpm --filter @apps/web build

  causal-aggregate:
    name: Causal aggregate on Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact push checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Causal aggregate
        run: pnpm test:causal

  record-outcome:
    name: Record exact push outcome
    if: always()
    needs:
      - source-snapshot
      - publish-run-pointer
      - focused-contracts
      - full-api-story-build
      - full-web
      - causal-aggregate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Persist exact run result on the docs-only child
        env:
          SOURCE_RESULT: ${{ needs.source-snapshot.result }}
          POINTER_RESULT: ${{ needs.publish-run-pointer.result }}
          FOCUSED_RESULT: ${{ needs.focused-contracts.result }}
          FULL_API_STORY_BUILD_RESULT: ${{ needs.full-api-story-build.result }}
          FULL_WEB_RESULT: ${{ needs.full-web.result }}
          CAUSAL_AGGREGATE_RESULT: ${{ needs.causal-aggregate.result }}
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout --detach "origin/${GITHUB_REF_NAME}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "Remote no longer descends from tested SHA $GITHUB_SHA"
            exit 0
          fi
          unexpected="$(git diff --name-only "$GITHUB_SHA"..HEAD | grep -Ev '^docs/auto-execute/evidence/b0/ci/(live-run\.json|[0-9a-f]{40}\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Remote contains non-CI changes after tested SHA:"
            echo "$unexpected"
            exit 0
          fi
          status=PASS
          for result in "$SOURCE_RESULT" "$POINTER_RESULT" "$FOCUSED_RESULT" "$FULL_API_STORY_BUILD_RESULT" "$FULL_WEB_RESULT" "$CAUSAL_AGGREGATE_RESULT"; do
            if [ "$result" != success ]; then status=FAIL; fi
          done
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          live="docs/auto-execute/evidence/b0/ci/live-run.json"
          final="docs/auto-execute/evidence/b0/ci/${GITHUB_SHA}.json"
          mkdir -p "$(dirname "$live")"
          cat > "$final" <<JSON
          {
            "schemaVersion": 1,
            "status": "$status",
            "event": "$GITHUB_EVENT_NAME",
            "ref": "$GITHUB_REF",
            "testedCodeSha": "$GITHUB_SHA",
            "workflow": "$GITHUB_WORKFLOW",
            "runId": $GITHUB_RUN_ID,
            "runAttempt": $GITHUB_RUN_ATTEMPT,
            "sourceArtifactName": "b0-candidate-source-${GITHUB_SHA}",
            "createdAt": "$created_at",
            "jobs": {
              "sourceSnapshot": "$SOURCE_RESULT",
              "publishRunPointer": "$POINTER_RESULT",
              "focusedContracts": "$FOCUSED_RESULT",
              "fullApiStoryBuild": "$FULL_API_STORY_BUILD_RESULT",
              "fullWeb": "$FULL_WEB_RESULT",
              "causalAggregate": "$CAUSAL_AGGREGATE_RESULT"
            }
          }
          JSON
          cp "$final" "$live"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$final" "$live"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(b0): record engineering gates for ${GITHUB_SHA} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
