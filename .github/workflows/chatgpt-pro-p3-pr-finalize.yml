name: ChatGPT Pro Finalize P3 via Candidate PR

on:
  pull_request:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: chatgpt-pro-p3-finalize
  cancel-in-progress: false

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      TARGET_BRANCH: codex/chatgpt-pro-ai-story-convergence
      CANDIDATE_SHA: ${{ github.event.pull_request.base.sha }}
      FROZEN_BASE_SHA: 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c
      PAYLOAD_PREFIX: docs/auto-execute/.chatgpt-pro-p3-final-stage.tar.gz.b64.part-
      READY_PATH: docs/auto-execute/.chatgpt-pro-p3-final-stage.ready
      PAYLOAD_B64_SHA256: c2043133ca4d06da76c43ab7f3c88213865ee7d70f8e2d61c831d66edd751755
      PAYLOAD_SHA256: 6c26a75c277baf21ba73dfb7ee0d405eb9393cdcd8181f283d6eb85fb2225fec
      PUSH_WORKFLOW: .github/workflows/chatgpt-pro-p3-finalize.yml
      PR_WORKFLOW: .github/workflows/chatgpt-pro-p3-pr-finalize.yml
    steps:
      - name: Check out exact candidate base SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify boundary, unpack payload and apply exact repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/p3-evidence"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "base_ref=${{ github.event.pull_request.base.ref }}"
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "checked_out=$(git rev-parse HEAD)"
            echo "merge_base=$(git merge-base HEAD ${FROZEN_BASE_SHA})"
            echo "main_remote=$(git rev-parse origin/main)"
          } | tee "${RUNNER_TEMP}/p3-evidence/00-boundary.log"
          test "${GITHUB_REPOSITORY}" = "forwardFish/aiStoryRoom"
          test "${{ github.event.pull_request.base.ref }}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git merge-base HEAD ${FROZEN_BASE_SHA})" = "${FROZEN_BASE_SHA}"
          test "$(git rev-parse origin/main)" = "${FROZEN_BASE_SHA}"
          test -z "$(git status --short)"

          mapfile -t parts < <(printf '%s\n' ${PAYLOAD_PREFIX}* | sort)
          test "${#parts[@]}" -eq 8
          payload_b64=/tmp/p3-stage.tar.gz.b64
          payload=/tmp/p3-stage.tar.gz
          cat "${parts[@]}" > "${payload_b64}"
          echo "${PAYLOAD_B64_SHA256}  ${payload_b64}" | sha256sum --check --strict
          base64 --decode "${payload_b64}" > "${payload}"
          echo "${PAYLOAD_SHA256}  ${payload}" | sha256sum --check --strict
          mapfile -t paths < <(tar -tzf "${payload}" | sed '/^$/d' | sed '/\/$/d' | sort)
          test "${#paths[@]}" -eq 7
          tar -xzf "${payload}" -C .

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('packages/templates/authoring/sangtian/narrative/scene-patterns.section-03.approved.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          target = next(pattern for pattern in value['patterns'] if pattern['patternId'] == 'NSP-P1-MERCHANT-LEDGER-PRIVATE-BARGAIN')
          expected = [
              'REQ-P1-MERCHANT-CONDITIONS',
              'REQ-P1-LAND-RISK',
              'REQ-P1-KNOWLEDGE-CHAIN',
          ]
          if target['requirementIds'] != expected:
              raise SystemExit(f"P3_REQUIREMENT_REPAIR_PRECONDITION_FAILED:{target['requirementIds']}")
          target['requirementIds'] = [
              'REQ-P1-MERCHANT-CONDITIONS',
              'REQ-P1-LAND-RISK',
          ]
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f "${parts[@]}" "${READY_PATH}" "${PUSH_WORKFLOW}" "${PR_WORKFLOW}"
          git diff --check

      - name: Audit source, requirement, actor and Kernel bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "${RUNNER_TEMP}/p3-evidence/01-source-bindings.json"
          import json
          from pathlib import Path

          root = Path('.')
          runtime = json.loads((root / 'packages/templates/config/sangtian/story-package/part-one-runtime.json').read_text(encoding='utf-8'))
          sections = {row['sectionId']: row for row in runtime['sections']}
          base_actors = {actor for asset in runtime['assets'] for actor in asset.get('actorRefs', [])}
          scenes = {}
          for asset in runtime['assets']:
              if asset['assetType'] != 'SOURCE_SCENE_EVIDENCE':
                  continue
              payload = asset['payload']
              scenes[payload['sourceSceneId']] = {
                  'claims': set(asset['sourceClaimIds']),
                  'sourceId': payload['sourceId'],
                  'sourceSha256': payload['sourceSha256'],
                  'sourceRange': payload['sourceRange'],
                  'origin': 'FROZEN_RUNTIME',
              }
          supplemental = json.loads((root / 'packages/templates/authoring/sangtian/narrative/source-scenes.supplemental.approved.json').read_text(encoding='utf-8'))
          assert supplemental['schemaVersion'] == 'narrative-source-scene-supplement-v1'
          assert supplemental['worldId'] == 'sangtian' and supplemental['partId'] == 'PART-01'
          assert supplemental['reviewStatus'] == 'APPROVED'
          for scene in supplemental['scenes']:
              assert scene['sourceSceneId'] not in scenes
              assert scene['verbatimPolicy'] == 'MECHANISM_ONLY_NO_VERBATIM_REUSE'
              ref = scene['sourceRefs'][0]
              scenes[scene['sourceSceneId']] = {
                  'claims': set(scene['sourceClaimIds']),
                  'sourceId': ref['sourceId'],
                  'sourceSha256': ref['sourceSha256'],
                  'sourceRange': ref,
                  'origin': 'APPROVED_SUPPLEMENT',
              }

          required_kernels = {
              kernel
              for section_id in ('SEC-P1-02', 'SEC-P1-03', 'SEC-P1-04')
              for kernel in sections[section_id]['activeDecisionKernelIds']
          }
          covered = set()
          audited = []
          for number in (2, 3, 4):
              document = json.loads((root / f'packages/templates/authoring/sangtian/narrative/scene-patterns.section-{number:02d}.approved.json').read_text(encoding='utf-8'))
              section = sections[document['scopeId']]
              allowed_requirements = set(section['requiredRequirementIds'])
              allowed_kernels = set(section['activeDecisionKernelIds'])
              foreground = set(section['foregroundActorRefs'])
              for pattern in document['patterns']:
                  scene = scenes[pattern['sourceSceneId']]
                  assert set(pattern['requirementIds']) <= allowed_requirements, pattern['patternId']
                  assert set(pattern['decisionKernelIds']) <= allowed_kernels, pattern['patternId']
                  assert set(pattern['actorRefs']) <= base_actors, pattern['patternId']
                  assert set(pattern['actorRefs']) & foreground, pattern['patternId']
                  assert set(pattern['sourceClaimIds']) <= scene['claims'], pattern['patternId']
                  source_range = scene['sourceRange']
                  assert any(
                      ref['sourceId'] == scene['sourceId']
                      and ref['sourceSha256'] == scene['sourceSha256']
                      and ref['chapterId'] == source_range['chapterId']
                      and ref['paragraphStartId'] == source_range['paragraphStartId']
                      and ref['paragraphEndId'] == source_range['paragraphEndId']
                      and ref['textSpanSha256'] == source_range['textSpanSha256']
                      for ref in pattern['sourceRefs']
                  ), pattern['patternId']
                  covered.update(pattern['decisionKernelIds'])
                  audited.append({
                      'patternId': pattern['patternId'],
                      'sectionId': document['scopeId'],
                      'sourceSceneId': pattern['sourceSceneId'],
                      'sourceOrigin': scene['origin'],
                      'requirementIds': pattern['requirementIds'],
                      'decisionKernelIds': pattern['decisionKernelIds'],
                  })
          assert len(audited) == 11
          assert covered == required_kernels, sorted(required_kernels - covered)
          print(json.dumps({
              'schemaVersion': 'omw.p3-source-binding-evidence.v1',
              'verdict': 'PASS',
              'patternCount': len(audited),
              'coveredKernelCount': len(covered),
              'requiredKernelCount': len(required_kernels),
              'patterns': audited,
          }, ensure_ascii=False, indent=2))
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked workspace
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run P3 contract gates
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/p3-evidence"
          pnpm --filter @ai-story/templates typecheck 2>&1 | tee "${evidence}/02-templates-typecheck.log"
          pnpm --filter @ai-story/templates test:story-package 2>&1 | tee "${evidence}/03-story-package.log"
          pnpm --filter @ai-story/templates build 2>&1 | tee "${evidence}/04-templates-build.log"
          pnpm --filter @apps/openovel-runtime typecheck 2>&1 | tee "${evidence}/05-openovel-typecheck.log"
          export SANGTIAN_NARRATIVE_SUPPLEMENT_PATH="${RUNNER_TEMP}/part-one-narrative-supplement.json"
          node scripts/story-decomposition/compile-sangtian-part-one-narrative-supplement.mjs 2>&1 | tee "${evidence}/06-supplement-compile.log"
          test -s "${SANGTIAN_NARRATIVE_SUPPLEMENT_PATH}"

      - name: Materialize P3 evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/p3-evidence"
          target="docs/auto-execute/evidence/chatgpt-pro-ai-story-convergence/p3/${CANDIDATE_SHA}"
          mkdir -p "${target}"
          cp "${evidence}/01-source-bindings.json" "${target}/source-bindings.json"
          cat > "${target}/summary.json" <<EOF
          {
            "schemaVersion": "omw.chatgpt-pro-p3-stage.v1",
            "verdict": "PASS",
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${TARGET_BRANCH}",
            "stagingSha": "${CANDIDATE_SHA}",
            "frozenBaseSha": "${FROZEN_BASE_SHA}",
            "payloadTarGzSha256": "${PAYLOAD_SHA256}",
            "deterministicRepair": "remove REQ-P1-KNOWLEDGE-CHAIN from NSP-P1-MERCHANT-LEDGER-PRIVATE-BARGAIN",
            "tests": {
              "templatesTypecheck": "PASS",
              "storyPackage": "PASS",
              "templatesBuild": "PASS",
              "openovelTypecheck": "PASS",
              "supplementCompile": "PASS"
            }
          }
          EOF
          sha256sum "${target}/source-bindings.json" "${target}/summary.json" > "${target}/SHA256SUMS"

      - name: Upload P3 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-final-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/p3-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Commit completed P3 stage
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(P3): complete source-grounded narrative assets"
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "${CANDIDATE_SHA}"
          git push origin HEAD:"${TARGET_BRANCH}"
