name: Maneuver MVP P3 continuation

on:
  push:
    branches:
      - feat/mvp-four-maneuver-actions
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/mvp-four-maneuver-actions

concurrency:
  group: maneuver-mvp-p3
  cancel-in-progress: false

jobs:
  implement-p3:
    if: github.event_name == 'pull_request' || (github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'bootstrap P3 continuation'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/mvp-four-maneuver-actions
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply P3 and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/automation/apply-maneuver-p3.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('node --test --test-isolation=none apps/web/tests/maneuver-ui.test.mjs', 'node --test apps/web/tests/maneuver-ui.test.mjs')
          source = source.replace('replace_between(app, "function renderLeverage(view) {", "\\nfunction renderRisks"', 'replace_between(app, "function renderLeverage(view) {", "\\nfunction renderManeuverPanel"')
          source = source.replace('assert.equal(root.querySelector("textarea"), null);', 'assert.equal(root.querySelector(\'[data-testid="maneuver-investigate-workbench"] textarea\'), null);', 1)
          source = source.replace('assert.equal(root.querySelector("textarea"), null);', 'assert.equal(root.querySelector(\'[data-testid="maneuver-leverage-workbench"] textarea\'), null);', 1)
          path.write_text(source, encoding='utf-8')
          PY
          python3 scripts/automation/apply-maneuver-p3.py
