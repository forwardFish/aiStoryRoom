name: B0 Stage 15 Independent Worker Boundary Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage15-independent-worker-boundary.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage15-independent-worker-boundary
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage15-independent-worker-boundary",
              description: `independent worker boundary repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact branch tip and acceptance driver blob
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "ff25436a94d83dcfe90ef23aaf826d028139be32"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage15-independent-worker-boundary.yml"
          test "$(git hash-object scripts/acceptance/b0-candidate-real-flow.ts)" = "9d9fc224b5320ed58496afc8562948560bf39af7"
          test "$(sha256sum scripts/acceptance/b0-candidate-real-flow.ts | cut -d' ' -f1)" = "97f7a410e419be2f0d3249e8c073c17dfecf76234bc4212f0321e1a13eda0025"

      - name: Model both valid pre-worker crash boundaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/d73f6dba26abbc66d50ed03e41ece2ef55af051d" --jq .content \
            | tr -d '\n' \
            | base64 -d > /tmp/b0-stage15-replacement.ts
          test "$(wc -c < /tmp/b0-stage15-replacement.ts | tr -d ' ')" = "6219"
          test "$(sha256sum /tmp/b0-stage15-replacement.ts | cut -d' ' -f1)" = "d43dde22c0c8f6cb1b915c8fbced417def291e2ae6b47bad711aff697993f6df"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/acceptance/b0-candidate-real-flow.ts")
          source = path.read_text(encoding="utf-8")
          start_marker = '    await phase("window-5-independent-worker", async () => {'
          end_marker = '\n\n    await phase("window-6-worker-crash-lease-expiry-recovery-and-ending", async () => {'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit(f"phase markers start={source.count(start_marker)} end={source.count(end_marker)}")
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = Path("/tmp/b0-stage15-replacement.ts").read_text(encoding="utf-8")
          path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")
          PY
          git diff --check
          test "$(sha256sum scripts/acceptance/b0-candidate-real-flow.ts | cut -d' ' -f1)" = "81113e22c059a89609000f43bdada3dd024637271c55517c60ff9b6cf16719ce"
          grep -F 'AI_ACTIONS_UNPREPARED' scripts/acceptance/b0-candidate-real-flow.ts
          grep -F 'SETTLEMENT_ENQUEUED' scripts/acceptance/b0-candidate-real-flow.ts
          grep -F 'without a standalone worker the world cannot advance' scripts/acceptance/b0-candidate-real-flow.ts
          grep -F 'standalone worker must complete the exact pre-existing settlement task' scripts/acceptance/b0-candidate-real-flow.ts

      - name: Frozen install and acceptance harness verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance
          bash -n scripts/acceptance/b0-selfhosted-real-acceptance.sh
          bash -n scripts/acceptance/b0-formal-supabase-acceptance.sh
          node --test scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs

      - name: Commit completed stage as ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/acceptance/b0-candidate-real-flow.ts
          git rm .github/workflows/b0-stage15-independent-worker-boundary.yml
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          .github/workflows/b0-stage15-independent-worker-boundary.yml
          scripts/acceptance/b0-candidate-real-flow.ts
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "test(b0): verify independent worker crash boundaries"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish stage outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/stage15-independent-worker-boundary",
              description: `independent worker boundary repair ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("B0 stage 15 independent worker boundary repair failed");
