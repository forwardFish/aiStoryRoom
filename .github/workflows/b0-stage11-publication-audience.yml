name: B0 Stage 11 Structured Publication Audience Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage11-publication-audience.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage11-publication-audience
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage11-publication-audience",
              description: `structured publication audience repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact remote baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "09a2e975d770dc20cd7bfa59c53049a1265491fb"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage11-publication-audience.yml"
          test "$(git hash-object apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts)" = "3f48ee7da048bbc3b1a9624f4257e69e5631cc02"
          test "$(git hash-object apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts)" = "8d2d110bd3a3e088ce600876c49e2b96c78e2ae9"

      - name: Separate result visibility from durable recipient routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pipeline = Path("apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts")
          source = pipeline.read_text(encoding="utf-8")
          old = '        audienceType: delivery.visibility,\n'
          new = '        audienceType: "ROLE",\n'
          if source.count(old) != 1:
              raise SystemExit(f"publication audience anchor count={source.count(old)}")
          pipeline.write_text(source.replace(old, new, 1), encoding="utf-8")

          spec = Path("apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts")
          source = spec.read_text(encoding="utf-8")
          marker = 'test("C8 diagnostics is read-only and reports window, task, narrative and world sequence state", async () => {'
          addition = '''test("B0 structured delivery persists recipient routing with the durable ROLE audience vocabulary", async () => {
            let persisted: Json | null = null;
            const { service } = fixture({
              storyRole: {
                findUnique: async () => ({ id: "role.b", runId: "run.1", roleKey: "role-b" }),
              },
              storyRun: {
                findUnique: async () => ({ currentDay: 3 }),
              },
              storyEvent: {
                upsert: async (input: Json) => {
                  persisted = input;
                  return { id: "event.1" };
                },
              },
              storyPlayer: {
                findMany: async () => [],
              },
            });

            await (service as any).persistStructuredDelivery({
              schemaVersion: "b0-publication-delivery-v1",
              idempotencyKey: "b0-publication:batch.1:result.1:role.b",
              batchId: "batch.1",
              runId: "run.1",
              windowId: "window.1",
              resultId: "result.1",
              resultKind: "CROSS_PLAYER_IMPACT",
              recipientActorId: "role.b",
              visibility: "TARGETED",
              sourceDisclosure: "HIDDEN",
              originActorIds: [],
              targetActorIds: ["role.b"],
              summary: "Another committed plan changed this role's position.",
              outcomeStatus: null,
              changes: [],
              explanation: {
                schemaVersion: "b0-causal-explanation-card-v1",
                resultId: "result.1",
                reasons: [{ kind: "OTHER_PLAN", summary: "Another committed plan changed your position." }],
              },
            });

            const create = persisted?.create as Json;
            assert.equal(create.visibility, "targeted");
            assert.equal(create.audienceType, "ROLE");
            assert.deepEqual(create.audienceRoleIdsJson, ["role.b"]);
          });

          '''.replace("          ", "")
          if source.count(marker) != 1:
              raise SystemExit(f"publication regression insertion count={source.count(marker)}")
          if "B0 structured delivery persists recipient routing with the durable ROLE audience vocabulary" in source:
              raise SystemExit("publication regression test already exists")
          spec.write_text(source.replace(marker, addition + marker, 1), encoding="utf-8")
          PY
          git diff --check
          grep -F 'audienceType: "ROLE"' apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
          ! grep -F 'audienceType: delivery.visibility' apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
          grep -F 'B0 structured delivery persists recipient routing with the durable ROLE audience vocabulary' apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts

      - name: Frozen install and product verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/api typecheck
          pnpm --filter @apps/api test:b0-batch
          pnpm --filter @apps/api test:b0-pipeline
          pnpm --filter @apps/api test:b0-ops
          pnpm --filter @apps/api test
          pnpm --filter @apps/api build

      - name: Commit and push the verified product repair
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          remote_before="$(git rev-parse origin/$GITHUB_REF_NAME)"
          test "$remote_before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts \
            apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts
          git rm .github/workflows/b0-stage11-publication-audience.yml
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          .github/workflows/b0-stage11-publication-audience.yml
          apps/api/src/b0-settlement/b0-settlement-pipeline.ops.spec.ts
          apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "fix(b0): persist structured deliveries with role audience"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          remote_after="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          printf '{\n  "schemaVersion": 1,\n  "localHead": "%s",\n  "remoteTipBeforePush": "%s",\n  "remoteTipAfterPush": "%s",\n  "sourceRunId": "%s"\n}\n' \
            "$local_head" "$remote_before" "$remote_after" "$GITHUB_RUN_ID" > /tmp/b0-stage11-push-receipt.json
          echo "local_head=$local_head" >> "$GITHUB_OUTPUT"
          echo "remote_before=$remote_before" >> "$GITHUB_OUTPUT"
          echo "remote_after=$remote_after" >> "$GITHUB_OUTPUT"

      - name: Upload push receipt
        uses: actions/upload-artifact@v4
        with:
          name: b0-stage11-push-receipt-${{ steps.push.outputs.remote_after }}
          path: /tmp/b0-stage11-push-receipt.json
          retention-days: 14

      - name: Publish stage outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          PRODUCT_SHA: ${{ steps.push.outputs.remote_after }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/stage11-publication-audience",
              description: `structured publication audience repair ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (success && process.env.PRODUCT_SHA) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: process.env.PRODUCT_SHA,
                state: "success",
                context: "b0/publication-audience-repair",
                description: `verified product repair from ${context.runId}`,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }
            if (!success) core.setFailed("B0 structured publication audience repair failed");
