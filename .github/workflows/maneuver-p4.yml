name: Maneuver MVP P4 AI continuation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/mvp-four-maneuver-actions

concurrency:
  group: maneuver-mvp-p4
  cancel-in-progress: false

jobs:
  implement-p4:
    if: github.head_ref == 'feat/mvp-four-maneuver-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/mvp-four-maneuver-actions
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply P4 and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/automation/apply-maneuver-p4.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('  plan.title = narrated.title;\\n  plan.narrative = narrated.narrative;\\n', '  plan.title = narrated.title || plan.title;\\n  plan.narrative = narrated.narrative || plan.narrative;\\n')
          path.write_text(source, encoding='utf-8')
          PY
          python3 scripts/automation/apply-maneuver-p4.py
