name: B0 Stage 12 Deadline Fixture Contract Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage12-deadline-fixture.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-stage12-deadline-fixture
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/stage12-deadline-fixture",
              description: `deadline fixture contract repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify exact branch tip and acceptance driver blob
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "7b10b85913f011e569c3be35b02bdc1e32050a78"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-stage12-deadline-fixture.yml"
          test "$(git hash-object scripts/acceptance/b0-candidate-real-flow.ts)" = "00a121e879f95547e5a54bd8ea3c8011516aecbf"
          test "$(sha256sum scripts/acceptance/b0-candidate-real-flow.ts | cut -d' ' -f1)" = "ef1818d44bee2954cfaed43f0095fbe28f1c4de856627fc47a6b6ac7a478e6f0"

      - name: Construct a constraint-valid expired deadline fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/acceptance/b0-candidate-real-flow.ts")
          source = path.read_text(encoding="utf-8")
          old = '      await prisma.actionWindow.update({ where: { id: opened.windowId }, data: { mainClosesAt: new Date(Date.now() - 1_000) } });'
          new = '''      const expiredDeadline = new Date(Date.now() - 1_000);
          await prisma.actionWindow.update({
            where: { id: opened.windowId },
            data: {
              mainOpenedAt: new Date(expiredDeadline.getTime() - 60_000),
              mainClosesAt: expiredDeadline,
            },
          });'''.replace("          ", "")
          if source.count(old) != 1:
              raise SystemExit(f"deadline fixture anchor count={source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          test "$(sha256sum scripts/acceptance/b0-candidate-real-flow.ts | cut -d' ' -f1)" = "fabdb3296069ca917e992c27ca7956787863e28779d4c2f13d6271206c7803fb"
          grep -F 'mainOpenedAt: new Date(expiredDeadline.getTime() - 60_000)' scripts/acceptance/b0-candidate-real-flow.ts
          grep -F 'mainClosesAt: expiredDeadline' scripts/acceptance/b0-candidate-real-flow.ts

      - name: Frozen install and acceptance harness verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance
          bash -n scripts/acceptance/b0-selfhosted-real-acceptance.sh
          bash -n scripts/acceptance/b0-formal-supabase-acceptance.sh
          node --test scripts/acceptance/__tests__/b0-formal-acceptance-boundary.spec.mjs

      - name: Commit completed stage as ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/acceptance/b0-candidate-real-flow.ts
          git rm .github/workflows/b0-stage12-deadline-fixture.yml
          git diff --cached --check
          cat > /tmp/expected <<'EOF'
          .github/workflows/b0-stage12-deadline-fixture.yml
          scripts/acceptance/b0-candidate-real-flow.ts
          EOF
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "test(b0): keep expired deadline fixture constraint-valid"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish stage outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/stage12-deadline-fixture",
              description: `deadline fixture contract repair ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("B0 stage 12 deadline fixture repair failed");
