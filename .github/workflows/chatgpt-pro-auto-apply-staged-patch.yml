name: ChatGPT Pro Source Binding Repair

on:
  pull_request:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    types: [opened, reopened, synchronize]
  push:
    branches:
      - codex/chatgpt-pro-ai-story-convergence
    paths:
      - ".github/workflows/chatgpt-pro-auto-apply-staged-patch.yml"
      - "docs/auto-execute/.chatgpt-pro-source-claim-repair.patch.gz.b64"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-pro-source-binding-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      CANDIDATE_BRANCH: codex/chatgpt-pro-ai-story-convergence
      CANDIDATE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      FROZEN_BASE_SHA: 1b750e56858dabefb0ddb8b922c6bdcbe0574e4c
      OPENOVEL_PROVIDER_BASE_URL: https://api.deepseek.com
      OPENOVEL_MODEL: deepseek-v4-pro
      OPENOVEL_NARRATOR_MODEL: deepseek-v4-pro
      OPENOVEL_REVIEWER_MODEL: deepseek-v4-pro
      OPENOVEL_OPTIONS_MODEL: deepseek-v4-pro
      OPENOVEL_STORYKEEPER_MODEL: deepseek-v4-pro
      OPENOVEL_DEEPSEEK_THINKING: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove candidate boundary and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence/logs
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "checked_out=$(git rev-parse HEAD)"
            echo "merge_base=$(git merge-base HEAD ${FROZEN_BASE_SHA})"
            echo "main_remote=$(git rev-parse origin/main)"
          } | tee candidate-evidence/logs/00-boundary.log
          test "${GITHUB_REPOSITORY}" = "forwardFish/aiStoryRoom"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git merge-base HEAD ${FROZEN_BASE_SHA})" = "${FROZEN_BASE_SHA}"
          test "$(git rev-parse origin/main)" = "${FROZEN_BASE_SHA}"
          test -z "$(git status --short)"

          PATCH_B64=docs/auto-execute/.chatgpt-pro-source-claim-repair.patch.gz.b64
          PATCH=/tmp/chatgpt-pro-source-claim-repair.patch
          if ! grep -q 'PART_ONE_NARRATIVE_SOURCE_CLAIM_SCENE_MISMATCH' \
            packages/templates/src/story-package/playable-part-one-runtime.ts; then
            test -f "$PATCH_B64"
            base64 --decode "$PATCH_B64" | gzip --decompress > "$PATCH"
            git apply --check "$PATCH"
            git apply "$PATCH"
          fi
          git diff --check

      - name: Validate exact source-scene and Kernel bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee candidate-evidence/logs/01-source-bindings.log
          import json
          from pathlib import Path

          runtime = json.loads(Path(
              "packages/templates/config/sangtian/story-package/part-one-runtime.json"
          ).read_text(encoding="utf-8"))
          sections = {row["sectionId"]: row for row in runtime["sections"]}
          scenes = {
              asset["payload"]["sourceSceneId"]: set(asset["sourceClaimIds"])
              for asset in runtime["assets"]
              if asset["assetType"] == "SOURCE_SCENE_EVIDENCE"
          }
          required = {
              kernel_id
              for section_id in ("SEC-P1-02", "SEC-P1-03", "SEC-P1-04")
              for kernel_id in sections[section_id]["activeDecisionKernelIds"]
          }
          covered = set()
          count = 0
          for number in (2, 3, 4):
              value = json.loads(Path(
                  f"packages/templates/authoring/sangtian/narrative/scene-patterns.section-{number:02d}.approved.json"
              ).read_text(encoding="utf-8"))
              for pattern in value["patterns"]:
                  count += 1
                  scene = pattern["sourceSceneId"]
                  assert scene in scenes, pattern["patternId"]
                  assert set(pattern["sourceClaimIds"]) <= scenes[scene], pattern["patternId"]
                  covered.update(pattern["decisionKernelIds"])
          assert count == 11, count
          assert covered == required, sorted(required - covered)
          print(json.dumps({
              "verdict": "PASS",
              "patternCount": count,
              "coveredKernelCount": len(covered),
              "requiredKernelCount": len(required),
          }, ensure_ascii=False, indent=2))
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact workspace
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee candidate-evidence/logs/02-install.log

      - name: Run complete deterministic gates
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @ai-story/templates typecheck 2>&1 | tee candidate-evidence/logs/03-templates-typecheck.log
          pnpm --filter @ai-story/templates test:story-package 2>&1 | tee candidate-evidence/logs/04-story-package.log
          pnpm --filter @apps/openovel-runtime typecheck 2>&1 | tee candidate-evidence/logs/05-openovel-typecheck.log
          pnpm --filter @apps/openovel-runtime build 2>&1 | tee candidate-evidence/logs/06-openovel-build.log
          pnpm test:story:v4 2>&1 | tee candidate-evidence/logs/07-story-v4.log
          pnpm --filter @apps/openovel-runtime smoke:http 2>&1 | tee candidate-evidence/logs/08-http-smoke.log

          mkdir -p "${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_SKIP_SOURCE_WRITES=1
          export SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring"
          export SANGTIAN_RUNTIME_PACKAGE_PATH="${RUNNER_TEMP}/part-one-runtime.json"
          node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee candidate-evidence/logs/09-assets.log
          sha256sum \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${RUNNER_TEMP}/part-one-runtime.json" \
            | tee candidate-evidence/logs/10-assets-sha256.log
          cmp --silent \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            "${RUNNER_TEMP}/part-one-runtime.json"

      - name: Upload source-repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-repair-${{ env.CANDIDATE_SHA }}
          path: candidate-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Commit only fully verified candidate repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/auto-execute/.chatgpt-pro-source-claim-repair.patch.gz.b64
          rm -f .github/workflows/chatgpt-pro-auto-apply-staged-patch.yml
          rm -f .github/workflows/chatgpt-pro-finalize-convergence.yml
          rm -f docs/auto-execute/.connector-all-functions-loaded
          rm -f docs/auto-execute/.connector-push-probe
          rm -f docs/auto-execute/.multi-file-probe-a
          rm -f docs/auto-execute/.pre-push-files-test
          rm -f docs/auto-execute/.push-files-schema-probe-2.txt
          rm -f docs/auto-execute/.push-files-schema-probe.txt
          rm -f docs/auto-execute/PARTIAL_SUBMISSION_AI_STORY_CONVERGENCE_2026-08-05.md
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            packages/templates/authoring/sangtian/narrative/scene-patterns.section-02.approved.json \
            packages/templates/authoring/sangtian/narrative/scene-patterns.section-03.approved.json \
            packages/templates/authoring/sangtian/narrative/scene-patterns.section-04.approved.json \
            packages/templates/src/story-package/playable-part-one-runtime.ts \
            packages/templates/tests/part-one-narrative-supplement.test.ts
          git add -u -- \
            docs/auto-execute/.chatgpt-pro-source-claim-repair.patch.gz.b64 \
            .github/workflows/chatgpt-pro-auto-apply-staged-patch.yml \
            .github/workflows/chatgpt-pro-finalize-convergence.yml \
            docs/auto-execute/.connector-all-functions-loaded \
            docs/auto-execute/.connector-push-probe \
            docs/auto-execute/.multi-file-probe-a \
            docs/auto-execute/.pre-push-files-test \
            docs/auto-execute/.push-files-schema-probe-2.txt \
            docs/auto-execute/.push-files-schema-probe.txt \
            docs/auto-execute/PARTIAL_SUBMISSION_AI_STORY_CONVERGENCE_2026-08-05.md
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(story-assets): bind patterns to verified source claims"
          git fetch origin "${CANDIDATE_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "${CANDIDATE_SHA}"
          git push origin HEAD:"${CANDIDATE_BRANCH}"
