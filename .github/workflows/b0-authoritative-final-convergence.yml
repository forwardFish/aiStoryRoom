      - name: Commit authoritative evidence result as docs only
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          tested="${{ needs.prepare.outputs.tested_sha }}"
          git fetch origin "$GITHUB_REF_NAME"
          remote="$(git rev-parse origin/$GITHUB_REF_NAME)"
          test "$remote" = "$tested"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/auto-execute/evidence/b0
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -Ev '^docs/'; then
            echo 'Evidence commit contains non-doc paths.' >&2
            exit 1
          fi
          if [ "${{ steps.aggregate.outputs.complete }}" = true ]; then
            git commit -m "test(b0): publish complete C8 and C9 evidence"
          else
            git commit -m "test(b0): publish authoritative incomplete evidence"
          fi
          evidence_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "evidence_sha=$evidence_sha" >> "$GITHUB_OUTPUT"
      - name: Publish exact evidence pointer as second docs-only commit
        id: pointer
        shell: bash
        env:
          TESTED_SHA: ${{ needs.prepare.outputs.tested_sha }}
          EVIDENCE_SHA: ${{ steps.evidence.outputs.evidence_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path('docs/auto-execute/evidence/b0/c9/final-pointer.json')
          existing=json.loads(path.read_text()) if path.exists() else {'schemaVersion':1}
          existing.update({
            'testedCodeSha':os.environ['TESTED_SHA'],
            'evidenceCommitSha':os.environ['EVIDENCE_SHA'],
            'finalRemoteSha':'RESOLVED_BY_FRESH_LS_REMOTE',
            'finalRemoteResolution':'external authoritative readback required because a commit cannot contain its own hash',
            'updatedAt':datetime.now(timezone.utc).isoformat(),
          })
          path.write_text(json.dumps(existing,indent=2)+'\n')
          PY
          git add docs/auto-execute/evidence/b0/c9/final-pointer.json
          git diff --cached --check
          git commit -m "test(b0): publish final evidence pointer"
          final_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
      - name: Fresh remote readback and commit status
        shell: bash
        env:
          TESTED_SHA: ${{ needs.prepare.outputs.tested_sha }}
          EVIDENCE_SHA: ${{ steps.evidence.outputs.evidence_sha }}
          FINAL_SHA: ${{ steps.pointer.outputs.final_sha }}
          COMPLETE: ${{ steps.aggregate.outputs.complete }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$live" = "$FINAL_SHA"
          rm -rf /tmp/b0-authoritative-readback
          git clone -q --filter=blob:none --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" /tmp/b0-authoritative-readback
          git -C /tmp/b0-authoritative-readback cat-file -e "$TESTED_SHA^{commit}"
          git -C /tmp/b0-authoritative-readback cat-file -e "$EVIDENCE_SHA^{commit}"
          git -C /tmp/b0-authoritative-readback cat-file -e "$FINAL_SHA^{commit}"
          git -C /tmp/b0-authoritative-readback merge-base --is-ancestor "$TESTED_SHA" "$EVIDENCE_SHA"
          git -C /tmp/b0-authoritative-readback merge-base --is-ancestor "$EVIDENCE_SHA" "$FINAL_SHA"
          non_docs="$(git -C /tmp/b0-authoritative-readback diff --name-only "$TESTED_SHA..$FINAL_SHA" | grep -Ev '^docs/' || true)"
          test -z "$non_docs"
          count="$(git -C /tmp/b0-authoritative-readback ls-tree -r --name-only "$FINAL_SHA" -- docs/auto-execute/evidence/b0/c8 docs/auto-execute/evidence/b0/c9 | wc -l | tr -d ' ')"
