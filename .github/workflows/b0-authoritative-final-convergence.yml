name: B0 Authoritative Final Convergence

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-authoritative-final-convergence.yml

permissions:
  contents: write
  statuses: write
  actions: read

concurrency:
  group: b0-authoritative-final-convergence
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tested_sha: ${{ steps.freeze.outputs.tested_sha }}
    steps:
      - name: Publish convergence locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/authoritative-convergence",
              description: `authoritative convergence running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact remote and stabilize validators
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-authoritative-final-convergence.yml"
          git merge-base --is-ancestor d5905ed2661bd72635d2e2c4ce6559bc94ada6cd HEAD

          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in (
              Path('.github/workflows/b0-engineering-selfhosted-acceptance.yml'),
              Path('.github/workflows/b0-candidate-real-acceptance.yml'),
              Path('.github/workflows/b0-finalize-evidence.yml'),
          ):
              if not path.exists():
                  continue
              source = path.read_text(encoding='utf-8')
              updated, count = re.subn(
                  r'(?ms)^on:\n.*?\npermissions:',
                  'on:\n  workflow_dispatch:\n\npermissions:',
                  source,
                  count=1,
              )
              if count == 1:
                  path.write_text(updated, encoding='utf-8')
              elif 'workflow_dispatch:' not in source:
                  raise SystemExit(f'cannot stabilize trigger block in {path}')

          marker = Path('docs/auto-execute/B0_AUTHORITATIVE_TEST_BASELINE.md')
          marker.parent.mkdir(parents=True, exist_ok=True)
          marker.write_text(
              '# B0 Authoritative Test Baseline\n\n'
              '- sourceTriggerSha: `' + __import__('os').environ['GITHUB_SHA'] + '`\n'
              '- validationMode: exact committed SHA\n'
              '- formalDatabase: managed non-production Supabase random schema only\n'
              '- selfHostedContainer: engineering-only\n'
              '- productionDeploymentDataAndConfig: forbidden\n',
              encoding='utf-8',
          )
          PY

          find .github/workflows -maxdepth 1 -type f -name 'b0-stage*.yml' -print -delete
          if [ -f scripts/acceptance/b0-acceptance-provenance-contract.mjs ]; then
            node scripts/acceptance/b0-acceptance-provenance-contract.mjs
          fi
          if [ -f scripts/acceptance/b0-managed-acceptance-contract.mjs ]; then
            node scripts/acceptance/b0-managed-acceptance-contract.mjs
          fi
          test -f scripts/acceptance/b0-candidate-real-flow.ts
          test -f scripts/acceptance/b0-managed-real-acceptance.sh
          bash -n scripts/acceptance/b0-managed-real-acceptance.sh
          git diff --check

      - name: Freeze committed tested-code baseline
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows docs/auto-execute/B0_AUTHORITATIVE_TEST_BASELINE.md
          git rm .github/workflows/b0-authoritative-final-convergence.yml
          git diff --cached --check
          git commit -m "ci(b0): freeze authoritative final validation baseline"
          tested_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
          echo "Frozen tested code SHA: $tested_sha"

  gates:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      status: ${{ steps.summary.outputs.status }}
      failure_count: ${{ steps.summary.outputs.failure_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify exact tested SHA
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.tested_sha }}"
      - name: Frozen install and Prisma generation
        run: pnpm install --frozen-lockfile && pnpm db:generate
      - name: Run complete engineering matrix
        id: matrix
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/b0-gates
          log=/tmp/b0-gates/exact-tested-sha-gates.log
          : > "$log"
          : > /tmp/b0-gates/results.ndjson
          commands=(
            'pnpm typecheck'
            'pnpm --filter @ai-story/shared typecheck'
            'pnpm --filter @ai-story/templates typecheck'
            'pnpm --filter @ai-story/templates test:b0-contract'
            'pnpm --filter @ai-story/templates test:b0-batch'
            'pnpm --filter @ai-story/templates test:b0-multi'
            'pnpm --filter @ai-story/templates test:b0-audience'
            'pnpm --filter @ai-story/shared build'
            'pnpm --filter @ai-story/templates build'
            'pnpm --filter @apps/openovel-runtime test:b0-runtime'
            'pnpm --filter @apps/openovel-runtime typecheck'
            'pnpm --filter @apps/api test:b0-batch'
            'pnpm --filter @apps/api test:b0-window'
            'pnpm --filter @apps/api test:b0-player-window'
            'pnpm --filter @apps/api test:b0-pipeline'
            'pnpm --filter @apps/api test:b0-ops'
            'pnpm --filter @apps/api typecheck'
            'pnpm --filter @apps/web typecheck'
            'pnpm --filter @apps/web test:b0-window'
            'pnpm --filter @apps/api test'
            'pnpm --filter @ai-story/openovel-runtime test'
            'pnpm --filter @ai-story/openovel-runtime typecheck'
            'pnpm test:story:v4'
            'pnpm test:maneuver'
            'pnpm --filter @apps/web test'
            'pnpm test:causal'
            'pnpm --filter @apps/api build'
            'pnpm --filter @apps/openovel-runtime build'
            'pnpm --filter @apps/web build'
            'pnpm build'
          )
          failures=0
          for command in "${commands[@]}"; do
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            echo "::group::$command"
            set +e
            bash -lc "$command" 2>&1 | tee -a "$log"
            code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            completed=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            COMMAND="$command" STARTED="$started" COMPLETED="$completed" CODE="$code" python3 - <<'PY' >> /tmp/b0-gates/results.ndjson
          import json, os
          print(json.dumps({
            'command': os.environ['COMMAND'],
            'startedAt': os.environ['STARTED'],
            'completedAt': os.environ['COMPLETED'],
            'exitCode': int(os.environ['CODE']),
            'status': 'PASS' if os.environ['CODE'] == '0' else 'FAIL'
          }))
          PY
            if [ "$code" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "$failures" > /tmp/b0-gates/failure-count.txt
          exit 0
      - name: Build gate summary
        id: summary
        shell: bash
        env:
          TESTED_SHA: ${{ needs.prepare.outputs.tested_sha }}
        run: |
          set -euo pipefail
          failures="$(cat /tmp/b0-gates/failure-count.txt)"
          TESTED_SHA="$TESTED_SHA" FAILURES="$failures" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          rows=[json.loads(line) for line in Path('/tmp/b0-gates/results.ndjson').read_text().splitlines() if line]
          failures=int(os.environ['FAILURES'])
          payload={
            'schemaVersion':1,
            'status':'PASS' if failures == 0 else 'FAIL',
            'testedCodeSha':os.environ['TESTED_SHA'],
            'generatedAt':datetime.now(timezone.utc).isoformat(),
            'commandCount':len(rows),
            'failureCount':failures,
            'commands':rows,
          }
          Path('/tmp/b0-gates/test-matrix-source.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
          status=FAIL
          if [ "$failures" = 0 ]; then status=PASS; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "failure_count=$failures" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: b0-authoritative-gates-${{ needs.prepare.outputs.tested_sha }}
          path: /tmp/b0-gates
          if-no-files-found: error
          retention-days: 14

  formal:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - environment: "ourmanyworlds.com / test"
            index: "0"
          - environment: "stellar-encouragement / test"
            index: "1"
          - environment: "Preview"
            index: "2"
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
          fetch-depth: 1
      - name: Verify exact tested SHA
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.tested_sha }}"
      - name: Resolve managed credentials in memory
        id: credentials
        shell: bash
        env:
          B0_SECRET_CONTEXT_JSON: ${{ toJSON(secrets) }}
          B0_ENVIRONMENT_NAME: ${{ matrix.environment }}
          B0_INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          root="/tmp/b0-formal-$B0_INDEX"
          mkdir -p "$root"
          B0_OUTPUT="$root/readiness.json" node <<'NODE'
          const fs = require('node:fs');
          const secrets = JSON.parse(process.env.B0_SECRET_CONTEXT_JSON || '{}');
          const entries = Object.entries(secrets);
          const dbPriority = [
            'SUPABASE_DIRECT_URL','POSTGRES_URL_NON_POOLING','DIRECT_URL','SUPABASE_DATABASE_URL',
            'SUPABASE_TEST_DATABASE_URL','TEST_DATABASE_URL','POSTGRES_PRISMA_URL','POSTGRES_URL','DATABASE_URL'
          ];
          const keyPriority = [
            'DEEPSEEK_API_KEY','OPENOVEL_DEEPSEEK_API_KEY','OPENOVEL_API_KEY','LLM_API_KEY','AI_API_KEY'
          ];
          function rank(name, list) { const index=list.indexOf(name); return index < 0 ? list.length + 1 : index; }
          const databases=[];
          for (const [name, valueRaw] of entries) {
            const value=String(valueRaw || '');
            if (!/(?:SUPABASE|DATABASE|POSTGRES|DIRECT)/i.test(name) || !/^postgres(?:ql)?:\/\//i.test(value)) continue;
            try {
              const url=new URL(value);
              const host=url.hostname.toLowerCase();
              if ((host === 'localhost' || host === '127.0.0.1' || host === '::1') || !host.includes('supabase.')) continue;
              databases.push([name,value]);
            } catch {}
          }
          databases.sort((a,b)=>rank(a[0],dbPriority)-rank(b[0],dbPriority)||a[0].localeCompare(b[0]));
          const providers=entries.filter(([name,value])=>
            /(?:DEEPSEEK|OPENOVEL|LLM|AI_API)/i.test(name) && /(?:KEY|TOKEN)/i.test(name) && String(value||'').length >= 20
          ).sort((a,b)=>rank(a[0],keyPriority)-rank(b[0],keyPriority)||a[0].localeCompare(b[0]));
          const database=databases[0] || null;
          const provider=providers[0] || null;
          const ready=Boolean(database && provider);
          const payload={
            schemaVersion:1,
            environment:process.env.B0_ENVIRONMENT_NAME,
            ready,
            databaseSecretName:database?.[0] || null,
            providerSecretName:provider?.[0] || null,
            databaseCandidateNames:databases.map(([name])=>name),
            providerCandidateNames:providers.map(([name])=>name),
            valuesPrinted:false,
            valuesPersisted:false,
            productionEnvironment:false,
          };
          fs.writeFileSync(process.env.B0_OUTPUT,JSON.stringify(payload,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`ready=${ready}\n`);
          if (ready) {
            console.log(`::add-mask::${database[1]}`);
            console.log(`::add-mask::${provider[1]}`);
            const modelDigest='sha256:'+require('node:crypto').createHash('sha256').update('deepseek-chat').digest('hex');
            fs.appendFileSync(process.env.GITHUB_ENV,
              `SUPABASE_DATABASE_URL=${database[1]}\nDEEPSEEK_API_KEY=${provider[1]}\nOPENOVEL_API_KEY=${provider[1]}\n`+
              `B0_DATABASE_SECRET_NAME=${database[0]}\nB0_PROVIDER_SECRET_NAME=${provider[0]}\n`+
              `B0_ACCEPTANCE_ENVIRONMENT=${process.env.B0_ENVIRONMENT_NAME}\nB0_ACCEPTANCE_TIER=formal-c8\n`+
              `B0_DATABASE_PROVENANCE=supabase-cloud-nonproduction-random-schema\n`+
              `B0_PROVIDER_PROVENANCE=deepseek-api-real\nB0_PROVIDER_MODEL_DIGEST=${modelDigest}\n`+
              `OPENOVEL_PROVIDER_BASE_URL=https://api.deepseek.com\nOPENOVEL_MODEL=deepseek-chat\n`+
              `B0_EVIDENCE_ROOT=/tmp/b0-formal-${process.env.B0_INDEX}/evidence/b0/c9/runtime\n`+
              `B0_PROJECT_ROOT=${process.env.GITHUB_WORKSPACE}\n`);
          }
          NODE
      - uses: pnpm/action-setup@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install PostgreSQL client
        if: steps.credentials.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Frozen install, generation, typecheck and builds
        id: build
        if: steps.credentials.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck:b0:real-acceptance
          pnpm --filter @ai-story/shared build
          pnpm --filter @ai-story/templates build
          pnpm --filter @apps/api build
          pnpm --filter @apps/openovel-runtime build
          pnpm --filter @apps/web typecheck
          pnpm --filter @apps/web build
      - name: Prepare random managed Supabase schema
        id: database
        if: steps.credentials.outputs.ready == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        run: scripts/acceptance/b0-managed-real-acceptance.sh prepare
      - name: Apply migrations only to random schema
        id: migrations
        if: steps.database.outcome == 'success'
        continue-on-error: true
        run: pnpm prisma migrate deploy
      - name: Execute real API, Web, three-session six-window acceptance
        id: acceptance
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ needs.prepare.outputs.tested_sha }}
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm test:b0:real-acceptance
      - name: Clean random schema and prove public schema unchanged
        id: cleanup
        if: always() && steps.database.outcome == 'success'
        continue-on-error: true
        run: scripts/acceptance/b0-managed-real-acceptance.sh cleanup
      - name: Redact and scan formal evidence
        id: redaction
        if: always() && steps.credentials.outputs.ready == 'true'
        continue-on-error: true
        run: scripts/acceptance/b0-managed-real-acceptance.sh redact
      - name: Finalize formal C8 evidence
        id: finalize
        if: steps.acceptance.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.redaction.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ needs.prepare.outputs.tested_sha }}
        run: scripts/acceptance/b0-managed-real-acceptance.sh finalize
      - name: Write environment result
        if: always()
        shell: bash
        env:
          READY: ${{ steps.credentials.outputs.ready }}
          BUILD: ${{ steps.build.outcome }}
          DATABASE: ${{ steps.database.outcome }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          ACCEPTANCE: ${{ steps.acceptance.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
          REDACTION: ${{ steps.redaction.outcome }}
          FINALIZE: ${{ steps.finalize.outcome }}
          B0_INDEX: ${{ matrix.index }}
          B0_ENVIRONMENT_NAME: ${{ matrix.environment }}
          TESTED_SHA: ${{ needs.prepare.outputs.tested_sha }}
        run: |
          set -euo pipefail
          root="/tmp/b0-formal-$B0_INDEX"
          mkdir -p "$root"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          outcomes={name.lower():os.environ.get(name,'') for name in ('READY','BUILD','DATABASE','MIGRATIONS','ACCEPTANCE','CLEANUP','REDACTION','FINALIZE')}
          ready=os.environ.get('READY') == 'true'
          passed=ready and all(outcomes[name] == 'success' for name in ('build','database','migrations','acceptance','cleanup','redaction','finalize'))
          payload={
            'schemaVersion':1,
            'status':'PASS' if passed else ('NOT_CONFIGURED' if not ready else 'FAIL'),
            'testedCodeSha':os.environ['TESTED_SHA'],
            'environment':os.environ['B0_ENVIRONMENT_NAME'],
            'generatedAt':datetime.now(timezone.utc).isoformat(),
            'outcomes':outcomes,
            'secretValuesPrinted':False,
            'secretValuesPersisted':False,
            'productionDataAccessed':False,
          }
          Path(f"/tmp/b0-formal-{os.environ['B0_INDEX']}/formal-result.json").write_text(json.dumps(payload,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b0-formal-environment-${{ matrix.index }}-${{ needs.prepare.outputs.tested_sha }}
          path: /tmp/b0-formal-${{ matrix.index }}
          if-no-files-found: error
          retention-days: 14

  finalize:
    if: always()
    needs: [prepare, gates, formal]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: b0-authoritative-gates-*
          path: /tmp/b0-final/gates
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: b0-formal-environment-*
          path: /tmp/b0-final/formal
          merge-multiple: false
      - name: Aggregate authoritative results and construct evidence
        id: aggregate
        shell: bash
        env:
          TESTED_SHA: ${{ needs.prepare.outputs.tested_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, shutil
          from datetime import datetime, timezone
          from pathlib import Path

          tested=os.environ['TESTED_SHA']
          gate_path=Path('/tmp/b0-final/gates/test-matrix-source.json')
          gates=json.loads(gate_path.read_text()) if gate_path.exists() else {'status':'MISSING','failureCount':-1,'commands':[]}
          formal_results=[]
          for path in sorted(Path('/tmp/b0-final/formal').rglob('formal-result.json')):
              formal_results.append((path,json.loads(path.read_text())))
          passed=[item for item in formal_results if item[1].get('status') == 'PASS']
          configured=[item for item in formal_results if item[1].get('status') != 'NOT_CONFIGURED']
          root=Path('docs/auto-execute/evidence/b0')
          c8=root/'c8'; c9=root/'c9'; readiness=c9/'readiness'; gates_dest=c9/'gates'
          for directory in (c8,c9,readiness,gates_dest): directory.mkdir(parents=True,exist_ok=True)
          shutil.copy2(gate_path,gates_dest/'test-matrix-source.json') if gate_path.exists() else None
          log_path=Path('/tmp/b0-final/gates/exact-tested-sha-gates.log')
          if log_path.exists(): shutil.copy2(log_path,gates_dest/'exact-tested-sha-gates.log')
          summary={
            'schemaVersion':1,
            'testedCodeSha':tested,
            'generatedAt':datetime.now(timezone.utc).isoformat(),
            'engineeringGatesStatus':gates.get('status'),
            'engineeringFailureCount':gates.get('failureCount'),
            'formalEnvironments':[result for _,result in formal_results],
          }
          (readiness/'authoritative-convergence-summary.json').write_text(json.dumps(summary,indent=2)+'\n')

          if gates.get('status') != 'PASS':
              status='ENGINEERING_GATES_FAILED'
              complete=False
          elif not passed:
              status='FORMAL_C8_FAILED' if configured else 'BLOCKED_NO_NONPRODUCTION_CREDENTIAL_PAIR'
              complete=False
          else:
              status='PASS'
              complete=True

          if not complete:
              blocker={
                'schemaVersion':1,
                'status':status,
                'testedCodeSha':tested,
                'generatedAt':datetime.now(timezone.utc).isoformat(),
                'formalC8Passed':False,
                'completionMarkersAllowed':False,
                'selfHostedContainerCannotSatisfyFormalC8':True,
                'productionCredentialsAndPublicSchemaForbidden':True,
                'formalEnvironments':[result for _,result in formal_results],
                'engineeringGatesStatus':gates.get('status'),
              }
              (c8/'authoritative-blocker.json').write_text(json.dumps(blocker,indent=2)+'\n')
              result={
                'schemaVersion':1,
                'status':'BLOCKED' if status.startswith('BLOCKED') else 'FAIL',
                'checkpoint':'B0_C9_NOT_COMPLETED',
                'code':status,
                'testedCodeSha':tested,
                'formalC8Passed':False,
                'completionMarkersAllowed':False,
              }
              (c9/'B0_FINAL_DELIVERY_RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
              (c9/'B0_FINAL_DELIVERY_REPORT.md').write_text(
                '# B0 Final Delivery Report\n\nStatus: **'+result['status']+'**\n\nCode: `'+status+'`. Formal managed C8 and all engineering gates must both pass before completion. Self-hosted containers are engineering-only and cannot satisfy formal C8.\n')
              (c9/'HANDOFF.md').write_text(
                '# B0 Incomplete Handoff\n\nSee `readiness/authoritative-convergence-summary.json` and `c8/authoritative-blocker.json`. Do not issue completion markers until a real managed non-production Supabase run passes.\n')
          else:
              result_path,result=passed[0]
              env_root=result_path.parent
              evidence_root=env_root/'evidence'/'b0'
              source_c8=evidence_root/'c8'
              source_runtime=evidence_root/'c9'/'runtime'
              if not (source_c8/'checkpoint.json').exists(): raise SystemExit('passing formal artifact lacks C8 checkpoint')
              if not (source_runtime/'acceptance-result.json').exists(): raise SystemExit('passing formal artifact lacks runtime result')
              shutil.copytree(source_c8,c8,dirs_exist_ok=True)
              shutil.copytree(source_runtime,c9/'runtime',dirs_exist_ok=True)
              checkpoint=json.loads((c8/'checkpoint.json').read_text())
              runtime=json.loads((c9/'runtime'/'acceptance-result.json').read_text())
              database=json.loads((c9/'runtime'/'database-provenance.json').read_text())
              cleanup=json.loads((c9/'runtime'/'schema-cleanup.json').read_text())
              if checkpoint.get('testedCodeSha') != tested: raise SystemExit('formal checkpoint tested SHA mismatch')
              if checkpoint.get('status') != 'PASS' or checkpoint.get('acceptanceTier') != 'formal-c8': raise SystemExit('formal checkpoint invalid')
              if checkpoint.get('selfHostedContainerUsedForFormalC8') is not False: raise SystemExit('container cannot satisfy formal C8')
              if runtime.get('status') != 'PASS': raise SystemExit('formal runtime result is not PASS')
