name: Apply Solo Endgame Stage B patch

on:
  push:
    branches:
      - codex/chatgpt-pro-main-game-final-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(stage-b): stage patch payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/chatgpt-pro-main-game-final-v1
      - name: Decode and apply reviewed Stage B commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2e607a1abcdded533b6615c26554e07a36c049b4"
          cat .stage-b/payload-*.b64 | base64 --decode | gzip --decompress > /tmp/stage-b.patch
          git apply --check /tmp/stage-b.patch
          git config user.name "OpenAI Stage B Delivery"
          git config user.email "stage-b-delivery@invalid"
          git am /tmp/stage-b.patch
          git push origin HEAD:codex/chatgpt-pro-main-game-final-v1
