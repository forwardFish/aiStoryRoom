name: B0 One-Shot Finalizer Scanner Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-finalizer-v4-scanner-repair.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-finalizer-v4-scanner-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publish repair locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/finalizer-scanner-repair",
              description: `finalizer scanner repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact ordinary fast-forward start
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "626673d120edbb63d4e21177f63ec44a7bce43d8"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/b0-finalizer-v4-scanner-repair.yml"
          test "$(git hash-object .github/workflows/b0-finalizer-v4.yml)" = "9843728784d36dfd3f979b742b589afebb710dab"
          test "$(sha256sum .github/workflows/b0-finalizer-v4.yml | cut -d' ' -f1)" = "a50591fb26c0e348579b296c9e8019e4e8956b75e3db97f6e2fead8b194b1994"

      - name: Apply the reviewed scanner and baseline patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/b0-finalizer-v4.patch.gz.b64 <<'PATCH'
          
          PATCH
          sed 's/^          //' /tmp/b0-finalizer-v4.patch.gz.b64 | base64 -d | gzip -dc > /tmp/b0-finalizer-v4.patch
          test "$(sha256sum /tmp/b0-finalizer-v4.patch | cut -d' ' -f1)" = "35177625cdcbcdf82e773f44930f538fce4cf05b02b1f5f838a804964c510d72"
          git apply --check /tmp/b0-finalizer-v4.patch
          git apply /tmp/b0-finalizer-v4.patch
          git diff --check
          test "$(sha256sum .github/workflows/b0-finalizer-v4.yml | cut -d' ' -f1)" = "e2f66b3d6a0271c8256514a395123efc40fede6b9ccc96b4b72ae40203d9c4c7"
          grep -F 'B0_REQUIRED_MAIN_BASELINE_SHA: 86da64eea18ab773312f40c7024ace9cb393344a' .github/workflows/b0-finalizer-v4.yml
          grep -F 'ordinaryLowercaseTokenMetricsIgnored' .github/workflows/b0-finalizer-v4.yml

      - name: Verify scanner remains fail-closed without matching model metrics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          pattern = re.compile(
              r"(?m)\b("
              r"DATABASE_URL|"
              r"[A-Z0-9_]*API_KEY|"
              r"(?:GITHUB_TOKEN|GH_TOKEN|[A-Z0-9_]+_TOKEN(?:_[A-Z0-9_]+)?)|"
              r"[A-Z0-9_]*PASSWORD|"
              r"[A-Z0-9_]+_SECRET"
              r")\s*[:=]\s*([^\s]+)"
          )
          assert pattern.search("token = 151643") is None
          assert pattern.search("token: 128247") is None
          assert pattern.search("DATABASE_URL=postgresql://live.example/db")
          assert pattern.search("DEEPSEEK_API_KEY=sk-exampleabcdefghijkl")
          PY

      - name: Commit the completed repair as an ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/b0-finalizer-v4.yml
          test "$(git diff --cached --name-only)" = ".github/workflows/b0-finalizer-v4.yml"
          git diff --cached --check
          git commit -m "ci(b0): distinguish model token metrics from secrets"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish repair outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/finalizer-scanner-repair",
              description: `finalizer scanner repair ${success ? "passed" : "failed"} in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("B0 finalizer scanner repair failed");
