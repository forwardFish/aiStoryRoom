          manifest={"schemaVersion":1,"generatedAtUtc":generated,"testedCodeSha":tested,"artifactCount":len(rows),"totalBytes":total,"selfReferentialExclusions":sorted(exclusions),"artifacts":rows};mp=c9/"manifest.json";mp.write_text(json.dumps(manifest,indent=2)+"\n");(c9/"manifest.sha256").write_text(f"{hashlib.sha256(mp.read_bytes()).hexdigest()}  manifest.json\n")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as h:h.write(f"status={status}\nclassification={classification}\ntested_sha={tested or ''}\n")
          print(json.dumps({"status":status,"classification":classification,"testedCodeSha":tested,"engineeringPass":engineering_pass,"formalPass":formal_pass,"externalBlocked":external_blocked},indent=2))
          PY
          for p in "$B0_ROOT/c8/checkpoint.json" "$B0_ROOT/c9/manifest.json" "$B0_ROOT/c9/checkpoint.json" "$B0_ROOT/c9/final-pointer.json" "$B0_ROOT/c9/HANDOFF.md" "$B0_ROOT/c9/test-matrix.json" "$B0_ROOT/c9/B0_FINAL_DELIVERY_RESULT.json" "$B0_ROOT/c9/B0_FINAL_DELIVERY_REPORT.md" "$B0_ROOT/c9/recovery-audit.json"; do test -f "$p"; done
          git diff --check -- "$B0_ROOT"

      - name: Ordinary fast-forward evidence and pointer commits
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          before="$(git rev-parse origin/$B0_BRANCH)"
          test "$before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$B0_ROOT"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -Ev '^docs/auto-execute/evidence/b0/' || true)"
          git commit -m "docs(b0): record guaranteed fail-closed C8 C9 evidence"
          evidence_sha="$(git rev-parse HEAD)"
          python3 - "$evidence_sha" <<'PY'
          import json,pathlib,sys
          for name in ("final-pointer.json","B0_FINAL_DELIVERY_RESULT.json"):
              p=pathlib.Path("docs/auto-execute/evidence/b0/c9")/name;d=json.loads(p.read_text());d["evidenceCommitSha"]=sys.argv[1];p.write_text(json.dumps(d,indent=2)+"\n")
          PY
          git add "$B0_ROOT/c9/final-pointer.json" "$B0_ROOT/c9/B0_FINAL_DELIVERY_RESULT.json"
          git diff --cached --check
          git commit -m "docs(b0): seal guaranteed fail-closed pointers"
          final_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$B0_BRANCH"
          after="$(git ls-remote origin refs/heads/$B0_BRANCH|awk '{print $1}')"
          test "$after" = "$final_sha"
          echo "evidence_sha=$evidence_sha" >> "$GITHUB_OUTPUT"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          cat > .artifacts/b0-finalizer-v7/push-readback.json <<EOF
          {"localHead":"$final_sha","remoteTipBeforePush":"$before","evidenceCommitSha":"$evidence_sha","remoteTipAfterPush":"$after"}
          EOF

      - name: Fresh-clone validate remote evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.generate.outputs.tested_sha }}
          EVIDENCE_SHA: ${{ steps.push.outputs.evidence_sha }}
          FINAL_SHA: ${{ steps.push.outputs.final_sha }}
        run: |
          set -euo pipefail
          clone="$RUNNER_TEMP/b0-final-v7-fresh"
          git clone --no-tags --single-branch --branch "$B0_BRANCH" "https://github.com/$GITHUB_REPOSITORY.git" "$clone"
          cd "$clone"
          live="$(git ls-remote origin refs/heads/$B0_BRANCH|awk '{print $1}')"
          test "$live" = "$FINAL_SHA"
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git rev-parse HEAD^)" = "$EVIDENCE_SHA"
          if test -n "$TESTED_SHA"; then
            git merge-base --is-ancestor "$TESTED_SHA" "$EVIDENCE_SHA"
            git diff --name-only "$TESTED_SHA..$FINAL_SHA" > "$RUNNER_TEMP/tested-to-final.txt"
            test -z "$(grep -Ev '^docs/auto-execute/evidence/b0/' "$RUNNER_TEMP/tested-to-final.txt" || true)"
          else : > "$RUNNER_TEMP/tested-to-final.txt"; fi
          git ls-tree -r --name-only "$FINAL_SHA" -- docs/auto-execute/evidence/b0/c8 docs/auto-execute/evidence/b0/c9 > "$RUNNER_TEMP/c8-c9-tree.txt"
          test "$(wc -l < "$RUNNER_TEMP/c8-c9-tree.txt")" -gt 10
          python3 - "$TESTED_SHA" "$EVIDENCE_SHA" "$FINAL_SHA" "$live" "$RUNNER_TEMP" <<'PY'
          import hashlib,json,pathlib,sys
          tested,evidence,final,live,temp_value=sys.argv[1:];temp=pathlib.Path(temp_value);root=pathlib.Path("docs/auto-execute/evidence/b0");c9=root/"c9";errors=[]
          required=[root/"c8/checkpoint.json",c9/"manifest.json",c9/"manifest.sha256",c9/"checkpoint.json",c9/"final-pointer.json",c9/"HANDOFF.md",c9/"test-matrix.json",c9/"B0_FINAL_DELIVERY_RESULT.json",c9/"B0_FINAL_DELIVERY_REPORT.md",c9/"recovery-audit.json",c9/"redaction-scan.json"]
          for p in required:
              if not p.is_file():errors.append("missing:"+str(p))
          for p in root.rglob("*.json"):
              try:json.loads(p.read_text())
              except Exception as e:errors.append("json:"+str(p)+":"+repr(e))
          mp=c9/"manifest.json";m=json.loads(mp.read_text());total=0
          for row in m.get("artifacts",[]):
              p=c9/row["path"]
              if not p.is_file():errors.append("manifest-missing:"+row["path"]);continue
              raw=p.read_bytes();total+=len(raw)
              if len(raw)!=row["bytes"]:errors.append("bytes:"+row["path"])
              if hashlib.sha256(raw).hexdigest()!=row["sha256"]:errors.append("sha:"+row["path"])
          if total!=m.get("totalBytes"):errors.append("totalBytes")
          if hashlib.sha256(mp.read_bytes()).hexdigest()!=(c9/"manifest.sha256").read_text().split()[0]:errors.append("manifest-self-hash")
          pointer=json.loads((c9/"final-pointer.json").read_text());result=json.loads((c9/"B0_FINAL_DELIVERY_RESULT.json").read_text());scan=json.loads((c9/"redaction-scan.json").read_text())
          if pointer.get("evidenceCommitSha")!=evidence:errors.append("pointer-evidence")
          if result.get("evidenceCommitSha")!=evidence:errors.append("result-evidence")
          if tested and pointer.get("testedCodeSha")!=tested:errors.append("pointer-tested")
          if scan.get("status")!="PASS" or scan.get("findingCount")!=0:errors.append("redaction")
          if live!=final:errors.append("live")
          if errors:raise SystemExit(str(errors))
          proof={"schemaVersion":1,"status":"PASS","deliveryStatus":result.get("status"),"classification":result.get("classification"),"testedCodeSha":tested or None,"evidenceCommitSha":evidence,"finalRemoteSha":final,"liveTip":live,"liveTipMatchesFinalRemoteSha":True,"testedToFinalOnlyEvidenceDocs":bool(tested),"testedToFinalFiles":(temp/"tested-to-final.txt").read_text().splitlines(),"c8c9TrackedPathCount":len((temp/"c8-c9-tree.txt").read_text().splitlines()),"c8c9TrackedPaths":(temp/"c8-c9-tree.txt").read_text().splitlines(),"manifestArtifactCount":m.get("artifactCount"),"manifestTotalBytes":m.get("totalBytes"),"redactionStatus":scan.get("status"),"candidateBranchReady":result.get("candidateBranchReady"),"completionMarkersAllowed":result.get("completionMarkersAllowed")}
          (temp/"fresh-clone-readback.json").write_text(json.dumps(proof,indent=2)+"\n")
          PY
          cp "$RUNNER_TEMP/fresh-clone-readback.json" "$GITHUB_WORKSPACE/.artifacts/b0-finalizer-v7/fresh-clone-readback.json"
          cp "$RUNNER_TEMP/c8-c9-tree.txt" "$GITHUB_WORKSPACE/.artifacts/b0-finalizer-v7/c8-c9-tree.txt"
          cp "$RUNNER_TEMP/tested-to-final.txt" "$GITHUB_WORKSPACE/.artifacts/b0-finalizer-v7/tested-to-final.txt"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" -f state=success -f context='b0/finalizer-v7-readback' -f description="fresh-clone C8/C9 verification passed in $GITHUB_RUN_ID" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Upload finalizer proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0-guaranteed-finalizer-v7-${{ github.sha }}
          path: .artifacts/b0-finalizer-v7
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          DELIVERY_STATUS: ${{ steps.generate.outputs.status }}
          CLASSIFICATION: ${{ steps.generate.outputs.classification }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:success?"success":"failure",context:"b0/finalizer-v7",description:success?`${process.env.DELIVERY_STATUS||"UNKNOWN"}: ${process.env.CLASSIFICATION||"UNKNOWN"}`.slice(0,140):`guaranteed finalizer v7 failed in ${context.runId}`,target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            if (!success) core.setFailed("B0 guaranteed fail-closed finalizer v7 failed");
