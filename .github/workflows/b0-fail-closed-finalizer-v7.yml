          # Redact text and create a strict scan.
          rules=[(re.compile(r"postgres(?:ql)?://[^\s\"'<>`]+",re.I),"[REDACTED_DATABASE_URL]"),(re.compile(r"(?i)Bearer\s+[A-Za-z0-9._~+/-]+=*"),"Bearer [REDACTED]"),(re.compile(r"(?i)(cookie\s*[:=]\s*)[^\r\n]+"),r"\1[REDACTED]"),(re.compile(r"sk-[A-Za-z0-9_-]{16,}"),"[REDACTED_API_KEY]"),(re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"),"[REDACTED_JWT]")];binary={".png",".jpg",".jpeg",".webp",".zip",".gz"}
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() in binary: continue
              try:text=p.read_text(encoding="utf-8")
              except Exception:continue
              for pattern,replacement in rules:text=pattern.sub(replacement,text)
              p.write_text(text,encoding="utf-8")
          findings=[];scans=[("database-url",re.compile(r"postgres(?:ql)?://[^\s\"'<>`]+",re.I)),("bearer",re.compile(r"(?i)Bearer\s+(?!\[REDACTED\])[A-Za-z0-9._~+/-]+=*")),("api-key",re.compile(r"sk-[A-Za-z0-9_-]{16,}")),("jwt",re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"))]
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() in binary:continue
              try:text=p.read_text(encoding="utf-8")
              except Exception:continue
              for kind,pattern in scans:
                  if pattern.search(text):findings.append({"path":str(p.relative_to(repo)).replace("\\","/"),"kind":kind})
