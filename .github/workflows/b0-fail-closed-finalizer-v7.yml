          generated = datetime.now(timezone.utc).isoformat()
          copy_tree(stage / "gates", c9 / "gates")
          copy_tree(stage / "recovery-v2", c9 / "recovery/finalizer-v2")
          shutil.copy2(stage / "status-summary.json", c9 / "gates/status-summary.json")
          shutil.copy2(stage / "downloads/selected-artifacts.json", c9 / "gates/selected-artifacts.json")
          shutil.copy2(stage / "remote-main-at-finalization.txt", c9 / "readback/remote-main-at-finalization.txt")
          engineering_sources = sorted(p for p in (stage / "extracted").glob("b0-engineering-real-acceptance-*") if p.is_dir())
          blocker_sources = sorted(p for p in (stage / "extracted").glob("b0-formal-c8-credential-blocker-*") if p.is_dir())
          formal_sources = sorted(p for p in (stage / "extracted").glob("b0-formal-c8-real-acceptance-*") if p.is_dir())
          for source in engineering_sources: copy_tree(source, c9 / "runtime/engineering" / source.name)
          for source in blocker_sources + formal_sources: copy_tree(source, c9 / "runtime/formal" / source.name)
          acceptance_result = None; acceptance_path = None
          for source in engineering_sources:
              for candidate in source.rglob("acceptance-result.json"):
                  payload = read_json(candidate)
                  if isinstance(payload, dict): acceptance_result, acceptance_path = payload, candidate; break
              if acceptance_result: break
          exact_pass = os.environ.get("EXACT_STATE") == "success"
          contract_pass = os.environ.get("CONTRACT_STATE") == "success"
          engineering_pass = bool(os.environ.get("ENGINEERING_STATE") == "success" and acceptance_result and acceptance_result.get("status") == "PASS")
          acceptance_jobs = read_json(stage / f"gates/run-{os.environ.get('ACCEPTANCE_RUN_ID')}-jobs.json") or {}
          jobs = acceptance_jobs.get("jobs", []) if isinstance(acceptance_jobs, dict) else []
          blocker_job = next((j for j in jobs if "credential blocker" in str(j.get("name", "")).lower()), None)
          formal_job = next((j for j in jobs if str(j.get("name", "")).lower().startswith("formal c8 on real")), None)
          external_blocked = bool(blocker_sources and blocker_job and blocker_job.get("conclusion") == "failure" and (not formal_job or formal_job.get("conclusion") == "skipped"))
          formal_pass = bool(formal_sources and formal_job and formal_job.get("conclusion") == "success")
          if exact_pass and contract_pass and engineering_pass and formal_pass: status, classification, ready = "PASS", "FULL_PASS", True
          elif exact_pass and contract_pass and engineering_pass and external_blocked: status, classification, ready = "EXTERNAL_BLOCKED", "ENGINEERING_PASS_FORMAL_C8_EXTERNAL_BLOCKED", False
          else: status, classification, ready = "INCOMPLETE", "ENGINEERING_OR_FORMAL_VERIFICATION_INCOMPLETE", False
          tested = os.environ["GITHUB_SHA"] if exact_pass and contract_pass and engineering_pass else None
          # v2 exact diagnosis.
          v2_runs = read_json(stage / "recovery-v2/selected-runs.json") or {"runs": []}; failed=[]; errors=[]
          for path in (stage / "recovery-v2").glob("run-*-jobs.json"):
              payload = read_json(path) or {}
              for job in payload.get("jobs", []):
                  for step in job.get("steps") or []:
                      if step.get("conclusion") == "failure": failed.append({"runId": job.get("run_id"), "jobId": job.get("id"), "job": job.get("name"), "step": step.get("name"), "stepNumber": step.get("number")})
          for path in (stage / "recovery-v2").glob("run-*.log"):
              command = None
              for line in path.read_text(errors="replace").splitlines():
                  clean = re.sub(r"^\S+\s+", "", line).strip()
                  if "##[group]Run " in clean: command = clean.split("##[group]Run ", 1)[1][:1000]
                  if "##[error]" in clean or re.search(r"(?:Traceback|AssertionError|Error:|Process completed with exit code|fatal:|ValidationError)", clean): errors.append({"log": path.name, "command": command, "line": clean[:1600]})
          (c9 / "recovery/finalizer-v2/diagnosis.json").write_text(json.dumps({"schemaVersion": 1, "commitSha": os.environ["B0_V2_SHA"], "runs": v2_runs.get("runs", []), "failedSteps": failed, "lastFailedCommand": next((r.get("command") for r in reversed(errors) if r.get("command")), None), "errorLines": errors[-160:]}, indent=2) + "\n")
          screenshots = sorted(p for source in engineering_sources for p in source.rglob("*.png") if p.is_file()); screenshot_rows = [{"path": str(p.relative_to(repo)).replace("\\", "/"), "bytes": p.stat().st_size, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for p in screenshots]
          (c9 / "runtime/engineering/browser-evidence-index.json").write_text(json.dumps({"schemaVersion": 1, "testedCodeSha": tested, "screenshotCount": len(screenshot_rows), "screenshots": screenshot_rows}, indent=2) + "\n")
          formal = {"status": "PASS" if formal_pass else ("EXTERNAL_BLOCKED" if external_blocked else "INCOMPLETE"), "passed": formal_pass, "externalBlocked": external_blocked, "managedNonProductionSupabaseRequired": True, "managedNonProductionSupabaseAvailable": formal_pass, "randomSchemaRequired": True, "publicSchemaForbiddenAsTestSchema": True, "selfHostedContainerMaySubstitute": False, "credentialValuesPersisted": False, "environmentsChecked": ["ourmanyworlds.com / test", "stellar-encouragement / test", "Preview"], "workflowRunId": int(os.environ["ACCEPTANCE_RUN_ID"]) if os.environ.get("ACCEPTANCE_RUN_ID") else None}
          engineering = {"status": "PASS_ENGINEERING_ONLY" if engineering_pass else "FAIL", "passed": engineering_pass, "formalC8Substitute": False, "database": "official self-hosted supabase/postgres random isolated engineering schema", "realBrowserSessions": 3 if engineering_pass else None, "synchronizedWindows": 6 if engineering_pass else None, "desktopViewportCovered": engineering_pass, "narrow390ViewportCovered": engineering_pass, "screenshotCount": len(screenshot_rows), "acceptanceResultPath": str(acceptance_path.relative_to(repo)).replace("\\", "/") if acceptance_path else None, "workflowRunId": int(os.environ["ACCEPTANCE_RUN_ID"]) if os.environ.get("ACCEPTANCE_RUN_ID") else None}
          (c8 / "checkpoint.json").write_text(json.dumps({"schemaVersion": 1, "generatedAtUtc": generated, "testedCodeSha": tested, "status": status, "classification": classification, "formalC8": formal, "engineeringAcceptance": engineering}, indent=2) + "\n")
          (c9 / "managed-supabase-validation.json").write_text(json.dumps({"schemaVersion": 1, "generatedAtUtc": generated, "status": formal["status"], "externalBlocked": external_blocked, "containerClassifiedEngineeringOnly": True, "productionPublicSchemaUsed": False, "productionDatabaseTouched": False, "productionConfigurationChanged": False, "realUserDataTouched": False}, indent=2) + "\n")
          job_rows=[]
          for path in (c9 / "gates").glob("run-*-jobs.json"):
              payload=read_json(path) or {}
              for job in payload.get("jobs", []): job_rows.append({"runId":job.get("run_id"),"jobId":job.get("id"),"name":job.get("name"),"status":job.get("status"),"conclusion":job.get("conclusion"),"startedAt":job.get("started_at"),"completedAt":job.get("completed_at")})
          (c9 / "test-matrix.json").write_text(json.dumps({"schemaVersion":1,"generatedAtUtc":generated,"testedCodeSha":tested,"overall":status,"classification":classification,"jobs":job_rows,"coverage":{"frozenInstallAndWorkspaceGates":exact_pass,"threeIsolatedBrowserSessions":engineering_pass,"sixSynchronizedWindows":engineering_pass,"worldSequenceExactlyOnce":engineering_pass,"privacyIdempotencyNarrativeWorkers":engineering_pass,"pauseResumeDeadlineLeaseCrashRecovery":engineering_pass,"desktopAnd390px":engineering_pass,"formalManagedNonProductionSupabase":formal_pass}},indent=2)+"\n")
          (c9 / "checkpoint.json").write_text(json.dumps({"schemaVersion":1,"generatedAtUtc":generated,"testedCodeSha":tested,"status":status,"classification":classification,"candidateBranchReady":ready,"completionMarkersAllowed":ready},indent=2)+"\n")
          result={"schemaVersion":1,"generatedAtUtc":generated,"repository":os.environ["GITHUB_REPOSITORY"],"branch":os.environ["B0_BRANCH"],"mainBaselineSha":os.environ["B0_MAIN_BASELINE"],"testedCodeSha":tested,"evidenceCommitSha":None,"finalRemoteSha":None,"finalRemoteShaResolution":"external clean-clone readback","status":status,"classification":classification,"candidateBranchReady":ready,"completionMarkersAllowed":ready,"formalC8":formal,"engineeringAcceptance":engineering,"boundaries":{"forcePushUsed":False,"pullRequestCreatedOrModified":False,"deploymentPerformed":False,"productionDatabaseTouched":False,"productionConfigurationChanged":False,"realUserDataTouched":False}}
          (c9 / "B0_FINAL_DELIVERY_RESULT.json").write_text(json.dumps(result,indent=2)+"\n")
          (c9 / "recovery-audit.json").write_text(json.dumps({"schemaVersion":1,"generatedAtUtc":generated,"startingRemoteSha":os.environ["GITHUB_SHA"],"mainBaselineSha":os.environ["B0_MAIN_BASELINE"],"finalizerV2DiagnosisPath":"recovery/finalizer-v2/diagnosis.json","ordinaryFastForwardOnly":True,"forcePushUsed":False},indent=2)+"\n")
          (c9 / "final-pointer.json").write_text(json.dumps({"schemaVersion":1,"testedCodeSha":tested,"evidenceCommitSha":None,"finalRemoteSha":None,"finalRemoteShaResolution":"external clean-clone readback because a commit cannot contain its own SHA","status":status,"classification":classification},indent=2)+"\n")
          (c9 / "HANDOFF.md").write_text(f"# B0 C8/C9 HANDOFF\n\n- main baseline: `{os.environ['B0_MAIN_BASELINE']}`\n- testedCodeSha: `{tested or 'not frozen'}`\n- exact run: `{os.environ.get('EXACT_RUN_ID') or 'unknown'}`\n- acceptance run: `{os.environ.get('ACCEPTANCE_RUN_ID') or 'unknown'}`\n- status: `{status}`\n- classification: `{classification}`\n\nExact job metadata and readable logs are under `gates/**`. Engineering API/Web, real browser sessions, synchronized windows, provider, database cleanup, privacy, idempotency, Narrative, Worker, pause/deadline/lease/crash evidence is under `runtime/engineering/**`. Formal managed Supabase proof or the credential blocker is under `runtime/formal/**`. The container remains engineering-only.\n")
