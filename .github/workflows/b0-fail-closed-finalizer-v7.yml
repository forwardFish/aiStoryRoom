name: B0 Guaranteed Fail-Closed Evidence Finalizer V7

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-fail-closed-finalizer-v7.yml

permissions:
  actions: read
  contents: write
  statuses: write

concurrency:
  group: b0-guaranteed-finalizer-v7-${{ github.ref }}
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_MAIN_BASELINE: 86da64eea18ab773312f40c7024ace9cb393344a
  B0_HISTORICAL_EVIDENCE_SHA: 6032972d4518f8feb57f958ff0b2e52636431be1
  B0_PREVIOUS_EVIDENCE_REMOTE_SHA: 787f735673c4e738003900f00cb5676b1d074217
  B0_TESTABLE_CANDIDATE_SHA: e7635c279e72ae8efaff614159447d88c7ba22d0
  B0_ROOT: docs/auto-execute/evidence/b0

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      tested_sha: ${{ steps.generate.outputs.tested_sha }}
      evidence_sha: ${{ steps.push.outputs.evidence_sha }}
      final_sha: ${{ steps.push.outputs.final_sha }}
      delivery_status: ${{ steps.generate.outputs.delivery_status }}
      classification: ${{ steps.generate.outputs.classification }}
    steps:
      - name: Publish locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/finalizer-v7",
              description: `fail-closed finalizer running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Anchor exact remote state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/b0-finalizer-v7
          git fetch origin "$B0_BRANCH" main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git cat-file -e "$B0_MAIN_BASELINE^{commit}"
          git cat-file -e "$B0_HISTORICAL_EVIDENCE_SHA^{commit}"
          git cat-file -e "$B0_TESTABLE_CANDIDATE_SHA^{commit}"
          git merge-base --is-ancestor "$B0_MAIN_BASELINE" HEAD
          git merge-base --is-ancestor "$B0_TESTABLE_CANDIDATE_SHA" HEAD
          test -z "$(git status --short)"
          printf '%s\n' "$GITHUB_SHA" > .artifacts/b0-finalizer-v7/local-head.txt
          printf '%s\n' "$(git rev-parse origin/$B0_BRANCH)" > .artifacts/b0-finalizer-v7/remote-tip-before-push.txt
          printf '%s\n' "$(git rev-parse origin/main)" > .artifacts/b0-finalizer-v7/remote-main-at-finalization.txt

      - name: Wait for exact, Windows, acceptance and formal statuses
        id: observe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, time
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          root = pathlib.Path(".artifacts/b0-finalizer-v7")
          wanted = {
              "exact": "b0/exact-push",
              "windows": "b0/windows-seed",
              "contract": "b0/acceptance-contract",
              "engineering": "b0/engineering-real-acceptance",
              "formal": "b0/formal-c8",
          }
          deadline = time.time() + 150 * 60
          records = {}
          while time.time() < deadline:
              rows = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/commits/{sha}/statuses?per_page=100"], text=True
              ))
              latest = {}
              for row in rows:
                  latest.setdefault(row.get("context"), row)
              records = {}
              terminal = True
              for key, context in wanted.items():
                  row = latest.get(context) or {}
                  target = str(row.get("target_url") or "")
                  match = re.search(r"/actions/runs/(\d+)", target)
                  records[key] = {
                      "context": context,
                      "state": row.get("state"),
                      "description": row.get("description"),
                      "targetUrl": target or None,
                      "runId": int(match.group(1)) if match else None,
                  }
                  terminal = terminal and row.get("state") in {"success", "failure", "error"}
              (root / "status-poll.json").write_text(
                  json.dumps({"testedCodeSha": sha, "records": records}, indent=2) + "\n"
              )
              if terminal:
                  break
              time.sleep(20)
          (root / "status-summary.json").write_text(
              json.dumps({"testedCodeSha": sha, "records": records}, indent=2) + "\n"
          )
          with output.open("a") as handle:
              for key, row in records.items():
                  handle.write(f"{key}_state={row.get('state') or ''}\n")
                  handle.write(f"{key}_run_id={row.get('runId') or ''}\n")
          print(json.dumps(records, indent=2))
          PY

      - name: Fetch run metadata, logs and selected artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_RUN_ID: ${{ steps.observe.outputs.exact_run_id }}
          WINDOWS_RUN_ID: ${{ steps.observe.outputs.windows_run_id }}
          ACCEPTANCE_RUN_ID: ${{ steps.observe.outputs.engineering_run_id }}
        run: |
          set -euo pipefail
          root=.artifacts/b0-finalizer-v7
          mkdir -p "$root/gates" "$root/downloads" "$root/extracted"
          for run_id in "$EXACT_RUN_ID" "$WINDOWS_RUN_ID" "$ACCEPTANCE_RUN_ID"; do
            test -n "$run_id" || continue
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$root/gates/run-$run_id.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$root/gates/run-$run_id-jobs.json"
            gh run view "$run_id" --log > "$root/gates/run-$run_id.log" 2>&1 || true
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$root/downloads/run-$run_id-artifacts.json"
          done
          python3 - <<'PY'
          import json, os, pathlib, subprocess, zipfile
          root = pathlib.Path(".artifacts/b0-finalizer-v7")
          repo = os.environ["GITHUB_REPOSITORY"]
          prefixes = (
              "b0-engineering-real-acceptance-",
              "b0-formal-c8-credential-blocker-",
              "b0-formal-c8-real-acceptance-",
              "b0-user-test-seed-",
          )
          selected = []
          for index in root.glob("downloads/run-*-artifacts.json"):
              payload = json.loads(index.read_text())
              for row in payload.get("artifacts", []):
                  name = str(row.get("name", ""))
                  if name.startswith(prefixes):
                      selected.append({
                          "id": row.get("id"),
                          "name": name,
                          "sizeBytes": row.get("size_in_bytes"),
                          "digest": row.get("digest"),
                          "runId": row.get("workflow_run", {}).get("id"),
                      })
          (root / "downloads/selected-artifacts.json").write_text(
              json.dumps({"artifacts": selected}, indent=2) + "\n"
          )
          for row in selected:
              archive = root / "downloads" / f"{row['name']}.zip"
              with archive.open("wb") as stream:
                  subprocess.run(
                      ["gh", "api", f"repos/{repo}/actions/artifacts/{row['id']}/zip"],
                      stdout=stream,
                      check=True,
                  )
              target = root / "extracted" / row["name"]
              target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(target)
          PY

      - name: Materialize history-preserving C8 C9 evidence
        id: generate
        shell: bash
        env:
          EXACT_STATE: ${{ steps.observe.outputs.exact_state }}
          WINDOWS_STATE: ${{ steps.observe.outputs.windows_state }}
          CONTRACT_STATE: ${{ steps.observe.outputs.contract_state }}
          ENGINEERING_STATE: ${{ steps.observe.outputs.engineering_state }}
          FORMAL_STATE: ${{ steps.observe.outputs.formal_state }}
          EXACT_RUN_ID: ${{ steps.observe.outputs.exact_run_id }}
          WINDOWS_RUN_ID: ${{ steps.observe.outputs.windows_run_id }}
          ACCEPTANCE_RUN_ID: ${{ steps.observe.outputs.engineering_run_id }}
        run: |
          set -euo pipefail
          git checkout "$B0_HISTORICAL_EVIDENCE_SHA" -- \
            "$B0_ROOT/c0/baseline-test-matrix.json" \
            "$B0_ROOT/c1/contract-gate-notes.md" \
            "$B0_ROOT/c2/checkpoint.json" \
            "$B0_ROOT/c3/checkpoint.json" \
            "$B0_ROOT/c4/checkpoint.json" \
            "$B0_ROOT/c5/checkpoint.json" \
            "$B0_ROOT/c6/checkpoint.json"
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, re, shutil, zipfile
          from datetime import datetime, timezone

          repo = pathlib.Path.cwd()
          stage = repo / ".artifacts/b0-finalizer-v7"
          root = repo / os.environ["B0_ROOT"]
          c8, c9 = root / "c8", root / "c9"
          history = root / "history"
          generated = datetime.now(timezone.utc).isoformat()

          def read_json(path: pathlib.Path):
              try: return json.loads(path.read_text(encoding="utf-8"))
              except Exception: return None

          def copy_tree(source: pathlib.Path, destination: pathlib.Path) -> None:
              for item in source.rglob("*"):
                  if item.is_file():
                      target = destination / item.relative_to(source)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(item, target)

          # Archive the immediately previous active C8/C9 run under a short path.
          history.mkdir(parents=True, exist_ok=True)
          previous_label = os.environ["B0_PREVIOUS_EVIDENCE_REMOTE_SHA"][:8]
          previous_dir = history / previous_label
          previous_dir.mkdir(parents=True, exist_ok=True)
          previous_zip = previous_dir / "prior-c8-c9.zip"
          with zipfile.ZipFile(previous_zip, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as bundle:
              for prefix, source in (("c8", c8), ("c9", c9)):
                  if source.exists():
                      for item in sorted(source.rglob("*")):
                          if item.is_file():
                              bundle.write(item, arcname=f"{prefix}/{item.relative_to(source).as_posix()}")
          prior_raw = previous_zip.read_bytes()
          (previous_dir / "archive-metadata.json").write_text(json.dumps({
              "schemaVersion": 1,
              "generatedAtUtc": generated,
              "sourceFinalRemoteSha": os.environ["B0_PREVIOUS_EVIDENCE_REMOTE_SHA"],
              "archive": previous_zip.name,
              "archiveBytes": len(prior_raw),
              "archiveSha256": hashlib.sha256(prior_raw).hexdigest(),
              "preservationRule": "prior active C8/C9 is retained as a versioned ZIP; C0-C6 remain ordinary immutable files",
          }, indent=2) + "\n", encoding="utf-8")

          for active in (c8, c9):
              if active.exists(): shutil.rmtree(active)
          for path in (c8, c9 / "gates", c9 / "runtime/engineering", c9 / "runtime/formal", c9 / "runtime/seed", c9 / "readback"):
              path.mkdir(parents=True, exist_ok=True)

          copy_tree(stage / "gates", c9 / "gates")
          shutil.copy2(stage / "status-summary.json", c9 / "gates/status-summary.json")
          shutil.copy2(stage / "downloads/selected-artifacts.json", c9 / "gates/selected-artifacts.json")
          shutil.copy2(stage / "remote-main-at-finalization.txt", c9 / "readback/remote-main-at-finalization.txt")

          extracted = stage / "extracted"
          engineering_sources = sorted(extracted.glob("b0-engineering-real-acceptance-*"))
          blocker_sources = sorted(extracted.glob("b0-formal-c8-credential-blocker-*"))
          formal_sources = sorted(extracted.glob("b0-formal-c8-real-acceptance-*"))
          seed_sources = sorted(extracted.glob("b0-user-test-seed-*"))
          for source in engineering_sources: copy_tree(source, c9 / "runtime/engineering/current")
          for source in blocker_sources + formal_sources: copy_tree(source, c9 / "runtime/formal/current")
          for source in seed_sources:
              destination = "windows" if "windows" in source.name.lower() else "linux"
              copy_tree(source, c9 / "runtime/seed" / destination)

          acceptance_result = None
          for candidate in (c9 / "runtime/engineering/current").rglob("acceptance-result.json"):
              acceptance_result = read_json(candidate)
              if acceptance_result: break
          exact_pass = os.environ.get("EXACT_STATE") == "success"
          windows_pass = os.environ.get("WINDOWS_STATE") == "success"
          contract_pass = os.environ.get("CONTRACT_STATE") == "success"
          engineering_pass = bool(os.environ.get("ENGINEERING_STATE") == "success" and acceptance_result and acceptance_result.get("status") == "PASS")
          formal_pass = os.environ.get("FORMAL_STATE") == "success" and bool(formal_sources)
          external_blocked = os.environ.get("FORMAL_STATE") == "failure" and bool(blocker_sources) and not formal_pass
          if exact_pass and windows_pass and contract_pass and engineering_pass and formal_pass:
              status, classification, ready = "PASS", "FULL_PASS", True
          elif exact_pass and windows_pass and contract_pass and engineering_pass and external_blocked:
              status, classification, ready = "EXTERNAL_BLOCKED", "ENGINEERING_PASS_FORMAL_C8_EXTERNAL_BLOCKED", False
          else:
              status, classification, ready = "INCOMPLETE", "ENGINEERING_OR_FORMAL_VERIFICATION_INCOMPLETE", False
          tested = os.environ["GITHUB_SHA"] if exact_pass and windows_pass and contract_pass and engineering_pass else None

          screenshots = sorted((c9 / "runtime/engineering/current").rglob("*.png"))
          (c9 / "runtime/engineering/browser-evidence-index.json").write_text(json.dumps({
              "schemaVersion": 1,
              "testedCodeSha": tested,
              "screenshotCount": len(screenshots),
              "screenshots": [{
                  "path": str(path.relative_to(root)).replace("\\", "/"),
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              } for path in screenshots],
          }, indent=2) + "\n", encoding="utf-8")

          formal = {
              "status": "PASS" if formal_pass else ("EXTERNAL_BLOCKED" if external_blocked else "INCOMPLETE"),
              "passed": formal_pass,
              "externalBlocked": external_blocked,
              "managedNonProductionSupabaseRequired": True,
              "managedNonProductionSupabaseAvailable": formal_pass,
              "randomSchemaRequired": True,
              "publicSchemaForbiddenAsTestSchema": True,
              "selfHostedContainerMaySubstitute": False,
              "credentialValuesPersisted": False,
              "workflowRunId": int(os.environ["ACCEPTANCE_RUN_ID"]) if os.environ.get("ACCEPTANCE_RUN_ID") else None,
          }
          engineering = {
              "status": "PASS_ENGINEERING_ONLY" if engineering_pass else "FAIL",
              "passed": engineering_pass,
              "formalC8Substitute": False,
              "realBrowserSessions": 3 if engineering_pass else None,
              "synchronizedWindows": 6 if engineering_pass else None,
              "desktopViewportCovered": engineering_pass,
              "narrow390ViewportCovered": engineering_pass,
              "screenshotCount": len(screenshots),
              "workflowRunId": int(os.environ["ACCEPTANCE_RUN_ID"]) if os.environ.get("ACCEPTANCE_RUN_ID") else None,
          }
          cross_platform = {
              "linux": {"status": "PASS" if exact_pass else "FAIL", "workflowRunId": int(os.environ["EXACT_RUN_ID"]) if os.environ.get("EXACT_RUN_ID") else None},
              "windows": {"status": "PASS" if windows_pass else "FAIL", "workflowRunId": int(os.environ["WINDOWS_RUN_ID"]) if os.environ.get("WINDOWS_RUN_ID") else None},
          }
          checkpoint = {
              "schemaVersion": 2,
              "generatedAtUtc": generated,
              "testableCandidateSha": os.environ["B0_TESTABLE_CANDIDATE_SHA"],
              "testedCodeSha": tested,
              "status": status,
              "classification": classification,
              "formalC8": formal,
              "engineeringAcceptance": engineering,
              "crossPlatformSeed": cross_platform,
          }
          (c8 / "checkpoint.json").write_text(json.dumps(checkpoint, indent=2) + "\n", encoding="utf-8")
          (c9 / "checkpoint.json").write_text(json.dumps({
              "schemaVersion": 2,
              "generatedAtUtc": generated,
              "testedCodeSha": tested,
              "status": status,
              "classification": classification,
              "candidateBranchReady": ready,
              "completionMarkersAllowed": ready,
          }, indent=2) + "\n", encoding="utf-8")
          (c9 / "managed-supabase-validation.json").write_text(json.dumps({
              "schemaVersion": 2,
              "status": formal["status"],
              "containerClassifiedEngineeringOnly": True,
              "productionPublicSchemaUsed": False,
              "productionDatabaseTouched": False,
              "productionConfigurationChanged": False,
              "realUserDataTouched": False,
          }, indent=2) + "\n", encoding="utf-8")
          (c9 / "test-matrix.json").write_text(json.dumps({
              "schemaVersion": 2,
              "generatedAtUtc": generated,
              "testedCodeSha": tested,
              "overall": status,
              "classification": classification,
              "runs": {"exact": os.environ.get("EXACT_RUN_ID"), "windowsSeed": os.environ.get("WINDOWS_RUN_ID"), "acceptance": os.environ.get("ACCEPTANCE_RUN_ID")},
              "coverage": {
                  "exactEngineeringGates": exact_pass,
                  "linuxCleanCloneSeed": exact_pass,
                  "windowsCleanCloneSeed": windows_pass,
                  "threeSessionsSixWindows": engineering_pass,
                  "privacyIdempotencyNarrativeWorkers": engineering_pass,
                  "pauseResumeDeadlineLeaseCrashRecovery": engineering_pass,
                  "desktopAnd390px": engineering_pass,
                  "formalManagedNonProductionSupabase": formal_pass,
              },
          }, indent=2) + "\n", encoding="utf-8")
          result = {
              "schemaVersion": 2,
              "generatedAtUtc": generated,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["B0_BRANCH"],
              "mainBaselineSha": os.environ["B0_MAIN_BASELINE"],
              "testableCandidateSha": os.environ["B0_TESTABLE_CANDIDATE_SHA"],
              "testedCodeSha": tested,
              "evidenceCommitSha": None,
              "finalRemoteSha": None,
              "finalRemoteShaResolution": "external clean-clone readback",
              "status": status,
              "classification": classification,
              "candidateBranchReady": ready,
              "completionMarkersAllowed": ready,
              "formalC8": formal,
              "engineeringAcceptance": engineering,
              "crossPlatformSeed": cross_platform,
              "boundaries": {"forcePushUsed": False, "pullRequestCreatedOrModified": False, "deploymentPerformed": False, "productionDatabaseTouched": False, "productionConfigurationChanged": False, "realUserDataTouched": False},
          }
          (c9 / "B0_FINAL_DELIVERY_RESULT.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          (c9 / "final-pointer.json").write_text(json.dumps({
              "schemaVersion": 2,
              "testableCandidateSha": os.environ["B0_TESTABLE_CANDIDATE_SHA"],
              "testedCodeSha": tested,
              "evidenceCommitSha": None,
              "finalRemoteSha": None,
              "finalRemoteShaResolution": "external clean-clone readback because a commit cannot contain its own SHA",
              "status": status,
              "classification": classification,
          }, indent=2) + "\n", encoding="utf-8")
          (c9 / "recovery-audit.json").write_text(json.dumps({
              "schemaVersion": 2,
              "generatedAtUtc": generated,
              "startingRemoteSha": os.environ["GITHUB_SHA"],
              "mainBaselineSha": os.environ["B0_MAIN_BASELINE"],
              "testableCandidateSha": os.environ["B0_TESTABLE_CANDIDATE_SHA"],
              "historicalEvidenceSourceSha": os.environ["B0_HISTORICAL_EVIDENCE_SHA"],
              "previousEvidenceRemoteSha": os.environ["B0_PREVIOUS_EVIDENCE_REMOTE_SHA"],
              "historicalC0ThroughC6Restored": True,
              "priorC8C9ArchivedAsZip": True,
              "ordinaryFastForwardOnly": True,
              "forcePushUsed": False,
          }, indent=2) + "\n", encoding="utf-8")
          (c9 / "HANDOFF.md").write_text(
              f"# B0 C8/C9 HANDOFF\n\n- testableCandidateSha: `{os.environ['B0_TESTABLE_CANDIDATE_SHA']}`\n- testedCodeSha: `{tested or 'not frozen'}`\n- exact run: `{os.environ.get('EXACT_RUN_ID')}`\n- Windows seed run: `{os.environ.get('WINDOWS_RUN_ID')}`\n- acceptance run: `{os.environ.get('ACCEPTANCE_RUN_ID')}`\n- status: `{status}`\n- classification: `{classification}`\n\nLogs are under `gates/**`; runtime evidence is under `runtime/**`; preserved history is under `history/**`. Formal C8 remains fail-closed when approved non-production credentials are unavailable.\n",
              encoding="utf-8",
          )
          (c9 / "B0_FINAL_DELIVERY_REPORT.md").write_text(
              f"# B0 Final Delivery Report\n\n- status: `{status}`\n- classification: `{classification}`\n- candidate ready: `{str(ready).lower()}`\n- testableCandidateSha: `{os.environ['B0_TESTABLE_CANDIDATE_SHA']}`\n- testedCodeSha: `{tested or 'not frozen'}`\n- Linux gates/seed: `{'PASS' if exact_pass else 'FAIL'}`\n- Windows seed: `{'PASS' if windows_pass else 'FAIL'}`\n- engineering acceptance: `{engineering['status']}`\n- formal C8: `{formal['status']}`\n- screenshots: `{len(screenshots)}`\n\nNo PR, force push, deployment or production operation was performed.\n",
              encoding="utf-8",
          )

          # Redact active text evidence. Preserved ZIPs were produced from already redacted evidence.
          rules = [
              (re.compile(r"postgres(?:ql)?://[^\s\"'<>`]+", re.I), "[REDACTED_DATABASE_URL]"),
              (re.compile(r"(?i)Bearer\s+[A-Za-z0-9._~+/-]+=*"), "Bearer [REDACTED]"),
              (re.compile(r"sk-[A-Za-z0-9_-]{16,}"), "[REDACTED_API_KEY]"),
              (re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"), "[REDACTED_JWT]"),
          ]
          binaries = {".png", ".jpg", ".jpeg", ".webp", ".zip", ".gz"}
          for path in list(c8.rglob("*")) + list(c9.rglob("*")):
              if not path.is_file() or path.suffix.lower() in binaries: continue
              try: text = path.read_text(encoding="utf-8")
              except Exception: continue
              for pattern, replacement in rules: text = pattern.sub(replacement, text)
              path.write_text(text, encoding="utf-8")
          findings = []
          scans = [
              ("database-url", re.compile(r"postgres(?:ql)?://[^\s\"'<>`]+", re.I)),
              ("api-key", re.compile(r"sk-[A-Za-z0-9_-]{16,}")),
              ("jwt", re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}")),
          ]
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() in binaries: continue
              try: text = path.read_text(encoding="utf-8")
              except Exception: continue
              for kind, pattern in scans:
                  if pattern.search(text): findings.append({"path": str(path.relative_to(repo)).replace("\\", "/"), "kind": kind})
          (c9 / "redaction-scan.json").write_text(json.dumps({"schemaVersion": 2, "generatedAtUtc": generated, "status": "PASS" if not findings else "FAIL", "findingCount": len(findings), "findings": findings}, indent=2) + "\n", encoding="utf-8")
          if findings: raise SystemExit(str(findings))

          exclusions = {"c9/manifest.json", "c9/manifest.sha256", "c9/final-pointer.json", "c9/B0_FINAL_DELIVERY_RESULT.json"}
          rows, total = [], 0
          for path in sorted(root.rglob("*")):
              relative = str(path.relative_to(root)).replace("\\", "/")
              if not path.is_file() or relative in exclusions: continue
              raw = path.read_bytes(); total += len(raw)
              rows.append({"path": relative, "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()})
          manifest = {"schemaVersion": 3, "generatedAtUtc": generated, "testableCandidateSha": os.environ["B0_TESTABLE_CANDIDATE_SHA"], "testedCodeSha": tested, "pathBase": "docs/auto-execute/evidence/b0", "artifactCount": len(rows), "totalBytes": total, "selfReferentialExclusions": sorted(exclusions), "artifacts": rows}
          manifest_path = c9 / "manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          (c9 / "manifest.sha256").write_text(f"{hashlib.sha256(manifest_path.read_bytes()).hexdigest()}  manifest.json\n", encoding="utf-8")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
              handle.write(f"tested_sha={tested or ''}\n")
              handle.write(f"delivery_status={status}\n")
              handle.write(f"classification={classification}\n")
          print(json.dumps({"status": status, "classification": classification, "testedCodeSha": tested, "artifactCount": len(rows), "totalBytes": total}, indent=2))
          PY
          for path in "$B0_ROOT/c0/baseline-test-matrix.json" "$B0_ROOT/c1/contract-gate-notes.md" "$B0_ROOT/c2/checkpoint.json" "$B0_ROOT/c3/checkpoint.json" "$B0_ROOT/c4/checkpoint.json" "$B0_ROOT/c5/checkpoint.json" "$B0_ROOT/c6/checkpoint.json" "$B0_ROOT/c8/checkpoint.json" "$B0_ROOT/c9/manifest.json" "$B0_ROOT/c9/manifest.sha256" "$B0_ROOT/c9/checkpoint.json" "$B0_ROOT/c9/final-pointer.json" "$B0_ROOT/c9/HANDOFF.md" "$B0_ROOT/c9/test-matrix.json" "$B0_ROOT/c9/B0_FINAL_DELIVERY_RESULT.json" "$B0_ROOT/c9/B0_FINAL_DELIVERY_REPORT.md" "$B0_ROOT/c9/recovery-audit.json" "$B0_ROOT/c9/redaction-scan.json"; do test -f "$path"; done
          git diff --check -- "$B0_ROOT"

      - name: Push evidence and pointer commits by ordinary fast-forward
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          before="$(git rev-parse origin/$B0_BRANCH)"
          test "$before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$B0_ROOT"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -Ev '^docs/auto-execute/evidence/b0/' || true)"
          git commit -m "docs(b0): record portable cross-platform evidence"
          evidence_sha="$(git rev-parse HEAD)"
          python3 - "$evidence_sha" <<'PY'
          import json, pathlib, sys
          for name in ("final-pointer.json", "B0_FINAL_DELIVERY_RESULT.json"):
              path = pathlib.Path("docs/auto-execute/evidence/b0/c9") / name
              payload = json.loads(path.read_text(encoding="utf-8"))
              payload["evidenceCommitSha"] = sys.argv[1]
              path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          git add "$B0_ROOT/c9/final-pointer.json" "$B0_ROOT/c9/B0_FINAL_DELIVERY_RESULT.json"
          git diff --cached --check
          git commit -m "docs(b0): seal portable evidence pointers"
          final_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$B0_BRANCH"
          after="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
          test "$after" = "$final_sha"
          echo "evidence_sha=$evidence_sha" >> "$GITHUB_OUTPUT"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          cat > .artifacts/b0-finalizer-v7/push-readback.json <<EOF
          {"localHead":"$final_sha","remoteTipBeforePush":"$before","evidenceCommitSha":"$evidence_sha","remoteTipAfterPush":"$after"}
          EOF

      - name: Linux fresh-clone readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.generate.outputs.tested_sha }}
          EVIDENCE_SHA: ${{ steps.push.outputs.evidence_sha }}
          FINAL_SHA: ${{ steps.push.outputs.final_sha }}
        run: |
          set -euo pipefail
          clone="$RUNNER_TEMP/b0-final-fresh"
          git clone --no-tags --single-branch --branch "$B0_BRANCH" "https://github.com/$GITHUB_REPOSITORY.git" "$clone"
          cd "$clone"
          live="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
          test "$live" = "$FINAL_SHA"
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git rev-parse HEAD^)" = "$EVIDENCE_SHA"
          git merge-base --is-ancestor "$TESTED_SHA" "$EVIDENCE_SHA"
          git diff --name-only "$TESTED_SHA..$FINAL_SHA" > "$RUNNER_TEMP/tested-to-final.txt"
          test -z "$(grep -Ev '^docs/auto-execute/evidence/b0/' "$RUNNER_TEMP/tested-to-final.txt" || true)"
          python3 - "$TESTED_SHA" "$EVIDENCE_SHA" "$FINAL_SHA" "$live" "$RUNNER_TEMP" <<'PY'
          import hashlib, json, pathlib, sys
          tested, evidence, final, live, temp_value = sys.argv[1:]
          root = pathlib.Path("docs/auto-execute/evidence/b0"); c9 = root / "c9"; errors = []
          required = [root / "c0/baseline-test-matrix.json", root / "c1/contract-gate-notes.md", root / "c2/checkpoint.json", root / "c3/checkpoint.json", root / "c4/checkpoint.json", root / "c5/checkpoint.json", root / "c6/checkpoint.json", root / "c8/checkpoint.json", c9 / "manifest.json", c9 / "manifest.sha256", c9 / "checkpoint.json", c9 / "final-pointer.json", c9 / "HANDOFF.md", c9 / "test-matrix.json", c9 / "B0_FINAL_DELIVERY_RESULT.json", c9 / "B0_FINAL_DELIVERY_REPORT.md", c9 / "recovery-audit.json", c9 / "redaction-scan.json"]
          for path in required:
              if not path.is_file(): errors.append("missing:" + str(path))
          for path in root.rglob("*.json"):
              try: json.loads(path.read_text(encoding="utf-8"))
              except Exception as error: errors.append(f"json:{path}:{error!r}")
          manifest_path = c9 / "manifest.json"; manifest = json.loads(manifest_path.read_text()); total = 0
          for row in manifest.get("artifacts", []):
              path = root / row["path"]
              if not path.is_file(): errors.append("manifest-missing:" + row["path"]); continue
              raw = path.read_bytes(); total += len(raw)
              if len(raw) != row["bytes"]: errors.append("bytes:" + row["path"])
              if hashlib.sha256(raw).hexdigest() != row["sha256"]: errors.append("sha:" + row["path"])
          if total != manifest.get("totalBytes"): errors.append("totalBytes")
          if len(manifest.get("artifacts", [])) != manifest.get("artifactCount"): errors.append("artifactCount")
          expected = (c9 / "manifest.sha256").read_text().split()[0]; actual = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          if actual != expected: errors.append("manifest-self-hash")
          pointer = json.loads((c9 / "final-pointer.json").read_text()); result = json.loads((c9 / "B0_FINAL_DELIVERY_RESULT.json").read_text()); scan = json.loads((c9 / "redaction-scan.json").read_text())
          if pointer.get("evidenceCommitSha") != evidence or result.get("evidenceCommitSha") != evidence: errors.append("evidence-pointer")
          if pointer.get("testedCodeSha") != tested or result.get("testedCodeSha") != tested: errors.append("tested-pointer")
          if scan.get("status") != "PASS" or scan.get("findingCount") != 0: errors.append("redaction")
          if errors: raise SystemExit(str(errors))
          proof = {"schemaVersion": 3, "status": "PASS", "deliveryStatus": result.get("status"), "classification": result.get("classification"), "testableCandidateSha": result.get("testableCandidateSha"), "testedCodeSha": tested, "evidenceCommitSha": evidence, "finalRemoteSha": final, "liveTip": live, "liveTipMatchesFinalRemoteSha": True, "testedToFinalOnlyEvidenceDocs": True, "manifestArtifactCount": manifest.get("artifactCount"), "manifestTotalBytes": manifest.get("totalBytes"), "manifestSha256": actual, "redactionStatus": scan.get("status"), "candidateBranchReady": result.get("candidateBranchReady"), "completionMarkersAllowed": result.get("completionMarkersAllowed")}
          pathlib.Path(temp_value, "fresh-clone-readback.json").write_text(json.dumps(proof, indent=2) + "\n")
          PY
          cp "$RUNNER_TEMP/fresh-clone-readback.json" "$GITHUB_WORKSPACE/.artifacts/b0-finalizer-v7/fresh-clone-readback.json"
          cp "$RUNNER_TEMP/tested-to-final.txt" "$GITHUB_WORKSPACE/.artifacts/b0-finalizer-v7/tested-to-final.txt"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" -f state=success -f context='b0/finalizer-v7-readback' -f description="Linux fresh-clone verification passed in $GITHUB_RUN_ID" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Upload finalizer proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0-guaranteed-finalizer-v7-${{ github.sha }}
          path: .artifacts/b0-finalizer-v7
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          DELIVERY_STATUS: ${{ steps.generate.outputs.delivery_status }}
          CLASSIFICATION: ${{ steps.generate.outputs.classification }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:success?"success":"failure",context:"b0/finalizer-v7",description:success?`${process.env.DELIVERY_STATUS}: ${process.env.CLASSIFICATION}`.slice(0,140):`finalizer failed in ${context.runId}`,target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            if (!success) core.setFailed("B0 fail-closed finalizer failed");

  cross-platform-readback:
    needs: finalize
    if: needs.finalize.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            context: b0/evidence-readback-linux
          - os: windows-2025
            label: Windows
            context: b0/evidence-readback-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.finalize.outputs.final_sha }}
          fetch-depth: 2
      - name: Verify ordinary-worktree manifest bytes
        shell: pwsh
        env:
          TESTED_SHA: ${{ needs.finalize.outputs.tested_sha }}
          EVIDENCE_SHA: ${{ needs.finalize.outputs.evidence_sha }}
          FINAL_SHA: ${{ needs.finalize.outputs.final_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:FINAL_SHA) { throw "wrong final SHA" }
          @'
          import hashlib, json, os, pathlib
          root = pathlib.Path("docs/auto-execute/evidence/b0"); c9 = root / "c9"; errors = []
          manifest_path = c9 / "manifest.json"; manifest = json.loads(manifest_path.read_text(encoding="utf-8")); total = 0
          for row in manifest.get("artifacts", []):
              path = root / row["path"]
              if not path.is_file(): errors.append("missing:" + row["path"]); continue
              raw = path.read_bytes(); total += len(raw)
              if len(raw) != row["bytes"]: errors.append("bytes:" + row["path"])
              if hashlib.sha256(raw).hexdigest() != row["sha256"]: errors.append("sha:" + row["path"])
          if total != manifest.get("totalBytes"): errors.append("totalBytes")
          expected = (c9 / "manifest.sha256").read_text(encoding="utf-8").split()[0]
          actual = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          if actual != expected: errors.append("manifest-self-hash")
          for required in ("c0/baseline-test-matrix.json", "c1/contract-gate-notes.md", "c2/checkpoint.json", "c3/checkpoint.json", "c4/checkpoint.json", "c5/checkpoint.json", "c6/checkpoint.json", "c8/checkpoint.json"):
              if not (root / required).is_file(): errors.append("historical-missing:" + required)
          result = {"schemaVersion": 3, "os": os.environ.get("RUNNER_OS"), "testedCodeSha": os.environ["TESTED_SHA"], "evidenceCommitSha": os.environ["EVIDENCE_SHA"], "finalRemoteSha": os.environ["FINAL_SHA"], "artifactCount": manifest.get("artifactCount"), "totalBytes": total, "manifestSha256": actual, "errors": errors, "status": "PASS" if not errors else "FAIL"}
          pathlib.Path("b0-cross-platform-readback.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          if errors: raise SystemExit(str(errors))
          '@ | python -
      - name: Upload cross-platform proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0-evidence-readback-${{ matrix.label }}-${{ needs.finalize.outputs.final_sha }}
          path: b0-cross-platform-readback.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish cross-platform status
        if: always()
        uses: actions/github-script@v7
        env:
          FINAL_SHA: ${{ needs.finalize.outputs.final_sha }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:process.env.FINAL_SHA,state:success?"success":"failure",context:"${{ matrix.context }}",description:success?`${{ matrix.label }} ordinary-worktree hashes passed in ${context.runId}`:`${{ matrix.label }} ordinary-worktree hashes failed in ${context.runId}`,target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            if (!success) core.setFailed("${{ matrix.label }} cross-platform evidence verification failed");
