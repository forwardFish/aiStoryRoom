name: B0 Guaranteed Fail-Closed Evidence Finalizer V7

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-fail-closed-finalizer-v7.yml

permissions:
  actions: read
  contents: write
  statuses: write

concurrency:
  group: b0-guaranteed-finalizer-v7-${{ github.ref }}
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_MAIN_BASELINE: 86da64eea18ab773312f40c7024ace9cb393344a
  B0_V2_SHA: bb48f72d4b65a17e311ec32dffa6c5c4a2959430
  B0_ROOT: docs/auto-execute/evidence/b0

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Publish locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/finalizer-v7",
              description: `guaranteed fail-closed finalizer v7 running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Anchor exact remote state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/b0-finalizer-v7
          git fetch origin "$B0_BRANCH" main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git cat-file -e "$B0_MAIN_BASELINE^{commit}"
          git merge-base --is-ancestor "$B0_MAIN_BASELINE" HEAD
          test -z "$(git status --short)"
          printf '%s\n' "$GITHUB_SHA" > .artifacts/b0-finalizer-v7/local-head.txt
          printf '%s\n' "$(git rev-parse origin/$B0_BRANCH)" > .artifacts/b0-finalizer-v7/remote-tip-before-push.txt
          printf '%s\n' "$(git rev-parse origin/main)" > .artifacts/b0-finalizer-v7/remote-main-at-finalization.txt

      - name: Observe exact, contract, and engineering statuses
        id: observe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, time
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          root = pathlib.Path(".artifacts/b0-finalizer-v7")
          wanted = {
              "exact": "b0/exact-push",
              "contract": "b0/acceptance-contract",
              "engineering": "b0/engineering-real-acceptance",
          }
          deadline = time.time() + 150 * 60
          records = {}
          while time.time() < deadline:
              rows = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/commits/{sha}/statuses?per_page=100"], text=True))
              latest = {}
              for row in rows:
                  context = row.get("context")
                  if context not in latest:
                      latest[context] = row
              records = {}
              complete = True
              for key, context in wanted.items():
                  row = latest.get(context) or {}
                  target = str(row.get("target_url") or "")
                  match = re.search(r"/actions/runs/(\d+)", target)
                  records[key] = {
                      "context": context,
                      "state": row.get("state"),
                      "description": row.get("description"),
                      "targetUrl": target or None,
                      "runId": int(match.group(1)) if match else None,
                      "createdAt": row.get("created_at"),
                      "updatedAt": row.get("updated_at"),
                  }
                  complete = complete and row.get("state") in {"success", "failure", "error"}
              (root / "status-poll.json").write_text(json.dumps({"testedCodeSha": sha, "records": records}, indent=2) + "\n")
              if complete:
                  break
              time.sleep(20)
          if not records:
              records = {key: {"context": context, "state": None, "runId": None} for key, context in wanted.items()}
          (root / "status-summary.json").write_text(json.dumps({"testedCodeSha": sha, "records": records}, indent=2) + "\n")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
              for key, row in records.items():
                  handle.write(f"{key}_state={row.get('state') or ''}\n")
                  handle.write(f"{key}_run_id={row.get('runId') or ''}\n")
          print(json.dumps(records, indent=2))
          PY

      - name: Fetch jobs and selected runtime artifacts without failing on absence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_RUN_ID: ${{ steps.observe.outputs.exact_run_id }}
          ACCEPTANCE_RUN_ID: ${{ steps.observe.outputs.engineering_run_id }}
        run: |
          set -euo pipefail
          root=.artifacts/b0-finalizer-v7
          mkdir -p "$root/gates" "$root/downloads" "$root/extracted" "$root/recovery-v2"
          for run_id in "$EXACT_RUN_ID" "$ACCEPTANCE_RUN_ID"; do
            test -n "$run_id" || continue
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$root/gates/run-$run_id.json" || true
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$root/gates/run-$run_id-jobs.json" || true
            gh run view "$run_id" --log > "$root/gates/run-$run_id.log" 2>&1 || true
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$root/downloads/run-$run_id-artifacts.json" || true
          done
          gh api "repos/$GITHUB_REPOSITORY/commits/$B0_V2_SHA" > "$root/recovery-v2/commit.json" || true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$B0_V2_SHA&per_page=100" > "$root/recovery-v2/runs-index.json" || true
          python3 - <<'PY'
          import json, pathlib, subprocess, zipfile, os
          root = pathlib.Path(".artifacts/b0-finalizer-v7")
          repo = os.environ["GITHUB_REPOSITORY"]
          prefixes = ("b0-engineering-real-acceptance-", "b0-formal-c8-credential-blocker-", "b0-formal-c8-real-acceptance-")
          selected = []
          for index in root.glob("downloads/run-*-artifacts.json"):
              try: payload = json.loads(index.read_text())
              except Exception: continue
              for row in payload.get("artifacts", []):
                  name = str(row.get("name", ""))
                  if name.startswith(prefixes):
                      selected.append({"id": row.get("id"), "name": name, "sizeBytes": row.get("size_in_bytes"), "digest": row.get("digest")})
          (root / "downloads/selected-artifacts.json").write_text(json.dumps({"artifacts": selected}, indent=2) + "\n")
          for row in selected:
              try:
                  archive = root / "downloads" / f"{row['name']}.zip"
                  with archive.open("wb") as stream:
                      subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts/{row['id']}/zip"], stdout=stream, check=True)
                  target = root / "extracted" / row["name"]
                  target.mkdir(parents=True, exist_ok=True)
                  with zipfile.ZipFile(archive) as bundle: bundle.extractall(target)
              except Exception as error:
                  (root / "downloads" / f"{row['name']}.error.txt").write_text(repr(error) + "\n")
          try: v2 = json.loads((root / "recovery-v2/runs-index.json").read_text())
          except Exception: v2 = {"workflow_runs": []}
          chosen = [row for row in v2.get("workflow_runs", []) if "finalizer" in str(row.get("name", "")).lower() or "finalizer" in str(row.get("path", "")).lower()]
          (root / "recovery-v2/selected-runs.json").write_text(json.dumps({"runs": chosen}, indent=2) + "\n")
          for row in chosen:
              rid = row.get("id")
              subprocess.run(["gh", "api", f"repos/{repo}/actions/runs/{rid}/jobs?per_page=100"], stdout=(root / f"recovery-v2/run-{rid}-jobs.json").open("wb"), check=False)
              subprocess.run(["gh", "run", "view", str(rid), "--log"], stdout=(root / f"recovery-v2/run-{rid}.log").open("wb"), stderr=subprocess.STDOUT, check=False)
          PY

      - name: Materialize required C8 C9 evidence regardless of PASS or blocker
        id: generate
        shell: bash
        env:
          EXACT_STATE: ${{ steps.observe.outputs.exact_state }}
          CONTRACT_STATE: ${{ steps.observe.outputs.contract_state }}
          ENGINEERING_STATE: ${{ steps.observe.outputs.engineering_state }}
          EXACT_RUN_ID: ${{ steps.observe.outputs.exact_run_id }}
          ACCEPTANCE_RUN_ID: ${{ steps.observe.outputs.engineering_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, re, shutil
          from datetime import datetime, timezone
          repo = pathlib.Path.cwd(); stage = repo / ".artifacts/b0-finalizer-v7"; root = repo / os.environ["B0_ROOT"]; c8 = root / "c8"; c9 = root / "c9"
          if root.exists(): shutil.rmtree(root)
          for path in (c8, c9 / "gates", c9 / "runtime/engineering", c9 / "runtime/formal", c9 / "recovery/finalizer-v2", c9 / "readback"): path.mkdir(parents=True, exist_ok=True)
          def read_json(path):
              try: return json.loads(path.read_text(encoding="utf-8"))
              except Exception: return None
