name: B0 Stage 4 Managed Credential Readiness

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-stage4-managed-credential-readiness.yml

permissions:
  contents: write
  statuses: write
  actions: read

concurrency:
  group: b0-stage4-managed-credential-readiness
  cancel-in-progress: false

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "ourmanyworlds.com / test"
          - "stellar-encouragement / test"
          - "Preview"
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record names only
        shell: bash
        env:
          B0_ENVIRONMENT_NAME: ${{ matrix.environment }}
          B0_SECRET_CONTEXT_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b0-credential-audit
          B0_OUTPUT="/tmp/b0-credential-audit/${{ strategy.job-index }}.json" node <<'NODE'
          const fs = require('node:fs');
          const all = JSON.parse(process.env.B0_SECRET_CONTEXT_JSON || '{}');
          const names = Object.keys(all).filter((name) =>
            /(?:SUPABASE|DATABASE|POSTGRES|DEEPSEEK|OPENOVEL|LLM|AI_API)/i.test(name)
          ).sort();
          const databaseCandidates = [
            'SUPABASE_DATABASE_URL', 'SUPABASE_TEST_DATABASE_URL', 'TEST_DATABASE_URL',
            'DATABASE_URL', 'POSTGRES_URL', 'POSTGRES_PRISMA_URL', 'POSTGRES_URL_NON_POOLING'
          ];
          const providerCandidates = [
            'DEEPSEEK_API_KEY', 'OPENOVEL_DEEPSEEK_API_KEY', 'OPENOVEL_API_KEY', 'LLM_API_KEY', 'AI_API_KEY'
          ];
          const databaseSecretName = databaseCandidates.find((name) => names.includes(name)) || null;
          const providerSecretName = providerCandidates.find((name) => names.includes(name)) || null;
          fs.writeFileSync(process.env.B0_OUTPUT, JSON.stringify({
            schemaVersion: 1,
            environment: process.env.B0_ENVIRONMENT_NAME,
            matchingSecretNames: names,
            databaseSecretName,
            providerSecretName,
            pairAvailable: Boolean(databaseSecretName && providerSecretName),
            secretValuesReadByAuditCode: false,
            secretValuesPersisted: false,
            secretValuesPrinted: false
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: b0-credential-readiness-${{ strategy.job-index }}
          path: /tmp/b0-credential-audit/*.json
          if-no-files-found: error
          retention-days: 3

  aggregate:
    if: always()
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publish stage locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo,
              sha: context.sha, state: "pending", context: "b0/stage4-credential-readiness",
              description: `credential readiness audit running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          pattern: b0-credential-readiness-*
          path: /tmp/b0-credential-readiness
          merge-multiple: true
      - name: Aggregate sanitized readiness and bind available environment
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/auto-execute/evidence/b0/c8 docs/auto-execute/evidence/b0/c9/readiness
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          rows=[]
          for path in sorted(Path('/tmp/b0-credential-readiness').glob('*.json')):
              rows.append(json.loads(path.read_text(encoding='utf-8')))
          preference=['ourmanyworlds.com / test','stellar-encouragement / test','Preview']
          rows.sort(key=lambda row: preference.index(row['environment']) if row['environment'] in preference else 99)
          selected=next((row for row in rows if row.get('pairAvailable')), None)
          payload={
            'schemaVersion':1,
            'status':'READY' if selected else 'BLOCKED_MISSING_NONPRODUCTION_CREDENTIAL_PAIR',
            'auditedAt':datetime.now(timezone.utc).isoformat(),
            'workflowRunId':os.environ['GITHUB_RUN_ID'],
            'testedCommitSha':os.environ['GITHUB_SHA'],
            'environments':rows,
            'selectedEnvironment': selected['environment'] if selected else None,
            'selectedDatabaseSecretName': selected['databaseSecretName'] if selected else None,
            'selectedProviderSecretName': selected['providerSecretName'] if selected else None,
            'secretValuesReadByAuditCode':False,
            'secretValuesPersisted':False,
            'secretValuesPrinted':False,
            'productionEnvironmentAudited':False,
            'productionPublicSchemaAccessed':False,
          }
          out=Path('docs/auto-execute/evidence/b0/c8/credential-readiness.json')
          out.write_text(json.dumps(payload,indent=2)+'\n',encoding='utf-8')
          Path('docs/auto-execute/evidence/b0/c9/readiness/credential-readiness.json').write_text(
              json.dumps(payload,indent=2)+'\n',encoding='utf-8')
          with Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as handle:
              handle.write(f"ready={'true' if selected else 'false'}\n")
              handle.write(f"environment={selected['environment'] if selected else ''}\n")
              handle.write(f"database_secret_name={selected['databaseSecretName'] if selected else ''}\n")
              handle.write(f"provider_secret_name={selected['providerSecretName'] if selected else ''}\n")
          PY

          if [ "${{ steps.aggregate.outputs.ready }}" = true ]; then :; fi
      - name: Configure formal workflow for selected non-production environment
        if: steps.aggregate.outputs.ready == 'true'
        shell: bash
        env:
          SELECTED_ENVIRONMENT: ${{ steps.aggregate.outputs.environment }}
          DATABASE_SECRET_NAME: ${{ steps.aggregate.outputs.database_secret_name }}
          PROVIDER_SECRET_NAME: ${{ steps.aggregate.outputs.provider_secret_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path=Path('.github/workflows/b0-candidate-real-acceptance.yml')
          source=path.read_text(encoding='utf-8')
          selected=os.environ['SELECTED_ENVIRONMENT']
          source, count1=re.subn(r'environment: "(?:ourmanyworlds\.com / test|stellar-encouragement / test|Preview)"',
                                 f'environment: "{selected}"', source, count=1)
          source, count2=re.subn(r'B0_ACCEPTANCE_ENVIRONMENT: "(?:ourmanyworlds\.com / test|stellar-encouragement / test|Preview)"',
                                 f'B0_ACCEPTANCE_ENVIRONMENT: "{selected}"', source, count=1)
          if count1 != 1 or count2 != 1:
              raise SystemExit('formal workflow environment anchors are missing')
          path.write_text(source,encoding='utf-8')
          trigger=Path('docs/auto-execute/B0_FORMAL_C8_TRIGGER.md')
          trigger.write_text(
              '# B0 Formal C8 Trigger\n\n'
              f'- sourceSha: `{os.environ["GITHUB_SHA"]}`\n'
              f'- environment: `{selected}`\n'
              f'- databaseSecretName: `{os.environ["DATABASE_SECRET_NAME"]}`\n'
              f'- providerSecretName: `{os.environ["PROVIDER_SECRET_NAME"]}`\n'
              '- secretValuesPersisted: `false`\n'
              '- productionPublicSchemaAccess: `forbidden`\n',
              encoding='utf-8')
          PY
          git diff --check
      - name: Commit readiness result as ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/auto-execute/evidence/b0/c8/credential-readiness.json \
            docs/auto-execute/evidence/b0/c9/readiness/credential-readiness.json
          if [ "${{ steps.aggregate.outputs.ready }}" = true ]; then
            git add .github/workflows/b0-candidate-real-acceptance.yml docs/auto-execute/B0_FORMAL_C8_TRIGGER.md
          fi
          git rm .github/workflows/b0-stage4-managed-credential-readiness.yml
          git diff --cached --check
          if [ "${{ steps.aggregate.outputs.ready }}" = true ]; then
            git commit -m "ci(b0): bind formal C8 to non-production credentials"
          else
            git commit -m "test(b0): record managed credential blocker"
          fi
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Publish stage outcome
        if: always()
        uses: actions/github-script@v7
        env:
          READY: ${{ steps.aggregate.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const completed = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo,
              sha: context.sha, state: completed ? "success" : "failure", context: "b0/stage4-credential-readiness",
              description: completed ? `credential audit completed; ready=${process.env.READY}` : `credential audit failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            if (!completed) core.setFailed('Managed credential readiness audit failed');
