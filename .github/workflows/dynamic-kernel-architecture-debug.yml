name: Dynamic Kernel Architecture Debug

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-architecture-debug.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish debug status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/architecture-debug" \
            -f description="Structural field diagnostics running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply complete follow-up candidate
        shell: bash
        run: |
          set -euo pipefail
          tr -d '[:space:]' \
            < .github/repair/dynamic-kernel-followup.patch.gz.b64 \
            > "${RUNNER_TEMP}/followup.patch.gz.b64"
          base64 --decode "${RUNNER_TEMP}/followup.patch.gz.b64" \
            | gzip --decompress \
            > "${RUNNER_TEMP}/followup.patch"
          git apply --check "${RUNNER_TEMP}/followup.patch"
          git apply "${RUNNER_TEMP}/followup.patch"
      - run: pnpm --filter @ai-story/templates build
      - run: pnpm db:generate
      - name: Debug committed responsibility next-plan trace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/openovel-runtime/tests/openovel-first.spec.ts')
          s=p.read_text()
          needle='''    const jointSignaturePrepared = await sangtianDecisionAdapter.prepare(workspace, {'''
          insert='''    const debugJointSignaturePrepared = await prepareSangtianDecision(workspace, {\n      runId,\n      turnNumber: 3,\n      action: jointSignature.label,\n      selectedOption: jointSignature,\n    });\n    console.error("DEBUG_RESPONSIBILITY_NEXT_PLAN", JSON.stringify({\n      nextDecisionPoint: debugJointSignaturePrepared?.settlement.event.nextDecisionPoint,\n      nextKernelSelection: debugJointSignaturePrepared?.settlement.event.nextKernelSelection,\n      proposedState: debugJointSignaturePrepared?.settlement.proposedState,\n    }, null, 2));\n    const jointSignaturePrepared = await sangtianDecisionAdapter.prepare(workspace, {'''
          if needle not in s: raise SystemExit('OPENOVEL_DEBUG_TARGET_MISSING')
          p.write_text(s.replace(needle, insert, 1))
          PY
          cd apps/openovel-runtime
          node --import tsx --test --test-name-pattern="authored decision state machine keeps curated choices" tests/openovel-first.spec.ts
        continue-on-error: true
      - name: Debug Settlement projection field budget
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/solo-story-engine/context-compiler.ts')
          s=p.read_text()
          needle='''    if (item.mustPreserve) {\n      dropped.push({ itemId: item.itemId, reason: "P0_BUDGET_EXHAUSTED" });'''
          insert='''    if (item.mustPreserve) {\n      console.error("DEBUG_P0_BUDGET", JSON.stringify({\n        maxTokenEstimate: input.maxTokenEstimate,\n        usedBeforeFailure: used,\n        failingItem: { itemId: item.itemId, section: item.section, tokenEstimate: item.tokenEstimate },\n        settlementFieldTokens: item.section === "PART_ONE_SETTLEMENT"\n          ? Object.entries(item.content as Record<string, unknown>).map(([key, value]) => ({\n            key,\n            tokenEstimate: estimateJsonTokens(value),\n          })).sort((left, right) => right.tokenEstimate - left.tokenEstimate)\n          : [],\n      }, null, 2));\n      dropped.push({ itemId: item.itemId, reason: "P0_BUDGET_EXHAUSTED" });'''
          if needle not in s: raise SystemExit('CONTEXT_DEBUG_TARGET_MISSING')
          p.write_text(s.replace(needle, insert, 1))
          PY
          cd apps/api
          node --import tsx --test --test-name-pattern="Narrator receives settled story facts" src/solo-story-engine/__tests__/part-one-runtime-integration.spec.ts
        continue-on-error: true
      - name: Publish debug completion
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="dynamic-kernel-lite/architecture-debug" \
            -f description="Structural field diagnostics completed" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
