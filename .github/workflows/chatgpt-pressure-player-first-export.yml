name: Export source for pressure player-first implementation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact source
        run: |
          set -euo pipefail
          tar --zstd -cf /tmp/aiStoryRoom-source.tar.zst \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='*/node_modules' \
            .
          git rev-parse HEAD > /tmp/source-head.txt
          git rev-parse HEAD^{tree} > /tmp/source-tree.txt
      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: aiStoryRoom-main-source
          path: |
            /tmp/aiStoryRoom-source.tar.zst
            /tmp/source-head.txt
            /tmp/source-tree.txt
          if-no-files-found: error
          retention-days: 1
