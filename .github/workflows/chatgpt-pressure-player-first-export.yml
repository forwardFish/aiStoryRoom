name: Export source for pressure player-first implementation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact backend source
        run: |
          set -euo pipefail
          tar --zstd -cf /tmp/aiStoryRoom-backend-source.tar.zst \
            AGENTS.md \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.base.json \
            apps/api \
            apps/openovel-runtime \
            packages/shared \
            packages/templates \
            prisma \
            scripts \
            .github/workflows
          git rev-parse HEAD > /tmp/source-head.txt
          git rev-parse HEAD^{tree} > /tmp/source-tree.txt
      - name: Upload exact backend source archive
        uses: actions/upload-artifact@v4
        with:
          name: aiStoryRoom-main-backend-source
          path: |
            /tmp/aiStoryRoom-backend-source.tar.zst
            /tmp/source-head.txt
            /tmp/source-tree.txt
          if-no-files-found: error
          retention-days: 1
