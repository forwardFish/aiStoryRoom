name: Export source for pressure player-first implementation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact workspace dependencies
        run: |
          set -euo pipefail
          CI=true pnpm install --frozen-lockfile
          pnpm db:generate
      - name: Archive dependency tree
        run: |
          set -euo pipefail
          tar --zstd -cf /tmp/aiStoryRoom-node-modules.tar.zst \
            node_modules \
            apps/api/node_modules \
            apps/openovel-runtime/node_modules \
            packages/shared/node_modules \
            packages/templates/node_modules
          git rev-parse HEAD > /tmp/deps-head.txt
      - name: Upload dependency archive
        uses: actions/upload-artifact@v4
        with:
          name: aiStoryRoom-main-dependencies
          path: |
            /tmp/aiStoryRoom-node-modules.tar.zst
            /tmp/deps-head.txt
          if-no-files-found: error
          retention-days: 1
