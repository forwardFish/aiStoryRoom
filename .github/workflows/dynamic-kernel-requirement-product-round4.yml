name: Dynamic Kernel Requirement Dependency Product Round 4

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-requirement-product-round4.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EVIDENCE_ROOT: /tmp/dynamic-kernel-requirement-product-round4
      SOURCE_COMMIT: 40908fd7583ea4006f328903d4b65c660670ad38
      BASE_PRODUCT_SHA: 321a9aa03ce33201a59da63350e385b885023d77
      BRANCH_NAME: codex/chatgpt-pro-dynamic-kernel-lite
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/requirement-dependency-product-r4" \
            -f description="Testing tracked Requirement dependency product round 4" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify clean product tree and install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          test "$(git branch --show-current)" = "${BRANCH_NAME}"
          git diff --quiet "${BASE_PRODUCT_SHA}..${GITHUB_SHA}^^"
          pnpm install --frozen-lockfile 2>&1 | tee "${EVIDENCE_ROOT}/logs/00-install.log"

      - name: Materialize tracked product implementation
        shell: bash
        run: |
          set -euo pipefail
          git show "${SOURCE_COMMIT}:.github/repair/dynamic-kernel-requirement-dependency.py.gz.b64" \
            | tr -d '[:space:]' | base64 --decode | gzip --decompress \
            > "${RUNNER_TEMP}/dependency-base.py"
          test "$(sha256sum "${RUNNER_TEMP}/dependency-base.py" | cut -d' ' -f1)" = \
            "a1bc1185636751d4aa4056a1a3dc45d0ffd46085b56cd4f82e5a98378c8eb884"

          for script in \
            dynamic-kernel-requirement-dependency-round1-format.py \
            dynamic-kernel-dependency-runtime-semantics.py \
            dynamic-kernel-dependency-predecessor-kernels.py \
            dynamic-kernel-authored-transition-surface.py \
            dynamic-kernel-context-projection.py \
            dynamic-kernel-context-budget.py
          do
            git show "${SOURCE_COMMIT}:.github/repair/${script}" > "${RUNNER_TEMP}/${script}"
          done

          tr -d '[:space:]' < .github/repair/dynamic-kernel-requirement-product-r4.py.gz.b64 \
            | base64 --decode | gzip --decompress > "${RUNNER_TEMP}/round4.py"
          test "$(sha256sum "${RUNNER_TEMP}/round4.py" | cut -d' ' -f1)" = \
            "470f82bec39174ff04320e05270b4cdc4358d515b61478153f5e06cc6b1db340"

          python "${RUNNER_TEMP}/dependency-base.py" 2>&1 | tee "${EVIDENCE_ROOT}/logs/01-apply-base.log"
          python "${RUNNER_TEMP}/dynamic-kernel-requirement-dependency-round1-format.py"
          python "${RUNNER_TEMP}/dynamic-kernel-dependency-runtime-semantics.py"
          python "${RUNNER_TEMP}/dynamic-kernel-dependency-predecessor-kernels.py"
          python "${RUNNER_TEMP}/dynamic-kernel-authored-transition-surface.py"
          python "${RUNNER_TEMP}/dynamic-kernel-context-projection.py"
          python "${RUNNER_TEMP}/dynamic-kernel-context-budget.py"
          python "${RUNNER_TEMP}/round4.py" 2>&1 | tee "${EVIDENCE_ROOT}/logs/02-apply-round4.log"

          SANGTIAN_SKIP_SOURCE_WRITES=1 \
          SANGTIAN_AUTHORING_OUTPUT_ROOT="${RUNNER_TEMP}/sangtian-authoring-output" \
          SANGTIAN_RUNTIME_PACKAGE_PATH="${GITHUB_WORKSPACE}/packages/templates/config/sangtian/story-package/part-one-runtime.json" \
            node scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            2>&1 | tee "${EVIDENCE_ROOT}/logs/03-compile-package.log"

          git diff --check
          git diff --name-status | tee "${EVIDENCE_ROOT}/logs/04-product-name-status.log"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/solo-story-engine/context-compiler.ts \
            apps/api/src/solo-story-engine/output-validator.ts \
            apps/api/src/solo-story-engine/types.ts \
            packages/templates/authoring/sangtian/requirements/part-01.requirements.json \
            packages/templates/config/sangtian/story-package/part-one-runtime.json \
            packages/templates/package.json \
            packages/templates/src/runtime-contract/kernel-selector-lite.ts \
            packages/templates/src/story-package/dynamic-kernel-lite-runtime.ts \
            packages/templates/src/story-package/index.ts \
            packages/templates/src/story-package/part-one-runtime-engine.ts \
            packages/templates/src/story-package/part-one-runtime-loader.ts \
            packages/templates/src/story-package/part-one-runtime-types.ts \
            packages/templates/src/story-package/requirement-dependency.ts \
            packages/templates/tests/part-one-dynamic-kernel-lite.test.ts \
            packages/templates/tests/requirement-dependency.test.ts \
            scripts/story-decomposition/build-sangtian-part-one-authoring.mjs \
            scripts/story-decomposition/compile-sangtian-part-one-authoring.mjs \
            scripts/story-decomposition/lib/requirement-dependency.mjs
          git rm -f \
            .github/repair/dynamic-kernel-requirement-product-r4.py.gz.b64 \
            .github/workflows/dynamic-kernel-requirement-product-round4.yml
          git diff --cached --check
          git commit -m "feat(kernel-lite): persist requirement dependency architecture"

          git rev-parse HEAD > "${EVIDENCE_ROOT}/tested-sha.txt"
          git rev-parse HEAD^{tree} > "${EVIDENCE_ROOT}/tested-tree.txt"
          git rev-parse "${BASE_PRODUCT_SHA}^{tree}" > "${EVIDENCE_ROOT}/base-tree.txt"
          test "$(cat "${EVIDENCE_ROOT}/tested-tree.txt")" != "$(cat "${EVIDENCE_ROOT}/base-tree.txt")"
          git diff --name-status "${BASE_PRODUCT_SHA}..HEAD" | tee "${EVIDENCE_ROOT}/changed-files.txt"
          grep -Eq '^(A|M)[[:space:]]+(packages/|apps/|scripts/story-decomposition/)' "${EVIDENCE_ROOT}/changed-files.txt"
          if git ls-tree -r --name-only HEAD | grep -Eq '^\.github/(repair/.*dynamic-kernel|workflows/dynamic-kernel-requirement-product)'; then
            echo "temporary dynamic-kernel scaffolding remained" >&2
            exit 1
          fi
          test -z "$(git status --short)"

      - name: Run exact-SHA deterministic gates
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          results="${EVIDENCE_ROOT}/results.tsv"
          : > "${results}"
          failed=0
          run_gate() {
            local label="$1"; shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${results}"
            if [ "${code}" -ne 0 ]; then failed=1; fi
          }
          run_gate 05-story-v4 pnpm test:story:v4
          run_gate 06-templates-typecheck pnpm --filter @ai-story/templates typecheck
          run_gate 07-templates-runtime-contract pnpm --filter @ai-story/templates test:runtime-contract
          run_gate 08-templates-story-package pnpm --filter @ai-story/templates test:story-package
          run_gate 09-templates-build pnpm --filter @ai-story/templates build
          run_gate 10-openovel-typecheck pnpm --filter @apps/openovel-runtime typecheck
          run_gate 11-openovel-test pnpm --filter @apps/openovel-runtime test
          run_gate 12-openovel-build pnpm --filter @apps/openovel-runtime build
          run_gate 13-prisma-generate pnpm db:generate
          run_gate 14-api-solo pnpm --filter @apps/api test:solo-story-engine
          run_gate 15-api-legacy-sangtian pnpm --filter @apps/api test:solo-story-engine:legacy-sangtian
          run_gate 16-branch-persistence pnpm test:story:branch-persistence
          run_gate 17-story-options pnpm test:story:options
          run_gate 18-story-convergence pnpm test:story:convergence
          if [ "${failed}" -eq 0 ]; then echo pass > "${EVIDENCE_ROOT}/status.txt"; else echo fail > "${EVIDENCE_ROOT}/status.txt"; fi

      - name: Summarize exact results
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path(os.environ['EVIDENCE_ROOT']); rows=[]
          pats={k:re.compile(v,re.M) for k,v in {
            'tests':r'^# tests (\d+)$','pass':r'^# pass (\d+)$','fail':r'^# fail (\d+)$',
            'skip':r'^# skipped (\d+)$','todo':r'^# todo (\d+)$'}.items()}
          if (root/'results.tsv').exists():
            for line in (root/'results.tsv').read_text().splitlines():
              label,code,log=line.split('\t',2); text=Path(log).read_text(errors='replace') if Path(log).exists() else ''
              row={'label':label,'exitCode':int(code),'logPath':log}
              for k,p in pats.items():
                vals=p.findall(text); row[k]=int(vals[-1]) if vals else None
              rows.append(row)
          summary={'inputSha':os.environ.get('GITHUB_SHA'),'baseProductSha':os.environ.get('BASE_PRODUCT_SHA'),
            'testedSha':(root/'tested-sha.txt').read_text().strip() if (root/'tested-sha.txt').exists() else None,
            'baseTree':(root/'base-tree.txt').read_text().strip() if (root/'base-tree.txt').exists() else None,
            'testedTree':(root/'tested-tree.txt').read_text().strip() if (root/'tested-tree.txt').exists() else None,
            'status':(root/'status.txt').read_text().strip() if (root/'status.txt').exists() else 'missing',
            'commands':rows,'supabaseFormal':'NOT_RUN','deepSeek':'NOT_RUN'}
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY

      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-requirement-product-r4-${{ github.sha }}
          path: /tmp/dynamic-kernel-requirement-product-round4/
          if-no-files-found: error
          retention-days: 14

      - name: Push exact tested product candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "${EVIDENCE_ROOT}/status.txt")" = pass
          test "$(git rev-parse HEAD)" = "$(cat "${EVIDENCE_ROOT}/tested-sha.txt")"
          git push origin HEAD:"${BRANCH_NAME}"
          git rev-parse HEAD > "${EVIDENCE_ROOT}/final-sha.txt"

      - name: Remove temporary scaffolding after failed gates
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/repair/dynamic-kernel-requirement-product-r4.py.gz.b64 .github/workflows/dynamic-kernel-requirement-product-round4.yml
          git commit -m "chore(kernel-lite): remove failed product round 4 scaffolding"
          git push origin HEAD:"${BRANCH_NAME}"

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure; description="Tracked Requirement dependency product round 4 failed"
          if [ -f "${EVIDENCE_ROOT}/final-sha.txt" ]; then state=success; description="Tracked Requirement dependency product round 4 passed and was pushed"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" -f context="dynamic-kernel-lite/requirement-dependency-product-r4" \
            -f description="${description}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
