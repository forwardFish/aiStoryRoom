name: Dynamic Kernel Round 3 Final Repair

# Final run: all narrator assertions consume the settled Prepared contract.
on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-round3-repair.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EVIDENCE_ROOT: /tmp/dynamic-kernel-round3
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/round3-final" \
            -f description="Final prepared-contract matrix running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply repair, run all gates and create tested commit
        shell: bash
        continue-on-error: true
        run: bash .github/repair/run-dynamic-kernel-round3.sh
      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-round3-${{ github.sha }}
          path: /tmp/dynamic-kernel-round3/
          if-no-files-found: error
          retention-days: 7
      - name: Push tested product commit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${EVIDENCE_ROOT}/final-sha.txt"
          git push origin HEAD:codex/chatgpt-pro-dynamic-kernel-lite
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          description="Final deterministic repair failed"
          if [ -f "${EVIDENCE_ROOT}/final-sha.txt" ]; then
            state=success
            description="Final deterministic repair passed and was pushed"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/round3-final" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
