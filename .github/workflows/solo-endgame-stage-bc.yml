name: Solo Endgame Stage B Exact Remote Verification

on:
  push:
    branches:
      - codex/chatgpt-pro-main-game-final-v1
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: solo-endgame-stage-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_ENV: test
      CANDIDATE_SHA: ${{ github.sha }}
      EVIDENCE_DIR: artifacts/solo-endgame-stage-b
    steps:
      - name: Check out exact remote SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Mark Stage B verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'solo-endgame-stage-b/clean-clone',
              description: 'Stage B exact-SHA verification is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Verify exact branch, remote SHA, and clean worktree
        id: git-proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/logs"
          local_sha="$(git rev-parse HEAD)"
          tracking_sha="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          ls_remote_raw="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}")"
          remote_sha="$(printf '%s\n' "$ls_remote_raw" | awk '{print $1}')"
          status_short="$(git status --short)"
          test "$local_sha" = "$GITHUB_SHA"
          test "$tracking_sha" = "$GITHUB_SHA"
          test "$remote_sha" = "$GITHUB_SHA"
          test -z "$status_short"
          {
            printf 'WORKDIR=%s\n' "$GITHUB_WORKSPACE"
            printf 'BRANCH=%s\n' "$GITHUB_REF_NAME"
            printf 'LOCAL_HEAD=%s\n' "$local_sha"
            printf 'TRACKING_HEAD=%s\n' "$tracking_sha"
            printf 'LS_REMOTE_RAW=%s\n' "$ls_remote_raw"
            printf 'STATUS_SHORT=%s\n' "$status_short"
          } | tee "$EVIDENCE_DIR/git-proof.txt"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen workspace
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE_DIR/logs/01-install.log"

      - name: Generate Prisma client without migration
        shell: bash
        run: |
          set -o pipefail
          pnpm db:generate 2>&1 | tee "$EVIDENCE_DIR/logs/02-db-generate.log"

      - name: Stage B focused concurrency, recovery, and integrity contracts
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/api exec node --import tsx --test \
            src/openovel-adapter/openovel-stage-b-concurrency.spec.ts \
            src/openovel-adapter/openovel-stage-b-recovery.spec.ts \
            src/openovel-adapter/openovel-stage-b-result-integrity.spec.ts \
            2>&1 | tee "$EVIDENCE_DIR/logs/03-stage-b-focused.tap"

      - name: OpenNovel Runtime typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime typecheck 2>&1 | tee "$EVIDENCE_DIR/logs/04-runtime-typecheck.log"

      - name: OpenNovel Runtime test
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime test 2>&1 | tee "$EVIDENCE_DIR/logs/05-runtime-test.log"

      - name: OpenNovel Runtime build
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/openovel-runtime build 2>&1 | tee "$EVIDENCE_DIR/logs/06-runtime-build.log"

      - name: API typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/api typecheck 2>&1 | tee "$EVIDENCE_DIR/logs/07-api-typecheck.log"

      - name: API test
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/api test 2>&1 | tee "$EVIDENCE_DIR/logs/08-api-test.log"

      - name: API build
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/api build 2>&1 | tee "$EVIDENCE_DIR/logs/09-api-build.log"

      - name: Web typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/web typecheck 2>&1 | tee "$EVIDENCE_DIR/logs/10-web-typecheck.log"

      - name: Web test
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/web test 2>&1 | tee "$EVIDENCE_DIR/logs/11-web-test.log"

      - name: Web build
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @apps/web build 2>&1 | tee "$EVIDENCE_DIR/logs/12-web-build.log"

      - name: Root typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee "$EVIDENCE_DIR/logs/13-root-typecheck.log"

      - name: Git diff check
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee "$EVIDENCE_DIR/logs/14-git-diff-check.log"

      - name: Record Stage B remote evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/manifest.json" <<JSON
          {
            "schemaVersion": "solo_endgame_stage_b_remote_evidence_v1",
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}",
            "commitSha": "${GITHUB_SHA}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "stage": "B",
            "stageCExecuted": false,
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Upload Stage B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solo-endgame-stage-b-${{ github.sha }}
          path: artifacts/solo-endgame-stage-b/
          if-no-files-found: error
          retention-days: 14

      - name: Mark Stage B verification successful
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'solo-endgame-stage-b/clean-clone',
              description: 'Stage B exact-SHA clean checkout and gates passed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Mark Stage B verification failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'solo-endgame-stage-b/clean-clone',
              description: 'Stage B exact-SHA verification failed; inspect workflow logs',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
