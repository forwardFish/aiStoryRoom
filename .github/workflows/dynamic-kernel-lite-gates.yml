# Local and pure-runtime evidence only. This workflow can never declare the
# product accepted because it does not exercise Supabase-backed persistence.
name: Dynamic Kernel Lite Auxiliary Gates

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  auxiliary:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      BASE_SHA: dc4a7cd10978fc3662edcb6f2cf3445c1393ddb0
      EVIDENCE_ROOT: ${{ runner.temp }}/dynamic-kernel-lite-auxiliary
      AI_STORY_REAL_MODEL_EVIDENCE_ROOT: ${{ runner.temp }}/dynamic-kernel-lite-auxiliary/real-model
      OPENOVEL_PROVIDER_BASE_URL: https://api.deepseek.com
      OPENOVEL_MODEL: deepseek-v4-pro
      OPENOVEL_NARRATOR_MODEL: deepseek-v4-pro
      OPENOVEL_REVIEWER_MODEL: deepseek-v4-pro
      OPENOVEL_OPTIONS_MODEL: deepseek-v4-pro
      OPENOVEL_STORYKEEPER_MODEL: deepseek-v4-pro
      OPENOVEL_DEEPSEEK_THINKING: disabled

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish auxiliary pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="pending" \
            -f context="dynamic-kernel-lite/auxiliary-gates" \
            -f description="Pure and local auxiliary gates are running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - id: auxiliary
        name: Run pure and local auxiliary matrix
        continue-on-error: true
        shell: bash
        env:
          OPENOVEL_PROVIDER_API_KEY: ${{ secrets.OPENOVEL_PROVIDER_API_KEY }}
          OPENOVEL_API_KEY: ${{ secrets.OPENOVEL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          results="${EVIDENCE_ROOT}/results.tsv"
          : > "${results}"

          run_gate() {
            local label="$1"
            shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${results}"
          }

          boundary_log="${EVIDENCE_ROOT}/logs/00-boundary.log"
          boundary_code=0
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "head=$(git rev-parse HEAD)"
            echo "base=${BASE_SHA}"
            echo "merge_base=$(git merge-base HEAD "${BASE_SHA}")"
            echo "origin_main=$(git rev-parse origin/main)"
            git status --short
          } | tee "${boundary_log}"
          if [ "${GITHUB_REPOSITORY}" != "forwardFish/aiStoryRoom" ]; then boundary_code=1; fi
          if [ "${GITHUB_REF_NAME}" != "codex/chatgpt-pro-dynamic-kernel-lite" ]; then boundary_code=1; fi
          if [ "$(git merge-base HEAD "${BASE_SHA}")" != "${BASE_SHA}" ]; then boundary_code=1; fi
          if [ "$(git rev-parse origin/main)" != "${BASE_SHA}" ]; then boundary_code=1; fi
          if [ -n "$(git status --short)" ]; then boundary_code=1; fi
          set +e
          git diff --check 2>&1 | tee -a "${boundary_log}"
          diff_code=${PIPESTATUS[0]}
          set -e
          if [ "${diff_code}" -ne 0 ]; then boundary_code=1; fi
          printf '%s\t%s\t%s\n' "00-boundary" "${boundary_code}" "${boundary_log}" >> "${results}"

          run_gate 01-install pnpm install --frozen-lockfile
          run_gate 02-supabase-contract-unit node --test scripts/acceptance/__tests__/supabase-formal-acceptance.spec.mjs scripts/acceptance/__tests__/dynamic-kernel-supabase-gate-contract.spec.mjs
          run_gate 03-templates-typecheck pnpm --filter @ai-story/templates typecheck
          run_gate 04-templates-runtime-contract pnpm --filter @ai-story/templates test:runtime-contract
          run_gate 05-templates-story-package pnpm --filter @ai-story/templates test:story-package
          run_gate 06-templates-build pnpm --filter @ai-story/templates build
          run_gate 07-openovel-typecheck pnpm --filter @apps/openovel-runtime typecheck
          run_gate 08-openovel-tests pnpm --filter @apps/openovel-runtime test
          run_gate 09-openovel-build pnpm --filter @apps/openovel-runtime build
          run_gate 10-api-solo-unit pnpm --filter @apps/api test:solo-story-engine
          run_gate 11-api-legacy-sangtian-unit pnpm --filter @apps/api test:solo-story-engine:legacy-sangtian
          run_gate 12-branch-persistence-auxiliary pnpm test:story:branch-persistence
          run_gate 13-story-options-auxiliary pnpm test:story:options
          run_gate 14-story-convergence-auxiliary pnpm test:story:convergence
          run_gate 15-story-v4-auxiliary pnpm test:story:v4

          if [ -z "${OPENOVEL_PROVIDER_API_KEY}${OPENOVEL_API_KEY}${DEEPSEEK_API_KEY}" ]; then
            echo "AUXILIARY_REAL_MODEL_NOT_RUN_ENV_BLOCKED" | tee "${EVIDENCE_ROOT}/logs/16-real-model-auxiliary.log"
            printf '%s\t78\t%s\n' "16-real-model-auxiliary" "${EVIDENCE_ROOT}/logs/16-real-model-auxiliary.log" >> "${results}"
          else
            run_gate 16-real-model-auxiliary pnpm test:story:real-model:g00-t20
          fi

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"])
          tap = re.compile(
              r"# tests (\d+)\s+# suites (\d+)\s+# pass (\d+)\s+# fail (\d+)\s+"
              r"# cancelled (\d+)\s+# skipped (\d+)\s+# todo (\d+)",
              re.MULTILINE,
          )
          rows = []
          for line in (root / "results.tsv").read_text(encoding="utf-8").splitlines():
              label, code, log_path = line.split("\t", 2)
              log = Path(log_path)
              text = log.read_text(encoding="utf-8", errors="replace") if log.exists() else ""
              blocks = [
                  dict(zip(
                      ["tests", "suites", "pass", "fail", "cancelled", "skipped", "todo"],
                      map(int, match.groups()),
                  ))
                  for match in tap.finditer(text)
              ]
              rows.append({
                  "label": label,
                  "exitCode": int(code),
                  "logPath": log_path,
                  "tapBlocks": blocks,
                  "validationErrors": [],
              })

          required = {
              "00-boundary", "01-install", "02-supabase-contract-unit",
              "03-templates-typecheck", "04-templates-runtime-contract",
              "05-templates-story-package", "06-templates-build",
              "07-openovel-typecheck", "08-openovel-tests",
              "09-openovel-build", "10-api-solo-unit",
              "11-api-legacy-sangtian-unit", "12-branch-persistence-auxiliary",
              "13-story-options-auxiliary", "14-story-convergence-auxiliary",
              "15-story-v4-auxiliary",
          }
          by_label = {row["label"]: row for row in rows}
          missing = sorted(required - set(by_label))
          tap_required = {
              "02-supabase-contract-unit", "04-templates-runtime-contract",
              "05-templates-story-package", "08-openovel-tests",
              "10-api-solo-unit", "11-api-legacy-sangtian-unit",
              "15-story-v4-auxiliary",
          }
          for label in tap_required:
              row = by_label.get(label)
              if not row:
                  continue
              tests = sum(block["tests"] for block in row["tapBlocks"])
              failures = sum(block["fail"] for block in row["tapBlocks"])
              if tests <= 0:
                  row["validationErrors"].append("ZERO_OR_MISSING_TESTS")
              if failures:
                  row["validationErrors"].append(f"TAP_FAILURE_COUNT:{failures}")

          auxiliary_pass = (
              not missing
              and all(
                  row["exitCode"] == 0 and not row["validationErrors"]
                  for row in rows
                  if row["label"] != "16-real-model-auxiliary"
              )
          )
          real = by_label.get("16-real-model-auxiliary")
          real_status = (
              "PASS" if real and real["exitCode"] == 0
              else "BLOCKED_ENV" if real and real["exitCode"] == 78
              else "FAIL"
          )
          summary = {
              "schemaVersion": "omw.dynamic-kernel-lite.auxiliary-gates.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "candidateSha": os.environ["GITHUB_SHA"],
              "baselineSha": os.environ["BASE_SHA"],
              "evidenceClass": "AUXILIARY_ONLY",
              "databaseBacked": False,
              "productAcceptanceEligible": False,
              "commands": rows,
              "missingCommands": missing,
              "auxiliaryVerdict": "PASS" if auxiliary_pass else "FAIL",
              "realModelAuxiliaryStatus": real_status,
              "finalVerdict": "AUXILIARY_PASS" if auxiliary_pass else "AUXILIARY_FAIL",
              "formalSupabaseGateRequired": True,
          }
          (root / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "gate-status.txt").write_text(
              ("success" if auxiliary_pass else "failure") + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload auxiliary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-lite-auxiliary-${{ github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 14

      - name: Publish auxiliary commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="failure"
          if [ -f "${EVIDENCE_ROOT}/gate-status.txt" ]; then
            state="$(tr -d '\r\n' < "${EVIDENCE_ROOT}/gate-status.txt")"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/auxiliary-gates" \
            -f description="Auxiliary-only gates ${state}; Supabase formal gate still required" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce auxiliary gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${EVIDENCE_ROOT}/gate-status.txt"
          test "$(tr -d '\r\n' < "${EVIDENCE_ROOT}/gate-status.txt")" = "success"
