# Branch-scoped acceptance workflow; never targets or modifies main.
name: Dynamic Kernel Lite Gates

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: "true"
      BASE_SHA: dc4a7cd10978fc3662edcb6f2cf3445c1393ddb0
      EVIDENCE_ROOT: ${{ runner.temp }}/dynamic-kernel-lite-evidence
      OPENOVEL_PROVIDER_BASE_URL: https://api.deepseek.com
      OPENOVEL_MODEL: deepseek-v4-pro
      OPENOVEL_NARRATOR_MODEL: deepseek-v4-pro
      OPENOVEL_REVIEWER_MODEL: deepseek-v4-pro
      OPENOVEL_OPTIONS_MODEL: deepseek-v4-pro
      OPENOVEL_STORYKEEPER_MODEL: deepseek-v4-pro
      OPENOVEL_DEEPSEEK_THINKING: disabled
      AI_STORY_REAL_MODEL_EVIDENCE_ROOT: ${{ runner.temp }}/dynamic-kernel-lite-evidence/real-model

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - id: gates
        name: Run complete isolated gate matrix
        continue-on-error: true
        shell: bash
        env:
          OPENOVEL_PROVIDER_API_KEY: ${{ secrets.OPENOVEL_PROVIDER_API_KEY }}
          OPENOVEL_API_KEY: ${{ secrets.OPENOVEL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          results="${EVIDENCE_ROOT}/results.tsv"
          : > "${results}"
          failed=0

          run_gate() {
            local label="$1"
            shift
            local log="${EVIDENCE_ROOT}/logs/${label}.log"
            set +e
            "$@" 2>&1 | tee "${log}"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "${label}" "${code}" "${log}" >> "${results}"
            if [ "${code}" -ne 0 ]; then
              failed=1
            fi
          }

          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "head=$(git rev-parse HEAD)"
            echo "base=${BASE_SHA}"
            echo "merge_base=$(git merge-base HEAD ${BASE_SHA})"
            echo "origin_main=$(git rev-parse origin/main)"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee "${EVIDENCE_ROOT}/logs/00-boundary.log"
          test "${GITHUB_REPOSITORY}" = "forwardFish/aiStoryRoom"
          test "${GITHUB_REF_NAME}" = "codex/chatgpt-pro-dynamic-kernel-lite"
          test "$(git merge-base HEAD ${BASE_SHA})" = "${BASE_SHA}"
          test "$(git rev-parse origin/main)" = "${BASE_SHA}"
          test -z "$(git status --short)"
          git diff --check
          printf '%s\t0\t%s\n' "00-boundary" "${EVIDENCE_ROOT}/logs/00-boundary.log" >> "${results}"

          run_gate 01-install pnpm install --frozen-lockfile
          run_gate 02-templates-typecheck pnpm --filter @ai-story/templates typecheck
          run_gate 03-templates-runtime-contract pnpm --filter @ai-story/templates test:runtime-contract
          run_gate 04-templates-story-package pnpm --filter @ai-story/templates test:story-package
          run_gate 05-templates-build pnpm --filter @ai-story/templates build
          run_gate 06-openovel-typecheck pnpm --filter @apps/openovel-runtime typecheck
          run_gate 07-openovel-tests pnpm --filter @apps/openovel-runtime test
          run_gate 08-openovel-build pnpm --filter @apps/openovel-runtime build
          run_gate 09-api-solo pnpm --filter @apps/api test:solo-story-engine
          run_gate 10-api-legacy-sangtian pnpm --filter @apps/api test:solo-story-engine:legacy-sangtian
          run_gate 11-branch-persistence pnpm test:story:branch-persistence
          run_gate 12-story-options pnpm test:story:options
          run_gate 13-story-convergence pnpm test:story:convergence
          run_gate 14-story-v4 pnpm test:story:v4

          if [ -z "${OPENOVEL_PROVIDER_API_KEY}${OPENOVEL_API_KEY}${DEEPSEEK_API_KEY}" ]; then
            echo "REAL_MODEL_NOT_RUN_ENV_BLOCKED" | tee "${EVIDENCE_ROOT}/logs/15-real-model.log"
            printf '%s\t78\t%s\n' "15-real-model" "${EVIDENCE_ROOT}/logs/15-real-model.log" >> "${results}"
            failed=1
          else
            run_gate 15-real-model pnpm test:story:real-model:g00-t20
            python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["AI_STORY_REAL_MODEL_EVIDENCE_ROOT"])
          for name in ["real-model-acceptance-summary.json", "real-model-g00-t20-summary.json", "run-configuration.json"]:
              path = root / name
              if not path.exists():
                  continue
              value = json.loads(path.read_text(encoding="utf-8"))
              value["branch"] = "codex/chatgpt-pro-dynamic-kernel-lite"
              value["candidateSha"] = os.environ.get("GITHUB_SHA")
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          fi

          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_ROOT"])
          rows = []
          for line in (root / "results.tsv").read_text(encoding="utf-8").splitlines():
              label, exit_code, log_path = line.split("\t", 2)
              text = Path(log_path).read_text(encoding="utf-8", errors="replace") if Path(log_path).exists() else ""
              blocks = []
              pattern = re.compile(r"# tests (\d+)\s+# suites (\d+)\s+# pass (\d+)\s+# fail (\d+)\s+# cancelled (\d+)\s+# skipped (\d+)\s+# todo (\d+)", re.MULTILINE)
              for match in pattern.finditer(text):
                  blocks.append(dict(zip(["tests", "suites", "pass", "fail", "cancelled", "skipped", "todo"], map(int, match.groups()))))
              rows.append({"label": label, "exitCode": int(exit_code), "logPath": log_path, "tapBlocks": blocks})
          deterministic = [row for row in rows if row["label"] != "15-real-model"]
          real_model = next((row for row in rows if row["label"] == "15-real-model"), None)
          deterministic_pass = all(row["exitCode"] == 0 for row in deterministic)
          real_model_status = "PASS" if real_model and real_model["exitCode"] == 0 else ("BLOCKED_ENV" if real_model and real_model["exitCode"] == 78 else "FAIL")
          summary = {
              "schemaVersion": "omw.dynamic-kernel-lite-gates.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "candidateSha": os.environ["GITHUB_SHA"],
              "baselineSha": os.environ["BASE_SHA"],
              "node": "22",
              "pnpm": "10.12.1",
              "commands": rows,
              "deterministicVerdict": "PASS" if deterministic_pass else "FAIL",
              "realModelStatus": real_model_status,
              "finalVerdict": "PASS" if deterministic_pass and real_model_status == "PASS" else "BLOCKED_OR_FAIL",
          }
          (root / "summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          {
            echo "head=$(git rev-parse HEAD)"
            echo "origin_main=$(git rev-parse origin/main)"
            echo "status_begin"
            git status --short
            echo "status_end"
          } | tee "${EVIDENCE_ROOT}/logs/99-final-boundary.log"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = "${BASE_SHA}"
          test -z "$(git status --short)"
          sha256sum "${EVIDENCE_ROOT}/summary.json" "${EVIDENCE_ROOT}"/logs/*.log > "${EVIDENCE_ROOT}/SHA256SUMS"

          if [ "${failed}" -eq 0 ]; then
            echo "success" > "${EVIDENCE_ROOT}/gate-status.txt"
          else
            echo "failure" > "${EVIDENCE_ROOT}/gate-status.txt"
          fi

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-lite-${{ github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 14

      - name: Publish commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="failure"
          if [ -f "${EVIDENCE_ROOT}/gate-status.txt" ]; then
            state="$(cat "${EVIDENCE_ROOT}/gate-status.txt")"
          fi
          description="Dynamic Kernel Lite gates ${state}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="dynamic-kernel-lite/gates" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce every required gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${EVIDENCE_ROOT}/gate-status.txt"
          test "$(cat "${EVIDENCE_ROOT}/gate-status.txt")" = "success"
