name: B0 One-Shot Complete Bounded Pool Read Graph Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-bounded-pool-read-graph-complete.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-one-shot-complete-bounded-pool-read-graph
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_BASELINE: 63aec28b0b775eff924585f68827abe87b148a9e
  B0_PATCH_BYTES: "32122"
  B0_PATCH_SHA256: b223d4e124f560a5e8d601b0e5f661dc0db5b15c57cc38c928954d0b041db4c3
  B0_GZIP_BYTES: "7380"
  B0_GZIP_SHA256: fd483b4ffdae74d8f16cef05c7a93a0403fdd6d0aa5f1296020d1ac343db09e7

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publish run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/bounded-pool-read-graph-complete",
              description: `embedded complete patch running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50

      - name: Decode, verify and apply the complete immutable patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$B0_BASELINE" HEAD
          test -z "$(git status --short)"
