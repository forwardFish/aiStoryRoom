name: B0 One-Shot Complete Bounded Pool Read Graph Repair

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-bounded-pool-read-graph-complete.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-one-shot-complete-bounded-pool-read-graph
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_BASELINE: 63aec28b0b775eff924585f68827abe87b148a9e
  B0_PATCH_ROOT: docs/auto-execute/evidence/b0/_tmp/bounded-pool-read-graph
  B0_PATCH_BYTES: "43949"
  B0_PATCH_SHA256: d0c68a29e64d7de6ab9c11b01519f23ab6e62593a4cbba565eed1ccbdf1818fa

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publish run locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/bounded-pool-read-graph-complete",
              description: `verified chunk repair running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50

      - name: Reconstruct and verify the immutable patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$B0_BASELINE" HEAD
          test -z "$(git status --short)"
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["B0_PATCH_ROOT"])
          paths = sorted(root.glob("chunk-*.b64"), key=lambda path: path.name)
          expected_names = [
              "chunk-00.b64", "chunk-01.b64", "chunk-02.b64", "chunk-03.b64",
              "chunk-04a.b64", "chunk-04b.b64", "chunk-05a.b64", "chunk-05b.b64",
              "chunk-06a.b64", "chunk-06b.b64", "chunk-07a.b64", "chunk-07b.b64",
          ]
          if [path.name for path in paths] != expected_names:
              raise SystemExit(f"unexpected chunk set: {[path.name for path in paths]}")

          parts = ["".join(path.read_text(encoding="ascii").split()) for path in paths]
          raw_length = sum(map(len, parts))
          expected_bytes = int(os.environ["B0_PATCH_BYTES"])
          expected_sha = os.environ["B0_PATCH_SHA256"]
          expected_b64_length = ((expected_bytes + 2) // 3) * 4
          removal_target = raw_length - expected_b64_length

          def overlap_lengths(left: str, right: str) -> list[int]:
              probe = right + "\0" + left
              prefix = [0] * len(probe)
              for index in range(1, len(probe)):
                  cursor = prefix[index - 1]
                  while cursor and probe[index] != probe[cursor]:
                      cursor = prefix[cursor - 1]
                  if probe[index] == probe[cursor]:
                      cursor += 1
                  prefix[index] = cursor
              lengths = [0]
              cursor = prefix[-1]
              while cursor:
                  if cursor <= len(left) and cursor <= len(right):
                      lengths.append(cursor)
                  cursor = prefix[cursor - 1]
              return sorted(set(lengths), reverse=True)

          candidates = [overlap_lengths(parts[index], parts[index + 1]) for index in range(len(parts) - 1)]
          states: dict[int, tuple[int, ...]] = {0: ()}
          for options in candidates:
              next_states: dict[int, tuple[int, ...]] = {}
              for total, chosen in states.items():
                  for overlap in options:
                      new_total = total + overlap
                      if new_total > removal_target:
                          continue
                      next_states.setdefault(new_total, chosen + (overlap,))
              states = next_states

          chosen = states.get(removal_target)
          valid = False
          decoded = b""
          combined = ""
          recovery_strategy = None
          excision_offset = None
          if chosen is not None:
              combined = parts[0]
              for part, overlap in zip(parts[1:], chosen):
                  combined += part[overlap:]
              try:
                  decoded = base64.b64decode(combined, validate=True)
                  valid = len(decoded) == expected_bytes and hashlib.sha256(decoded).hexdigest() == expected_sha
                  if valid:
                      recovery_strategy = "adjacent-overlap-removal"
              except Exception:
                  valid = False

          # The remote diagnostic proved that chunk-03 is the only anomalously
          # long segment: 12,144 characters versus the expected 8,774 after
          # removing the exact 3,370-character excess. Search that one bounded
          # corruption surface and accept only the immutable byte size + SHA.
          if not valid and len(parts[3]) - removal_target >= 0:
              original = parts[3]
              prefix = "".join(parts[:3])
              suffix = "".join(parts[4:])
              for offset in range(len(original) - removal_target + 1):
                  candidate = prefix + original[:offset] + original[offset + removal_target:] + suffix
                  try:
                      candidate_bytes = base64.b64decode(candidate, validate=True)
                  except Exception:
                      continue
                  if len(candidate_bytes) != expected_bytes:
                      continue
                  if hashlib.sha256(candidate_bytes).hexdigest() != expected_sha:
                      continue
                  combined = candidate
                  decoded = candidate_bytes
                  valid = True
                  recovery_strategy = "chunk-03-contiguous-excision"
                  excision_offset = offset
                  break

          diagnostic = {
              "schemaVersion": 1,
              "chunkNames": expected_names,
              "chunkLengths": [len(part) for part in parts],
              "rawBase64Length": raw_length,
              "expectedBase64Length": expected_b64_length,
              "requiredOverlapRemoval": removal_target,
              "candidateOverlapLengths": candidates,
              "chosenOverlaps": list(chosen) if chosen is not None else None,
              "recoveryStrategy": recovery_strategy,
              "chunk03ExcisionOffset": excision_offset,
              "reconstructedBase64Length": len(combined),
              "decodedBytes": len(decoded),
              "decodedSha256": hashlib.sha256(decoded).hexdigest() if decoded else None,
              "valid": valid,
          }
          Path("/tmp/chunk-diagnostic.json").write_text(json.dumps(diagnostic, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(diagnostic, indent=2))
          if not valid:
              raise SystemExit("the overlap-aware reconstruction did not match the immutable patch contract")
          Path("/tmp/b0.patch").write_bytes(decoded)
          PY
          test "$(wc -c < /tmp/b0.patch | tr -d ' ')" = "$B0_PATCH_BYTES"
          test "$(sha256sum /tmp/b0.patch | awk '{print $1}')" = "$B0_PATCH_SHA256"
          git apply --check /tmp/b0.patch
          git apply /tmp/b0.patch
          git diff --check

      - name: Upload reconstruction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b0-bounded-pool-reconstruction-${{ github.sha }}
          path: |
            /tmp/chunk-diagnostic.json
            /tmp/b0.patch
            docs/auto-execute/evidence/b0/_tmp/bounded-pool-read-graph/*.b64
          if-no-files-found: warn
          retention-days: 3

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Run focused product gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @apps/api test:b0-window
          pnpm --filter @apps/api test:b0-player-window
          pnpm --filter @apps/api test:b0-ops
          pnpm --filter @apps/api test:maneuver-v1
          pnpm --filter @apps/api typecheck
          pnpm typecheck:b0:real-acceptance
          pnpm --filter @apps/api build
          pnpm --filter @apps/web test:b0-window
          pnpm --filter @apps/web typecheck
          pnpm --filter @apps/web build

      - name: Scan changed product files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          paths = [pathlib.Path(path) for path in """
          apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
          apps/api/src/b0-settlement/b0-window-initialization-concurrency.spec.ts
          apps/api/src/b0-settlement/b0-window-player.controller.ts
          apps/api/src/b0-settlement/b0-window-player.service.ts
          apps/api/src/maneuver-v1/maneuver-v1.controller.ts
          apps/api/src/maneuver-v1/maneuver-v1.prisma-read.spec.ts
          apps/api/src/maneuver-v1/maneuver-v1.prisma-read.ts
          apps/api/src/maneuver-v1/maneuver-v1.service.ts
          apps/web/public/maneuver-v1/maneuver-v1-controller.js
          apps/web/tests/b0-window-web.test.mjs
          """.split()]
          patterns = [
              re.compile(r"postgres(?:ql)?://[^\s\"']+", re.I),
              re.compile(r"sk-[A-Za-z0-9_-]{16,}"),
              re.compile(r"Bearer\s+[A-Za-z0-9._~+/-]{16,}", re.I),
              re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"),
          ]
          findings = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for pattern in patterns:
                  if pattern.search(text): findings.append((str(path), pattern.pattern))
          if findings: raise SystemExit(f"changed-file secret scan failed: {findings}")
          print("changed-file secret scan: PASS")
          PY

      - name: Commit and push product files only
        id: push
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/api/src/b0-settlement/b0-settlement-pipeline.service.ts
            apps/api/src/b0-settlement/b0-window-initialization-concurrency.spec.ts
            apps/api/src/b0-settlement/b0-window-player.controller.ts
            apps/api/src/b0-settlement/b0-window-player.service.ts
            apps/api/src/maneuver-v1/maneuver-v1.controller.ts
            apps/api/src/maneuver-v1/maneuver-v1.prisma-read.spec.ts
            apps/api/src/maneuver-v1/maneuver-v1.prisma-read.ts
            apps/api/src/maneuver-v1/maneuver-v1.service.ts
            apps/web/public/maneuver-v1/maneuver-v1-controller.js
            apps/web/tests/b0-window-web.test.mjs
          )
          git fetch origin "$B0_BRANCH"
          remote_before="$(git rev-parse origin/$B0_BRANCH)"
          test "$remote_before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git diff --cached --check
          printf '%s\n' "${files[@]}" | LC_ALL=C sort > /tmp/expected-files
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git commit -m "fix(b0): bound repeated projection reads to the pool"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$B0_BRANCH"
          remote_after="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
          test "$remote_after" = "$local_head"
          echo "local_head=$local_head" >> "$GITHUB_OUTPUT"
          echo "remote_before=$remote_before" >> "$GITHUB_OUTPUT"
          echo "remote_after=$remote_after" >> "$GITHUB_OUTPUT"
          echo "REMOTE_PRODUCT_FIX_PUSHED=$local_head"

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          LOCAL_HEAD: ${{ steps.push.outputs.local_head }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/bounded-pool-read-graph-complete",
              description: success
                ? `product fix pushed ${process.env.LOCAL_HEAD?.slice(0, 12)}`
                : `verified chunk repair failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("verified bounded-pool product repair failed");
