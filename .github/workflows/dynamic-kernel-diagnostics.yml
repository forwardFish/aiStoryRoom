name: Dynamic Kernel Remaining Failure Diagnostics

on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/dynamic-kernel-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EVIDENCE_ROOT: /tmp/dynamic-kernel-diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply the verified repair payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/logs"
          tr -d '[:space:]' < .github/repair/dynamic-kernel-followup.patch.gz.b64 \
            | base64 --decode | gzip --decompress > "${RUNNER_TEMP}/followup.patch"
          test "$(sha256sum "${RUNNER_TEMP}/followup.patch" | cut -d' ' -f1)" = \
            "cf21f3aaabd702ef8d3914d95e32443ff89ec9cd1d40ca6af11556f5b138cd07"
          git apply --check "${RUNNER_TEMP}/followup.patch"
          git apply "${RUNNER_TEMP}/followup.patch"
          git diff --check
      - name: Add diagnostic output without changing assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path("apps/api/src/solo-story-engine/__tests__/part-one-runtime-integration.spec.ts")
          text = api.read_text(encoding="utf-8")
          needle = "  assert.equal(compiled.ok, true);\n  if (!compiled.ok) throw new Error(\"Part One context compilation failed\");"
          replacement = "  if (!compiled.ok) console.error(\"DYNAMIC_KERNEL_CONTEXT_COMPILE_FAILURE\", JSON.stringify(compiled));\n  assert.equal(compiled.ok, true);\n  if (!compiled.ok) throw new Error(\"Part One context compilation failed\");"
          if needle not in text:
              raise SystemExit("API diagnostic insertion point missing")
          api.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

          openovel = Path("apps/openovel-runtime/tests/openovel-first.spec.ts")
          text = openovel.read_text(encoding="utf-8")
          needle = "    assert.match(jointSignatureContext, /复核由谁主持/);"
          replacement = "    console.error(\"DYNAMIC_KERNEL_T03_DIAGNOSTIC\", JSON.stringify({ prepared: jointSignaturePrepared, context: jointSignatureContext }));\n    assert.match(jointSignatureContext, /复核由谁主持/);"
          if needle not in text:
              raise SystemExit("OpenNovel diagnostic insertion point missing")
          openovel.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Run focused diagnostics
        shell: bash
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @apps/openovel-runtime test 2>&1 \
            | tee "${EVIDENCE_ROOT}/logs/openovel.log"
          echo ${PIPESTATUS[0]} > "${EVIDENCE_ROOT}/openovel-exit.txt"
          pnpm --filter @apps/api test:solo-story-engine:legacy-sangtian 2>&1 \
            | tee "${EVIDENCE_ROOT}/logs/legacy-sangtian.log"
          echo ${PIPESTATUS[0]} > "${EVIDENCE_ROOT}/legacy-exit.txt"
          exit 0
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-kernel-diagnostics-${{ github.sha }}
          path: /tmp/dynamic-kernel-diagnostics/
          if-no-files-found: error
          retention-days: 3
