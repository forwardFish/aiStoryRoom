name: B0 One-Shot Compact Evidence History

on:
  push:
    branches:
      - codex/chatgpt-pro-maneuver-evidence-v1
    paths:
      - .github/workflows/b0-one-shot-compact-evidence-history.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: b0-one-shot-compact-evidence-history
  cancel-in-progress: false

env:
  B0_BRANCH: codex/chatgpt-pro-maneuver-evidence-v1
  B0_HISTORY_ROOT: docs/auto-execute/evidence/b0/history

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish locator
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "b0/compact-evidence-history",
              description: `history compaction running in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact remote state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$B0_BRANCH)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
          test -d "$B0_HISTORY_ROOT"

      - name: Compact the historical evidence tree into a versioned ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import zipfile
          from datetime import datetime, timezone

          root = pathlib.Path(os.environ["B0_HISTORY_ROOT"])
          stage = pathlib.Path(".artifacts/history-compaction")
          stage.mkdir(parents=True, exist_ok=True)
          archive = stage / "prior-history.zip"
          files = sorted(path for path in root.rglob("*") if path.is_file())
          if not files:
              raise SystemExit("historical evidence tree is empty")

          with zipfile.ZipFile(
              archive,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
          ) as bundle:
              for path in files:
                  bundle.write(path, arcname=path.relative_to(root).as_posix())

          raw = archive.read_bytes()
          source_roots = sorted({path.relative_to(root).parts[0] for path in files})
          shutil.rmtree(root)
          destination = root / "legacy"
          destination.mkdir(parents=True, exist_ok=True)
          target = destination / "prior-history.zip"
          shutil.copy2(archive, target)
          metadata = {
              "schemaVersion": 1,
              "generatedAtUtc": datetime.now(timezone.utc).isoformat(),
              "sourceCommitSha": os.environ["GITHUB_SHA"],
              "archive": target.name,
              "archiveBytes": len(raw),
              "archiveSha256": hashlib.sha256(raw).hexdigest(),
              "archivedFileCount": len(files),
              "sourceTopLevelEntries": source_roots,
              "preservationRule": "the complete prior history tree is retained in a versioned ZIP so ordinary Windows checkouts remain portable",
          }
          (destination / "archive-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY
          test -f "$B0_HISTORY_ROOT/legacy/prior-history.zip"
          test -f "$B0_HISTORY_ROOT/legacy/archive-metadata.json"
          find "$B0_HISTORY_ROOT" -type f -print
          git diff --check -- docs/auto-execute/evidence/b0

      - name: Commit and push only the docs history compaction
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$B0_BRANCH"
          before="$(git rev-parse origin/$B0_BRANCH)"
          test "$before" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/auto-execute/evidence/b0/history
          git add -u docs/auto-execute/evidence/b0/history
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -Ev '^docs/auto-execute/evidence/b0/history/' || true)"
          git commit -m "docs(b0): compact historical evidence for Windows checkout"
          local_head="$(git rev-parse HEAD)"
          git push origin "HEAD:$B0_BRANCH"
          after="$(git ls-remote origin refs/heads/$B0_BRANCH | awk '{print $1}')"
          test "$after" = "$local_head"
          echo "local_head=$local_head" >> "$GITHUB_OUTPUT"
          echo "remote_before=$before" >> "$GITHUB_OUTPUT"
          echo "remote_after=$after" >> "$GITHUB_OUTPUT"

      - name: Publish outcome
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          LOCAL_HEAD: ${{ steps.push.outputs.local_head }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "b0/compact-evidence-history",
              description: success
                ? `history compacted at ${process.env.LOCAL_HEAD?.slice(0, 12)}`
                : `history compaction failed in ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!success) core.setFailed("Evidence history compaction failed");
