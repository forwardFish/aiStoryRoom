name: Settled Reaction Generated Source Diagnostic

# Re-run with a traceable status context.
on:
  push:
    branches:
      - codex/chatgpt-pro-dynamic-kernel-lite
    paths:
      - .github/workflows/settled-reaction-generated-source-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="dynamic-kernel-lite/generated-source-diagnostic" \
            -f description="Exporting generated product source" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate source snapshot
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python .github/repair/requirement-dependency-product.py
          python .github/repair/requirement-dependency-due-override.py
          python .github/repair/requirement-dependency-due-test-fix.py
          python .github/repair/run-settled-reaction-contract-v2.py
          python .github/repair/settled-reaction-authoring-fix.py
          python .github/repair/run-settled-reaction-product-fix-v4.py
          mkdir -p /tmp/generated/packages/templates/src/story-package
          cp packages/templates/src/story-package/part-one-runtime-engine.ts \
            /tmp/generated/packages/templates/src/story-package/
          cp packages/templates/src/story-package/part-one-runtime-types.ts \
            /tmp/generated/packages/templates/src/story-package/
          cp packages/templates/src/story-package/settled-reaction-contract.ts \
            /tmp/generated/packages/templates/src/story-package/
          cp packages/templates/src/runtime-facade.ts \
            /tmp/generated/packages/templates/src/
          git diff -- packages/templates/src/story-package/part-one-runtime-engine.ts \
            > /tmp/generated/engine.patch
      - uses: actions/upload-artifact@v4
        with:
          name: settled-reaction-generated-source-${{ github.sha }}
          path: /tmp/generated/
          if-no-files-found: error
          retention-days: 3
      - name: Publish completion
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          description="Generated source artifact uploaded"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="dynamic-kernel-lite/generated-source-diagnostic" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
